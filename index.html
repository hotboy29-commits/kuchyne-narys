/* ─────────────────────────── 15. EXPORT PDF ─────────────────────────── */

function buildPrint(){
  const p = S.project, info = p.info;
  const P = PAPER[info.paper] || PAPER.A4L;
  const dateCs = new Date(info.date || Date.now()).toLocaleDateString('cs-CZ', {day:'numeric',month:'long',year:'numeric'});
  const els = [...p.elements].sort((a,b)=> (a.y-b.y) || (a.x-b.x));
  const totalLen = els.reduce((s,e)=> s + elFrontW(e)*(e.qty||1), 0);
  const pages = [];

  /* 1) titulní strana */
  pages.push(`
  <section class="pr-page cover">
    <div class="pr-cover-head">
      <div class="pr-kicker">Nárys · půdorys</div>
      <h1 class="pr-title">${esc(info.name || 'Název projektu')}</h1>
    </div>
    <div class="pr-grid">
      <div class="pr-block"><h3>Zákazník</h3><p>${esc(info.client || '—')}${info.clientPhone ? '\n'+esc(info.clientPhone) : ''}</p></div>
      <div class="pr-block"><h3>Zpracoval</h3><p>${esc(info.designer || '—')}${info.designerContact ? '\n'+esc(info.designerContact) : ''}</p></div>
      <div class="pr-block"><h3>Adresa realizace</h3><p>${esc(info.address || '—')}</p></div>
      <div class="pr-block"><h3>Datum</h3><p>${dateCs}\nFormát ${info.paper} (${P.w} × ${P.h} mm)</p></div>
      <div class="pr-block"><h3>Rozsah</h3><p>${els.length} prvků · ${p.walls.length} zdí · ${p.guides.length} odstupů\ncelková šířka prvků ${(totalLen/1000).toFixed(2)} m</p></div>
      <div class="pr-block"><h3>Podklady</h3><p>Půdorys DS a HS s kótami v mm\nVýpis prvků na další straně</p></div>
    </div>
    ${info.notes ? `<div class="pr-notes"><h3>Poznámky</h3><p>${esc(info.notes)}</p></div>` : ''}
    <div class="pr-cover-foot"><span>${esc(info.name || 'Název projektu')}</span><span>${dateCs}</span></div>
  </section>`);

  /* 2) výkresy – DS a HS zvlášť (sloupy jsou v obou), aby se nepřekrývaly */
  const winsAll = S.project.windows, symsAll = S.project.symbols;
  const showList = !!(els.length || winsAll.length || symsAll.length);
  const fDS = e => { const k = elKind3(e); return k==='base' || k==='column'; };
  const fHS = e => { const k = elKind3(e); return k==='upper' || k==='column'; };
  const showDS = els.some(fDS);
  const showHS = els.some(fHS);
  const showPrice = !!(els.length && pricing().inPrint);
  const nPages = 1 + (showDS?1:0) + (showHS?1:0) + (showList?1:0) + (showPrice?1:0);
  let pg = 1;
  const drawOne = (kicker, title, sub, filter, fname) => {
    pg++;
    pages.push(`
  <section class="pr-page">
    <div class="pr-head">
      <div><span class="pr-kicker">${kicker}</span><h2>${title} – ${esc(info.name || 'Název projektu')}</h2></div>
      <div class="pr-meta">${esc(info.client || '')}<br>${dateCs} · Kóty v mm · ${sub}</div>
    </div>
    <div class="pr-drawing">${drawingSvg(P, { filter })}</div>
    <div class="pr-legend">${legendHtml(filter)}</div>
    ${info.notes ? `<div class="pr-notes-inline"><b>Poznámky:</b> ${esc(info.notes)}</div>` : ''}
    <div class="pr-foot"><span>${esc(info.name || 'Projekt')} – ${fname}</span><span>Strana ${pg} / ${nPages}</span></div>
  </section>`);
  };
  if(showDS) drawOne('Výkres 1', 'Půdorys DS', 'spodní skříňky + sloupy', fDS, 'půdorys DS');
  if(showHS) drawOne('Výkres 2', 'Půdorys HS', 'horní skříňky + sloupy', fHS, 'půdorys HS');

  /* 3) výpis prvků + oken + instalací */
  const wins = S.project.windows, syms = S.project.symbols;
  if(els.length || wins.length || syms.length){
    const LAM = 18;   // síla lamina – půda je o dvě síly užší
    const rowFor = (e, i) => {
      const wNom = elFrontW(e), dNom = elFrontD(e);
      const pw = wNom - 2*LAM;            // šířka půdy i latí (podél čela)
      const k3v = elKind3(e);
      const noteX = (k3v==='base') ? (e.note||'') : ((k3v==='upper'?'horní skříň':'sloup') + (e.note?' — '+e.note:''));
      let out = `<tr>
        <td class="num">${i+1}</td>
        <td><span class="pr-tdot" style="background:${e.color}"></span>${esc(e.name || '—')}</td>
        <td class="num">${fmt(wNom)}</td>
        <td class="num">${fmt(dNom)}</td>
        <td class="num">${e.qty||1}</td>
        <td class="num">${fmt(wNom*(e.qty||1))}</td>
        <td>${esc(noteX)}</td>
      </tr>`;
      const bkw = bokW(e), bh = bokH(e);
      const bokRows = [['L','vlevo'],['R','vpravo']].filter(([sd])=>bokHas(e,sd))
        .map(([,str]) => `<tr class="pr-sub"><td class="num"></td>
          <td>└ Bok+ (${elKind3(e)==='upper'?'HS':'DS'} – ${str})</td>
          <td class="num">${fmt(bh)}</td>
          <td class="num">${fmt(bokDepthOf(e))}</td>
          <td class="num">1</td>
          <td class="num">${fmt(bh)}</td>
          <td>panel ${fmt(bh)} × ${fmt(bokDepthOf(e))} × ${bkw} mm (v × hl × tl)</td>
        </tr>`).join('');
      if(bokRows) out += bokRows;
      if(elKind3(e)==='base' && pw >= 1){
        out += `<tr class="pr-sub"><td class="num"></td>
          <td>└ půda</td>
          <td class="num">${fmt(pw)}</td>
          <td class="num">${fmt(dNom)}</td>
          <td class="num">1</td>
          <td class="num">${fmt(pw)}</td>
          <td>šířka skříně − 2× ${LAM} mm</td>
        </tr>
        <tr class="pr-sub"><td class="num"></td>
          <td>└ lať</td>
          <td class="num">${fmt(pw)}</td>
          <td class="num">120</td>
          <td class="num">2</td>
          <td class="num">${fmt(pw*2)}</td>
          <td>2 ks, hloubka 120 mm</td>
        </tr>`;
      }
      return out;
    };
    /* Výpis se dělí stejně jako výkresy: DS (spodní skříňky + sloupy)
       a HS (horní skříňky). Sloupy se ve výpisu počítají JEDNOU, v sekci DS. */
    const listDS = els.filter(e=>{ const k = elKind3(e); return k==='base' || k==='column'; });
    const listHS = els.filter(e=>elKind3(e)==='upper');
    const sumW = list => list.reduce((s,e)=> s + elFrontW(e)*(e.qty||1), 0);
    const totalDS = sumW(listDS), totalHS = sumW(listHS);
    const nCols = els.filter(e=>elKind3(e)==='column').length;
    const tableHead = `<thead><tr>
      <th class="num">#</th><th>Název prvku</th>
      <th class="num">Šířka (mm)</th><th class="num">Hloubka (mm)</th>
      <th class="num">Ks</th><th class="num">Celkem (mm)</th><th>Poznámka</th>
    </tr></thead>`;
    const soklHtml = (() => {
      const runs = dsRuns();
      const _P = pricing(), _g = _P.groups.find(x => x.id === 'bok');
      const soklBoardW = _g ? _g.bw : 2800, soklKerf = +_P.kerf || 0;
      const soklMaxOrd = Math.max(200, soklBoardW - soklKerf - SOKL_RESERVE);
      if(!runs.length) return '';
      let t = 0; const rows = runs.map((r,i) => {
        const pcs = soklPiecesForRun(r);
        const obj = pcs.reduce((a,b)=>a+b,0); t += obj;
        const kusy = pcs.length > 1
          ? '<div style="color:#666;font-size:7.5pt">kusy: ' + pcs.map(x=>fmt(x)).join(' + ') + ' mm</div>' : '';
        return `<tr><td>DS řada ${i+1} (${r.n} spodních skříněk)${kusy}</td>
          <td class="num">${fmt(R(r.len))}</td>
          <td class="num">${SOKL_RESERVE}${pcs.length > 1 ? ' na kus' : ''}</td>
          <td class="num">${pcs.length > 1 ? pcs.length + ' ks · ' : ''}${fmt(obj)}</td></tr>`;
      }).join('');
      return `<div class="pr-sub" style="margin-top:4mm"><b style="font-size:12.5px">Sokl (DS) – čelní, výška 150 mm, tl. 18 mm</b></div>
        <table class="pr-table" style="margin-top:1mm">
          <thead><tr><th>Sestava</th><th class="num">Délka řady (mm)</th><th class="num">Rezerva (mm)</th><th class="num">Objednat (mm)</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="3">Celkem objednat</td><td class="num">${fmt(t)}</td></tr></tfoot>
        </table>
        <div style="color:#666;font-size:7.5pt;margin-top:0.8mm">
          Řada se dělí na kusy podle spár skříněk – nejdelší objednaný kus je ${fmt(soklMaxOrd)} mm
          (deska ${fmt(soklBoardW)} − ${fmt(soklKerf)} mm řez − ${SOKL_RESERVE} mm rezerva).
          Rezerva ${SOKL_RESERVE} mm se připočítává <b>na každý kus</b>.
        </div>`;
    })();
    /* Čela – rozměry k objednání (dvířka a čela zásuvek po velikostech) */
    const frontsHtml = (() => {
      const P = pricing();
      const fp = materialParts().filter(pt => pt.group === 'front');
      if(!fp.length) return '';
      const map = new Map();
      for(const pt of fp){
        const isB = /blende/.test(pt.label);
        const key = (isB ? 'blende' : '') + pt.w + '×' + pt.h;
        if(!map.has(key)) map.set(key, { w:pt.w, h:pt.h, qty:0, blende:isB });
        map.get(key).qty += pt.qty;
      }
      const list = [...map.values()].sort((a,b) => (b.w - a.w) || (b.h - a.h));
      const rows = list.map(o => {
        const typ = o.blende ? ('blende ' + P.blendeW + ' × ' + P.blendeD + ' mm')
                  : (o.h === Math.round(P.doorH)) ? 'dvířka' : 'čelo zásuvky';
        return `<tr><td>${typ}</td><td class="num">${fmt(o.w)}</td><td class="num">${fmt(o.h)}</td><td class="num">${o.qty} ks</td></tr>`;
      }).join('');
      const total = list.reduce((a,o) => a + o.qty, 0);
      return `<div class="pr-sub" style="margin-top:4mm"><b style="font-size:12.5px">Čela – rozměry k objednání</b></div>
        <table class="pr-table" style="margin-top:1mm">
          <thead><tr><th>Druh</th><th class="num">Šířka (mm)</th><th class="num">Výška (mm)</th><th class="num">Počet</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="3">Celkem čel</td><td class="num">${total} ks</td></tr></tfoot>
        </table>
        <div style="color:#666;font-size:7.5pt;margin-top:0.8mm">
          Šířka čela = šířka skříně − 4 mm (600 → 596; na dvě dvířka 297; myčka 450 → 446).
          V rohu je líc blende v rovině dveří a čelo je od ní 2 mm;
          skříň 600 mm v rohu → dvířka ${600 - 18 - 4} mm.
          Výška dvířek ${fmt(P.doorH)} mm, čela zásuvek od spodu ${(P.drawerStack||[]).join(' / ')}
          mm s mezerou ${P.drawerGap} mm – dohromady vždy ${fmt(P.doorH)} mm (dvě zásuvky 350 + 350 s mezerou 4 mm).
          U sloupů jsou uvedené jen spodní výsuvy, zbytek čel se doměřuje.
        </div>`;
    })();
    let tables = '';
    if(listDS.length) tables += `
      <div class="pr-sub" style="margin-top:2mm"><b style="font-size:12.5px">A · Spodní sestava (DS) – spodní skříňky + sloupy</b>${nCols?` <span style="font-weight:400;color:#666">(${nCols} ${nCols===1?'sloup':'sloupy'})</span>`:''}</div>
      <table class="pr-table">${tableHead}<tbody>${listDS.map((e,i)=>rowFor(e,i)).join('')}</tbody>
      <tfoot><tr><td colspan="5">Celková šířka DS</td><td class="num">${fmt(totalDS)}</td><td></td></tr></tfoot></table>`;
    if(listHS.length) tables += `
      <div class="pr-sub" style="margin-top:4mm"><b style="font-size:12.5px">B · Horní sestava (HS) – horní skříňky</b>${nCols?` <span style="font-weight:400;color:#666">(sloupy jsou vykázané v sekci DS – kreslí se i do výkresu HS)</span>`:''}</div>
      <table class="pr-table">${tableHead}<tbody>${listHS.map((e,i)=>rowFor(e,i)).join('')}</tbody>
      <tfoot><tr><td colspan="5">Celková šířka HS</td><td class="num">${fmt(totalHS)}</td><td></td></tr></tfoot></table>`;
    tables += soklHtml + frontsHtml;
    pages.push(`
    <section class="pr-page">
      <div class="pr-head">
        <div><span class="pr-kicker">Příloha</span><h2>Výpis prvků</h2></div>
        <div class="pr-meta">${esc(info.name || '')}<br>${dateCs}</div>
      </div>
      ${tables}
      ${wins.length ? `
      <table class="pr-table" style="margin-top:5mm">
        <thead><tr><th>Zeď</th><th class="num">Úsek</th><th class="num">Šířka okna (mm)</th><th class="num">Střed od začátku úseku (mm)</th></tr></thead>
        <tbody>${wins.map(win => {
          const wl = S.project.walls.find(x=>x.id===win.wallId);
          return `<tr><td>${esc(wl?.name||'zeď')}</td><td class="num">${win.seg+1}</td><td class="num">${fmt(win.w)}</td><td class="num">${fmt(win.off)}</td></tr>`;
        }).join('')}</tbody>
      </table>` : ''}
      ${syms.length ? `
      <table class="pr-table" style="margin-top:5mm">
        <thead><tr><th>Značka</th><th>Význam</th><th>Poznámka</th><th class="num">X (mm)</th><th class="num">Y (mm)</th><th>Zeď·úsek</th><th class="num">Od začátku (mm)</th><th class="num">Od líce (mm)</th></tr></thead>
        <tbody>${syms.map(sm => {
          const t = symType(sm.type), ORp = projectOrigin();
          const wa = sm.wallId!=null ? S.project.walls.find(x=>x.id===sm.wallId) : null;
          return `<tr><td><b style="color:${t.color}">${t.code}</b></td><td>${t.label}</td><td>${esc(sm.note||'')}</td><td class="num">${fmt(Math.round(sm.x-ORp.x))}</td><td class="num">${fmt(Math.round(sm.y-ORp.y))}</td><td>${wa?esc(wa.name||'zeď')+'·'+((+sm.seg||0)+1):'—'}</td><td class="num">${wa?fmt(Math.round(sm.along||0)):'—'}</td><td class="num">${wa?fmt(Math.round(sm.off||0)):'—'}</td></tr>`;
        }).join('')}</tbody>
      </table>` : ''}
      ${info.notes ? `<div class="pr-notes-inline" style="white-space:pre-wrap">${esc(info.notes)}</div>` : ''}
      <div class="pr-foot"><span>${esc(info.name || 'Projekt')} – výpis prvků</span><span>Strana ${(++pg)} / ${nPages}</span></div>
    </section>`);
  }

  /* 4) kalkulace materiálu (jen když je co počítat) */
  if(showPrice) pages.push(pricePageHtml({ page: ++pg, total: nPages }));

  /* Rozměr stránky musí odpovídat zvolenému papíru – jinak tiskárna výkres
     přeškáluje a čáry přestanou sedět. */
  pages.unshift(`<style>
    @page { size: ${P.w}mm ${P.h}mm; margin: 0; }
    @page coverPage { size: ${P.w}mm ${P.h}mm; margin: 0; }
    .pr-page { width: ${P.w}mm; height: ${P.h}mm; padding: 14mm 14mm 16mm; }
  </style>`);
  $('#printRoot').innerHTML = pages.join('');
}

function legendHtml(filter){
  const fEls = filter ? S.project.elements.filter(filter) : S.project.elements;
  const used = [...new Map(fEls.map(e=>[e.name||'bez názvu', e])).values()];
  const symUsed = [...new Map(S.project.symbols.map(sm=>[sm.type, symType(sm.type)])).values()];
  return used.map(e => `<span class="lg"><i class="sw" style="background:${e.color}"></i>${esc(e.name||'bez názvu')}</span>`).join('')
    + `<span class="lg"><i class="sw" style="background:#2b3138"></i>Zeď</span>`
    + (S.project.windows.length ? `<span class="lg"><i class="sw" style="background:#fff;border:1.6px solid #0f172a"></i>Okno</span>` : '')
    + symUsed.map(t => `<span class="lg"><i class="sw" style="background:${t.color};border-radius:50%"></i>${t.code} – ${t.label}</span>`).join('')
    + (fEls.some(e=>elKind3(e)==='upper')
       ? `<span class="lg"><i class="sw" style="background:#fff;border:1.6px dashed #334155"></i>Horní skříň (HS) – přerušovaně</span>` : '')
    + (S.showDimInst ? `<span class="lg"><i class="sw" style="background:#0d6b5f"></i>Šířka skříně – tyrkysová kóta pod čelem skříně</span>` : '')
    + `<span class="lg"><i class="sw" style="background:#334155;height:0;border-top:1.6px solid #334155"></i>Rozměr místnosti</span>`
    + (S.showDimInst ? `<span class="lg"><i class="sw" style="background:${symUsed[0]?.color || '#2563eb'};border-radius:50%"></i>Kóty instalací = barva značky (mimo výkres)</span>` : '');
}

/**
 * Výkres v souřadnicích PAPÍRU (mm). Tloušťky čar i písma jsou zadány v mm na
 * papíře a přepočteny přes měřítko k – proto nejsou „rozmazané“.
 */
function drawingSvg(P, opt){
  const filter = (opt && opt.filter) || null;
  const b = contentBBox({ skipGuides:true, filter });
  if(!b) return `<svg viewBox="0 0 ${P.w} ${P.h}"></svg>`;
  const M = 12;                                  // okraj [mm papíru]
  const iw = P.w - M*2, ih = P.h - M*2;
  const pad = 1250;                              // místo na kóty [mm skutečnosti]
  const k = Math.min(iw / (b.w + pad*2), ih / (b.h + pad*2));
  const ox = M + (iw - (b.w + pad*2)*k)/2 - (b.x - pad)*k;
  const oy = M + (ih - (b.h + pad*2)*k)/2 - (b.y - pad)*k;
  const sw = pen => R(pen/k);                    // mm papíru → user units
  const fs = mm => R(mm/k);                      // výška písma [mm papíru]

  const parts = [];
  parts.push(`<g transform="translate(${R(ox)},${R(oy)}) scale(${k})">`);

  // zdi
  for(const w of S.project.walls){
    if(w.pts.length < 2) continue;
    const d = w.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + (w.closed?' Z':'');
    if(w.closed) parts.push(`<path d="${d}" fill="#fafafa" stroke="none"/>`);
    parts.push(`<path d="${wallBandPath(w)}" fill="#22262b" fill-rule="evenodd"
      stroke="#22262b" stroke-width="${sw(0.18)}" stroke-linejoin="miter"/>`);
  }

  // okna ve zdech
  parts.push(windowsSvg(sw, false, 0.25));

  // prvky – tenká linka, žádná výplň přes sousedy (jen prvky dané vrstvy)
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    const upEl = elKind3(e)==='upper';
    parts.push(`<rect x="${e.x}" y="${e.y}" width="${Math.max(e.w,1)}" height="${Math.max(e.d,1)}"
      fill="${e.color}${upEl?'08':'14'}" stroke="#1f2937" stroke-width="${sw(PEN.el)}"${upEl?` stroke-dasharray="${R(1.7/k)} ${R(1.1/k)}"`:''}/>`);
    const fv = FRONT_VEC[e.front||'jih'];
    const m = Math.min(80, e.w*0.14, e.d*0.14);
    let dl = '';
    if(fv[1]===1)  dl = `M${e.x+m} ${e.y+e.d-m} H${e.x+e.w-m}`;
    if(fv[1]===-1) dl = `M${e.x+m} ${e.y+m} H${e.x+e.w-m}`;
    if(fv[0]===1)  dl = `M${e.x+e.w-m} ${e.y+m} V${e.y+e.d-m}`;
    if(fv[0]===-1) dl = `M${e.x+m} ${e.y+m} V${e.y+e.d-m}`;
    if(dl) parts.push(`<path d="${dl}" stroke="${e.color}" stroke-width="${sw(PEN.el)}" fill="none"/>`);

    const capPx = Math.min(e.w, e.d);
    if(capPx*k >= 5){                            // ~5 mm na papíře → popisek se vejde
      const cx = e.x+e.w/2, cy = e.y+e.d/2;
      const size = fs(clamp(capPx*k*0.30, 2.0, 3.4));
      parts.push(`<text x="${R(cx)}" y="${R(cy)}" text-anchor="middle" dominant-baseline="middle"
        font-size="${size}" font-weight="700" fill="#0d1117"
        style="font-family:Helvetica,Arial,sans-serif">${esc(e.name||'')}</text>`);
    }
  }

  // čela (dvířka, zásuvky) – tenké pruhy na líci skříně
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    for(const r of frontStrips(e)){
      parts.push(`<rect x="${R(r.x)}" y="${R(r.y)}" width="${R(r.w)}" height="${R(r.h)}"
        fill="#ffffff" stroke="#1f2937" stroke-width="${sw(0.14)}"/>`);
    }
  }
  // blende v rohu – čtverec 50 × 50
  for(const b of blendeCorners()){
    parts.push(`<rect x="${R(b.x)}" y="${R(b.y)}" width="${R(b.w)}" height="${R(b.h)}"
      fill="#dc2626" stroke="#7f1d1d" stroke-width="${sw(0.16)}"/>`);
  }

  // bok+ (boční panely) – kreslí se zvlášť, nejsou skříně
  parts.push(boksPrintSvg(sw, filter));

  // značky instalací
  parts.push(symbolsSvg(sw, false, x => R(x), false, 0.35, mm => R(mm/k), 640)); // písmo kót instalací v mm papíru

  // Kóty šířek skříní – KAŽDÁ skříň má vlastní kótu podél šířky. Kreslí se
  // VŽDY do středu místnosti (nikdy ke kraji, kde je kóta zdi), takže se
  // s obvodovými kótami nemůžou překrývat. Kóty sousedních skříněk ve stejné
  // řadě leží na jedné přímce a tvoří přehledný řetězec 600/600/…
  let wbR = wallsBBox();
  if(!wbR){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const e of S.project.elements){ x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); }
    if(x0<Infinity) wbR = { x:x0, y:y0, w:x1-x0, h:y1-y0 };
  }
  const rcx = wbR ? wbR.x + wbR.w/2 : 0, rcy = wbR ? wbR.y + wbR.h/2 : 0;
  const OFF_EL = 360;                        // odsazení kóty od skříně [mm]
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    const front = e.front || 'jih';
    const wF = elFrontW(e);
    if(wF < 40) continue;
    const cx = e.x+e.w/2, cy = e.y+e.d/2;
    if(front==='jih' || front==='sever'){
      const below = (cy < rcy) ? 1 : -1;        // do středu místnosti
      const fy = below>0 ? e.y+e.d+OFF_EL : e.y-OFF_EL;
      parts.push(dimPrint(e.x, fy, e.x+e.w, fy, 'x', k, 1.1, '#0d6b5f'));
    } else {
      const right = (cx < rcx) ? 1 : -1;
      const fx = right>0 ? e.x+e.w+OFF_EL : e.x-OFF_EL;
      parts.push(dimPrint(fx, e.y, fx, e.y+e.d, 'y', k, 1.1, '#0d6b5f'));
    }
  }
  // vnější kóty místnosti – odsazené DÁL od výkresu, skříně mají vlastní prostor
  if(wbR){
    parts.push(dimPrint(wbR.x, wbR.y-950, wbR.x+wbR.w, wbR.y-950, 'x', k, 1.1, '#334155'));
    parts.push(dimPrint(wbR.x-950, wbR.y, wbR.x-950, wbR.y+wbR.h, 'y', k, 1.1, '#334155'));
  }
  // měřítko
  /* měřítko – jasně označené a odsazené pod výkres, ať nejde zaměnit s kótou */
  const bx = b.x + b.w - 1000, by = b.y + b.h + 700;
  parts.push(`<line x1="${bx}" y1="${by}" x2="${bx+1000}" y2="${by}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx}" y1="${by-60}" x2="${bx}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx+1000}" y1="${by-60}" x2="${bx+1000}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<text x="${bx+500}" y="${by-110}" text-anchor="middle" font-size="${fs(2.6)}" fill="#111"
    style="font-family:Helvetica,Arial,sans-serif">MĚŘÍTKO · úsečka = 1 000 mm</text>`);

  parts.push(`</g>`);
  return `<svg viewBox="0 0 ${P.w} ${P.h}" width="${P.w}mm" height="${P.h}mm" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

/** Kóta v souřadnicích skutečnosti, tloušťky/písmo přepočtené z mm papíru. */
function dimPrint(x1,y1,x2,y2,axis,k,mul=1,color='#0d6b5f'){
  const len = axis==='x' ? Math.abs(x2-x1) : Math.abs(y2-y1);
  if(len < 20) return '';
  const swp = p => R(p/k);
  const textMm = 2.6*mul;
  const gap = textMm/k*2.6;
  let line;
  if(axis==='x'){
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1+gap}" y2="${y1}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2-gap}" y1="${y2}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  } else {
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y1+gap}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2}" y1="${y2-gap}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  }
  const tick = 30*mul;
  const a1 = axis==='x' ? `M${x1} ${y1-tick} l${tick*1.4} ${tick} l${-tick*1.4} ${tick}`
                        : `M${x1-tick} ${y1} l${tick} ${tick*1.4} l${tick} ${-tick*1.4}`;
  const a2 = axis==='x' ? `M${x2} ${y2-tick} l${-tick*1.4} ${tick} l${tick*1.4} ${tick}`
                        : `M${x2+tick} ${y2} l${-tick} ${-tick*1.4} l${-tick} ${tick*1.4}`;
  const halo = swp(1.0);                         // bílá halo pro čitelnost přes čáry
  const txt = `<text x="${R((x1+x2)/2)}" y="${R((y1+y2)/2)}" text-anchor="middle" dominant-baseline="middle"
    font-size="${R(textMm/k)}" fill="${color}" font-weight="700"
    style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${halo}">${fmt(len)}</text>`;
  return line + `<path d="${a1}" fill="${color}"/><path d="${a2}" fill="${color}"/>` + txt;
}

function doExportPdf(){
  if(!S.project.elements.length && !S.project.walls.length){
    toast('Není co exportovat – nakresli aspoň zeď');
    return;
  }
  buildPrint();
  toast('V dialogu tisku zvol „Uložit jako PDF“');
  setTimeout(()=> window.print(), 250);
}

/* ─────────────────────────── 16. NÁSTROJE / LIŠTA ─────────────────────────── */

function setTool(t){
  commitDraft();                       // rozdělaná zeď se uloží, ne zahodí
  S.tool = t;
  $$('.tool-btn').forEach(b => {
    const on = b.dataset.tool === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true':'false');
  });
  $('#hint').textContent = HINTS[t] || '';
  render();
}
const HINTS = {
  select: 'Klepni na prvek, zeď nebo odstupovou čáru a uprav ji vpravo. Táhnout = přesun, bílé body = změna velikosti.',
  rect:   'Táhni a nakresli obdélník – rozměry pak přepíšeš vpravo. Krátké klepnutí vloží obdélník 600 × 510.',
  wall:   'Klikej body zdi. Hotovo stiskni nahoře (nebo Enter) – klik na první bod zeď uzavře. Délky úseků pak přepíšeš vpravo.',
  guide:  'Táhni odstupovou čáru. Přichytává se k ní stejně jako ke zdi.',
  window: 'Klepni na zeď – vloží se okno 600 mm. Šířku a polohu pak upravíš vpravo; oknem jde táhnout podél zdi.',
  sym:    'Dole vyber značku a klepej do půdorysu. Vpravo ji přichytíš k zdi a zadáš přesné mm od rohu i od líce; poznámku (myčka, trouba…) doplníš tamtéž.',
  measure:'Táhni pro změření vzdálenosti – měří se jen vodorovně (X) nebo svisle (Y), nikdy šikmo. Chytá se na rohy/hrany skříní, boků+ a zdí. Nic se neukládá.'
};

function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ─────────────────────────── 17. INICIALIZACE ─────────────────────────── */

function buildTools(){
  const tools = [
    ['select','⬚','Výběr a úpravy'],
    ['rect','▭','Obdélník'],
    ['wall','▬','Zeď / příčka'],
    ['guide','⇢','Odstupová čára'],
    ['window','◫','Okno'],
    ['sym','⌁','Značky instalací'],
    ['measure','↔','Změřit']
  ];
  $('#tools').innerHTML = tools.map(([id,ic,label]) =>
    `<button class="tool-btn" data-tool="${id}" title="${label}" aria-pressed="false">
       <span class="tool-ic">${ic}</span><span class="tool-lb">${label}</span>
     </button>`).join('');
  $('#tools').addEventListener('click', ev => {
    const b = ev.target.closest('.tool-btn'); if(!b) return;
    /* Klik na nástroj, kterým právě kreslím, kresbu dokončí a nechá nástroj
       aktivní – další klik začne novou zeď. */
    if(b.dataset.tool === S.tool && S.draft){ commitDraft(); return; }
    setTool(b.dataset.tool);
  });
  // krátké klepnutí nástrojem Obdélník (bez tažení) vloží výchozí obdélník
  let downAt = null;
  $('#svg').addEventListener('pointerdown', ev => { downAt = { x:ev.clientX, y:ev.clientY, t:Date.now() }; });
  $('#svg').addEventListener('pointerup', ev => {
    if(S.tool!=='rect' || !downAt) return;
    const moved = Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y);
    if(moved < 6 && Date.now()-downAt.t < 500){
      const wpt = screenToWorld(ev.clientX, ev.clientY);
      const e = addElementAtPoint(wpt.x, wpt.y);
      select('el', e.id); pushHistory();
      toast(S.layer==='HS' ? 'Horní skříň 600 × 320 (š × hl) u zdi – uprav rozměry vpravo' : 'Obdélník 600 × 510 (š × hl) – uprav rozměry vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
    downAt = null;
  });
}

function bindUi(){
  $('#btnProjectInfo').onclick = openProjectModal;
  $('#btnProjSave').onclick = saveProjectInfo;
  $('#btnProjNew').onclick = resetProject;
  $('#btnNew').onclick = resetProject;
  $('#btnProjCancel').onclick = closeProjectModal;
  $('#btnRoomTool').onclick = openRoomModal;
  $('#btnRoomCancel').onclick = closeRoomModal;
  $('#btnRoomCreate').onclick = () => {
    createRoom(+$('#fRoomW').value||4200, +$('#fRoomD').value||3000, +$('#fWallT').value||WALL_T_DEFAULT);
    closeRoomModal();
    toast('Místnost vytvořena – uprav délky úseků vpravo');
  };
  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  $('#btnGrid').onclick = () => {
    S.showGrid = !S.showGrid;
    $('#btnGrid').setAttribute('aria-pressed', S.showGrid?'true':'false');
    render();
  };
  $('#btnDims').onclick = () => {
    S.showDims = !S.showDims;
    $('#btnDims').setAttribute('aria-pressed', S.showDims?'true':'false');
    render();
  };
  $('#btnFronts').onclick = () => {
    S.showFronts = !S.showFronts;
    $('#btnFronts').setAttribute('aria-pressed', S.showFronts?'true':'false');
    render();
  };
  /* Blende v rozích: vypínač automatiky. Když je vypnutá, nic se
     nedopočítává a blende si můžeš nakreslit sám jako prvek. */
  $('#btnBlendeAuto').onclick = () => {
    const P = pricing();
    P.blendeOn = (P.blendeOn === false);
    syncBlendeAuto();
    save();
    render();
    toast(P.blendeOn === false
      ? 'Blende v rozích VYPNUTÁ – nakresli si ji sám'
      : 'Blende v rozích zapnutá – počítá se z rohů');
  };
  $('#btnBlendeAuto').setAttribute('aria-pressed', pricing().blendeOn === false ? 'false' : 'true');
  $('#btnDimInst').onclick = () => {
    S.showDimInst = !S.showDimInst;
    $('#btnDimInst').setAttribute('aria-pressed', S.showDimInst?'true':'false');
    render();
  };
  $('#btnMagnet').onclick = () => {
    S.magnet = !S.magnet;
    $('#btnMagnet').setAttribute('aria-pressed', S.magnet?'true':'false');
    toast(S.magnet ? 'Magnet zapnutý' : 'Magnet vypnutý');
  };
  $('#btnLayerAll').onclick = () => setLayer('all');
  $('#btnLayerDS').onclick  = () => setLayer('DS');
  $('#btnLayerHS').onclick  = () => setLayer('HS');
  $('#btnZoomIn').onclick  = () => zoomBy(1.25);
  $('#btnZoomOut').onclick = () => zoomBy(1/1.25);
  $('#btnFit').onclick = () => fitView();
  $('#btnSave').onclick = () => { save(); exportJson(); toast('Uloženo do souboru JSON'); };
  $('#btnPrice').onclick = openPriceModal;
  $('#btnPriceClose').onclick = closePriceModal;
  $('#btnPriceSave').onclick = () => { savePricing(); closePriceModal(); };
  $('#btnPricePrint').onclick = printPriceOnly;
  $('#btnPriceReset').onclick = resetPricing;
  $('#modalPrice').addEventListener('click', ev => { if(ev.target.id === 'modalPrice') closePriceModal(); });
  $('#btnPdf').onclick = doExportPdf;
  $('#btnPng').onclick = doExportPng;
  $('#btnImport').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const p = JSON.parse(r.result);
        if(!p.elements || !p.walls) throw new Error('neplatný formát');
        loadProject(p);
        toast('Nárys načten');
      }catch(err){ toast('Soubor se nepodařilo načíst'); }
    };
    r.readAsText(f);
  };
  $('#snapRange').oninput = ev => { S.snapMm = +ev.target.value; $('#snapOut').textContent = S.snapMm + ' mm'; };

  const s = svg();
  s.addEventListener('pointerdown', ptrDown);
  s.addEventListener('pointermove', ptrMove);
  s.addEventListener('pointerup', ptrUp);
  s.addEventListener('pointercancel', ptrUp);
  s.addEventListener('dblclick', onDblClick);
  /* wheel se chytá na celém okně, aby pinch/ctrl+kolečko kdekoli
     zoomoval výkres a ne celou stránku (viz onWheel) */
  window.addEventListener('wheel', onWheel, { passive:false });
  s.addEventListener('contextmenu', ev => ev.preventDefault());

  window.addEventListener('keydown', ev => {
    const inField = /input|textarea|select/i.test(document.activeElement?.tagName || '');
    if(inField) return;
    const meta = ev.metaKey || ev.ctrlKey;
    const k = ev.key.toLowerCase();
    if(meta && k==='z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if(meta && k==='s'){ ev.preventDefault(); save(); exportJson(); return; }
    if(meta && k==='p'){ ev.preventDefault(); doExportPdf(); return; }
    if(meta && k==='d'){ ev.preventDefault(); duplicateSelection(); return; }
    /* Zoom výkresu klávesnicí – aby se nezvětšovala celá stránka (a s ní
       panel vpravo a lišty), které pak nejdou oddálit. */
    if(meta && (k==='+' || k==='=')){ ev.preventDefault(); zoomBy(1.25); return; }
    if(meta && k==='-'){ ev.preventDefault(); zoomBy(1/1.25); return; }
    if(ev.key==='Delete' || ev.key==='Backspace'){ ev.preventDefault(); deleteSelection(); return; }
    if(ev.key==='Enter'){ if(S.draft?.kind==='wall'){ ev.preventDefault(); finishWall(false); } return; }
    if(ev.key==='Backspace' && S.draft?.kind==='wall'){ ev.preventDefault(); undoWallPoint(); return; }
    if(ev.key==='Escape'){
      S.draft = null; S.measure = null; select(null,null); setTool('select'); return;
    }
    if(k==='v'){ setTool('select'); }
    if(k==='r'){ setTool('rect'); }
    if(k==='z' && !meta){ setTool('wall'); }
    if(k==='g'){ setTool('guide'); }
    if(k==='m'){ setTool('measure'); }
    if(k==='o'){ rotateSelection(); }
  });

  window.addEventListener('beforeprint', () => { try{ buildPrint(); }catch(e){ console.warn(e); } });
  window.addEventListener('resize', () => render());
}

function loadProject(p, {resetHistory=true}={}){
  S.project = {
    id: p.id || uid('p'),
    info: { ...newProject().info, ...(p.info||{}) },
    walls: (p.walls||[]).map(w => ({ ...w, id:w.id||uid('w'), pts:(w.pts||[]).map(q=>({x:+q.x||0,y:+q.y||0})),
                                    t:w.t||WALL_T_DEFAULT, closed:!!w.closed, name:w.name||'Zeď', side:w.side ?? null })),
    /* ...e zachová i pole, která nejsou v seznamu níž – hlavně druh
       (kind = DS/HS), výšku (h) a bok+ (bok). Bez toho se po načtení
       tvářily všechny skříně jako spodní (DS). */
    elements: (p.elements||[]).map(e => {
      const o = { ...e, id:e.id||uid('e'), x:+e.x||0, y:+e.y||0,
        w:+e.w||600, d:+e.d||600, name:e.name||'', note:e.note||'', qty:e.qty||1,
        color:e.color||COLORS[0], front:e.front||'jih' };
      const kd = String(o.kind ?? '').toLowerCase();
      if(kd === 'upper' || kd === 'base' || kd === 'column') o.kind = kd; else delete o.kind;
      const hv = +o.h;
      if(hv >= 100) o.h = clamp(hv, 100, 3000); else delete o.h;
      const nb = normBok(o.bok);
      if(nb) o.bok = nb; else delete o.bok;
      const fr = o.fronts;
      if(fr && typeof fr === 'object' && fr.on){
        o.fronts = { on:true,
          doors:   clamp(Math.round(+fr.doors   || 0), 0, 20),
          drawers: clamp(Math.round(+fr.drawers || 0), 0, 20) };
      } else delete o.fronts;
      /* blende se od v2 nepočítá ručně – dopočítá se z rohů půdorysu */
      delete o.blende;
      return o;
    }),
    guides: (p.guides||[]).map(g => ({ ...g, id:g.id||uid('g'), a:{x:+g.a?.x||0,y:+g.a?.y||0},
      b:{x:+g.b?.x||0,y:+g.b?.y||0}, print:g.print!==false, name:g.name||'Odstup' })),
    windows: (p.windows||[]).map(o => ({ ...o, id:o.id||uid('o'), wallId:o.wallId, seg:+o.seg||0,
      off:+o.off||0, w:Math.max(100,+o.w||600) })),
    symbols: (p.symbols||[]).map(o => ({ ...o, id:o.id||uid('s'), x:+o.x||0, y:+o.y||0,
      type:symType(o.type).id, note:o.note||'', wallId:o.wallId ?? null,
      seg:+o.seg||0, along:+o.along||0, off:+o.off||0 })),
    pricing: (p.pricing && typeof p.pricing === 'object') ? p.pricing : PRICE_DEFAULTS(),
    created: p.created || new Date().toISOString()
  };
  S.sel = null;
  /* starší uložené nákresy mají souřadnice od bývalého středu pohledu –
     hned je ukotvíme do počátku, ať v nich nejsou obrovská čísla */
  rebaseProject();
  $('#projTitle').textContent = S.project.info.name || 'Nový nárys';
  if(resetHistory){ history = [snapshot()]; historyIndex = 0; }
  fitView();
  save();
}

function init(){
  buildTools();
  $('#symPal')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-symtype]'); if(!b) return;
    S.symType = b.dataset.symtype;
    render();
  });
  bindUi();
  setTool('select');
  $('#snapRange').value = S.snapMm;

  let restored = null;
  try{ restored = JSON.parse(STORE.getItem(STORE_KEY) || 'null'); }catch(e){}
  if(restored && (restored.walls?.length || restored.elements?.length)){
    /* Projekty z doby, kdy byl výchozí formát A3 na šířku, se jednorázově
       přepnou na A4 na šířku (tisk na běžný A4) – viz MIG_PAPER. */
    if(restored.info?.paper === 'A3L' && !STORE.getItem('MIG_PAPER_A4L')){
      restored.info.paper = 'A4L';
      try{ STORE.setItem(STORE_KEY, JSON.stringify(restored)); }catch(e){}
    }
    loadProject(restored);
    toast('Obnoven poslední nárys');
  } else {
    S.project = newProject();
    $('#projTitle').textContent = 'Nový nárys';
    history = [snapshot()]; historyIndex = 0;
    openProjectModal();
  }
  try{ STORE.setItem('MIG_PAPER_A4L','1'); }catch(e){}
  requestAnimationFrame(()=>{ fitView(); render(); });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>

  /* Rozměr stránky musí odpovídat zvolenému papíru – jinak tiskárna výkres
     přeškáluje a čáry přestanou sedět. */
  pages.unshift(`<style>
    @page { size: ${P.w}mm ${P.h}mm; margin: 0; }
    @page coverPage { size: ${P.w}mm ${P.h}mm; margin: 0; }
    .pr-page { width: ${P.w}mm; height: ${P.h}mm; padding: 14mm 14mm 16mm; }
  </style>`);
  $('#printRoot').innerHTML = pages.join('');
}

function legendHtml(){
  const used = [...new Map(S.project.elements.map(e=>[e.name||'bez názvu', e])).values()];
  return used.map(e => `<span class="lg"><i class="sw" style="background:${e.color}"></i>${esc(e.name||'bez názvu')}</span>`).join('')
    + `<span class="lg"><i class="sw" style="background:#2b3138"></i>Zeď</span>`
    + (S.project.guides.some(g=>g.print) ? `<span class="lg"><i class="sw" style="background:#c2410c;height:0;border-top:2px dashed #c2410c"></i>Odstupová čára</span>` : '');
}

/**
 * Výkres v souřadnicích PAPÍRU (mm). Tloušťky čar i písma jsou zadány v mm na
 * papíře a přepočteny přes měřítko k – proto nejsou „rozmazané“.
 */
function drawingSvg(P){
  const b = contentBBox();
  if(!b) return `<svg viewBox="0 0 ${P.w} ${P.h}"></svg>`;
  const M = 12;                                  // okraj [mm papíru]
  const iw = P.w - M*2, ih = P.h - M*2;
  const pad = 900;                               // místo na kóty [mm skutečnosti]
  const k = Math.min(iw / (b.w + pad*2), ih / (b.h + pad*2));
  const ox = M + (iw - (b.w + pad*2)*k)/2 - (b.x - pad)*k;
  const oy = M + (ih - (b.h + pad*2)*k)/2 - (b.y - pad)*k;
  const sw = pen => R(pen/k);                    // mm papíru → user units
  const fs = mm => R(mm/k);                      // výška písma [mm papíru]

  const parts = [];
  parts.push(`<g transform="translate(${R(ox)},${R(oy)}) scale(${k})">`);

  // odstupové čáry (pod zdmi, aby je nepřekryly)
  for(const g of S.project.guides){
    if(!g.print) continue;
    const dx = g.b.x-g.a.x, dy = g.b.y-g.a.y, L = Math.hypot(dx,dy)||1;
    const ex = 4000, ux = dx/L*ex, uy = dy/L*ex;
    parts.push(`<line x1="${R(g.a.x-ux)}" y1="${R(g.a.y-uy)}" x2="${R(g.b.x+ux)}" y2="${R(g.b.y+uy)}"
      stroke="#c2410c" stroke-width="${sw(PEN.guide)}" stroke-dasharray="${sw(1.6)} ${sw(1)}"/>`);
  }

  // zdi
  for(const w of S.project.walls){
    if(w.pts.length < 2) continue;
    const d = w.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + (w.closed?' Z':'');
    parts.push(`<path d="${d}" fill="${w.closed?'#fafafa':'none'}" stroke="#22262b"
      stroke-width="${w.t||WALL_T_DEFAULT}" stroke-linejoin="miter" stroke-linecap="square"/>`);
  }

  // prvky – tenká linka, žádná výplň přes sousedy
  for(const e of S.project.elements){
    parts.push(`<rect x="${e.x}" y="${e.y}" width="${Math.max(e.w,1)}" height="${Math.max(e.d,1)}"
      fill="${e.color}14" stroke="#1f2937" stroke-width="${sw(PEN.el)}"/>`);
    const fv = FRONT_VEC[e.front||'jih'];
    const m = Math.min(80, e.w*0.14, e.d*0.14);
    let dl = '';
    if(fv[1]===1)  dl = `M${e.x+m} ${e.y+e.d-m} H${e.x+e.w-m}`;
    if(fv[1]===-1) dl = `M${e.x+m} ${e.y+m} H${e.x+e.w-m}`;
    if(fv[0]===1)  dl = `M${e.x+e.w-m} ${e.y+m} V${e.y+e.d-m}`;
    if(fv[0]===-1) dl = `M${e.x+m} ${e.y+m} V${e.y+e.d-m}`;
    if(dl) parts.push(`<path d="${dl}" stroke="${e.color}" stroke-width="${sw(PEN.el)}" fill="none"/>`);

    const capPx = Math.min(e.w, e.d);
    if(capPx*k >= 5){                            // ~5 mm na papíře → popisek se vejde
      const size = fs(clamp(capPx*k*0.30, 2.0, 3.4));
      parts.push(`<text x="${R(e.x+e.w/2)}" y="${R(e.y+e.d/2)}" text-anchor="middle" dominant-baseline="middle"
        font-size="${size}" font-weight="700" fill="#0d1117"
        style="font-family:Helvetica,Arial,sans-serif">${esc(e.name||'')}</text>`);
    }
  }

  // kóty
  const wb = wallsBBox();
  if(wb){
    parts.push(dimPrint(wb.x, wb.y-600, wb.x+wb.w, wb.y-600, 'x', k));
    parts.push(dimPrint(wb.x-600, wb.y, wb.x-600, wb.y+wb.h, 'y', k));
  }
  for(const e of S.project.elements){
    parts.push(dimPrint(e.x, e.y+e.d+220, e.x+e.w, e.y+e.d+220, 'x', k, 0.8));
  }
  for(const run of computeRuns()){
    parts.push(dimPrint(run.x1, run.y+620, run.x2, run.y+620, 'x', k, 1.1));
  }
  for(const g of S.project.guides){
    if(!g.print) continue;
    const horiz = Math.abs(g.a.y-g.b.y) <= Math.abs(g.a.x-g.b.x);
    if(horiz) parts.push(dimPrint(g.a.x, g.a.y-180, g.b.x, g.b.y-180, 'x', k, 0.7, '#c2410c'));
    else      parts.push(dimPrint(g.a.x-180, g.a.y, g.b.x-180, g.b.y, 'y', k, 0.7, '#c2410c'));
  }

  // měřítko
  const bx = b.x + 500, by = b.y + b.h - 300;
  parts.push(`<line x1="${bx}" y1="${by}" x2="${bx+1000}" y2="${by}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx}" y1="${by-60}" x2="${bx}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx+1000}" y1="${by-60}" x2="${bx+1000}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<text x="${bx+500}" y="${by-110}" text-anchor="middle" font-size="${fs(2.6)}" fill="#111"
    style="font-family:Helvetica,Arial,sans-serif">1 000 mm</text>`);

  parts.push(`</g>`);
  return `<svg viewBox="0 0 ${P.w} ${P.h}" width="${P.w}mm" height="${P.h}mm" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

/** Kóta v souřadnicích skutečnosti, tloušťky/písmo přepočtené z mm papíru. */
function dimPrint(x1,y1,x2,y2,axis,k,mul=1,color='#0d6b5f'){
  const len = axis==='x' ? Math.abs(x2-x1) : Math.abs(y2-y1);
  if(len < 20) return '';
  const swp = p => R(p/k);
  const textMm = 2.6*mul;
  const gap = textMm/k*2.6;
  let line;
  if(axis==='x'){
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1+gap}" y2="${y1}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2-gap}" y1="${y2}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  } else {
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y1+gap}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2}" y1="${y2-gap}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  }
  const tick = 30*mul;
  const a1 = axis==='x' ? `M${x1} ${y1-tick} l${tick*1.4} ${tick} l${-tick*1.4} ${tick}`
                        : `M${x1-tick} ${y1} l${tick} ${tick*1.4} l${tick} ${-tick*1.4}`;
  const a2 = axis==='x' ? `M${x2} ${y2-tick} l${-tick*1.4} ${tick} l${tick*1.4} ${tick}`
                        : `M${x2+tick} ${y2} l${-tick} ${-tick*1.4} l${-tick} ${tick*1.4}`;
  const halo = swp(0.35);                        // tenká bílá halo, ne tlustá skvrna
  const txt = `<text x="${R((x1+x2)/2)}" y="${R((y1+y2)/2)}" text-anchor="middle" dominant-baseline="middle"
    font-size="${R(textMm/k)}" fill="${color}" font-weight="600"
    style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${halo}">${fmt(len)}</text>`;
  return line + `<path d="${a1}" fill="${color}"/><path d="${a2}" fill="${color}"/>` + txt;
}

function doExportPdf(){
  if(!S.project.elements.length && !S.project.walls.length){
    toast('Není co exportovat – nakresli aspoň zeď');
    return;
  }
  buildPrint();
  toast('V dialogu tisku zvol „Uložit jako PDF“');
  setTimeout(()=> window.print(), 250);
}

/* ─────────────────────────── 16. NÁSTROJE / LIŠTA ─────────────────────────── */

function setTool(t){
  commitDraft();                       // rozdělaná zeď se uloží, ne zahodí
  S.tool = t;
  $$('.tool-btn').forEach(b => {
    const on = b.dataset.tool === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true':'false');
  });
  $('#hint').textContent = HINTS[t] || '';
  render();
}
const HINTS = {
  select: 'Klepni na prvek, zeď nebo odstupovou čáru a uprav ji vpravo. Táhnout = přesun, bílé body = změna velikosti.',
  rect:   'Táhni a nakresli obdélník – rozměry pak přepíšeš vpravo. Krátké klepnutí vloží obdélník 600 × 600.',
  wall:   'Klikej body zdi. Hotovo stiskni nahoře (nebo Enter) – klik na první bod zeď uzavře. Délky úseků pak přepíšeš vpravo.',
  guide:  'Táhni odstupovou čáru. Přichytává se k ní stejně jako ke zdi.',
  measure:'Táhni pro změření vzdálenosti – nic se neukládá.'
};

function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ─────────────────────────── 17. INICIALIZACE ─────────────────────────── */

function buildTools(){
  const tools = [
    ['select','⬚','Výběr a úpravy'],
    ['rect','▭','Obdélník'],
    ['wall','▬','Zeď / příčka'],
    ['guide','⇢','Odstupová čára'],
    ['measure','↔','Změřit']
  ];
  $('#tools').innerHTML = tools.map(([id,ic,label]) =>
    `<button class="tool-btn" data-tool="${id}" title="${label}" aria-pressed="false">
       <span class="tool-ic">${ic}</span><span class="tool-lb">${label}</span>
     </button>`).join('');
  $('#tools').addEventListener('click', ev => {
    const b = ev.target.closest('.tool-btn'); if(!b) return;
    /* Klik na nástroj, kterým právě kreslím, kresbu dokončí a nechá nástroj
       aktivní – další klik začne novou zeď. */
    if(b.dataset.tool === S.tool && S.draft){ commitDraft(); return; }
    setTool(b.dataset.tool);
  });
  // krátké klepnutí nástrojem Obdélník (bez tažení) vloží výchozí obdélník
  let downAt = null;
  $('#svg').addEventListener('pointerdown', ev => { downAt = { x:ev.clientX, y:ev.clientY, t:Date.now() }; });
  $('#svg').addEventListener('pointerup', ev => {
    if(S.tool!=='rect' || !downAt) return;
    const moved = Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y);
    if(moved < 6 && Date.now()-downAt.t < 500){
      const wpt = screenToWorld(ev.clientX, ev.clientY);
      const e = addElementAtPoint(wpt.x, wpt.y);
      select('el', e.id); pushHistory();
      toast('Obdélník 600 × 600 – uprav rozměry vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
    downAt = null;
  });
}

function bindUi(){
  $('#btnProjectInfo').onclick = openProjectModal;
  $('#btnProjSave').onclick = saveProjectInfo;
  $('#btnProjCancel').onclick = closeProjectModal;
  $('#btnRoomTool').onclick = openRoomModal;
  $('#btnRoomCancel').onclick = closeRoomModal;
  $('#btnRoomCreate').onclick = () => {
    createRoom(+$('#fRoomW').value||4200, +$('#fRoomD').value||3000, +$('#fWallT').value||WALL_T_DEFAULT);
    closeRoomModal();
    toast('Místnost vytvořena – uprav délky úseků vpravo');
  };
  $('#btnUndo').onclick = undo;
  $('#btnRedo').onclick = redo;
  $('#btnGrid').onclick = () => {
    S.showGrid = !S.showGrid;
    $('#btnGrid').setAttribute('aria-pressed', S.showGrid?'true':'false');
    render();
  };
  $('#btnDims').onclick = () => {
    S.showDims = !S.showDims;
    $('#btnDims').setAttribute('aria-pressed', S.showDims?'true':'false');
    render();
  };
  $('#btnMagnet').onclick = () => {
    S.magnet = !S.magnet;
    $('#btnMagnet').setAttribute('aria-pressed', S.magnet?'true':'false');
    toast(S.magnet ? 'Magnet zapnutý' : 'Magnet vypnutý');
  };
  const stageCenter = () => { const r = svg().getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 }; };
  $('#btnZoomIn').onclick  = () => { const c = stageCenter(); zoomAt(c.x, c.y, S.view.zoom*1.25); };
  $('#btnZoomOut').onclick = () => { const c = stageCenter(); zoomAt(c.x, c.y, S.view.zoom/1.25); };
  $('#btnFit').onclick = () => fitView();
  $('#btnSave').onclick = () => { save(); exportJson(); toast('Uloženo do souboru JSON'); };
  $('#btnPdf').onclick = doExportPdf;
  $('#btnImport').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const p = JSON.parse(r.result);
        if(!p.elements || !p.walls) throw new Error('neplatný formát');
        loadProject(p);
        toast('Nárys načten');
      }catch(err){ toast('Soubor se nepodařilo načíst'); }
    };
    r.readAsText(f);
  };
  $('#snapRange').oninput = ev => { S.snapMm = +ev.target.value; $('#snapOut').textContent = S.snapMm + ' mm'; };

  const s = svg();
  s.addEventListener('pointerdown', ptrDown);
  s.addEventListener('pointermove', ptrMove);
  s.addEventListener('pointerup', ptrUp);
  s.addEventListener('pointercancel', ptrUp);
  s.addEventListener('dblclick', onDblClick);
  s.addEventListener('wheel', onWheel, { passive:false });
  s.addEventListener('contextmenu', ev => ev.preventDefault());

  window.addEventListener('keydown', ev => {
    const inField = /input|textarea|select/i.test(document.activeElement?.tagName || '');
    if(inField) return;
    const meta = ev.metaKey || ev.ctrlKey;
    const k = ev.key.toLowerCase();
    if(meta && k==='z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if(meta && k==='s'){ ev.preventDefault(); save(); exportJson(); return; }
    if(meta && k==='p'){ ev.preventDefault(); doExportPdf(); return; }
    if(meta && k==='d'){ ev.preventDefault(); duplicateSelection(); return; }
    if(ev.key==='Delete' || ev.key==='Backspace'){ ev.preventDefault(); deleteSelection(); return; }
    if(ev.key==='Enter'){ if(S.draft?.kind==='wall'){ ev.preventDefault(); finishWall(false); } return; }
    if(ev.key==='Backspace' && S.draft?.kind==='wall'){ ev.preventDefault(); undoWallPoint(); return; }
    if(ev.key==='Escape'){
      S.draft = null; S.measure = null; select(null,null); setTool('select'); return;
    }
    if(k==='v'){ setTool('select'); }
    if(k==='r'){ setTool('rect'); }
    if(k==='z' && !meta){ setTool('wall'); }
    if(k==='g'){ setTool('guide'); }
    if(k==='m'){ setTool('measure'); }
    if(k==='o'){ rotateSelection(); }
  });

  window.addEventListener('beforeprint', () => { try{ buildPrint(); }catch(e){ console.warn(e); } });
  window.addEventListener('resize', () => render());
}

function loadProject(p, {resetHistory=true}={}){
  S.project = {
    id: p.id || uid('p'),
    info: { ...newProject().info, ...(p.info||{}) },
    walls: (p.walls||[]).map(w => ({ id:w.id||uid('w'), pts:(w.pts||[]).map(q=>({x:+q.x||0,y:+q.y||0})),
                                    t:w.t||WALL_T_DEFAULT, closed:!!w.closed, name:w.name||'Zeď' })),
    elements: (p.elements||[]).map(e => ({ id:e.id||uid('e'), x:+e.x||0, y:+e.y||0,
      w:+e.w||600, d:+e.d||600, name:e.name||'', note:e.note||'', qty:e.qty||1,
      color:e.color||COLORS[0], front:e.front||'jih' })),
    guides: (p.guides||[]).map(g => ({ id:g.id||uid('g'), a:{x:+g.a?.x||0,y:+g.a?.y||0},
      b:{x:+g.b?.x||0,y:+g.b?.y||0}, print:g.print!==false, name:g.name||'Odstup' })),
    created: p.created || new Date().toISOString()
  };
  S.sel = null;
  /* starší uložené nákresy mají souřadnice od bývalého středu pohledu –
     hned je ukotvíme do počátku, ať v nich nejsou obrovská čísla */
  rebaseProject();
  $('#projTitle').textContent = S.project.info.name || 'Nový nárys';
  if(resetHistory){ history = [snapshot()]; historyIndex = 0; }
  fitView();
  save();
}

function init(){
  buildTools();
  bindUi();
  setTool('select');
  $('#snapRange').value = S.snapMm;

  let restored = null;
  try{ restored = JSON.parse(STORE.getItem(STORE_KEY) || 'null'); }catch(e){}
  if(restored && (restored.walls?.length || restored.elements?.length)){
    loadProject(restored);
    toast('Obnoven poslední nárys');
  } else {
    S.project = newProject();
    $('#projTitle').textContent = 'Nový nárys';
    history = [snapshot()]; historyIndex = 0;
    openProjectModal();
  }
  requestAnimationFrame(()=>{ fitView(); render(); });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>

     : l==='DS'  ? 'Vrstva DS: spodní skříňky + sloupy'
     :            'Vrstva HS: horní skříňky + sloupy');
}
/* Nový prvek nakreslený ve vrstvě HS je rovnou HORNÍ skříň: přisune se ke
   zdi, hloubka 320, výška 710. */
function finishNewElementKind(e){
  if(S.layer === 'HS'){
    e.kind = 'upper'; e.h = UP_H_DFLT;
    const f = e.front || 'jih';
    const face = wallFaceBehind(e);
    if(face != null){
      if(f==='jih')        { e.y = R(face); e.d = UP_D_DFLT; }
      else if(f==='sever') { e.d = UP_D_DFLT; e.y = R(face - UP_D_DFLT); }
      else if(f==='východ'){ e.x = R(face); e.w = UP_D_DFLT; }
      else                 { e.w = UP_D_DFLT; e.x = R(face - UP_D_DFLT); }
    } else {
      e.d = Math.min(e.d, UP_D_DFLT);
    }
  }
  return e;
}

/* Souvislé řady spodních skříněk (pro sokl a délky materiálu). */
function dsRuns(){
  /* Do „řady DS“ patří spodní skříňky (base) i sloupy (column) stojící na stejné
     čelní linii – sloup uprostřed řady (např. lednice) řadu nerozdělí. Řada,
     která neobsahuje žádnou spodní skříňku, sokl nedostává. */
  const items = [];
  for(const e of S.project.elements){
    const k = elKind3(e);
    if(k!=='base' && k!=='column') continue;
    const f = e.front || 'jih';
    let s0, s1, face;
    if(f==='jih')        { face=e.y+e.d; s0=e.x;   s1=e.x+e.w; }
    else if(f==='sever') { face=e.y;    s0=e.x;   s1=e.x+e.w; }
    else if(f==='východ'){ face=e.x;    s0=e.y;   s1=e.y+e.d; }
    else                 { face=e.x+e.w;s0=e.y;   s1=e.y+e.d; }
    items.push({ e, k, f, face:R(face), s0, s1 });
  }
  const groups = {};
  for(const it of items){ const key = it.f+':'+it.face; (groups[key]=groups[key]||[]).push(it); }
  const runs = [];
  for(const key in groups){
    const g = groups[key].sort((a,b)=>a.s0-b.s0);
    let cur = null;
    for(const b of g){
      if(!cur){
        cur = { f:b.f, face:b.face, s0:b.s0, s1:b.s1, el:[b.e], n:(b.k==='base'?1:0) };
      } else if(b.s0 - cur.s1 <= 90){
        cur.s1 = Math.max(cur.s1, b.s1); cur.el.push(b.e); if(b.k==='base') cur.n++;
      } else {
        if(cur.n > 0) runs.push(cur);
        cur = { f:b.f, face:b.face, s0:b.s0, s1:b.s1, el:[b.e], n:(b.k==='base'?1:0) };
      }
    }
    if(cur && cur.n > 0) runs.push(cur);
  }
  const out = [];
  for(const r of runs){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const e of r.el){ x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); }
    const len = (r.f==='jih'||r.f==='sever') ? (x1-x0) : (y1-y0);
    out.push({ f:r.f, face:r.face, len, x0, y0, x1, y1, n:r.n, el:r.el });
  }
  return out;
}

/* ── čelní sokl (150 mm) pod řadami DS – do 3D/PNG modelu ── */
function plinths3(sc, mats){
  for(const r of dsRuns()){
    scBox(sc, r.x0, r.y0, r.x1, r.y1, B3D.floorT, B3D.floorT + B3D.sokl, mats.plinth);
  }
}

/* ── zjednodušená scéna: vrcholy + plochy (materiál po ploše) ── */
function mkScene(){ return { verts:[], facs:[] }; }
function scAddPt(sc, x, y, z){
  const q = n => Math.round(n*1000)/1000;      // 0.001 m = 1 mm
  sc.verts.push([q(x/1000), q(-y/1000), q(z/1000)]);
  return sc.verts.length - 1;
}
function vec3(a,b){ return [b[0]-a[0], b[1]-a[1], b[2]-a[2]]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function mid3(ps){ return ps.reduce((s,p)=>{ s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; return s; },[0,0,0]).map(v=>v/ps.length); }

/* Čtyřúhelník mezi 4 3D body; normálu otočí vždy VEN od středu tělesa cen. */
function scQuad(sc, pts, cen, mat){
  const cc = mid3(pts);
  let n = cross3(vec3(pts[0],pts[1]), vec3(pts[0],pts[2]));
  const out = vec3(cc, cen);
  if(dot3(n, out) < 0){
    sc.facs.push({ mat, v:[scAddPt(sc,pts[0][0],pts[0][1],pts[0][2]), scAddPt(sc,pts[3][0],pts[3][1],pts[3][2]), scAddPt(sc,pts[2][0],pts[2][1],pts[2][2]), scAddPt(sc,pts[1][0],pts[1][1],pts[1][2])] });
  } else {
    sc.facs.push({ mat, v:pts.map(p=>scAddPt(sc,p[0],p[1],p[2])) });
  }
}

/* Hranol z rovinného polygonu (plan x,y v mm) mezi z0 a z1 [mm]. */
function scPrism(sc, corners, z0, z1, mat){
  const n = corners.length;
  if(n < 3 || z1 - z0 < 0.5) return;
  const btm = [], top = [], all = [];
  for(const c of corners){
    btm.push([c.x, c.y, z0]); top.push([c.x, c.y, z1]);
  }
  all.push(...btm, ...top);
  const cen = mid3(all);
  for(let i=0;i<n;i++){
    const j = (i+1)%n;
    scQuad(sc, [btm[i], btm[j], top[j], top[i]], cen, mat);   // bok
  }
  scQuad(sc, btm, cen, mat);                                    // dno (dolů)
  scQuad(sc, top, cen, mat);                                    // vrch (nahoru)
}
/* Obdélník (x0,y0)-(x1,y1) v mm jako hranol. */
function scBox(sc, x0,y0,x1,y1, z0,z1, mat){
  scPrism(sc, [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}], z0, z1, mat);
}

/* ── pracovní desky nad souvislými řadami spodních skříněk ── */
function counters3(sc){
  const bases = [];
  for(const e of S.project.elements){
    if(elKind3(e) !== 'base') continue;
    const f = e.front || 'jih', w = e.w, d = e.d;
    let front, range0, range1, rect;
    if(f==='jih')      { front = e.y + d; range0 = e.x;         range1 = e.x + w; rect = { y0:e.y,  y1:e.y+d }; }
    else if(f==='sever'){ front = e.y;   range0 = e.x;         range1 = e.x + w; rect = { y0:e.y,  y1:e.y+d }; }
    else if(f==='východ'){ front = e.x + w; range0 = e.y;      range1 = e.y + d; rect = { x0:e.x,  x1:e.x+w }; }
    else                { front = e.x;   range0 = e.y;         range1 = e.y + d; rect = { x0:e.x,  x1:e.x+w }; }
    bases.push({ e, f, front:R(front), r0:R(range0), r1:R(range1), rect, h:elH3(e) });
  }
  const groups = {};
  for(const b of bases){
    const key = b.f + ':' + b.front;
    (groups[key] = groups[key] || []).push(b);
  }
  for(const key in groups){
    const row = groups[key];
    const hTop = Math.max(...row.map(b => b.h));
    row.sort((a,b) => a.r0 - b.r0);
    let runs = [];
    for(const b of row){
      if(runs.length && b.r0 - runs[runs.length-1].r1 <= 90) runs[runs.length-1].r1 = Math.max(runs[runs.length-1].r1, b.r1);
      else runs.push({ r0:b.r0, r1:b.r1, rect:b.rect });
    }
    for(const run of runs){
      const f = row[0].f, z0 = B3D.floorT + B3D.sokl + hTop, z1 = B3D.floorT + B3D.sokl + hTop + B3D.counterT;
      let x0,y0,x1,y1;
      if(f==='jih')      { x0 = run.r0; x1 = run.r1; y1 = row[0].front; y0 = Math.min(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.y0)); }
      else if(f==='sever'){ x0 = run.r0; x1 = run.r1; y0 = row[0].front; y1 = Math.max(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.y1)); }
      else if(f==='východ'){ y0 = run.r0; y1 = run.r1; x1 = row[0].front; x0 = Math.min(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.x0)); }
      else               { y0 = run.r0; y1 = run.r1; x0 = row[0].front; x1 = Math.max(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.x1)); }
      scBox(sc, x0,y0,x1,y1, z0,z1, 'counter');
    }
  }
}

/* ── celá sestava prvků (skříně + sloupy + bok+) ── */
function elements3(sc, mats){
  S.project.elements.forEach((e, i) => {
    const h = elH3(e), z0 = elZ0(e), z1 = z0 + h;
    const mat = mats.el(e.color || '#c9c3b8');
    scBox(sc, e.x, e.y, e.x + e.w, e.y + e.d, z0, z1, mat);
    /* bok+ = tenký svislý panel(y) na boku/bocích skříně */
    for(const b of bokRects(e)){
      let zB0, zB1; const kb = elKind3(e);
      if(kb==='upper')        { zB0 = B3D.upperBot;                 zB1 = B3D.upperBot + BOK_H_HS; }
      else if(kb==='column')  { zB0 = z0;                           zB1 = z1; }
      else                    { zB0 = B3D.floorT;                   zB1 = B3D.floorT + BOK_H_DS; }
      scBox(sc, b.x, b.y, b.x + b.w, b.y + b.h, zB0, zB1, mats.el('#d8d3c8'));
    }
  });
}

/* ── místnost: podlaha, strop, stěny s otvory oken ── */
function room3(sc, mats, noCeil){
  const c = contentBBox({ skipGuides:true });
  if(!c) return;
  const P = B3D.pad;
  scBox(sc, c.x-P, c.y-P, c.x+c.w+P, c.y+c.h+P, 0, B3D.floorT, mats.floor);
  if(!noCeil) scBox(sc, c.x-P, c.y-P, c.x+c.w+P, c.y+c.h+P, B3D.wallH, B3D.wallH+B3D.ceilT, mats.ceil);
  /* okna načtená podle zdi a úseku */
  const winsBy = {};
  for(const w of S.project.windows) winsBy[w.wallId+':'+w.seg] = winsBy[w.wallId+':'+w.seg] || [];
  for(const w of S.project.windows) winsBy[w.wallId+':'+w.seg].push(w);

  for(const w of S.project.walls){
    const t = w.t || WALL_T_DEFAULT, side = wallSide(w);
    for(const sg of wallSegments(w)){
      const dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx,dy);
      if(L < 1) continue;
      const ux = dx/L, uy = dy/L;
      /* směr pásu ven z místnosti (stejná konvence jako 2D výplň zdi) */
      const onx = -uy*side, ony = ux*side;
      const ext = t;                      // prodloužení přes rohy, ať rohy sedí
      const s0 = -ext, s1 = L + ext;
      /* otevřené úseky (okna) */
      const open = [];
      for(const win of (winsBy[w.id+':'+sg.i] || [])){
        const half = Math.min(win.w, L)/2;
        const a = Math.max(s0, win.off - half), b = Math.min(s1, win.off + half);
        if(b - a > 1) open.push([a,b]);
      }
      open.sort((p,q) => p[0]-q[0]);
      const parts = [];
      let cur = s0;
      for(const [a,b] of open){
        if(a - cur > 1) parts.push({ a:cur, b:a, open:false });
        parts.push({ a, b, open:true });
        cur = b;
      }
      if(s1 - cur > 1) parts.push({ a:cur, b:s1, open:false });
      for(const seg of parts){
        const pA = { x:sg.a.x + ux*seg.a, y:sg.a.y + uy*seg.a };
        const pB = { x:sg.a.x + ux*seg.b, y:sg.a.y + uy*seg.b };
        const corners = [
          { x:pA.x,          y:pA.y },
          { x:pB.x,          y:pB.y },
          { x:pB.x + onx*t,  y:pB.y + ony*t },
          { x:pA.x + onx*t,  y:pA.y + ony*t }
        ];
        if(seg.open){
          scPrism(sc, corners, 0, B3D.sill, mats.wall);                  // parapet
          scPrism(sc, corners, B3D.sill, B3D.winTop, mats.glass);        // zasklení
          scPrism(sc, corners, B3D.winTop, B3D.wallH, mats.wall);        // nadpraží
        } else {
          scPrism(sc, corners, 0, B3D.wallH, mats.wall);
        }
      }
    }
  }
}

/* ── sestavení OBJ + MTL ── */
function buildScene3(noCeil){
  const sc = mkScene();
  const used = {};
  const mats = { wall:'#ece8e0', floor:'#d8d0c2', ceil:'#f6f4ef', glass:'#bcd7e8', counter:'#f0ede6', plinth:'#e7e0d3' };
  mats.el = hex => { used[hex]=1; return 'el_' + hex.replace('#',''); };
  elements3(sc, mats);
  counters3(sc);
  plinths3(sc, mats);
  room3(sc, mats, noCeil);
  const matList = Object.keys(used).map(h => ({ name:'el_'+h.replace('#',''), hex:h }));
  matList.push({ name:'wall', hex:mats.wall }, { name:'floor', hex:mats.floor },
               { name:'ceil', hex:mats.ceil }, { name:'glass', hex:mats.glass },
               { name:'counter', hex:mats.counter }, { name:'plinth', hex:mats.plinth });
  return { sc, matList };
}
function buildObj3(){
  const { sc, matList } = buildScene3(false);
  let obj = '# 3D model z plánku (kuchyne-narys)\n# souradnice v metrech (plan x,y; -y = nahoru), Z nahoru\n';
  obj += '# meritko 1:1 k planku; materialy viz model.mtl\n';
  for(const v of sc.verts) obj += 'v ' + v.join(' ') + '\n';
  const byMat = {};
  sc.facs.forEach((f, i) => { (byMat[f.mat] = byMat[f.mat] || []).push([i, f.v]); });
  let oi = 0;
  for(const m in byMat){
    obj += '\no cast_' + (oi++) + '\n';
    obj += 'usemtl ' + m + '\n';
    for(const [, v] of byMat[m]){
      obj += 'f ' + v.map(i => (i+1)).join(' ') + '\n';
    }
  }
  let mtl = '# materialy (kd = barva; v Blenderu je nahrad plnohodnotnymi)\n';
  for(const m of matList) mtl += 'newmtl ' + m.name + '\nKd ' + hexRgb(m.hex) + '\nKs 0 0 0\nKa 0 0 0\n\n';
  return { obj, mtl };
}

/* ── ZIP (bez komprese) + stažení ── */
function crc32(bytes){
  let c; const t = [];
  for(let n=0;n<256;n++){ c = n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n] = c>>>0; }
  let crc = 0xFFFFFFFF;
  for(const b of bytes) crc = t[(crc ^ b) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const u16 = v => [v & 255, (v >> 8) & 255];
  const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
  const body = [], centr = [];
  let off = 0;
  for(const f of files){
    const nb = [...enc.encode(f.name)];
    const db = (typeof f.data === 'string') ? [...enc.encode(f.data)] : [...f.data];
    const crc = crc32(new Uint8Array(db));
    body.push(...[80,75,3,4,20,0,0,0,0,0], ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...nb, ...db);
    centr.push(...[80,75,1,2,20,0,20,0,0,0,0,0], ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...nb);
    off += 30 + nb.length + db.length;
  }
  const cdSize = centr.length;
  body.push(...centr, ...[80,75,5,6,0,0,0,0], ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0));
  return new Uint8Array(body);
}

/* ═══════════════ 3D POHLEDY → PNG (vstup pro AI vizualizaci, např. Nano Banana) ═══════
   Vyrendruje z přesného 3D modelu plánku čisté obrázky BEZ popisků a kót:
   pohled shora + dva izometrické + nízký boční. Stěny jsou průsvitné, aby bylo
   vidět celou kuchyni v místnosti (okna jsou vidět jako zasklení). Vše je
   neutrálně světlé – konečný styl pak určí prompt. Stáhne se ZIP s PNG a
   šablonou promptu. */

const PNG_VIEWS = [
  { name:'1_shora',         az:0,   el:90, desc:'pohled shora (dispozice 1:1)' },
  { name:'2_izometricky_A', az:45,  el:32, desc:'izometrický pohled A' },
  { name:'3_izometricky_B', az:225, el:32, desc:'izometrický pohled B' },
  { name:'4_nizky_bocni',   az:90,  el:14, desc:'nízký boční pohled' }
];

function hexToRgbArr(h){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h||'').trim());
  if(!m) return [0.8,0.78,0.75];
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].map(v => v/255);
}
function nrm3(v){ const L = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/L, v[1]/L, v[2]/L]; }

function pngStyle(mat){
  if(mat === 'wall')    return { c:[0.86,0.84,0.80], a:0.45 };
  if(mat === 'glass')   return { c:[0.68,0.80,0.90], a:0.85 };
  if(mat === 'floor')   return { c:[0.93,0.91,0.88], a:1 };
  if(mat === 'counter') return { c:[0.90,0.88,0.84], a:1 };
  if(mat === 'ceil')    return { c:[0.95,0.94,0.92], a:0.15 };
  return { c:[0.78,0.79,0.83], a:1 };              // skříně – neutrální světle šedá
}

/* Nakreslí jeden pohled scény do canvasu a vrátí base64 PNG (bez hlavičky). */
function renderPngView(sc, az, el){
  const W = 1500, H = 1500;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const E = el * Math.PI/180, A = az * Math.PI/180;
  /* směr od počátku ke kameře */
  const d = [Math.cos(E)*Math.sin(A), Math.cos(E)*Math.cos(A), Math.sin(E)];
  /* g = směr pohledu (od kamery k počátku) */
  const g = [-d[0], -d[1], -d[2]];
  let right, upv;
  if(el > 89){ right = [1,0,0]; upv = [0,1,0]; }        // pohled shora, sever nahoru
  else {
    right = nrm3(cross3([0,0,1], g));                   // doprava na obrazovce
    if(!(Math.abs(right[0])+Math.abs(right[1])+Math.abs(right[2]) > 0.5)) right = [1,0,0];
    upv = nrm3(cross3(g, right));                       // nahoru na obrazovce
  }

  /* plochy + světelný stín (přibližný 3D dojem) */
  const light = nrm3([0.5, 0.3, 0.8]);
  const polys = [];
  for(const f of sc.facs){
    const pts = f.v.map(i => sc.verts[i]);
    if(pts.length < 3) continue;
    const n0 = nrm3(cross3(vec3(pts[0], pts[1]), vec3(pts[0], pts[2])));
    const bright = 0.58 + 0.42 * Math.abs(dot3(n0, light));
    let dep = 0; for(const p of pts) dep += dot3(p, d); dep /= pts.length;
    polys.push({ pts, dep, bright, mat:f.mat });
  }
  polys.sort((a,b) => a.dep - b.dep);                   // daleké nejdřív

  /* rozsah pro vystředění */
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  for(const p of polys) for(const q of p.pts){
    const X = dot3(q, right), Y = dot3(q, upv);
    if(X<x0)x0=X; if(X>x1)x1=X; if(Y<y0)y0=Y; if(Y>y1)y1=Y;
  }
  if(!isFinite(x0)) return '';
  const mrg = 90;
  const scale = Math.min((W-2*mrg)/(x1-x0 || 1), (H-2*mrg)/(y1-y0 || 1));
  const mx = (x0+x1)/2, my = (y0+y1)/2;
  const px = p => (dot3(p, right) - mx) * scale + W/2;
  const py = p => H/2 - (dot3(p, upv)   - my) * scale;

  for(const poly of polys){
    const st = pngStyle(poly.mat);
    const r = Math.round(clamp(st.c[0]*poly.bright,0,1)*255);
    const gg = Math.round(clamp(st.c[1]*poly.bright,0,1)*255);
    const b = Math.round(clamp(st.c[2]*poly.bright,0,1)*255);
    ctx.beginPath();
    for(let i=0;i<poly.pts.length;i++){
      const X = px(poly.pts[i]), Y = py(poly.pts[i]);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(' + r + ',' + gg + ',' + b + ',' + st.a + ')';
    ctx.fill();
  }
  return cv.toDataURL('image/png').split(',')[1] || '';
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}

/* ═════════════════════ 18. KALKULACE MATERIÁLU (CENA) ═════════════════════
   Z rozměrů na plátně spočítá spotřebu materiálu – desky (korpusy, čela,
   pracovní deska, bok+, sokl, zadní díly) a hrany. Počítá CELÉ desky
   s prořezem. Ceník je upravitelný a ukládá se k projektu. Zatím jen
   materiál – kování, práce a marže přijdou v další fázi (cenová nabídka). */


function PRICE_DEFAULTS(){ return ({
  v: PRICE_VER,
  vatRate: 21,          // sazba DPH [%]
  vatIncluded: true,    // ceny v ceníku jsou VČETNĚ DPH
  edgeShare: 100,       // % obvodu dílů, které se hraní
  edgePrice: 12,        // Kč/m hrany (s DPH)
  doorW: 600,           // max šířka jednoho čela [mm] – z ní se počítá počet dvířek
  doorH: DOOR_H_DFLT,   // výška dvířek [mm] – DS i HS 704
  drawerGap: DRAWER_GAP,     // mezera mezi čely nad sebou [mm]
  drawerStack: [350, 223, 125],  // čela zásuvek od spodu [mm]
  blendeW: BLENDE_W_DFLT,        // blende podél čela [mm] – čtverec 50 × 50
  blendeD: BLENDE_D_DFLT,        // blende do hloubky [mm]
  blendeOn: true,                // počítat blende do rohů automaticky
  inPrint: true,        // přidávat kalkulaci do PDF
  topDepth: TOP_DEPTH_DFLT, // hloubka pracovní desky [mm] – standard 600, existuje i 635
  kerf: 4,              // šířka řezu (prořez pilou) [mm] – počítá se do rozvržení
  rot: false,           // smí se díly otáčet o 90° (dekor/kresba obvykle nedovolí)
  zastena: false,       // počítat zástěnu (samostatná položka)
  tl: false,            // počítat TL – těsnící lištu (samostatná položka)
  zastReserve: 100,     // rezerva k délce zástěny/TL na každou řadu [mm]
  groups: [
    { id:'body',  name:'Korpus – lamino DTD 18 mm',        bw:2800, bh:2070, price:2400, waste:15 },
    { id:'front', name:'Čela a dvířka – lamino DTD 18 mm', bw:2800, bh:2070, price:2400, waste:15 },
    { id:'top',   name:'Pracovní deska – 38 mm',           bw:4100, bh:640,  price:5500, waste:10, half:true },
    { id:'bok',   name:'Bok+ a sokl – lamino DTD 18 mm',   bw:2800, bh:2070, price:2400, waste:15 },
    { id:'back',  name:'Zadní díl – HDF 3 mm',             bw:2800, bh:2070, price:850,  waste:15 },
    { id:'zast',  name:'Zástěna – panel 4 100 × 640 mm',   bw:4100, bh:640,  price:5500, waste:0, lin:true, half:true },
    { id:'tl',    name:'TL – těsnící lišta 4 100 mm',      bw:4100, bh:0,    price:1200, waste:0, lin:true, half:true }
  ]
}); }

/* Ceník projektu – vždy bezpečně normalizovaný (i po načtení staršího souboru). */
function pricing(){
  const D = PRICE_DEFAULTS();
  let p = S.project && S.project.pricing;
  if(!p || typeof p !== 'object'){
    p = D;
    if(S.project) S.project.pricing = p;
    return p;
  }
  const num = (v, d) => (v == null || v === '' || isNaN(+v)) ? d : +v;
  /* Projekt uložený starší verzí: u položek, které mají přesně starou
     výchozí cenu (uživatel je neupravoval), se cena přepíše na novou
     výchozí. Ručně přepsané ceny zůstanou. */
  if(p.v !== PRICE_VER){
    const fresh = PRICE_DEFAULTS();
    const OLD_PRICES = [PRICE_OLD_DEFAULTS, { body:2400, front:2400, top:5500, bok:2400, back:390 }];
    if(Array.isArray(p.groups)){
      for(const g of p.groups){
        if(!g || !g.id) continue;
        const nw = fresh.groups.find(f => f.id === g.id);
        if(!nw) continue;
        /* cena: přepiš, jen když je to některá ze starých výchozích hodnot */
        const isOldDefault = OLD_PRICES.some(t => t[g.id] != null && +g.price === t[g.id]);
        if(isOldDefault) g.price = PRICE_NEW_COMING[g.id] != null ? PRICE_NEW_COMING[g.id] : nw.price;
        /* název: starý výchozí název („sololit“) přejmenuj na nový („HDF“) */
        const oldName = PRICE_OLD_NAMES[g.id];
        if(oldName && String(g.name || '').trim() === oldName) g.name = nw.name;
        if(g.name === undefined || g.name === null || String(g.name).trim() === '') g.name = nw.name;
      }
    }
    /* starší projekty měly zástěnu a TL pod jedním zaškrtnutím – když byl
       zapnutý, zapne se i TL (uživatel si to pak může vypnout) */
    if(p.tl === undefined) p.tl = p.zastena === true;
    /* deska pracovní desky: starý výchozí rozměr 4100 × 600 → 4100 × 640
       (aby se na ni vešla i hloubka 635) */
    if(Array.isArray(p.groups)){
      const gt = p.groups.find(g => g && g.id === 'top');
      if(gt && (+gt.bw === 4100) && (+gt.bh === 600)) gt.bh = 640;
    }
    p.v = PRICE_VER;
  }
  p.vatRate     = clamp(num(p.vatRate, D.vatRate), 0, 100);
  p.edgeShare   = clamp(num(p.edgeShare, D.edgeShare), 0, 100);
  p.edgePrice   = Math.max(0, num(p.edgePrice, D.edgePrice));
  p.doorW       = Math.max(200, num(p.doorW, D.doorW));
  p.doorH       = clamp(num(p.doorH, D.doorH), 100, 2000);
  p.drawerGap   = clamp(num(p.drawerGap, D.drawerGap), 0, 20);
  /* starší projekty měly blende 18 × 50 (pruh podél dveří) – teď je to
     čtverec 50 × 50 v rohu, stará dvojice se přepíše */
  if(+p.blendeW === 18 && +p.blendeD === 50){
    p.blendeW = BLENDE_W_DFLT; p.blendeD = BLENDE_D_DFLT;
  }
  p.blendeW     = clamp(num(p.blendeW, D.blendeW), 0, 400);
  p.blendeD     = clamp(num(p.blendeD, D.blendeD), 0, 600);
  p.blendeOn    = p.blendeOn !== false;      // blende do rohů se počítá sama
  p.drawerStack = (Array.isArray(p.drawerStack) && p.drawerStack.length ? p.drawerStack : D.drawerStack)
                    .map(v => Math.max(20, +v || 0)).filter(v => v > 0);
  p.vatIncluded = p.vatIncluded !== false;
  p.inPrint     = p.inPrint !== false;
  p.kerf        = clamp(num(p.kerf, D.kerf), 0, 20);
  p.topDepth    = clamp(num(p.topDepth, D.topDepth), 300, 1200);
  p.rot         = p.rot === true;
  p.zastena     = p.zastena === true;
  p.tl          = p.tl === true;
  p.zastReserve = clamp(num(p.zastReserve, D.zastReserve), 0, 2000);
  p.v = PRICE_VER;
  p.groups = D.groups.map(d => {
    const f = (Array.isArray(p.groups) ? p.groups.find(g => g && g.id === d.id) : null) || {};
    return {
      id:    d.id,
      name:  (f.name && String(f.name).trim()) || d.name,
      bw:    Math.max(200, num(f.bw, d.bw)),
      bh:    d.lin ? Math.max(0, num(f.bh, d.bh)) : Math.max(200, num(f.bh, d.bh)),
      price: Math.max(0, num(f.price, d.price)),
      waste: clamp(num(f.waste, d.waste), 0, 100),
      lin:   !!d.lin,
      half:  !!d.half
    };
  });
  return p;
}

/* ── DĚLENÍ DLOUHÝCH DÍLŮ NA SPÁRY SKŘÍNÍ ────────────────────────────
   Sokl ani pracovní deska nemohou být delší než deska, ze které se řežou.
   Když je řada delší, rozdělí se na víc kusů – a hranice kusů se trefí
   na spáru mezi skříněmi (spára v soklu pak sedí na spáru korpusů). */

/* Délky jednotlivých skříní v řadě, včetně mezer mezi nimi.
   Součet = délka celé řady. */
function runSegs(r){
  const horiz = (r.f === 'jih' || r.f === 'sever');
  const list = (r.el || []).map(e => {
    const a = horiz ? e.x : e.y;
    const b = horiz ? (e.x + e.w) : (e.y + e.d);
    return { a, b };
  }).sort((p,q) => p.a - q.a);
  if(!list.length) return [ Math.max(0, r.len) ];
  const runEnd = horiz ? r.x1 : r.y1;
  const out = [];
  for(let i=0;i<list.length;i++){
    const start = list[i].a;
    const end = (i+1 < list.length) ? list[i+1].a : Math.max(list[i].b, runEnd);
    out.push(Math.max(0, end - start));
  }
  return out;
}

/* Rozdělí sled skříní na kusy, které se vejdou na desku.
   Kus končí vždy na spáře skříně; jen skříň širší než deska se dělí v půli. */
function splitPieces(segs, maxPiece, reserve){
  const R = Math.max(0, +reserve || 0);          // rezerva na každý kus
  const M = Math.max(100, (+maxPiece || 2800) - R);
  const out = [];
  let cur = 0;
  for(const L of segs){
    if(L > M + 0.5){                      // jediná skříň širší než deska
      if(cur > 0.5){ out.push(cur); cur = 0; }
      const n = Math.ceil(L / M);
      for(let i=0;i<n;i++) out.push(L / n);
      continue;
    }
    if(cur + L > M + 0.5){ out.push(cur); cur = L; }
    else cur += L;
  }
  if(cur > 0.5) out.push(cur);
  /* REZERVA NA KAŽDÝ KUS – každý díl se musí nechat dorovnat */
  return out.map(x => x + R);
}

/* Kusy soklu a pracovní desky pro jednu řadu (zaokrouhlené mm). */
function soklPiecesForRun(r){
  const P = pricing();
  const g = P.groups.find(x => x.id === 'bok');
  const maxPiece = Math.max(200, (g ? g.bw : 2800) - (+P.kerf || 0));
  return splitPieces(runSegs(r), maxPiece, SOKL_RESERVE).map(x => Math.round(x));
}
function topPiecesForRun(r){
  const P = pricing();
  const g = P.groups.find(x => x.id === 'top');
  const maxPiece = Math.max(200, (g ? g.bw : 4100) - (+P.kerf || 0));
  return splitPieces(runSegs(r), maxPiece, TOP_RESERVE).map(x => Math.round(x));
}

/* Hloubka pracovní desky: standard 600 mm (existují i 635 / 650).
   Bere se nastavená hloubka, a kdyby byla některá spodní skříň hlubší,
   vyhraje skříň – deska musí skříň překrýt. */
function topDepthOfRun(r){
  const P = pricing();
  const horiz = (r.f === 'jih' || r.f === 'sever');
  const perp = e => horiz ? e.d : e.w;
  const bases = (r.el || []).filter(e => elKind3(e) === 'base');
  const runDeep = horiz ? (r.y1 - r.y0) : (r.x1 - r.x0);
  const baseDeep = bases.length ? Math.max(...bases.map(perp)) : runDeep;
  return Math.max(200, Math.max(+P.topDepth || TOP_DEPTH_DFLT, baseDeep));
}

/* Rozpis jednotlivých dílů, ze kterých se počítá plocha. */
function materialParts(){
  const P = pricing();
  const parts = [];
  const add = (group, label, w, h, qty) => {
    if(!(w > 0) || !(h > 0) || !(qty > 0)) return;
    parts.push({ group, label, w:Math.round(w), h:Math.round(h), qty });
  };

  for(const e of S.project.elements){
    const k = elKind3(e);
    const q = Math.max(1, Math.round(e.qty || 1));
    const W = elFrontW(e), D = elFrontD(e), H = elH3(e);
    const tag = (e.name || (k === 'upper' ? 'Horní skříň' : k === 'column' ? 'Sloup' : 'Spodní skříň'))
              + (q > 1 ? ' (' + q + '×)' : '');
    /* korpus: 2 bočnice, dno, horní deska, 2 police */
    add('body', tag + ' – bočnice',        D, H, 2*q);
    add('body', tag + ' – dno',            W, D, 1*q);
    add('body', tag + ' – horní deska',    W, D, 1*q);
    add('body', tag + ' – police',         W, Math.max(200, D - 20), 2*q);
    /* zadní díl z HDF */
    add('back', tag + ' – zadní díl (HDF)', W, H, 1*q);
    /* čela – jen když je uživatel u skříně zapne; sloup = vestavěný
       spotřebič (vlastní čela), u sloupů se nepočítají nikdy */
    const FR = frontCfg(e);
    /* sloup: počítají se jen spodní výsuvy (trouba, mikro a výklop se doměřují) */
    if(FR.on && (k === 'base' || k === 'upper' || k === 'column')){
      const FP = frontPieces(e);
      if(FP.doors.length){
        add('front', tag + ' – dvířka ' + FP.wDoor + ' × ' + FP.doors[0], FP.wDoor, FP.doors[0], FP.doors.length*q);
      }
      FP.drawers.forEach((h, i) => add('front',
        tag + ' – čelo zásuvky ' + (i+1) + ' ' + FP.wDraw + ' × ' + h, FP.wDraw, h, 1*q));
    }
    /* bok+ na každé zapnuté straně */
    if(bokAny(e)){
      const nb = (bokHas(e,'L') ? 1 : 0) + (bokHas(e,'R') ? 1 : 0);
      add('bok', tag + ' – bok+', bokDepthOf(e), bokH(e), nb*q);
    }
  }

  /* BLENDE – jedna na každý roh, kde se potkají dvě kolmé řady.
     Je to svislý hranol 50 × 50, výška = výška sousedních skříní. */
  blendeCorners().forEach((b, i) => {
    const hs = b.els.map(id => { const e2 = getEl(id); return e2 ? elH3(e2) : 0; });
    const hB = Math.max(...hs, 0) || BOK_H_DS;
    add('front', 'Blende do rohu ' + (i+1) + ' – ' + b.w + ' × ' + b.h + ' mm (hřbet ' + fmt(Math.round(hB)) + ')',
        Math.max(b.w, b.h), hB, 1);
  });

  /* pracovní deska a sokl pod souvislými řadami DS
     Když je řada delší než deska, rozdělí se na kusy – hranice se trefí
     na spáru mezi skříněmi (sokl 3 000 mm → např. 2 400 + 700). */
  dsRuns().forEach((r, i) => {
    const horiz = (r.f === 'jih' || r.f === 'sever');
    const deep  = horiz ? (r.y1 - r.y0) : (r.x1 - r.x0);
    const tP = topPiecesForRun(r), sP = soklPiecesForRun(r);
    /* hloubka desky = standard 600 mm (nebo 635), ne odvozená od skříně;
       přes sloup (lednici, troubu) deska nejde – kolem něj se vyřezává */
    const topDeep = topDepthOfRun(r);
    tP.forEach((len, k) => add('top',
      'Pracovní deska – DS řada ' + (i+1) + (tP.length > 1 ? ' (kus ' + (k+1) + '/' + tP.length + ')' : ''),
      len, topDeep, 1));
    sP.forEach((len, k) => add('bok',
      'Sokl – DS řada ' + (i+1) + (sP.length > 1 ? ' (kus ' + (k+1) + '/' + sP.length + ')' : ''),
      len, B3D.sokl, 1));
  });

  return parts;
}

/* ── ROZVRŽENÍ DÍLŮ NA DESKY (skutečné skládání, ne jen plocha) ──────────
   Plošný výpočet nestačí: když je mezi díly např. 600 × 2030 mm (zadní díl
   sloupu), vezme celou výšku desky a zbytek plochy je nepoužitelný.
   Proto se díly opravdu skládají na desku – guillotinovým řezem, s mezerou
   na pilu (kerf). Počet desek = max(plošný výpočet s prořezem, rozvržení).

   Vrací pole desek; každá má seznam volných obdélníků a umístěných dílů. */
function packSheets(pieces, bw, bh, allowRot, kerf){
  const K = Math.max(0, +kerf || 0);
  const eps = 1e-6;
  const maxL = Math.max(bw, bh);          // nejdelší rozměr desky
  const minS = Math.min(bw, bh);          // nejkratší rozměr desky

  /* 1) příprava dílů: co se na desku nevejde vcelku, rozdělí se na části
        (v realitě se sokl i jiné dlouhé díly nastavují) – a označí se to. */
  const list = [];
  for(const pt of pieces){
    const q = Math.max(0, Math.round(+pt.qty || 0));
    for(let i=0;i<q;i++){
      let w = +pt.w, h = +pt.h;
      const fitsRaw = (w + K <= bw + eps && h + K <= bh + eps)
                   || (allowRot && w + K <= bh + eps && h + K <= bw + eps);
      if(!fitsRaw){
        const long = Math.max(w, h), short = Math.min(w, h);
        if(short + K > minS + eps){
          list.push({ w, h, label:pt.label, oversize:true });
          continue;
        }
        const parts = Math.max(2, Math.ceil((long + K) / maxL));
        if(w >= h){ w = long / parts; h = short; } else { w = short; h = long / parts; }
        for(let k=0;k<parts;k++)
          list.push({ w, h, label:pt.label, split:true, partOf:parts });
      } else {
        list.push({ w, h, label:pt.label });
      }
    }
  }

  /* 2) co největší díly první */
  list.sort((a,b) => (b.w*b.h) - (a.w*a.h) || (b.h - a.h) || (b.w - a.w));

  const sheets = [];
  const fits = (r, w, h) => w <= r.w + eps && h <= r.h + eps;

  const findFree = (s, w, h) => {
    let bi = -1, bestA = Infinity;
    for(let i=0;i<s.free.length;i++){
      const r = s.free[i];
      if(!fits(r, w, h)) continue;
      const a = r.w * r.h;
      if(a < bestA - eps){ bestA = a; bi = i; }
    }
    return bi;
  };
  const place = (s, i, w, h, rot, p) => {
    const r = s.free.splice(i,1)[0];
    const rightW = r.w - w, topH = r.h - h;
    if(rightW > eps) s.free.push({ x:r.x + w, y:r.y, w:rightW, h:r.h });
    if(topH > eps)   s.free.push({ x:r.x, y:r.y + h, w:w, h:topH });
    s.placed.push({ w, h, x:r.x, y:r.y, rot:!!rot, label:p.label,
                    split:!!p.split, partOf:p.partOf || 1 });
  };

  /* 3) skládání: nejdřív zkus položit díl do existující desky, pak novou */
  for(const p of list){
    if(p.oversize){
      const s = { free:[{ x:0, y:0, w:bw, h:bh }], placed:[], oversize:true };
      s.placed.push({ w:p.w, h:p.h, oversize:true, label:p.label });
      sheets.push(s);
      continue;
    }
    /* řez se přidává jen tam, kde po dílu ještě zbývá místo – díl na celou
       šířku desky (např. pracovní deska 600 na desce 600) řez nepotřebuje */
    const w = p.w + ((p.w + K <= bw + eps) ? K : 0);
    const h = p.h + ((p.h + K <= bh + eps) ? K : 0);
    let done = false;
    for(const s of sheets){
      if(s.oversize) continue;
      let i = findFree(s, w, h);
      if(i < 0 && allowRot) i = findFree(s, h, w);
      if(i >= 0){
        if(fits(s.free[i], w, h)) place(s, i, w, h, false, p);
        else place(s, i, h, w, true, p);
        done = true; break;
      }
    }
    if(done) continue;

    const s = { free:[{ x:0, y:0, w:bw, h:bh }], placed:[], oversize:false };
    if(fits(s.free[0], w, h)) place(s, 0, w, h, false, p);
    else if(allowRot && fits(s.free[0], h, w)) place(s, 0, h, w, true, p);
    else { s.oversize = true; s.placed.push({ w:p.w, h:p.h, oversize:true, label:p.label }); }
    sheets.push(s);
  }
  return sheets;
}

/* ── zástěna + těsnící lišta (TL) ────────────────────────────────────────
   Zástěna jde po stěně jen tam, kde stojí spodní skříňky, a končí tam,
   kde skříňky končí. Žádné ohyby na hloubku pracovní desky se na koncích
   NEPŘIDÁVAJÍ (stěna 2 000 mm + skříňky 1 500 mm → zástěna 1 500 mm).
   Délka jedné řady:
     délka řady + rezerva
   Počítá se po celých panelech (zástěna) a celých lištách (TL) – obě
   položky mají standardní délku 4 100 mm. */

/* ── objednávání po půlkách ─────────────────────────────────────────────
   Pracovní deska, zástěna i TL se dodávají v délkách 4 100 mm, ale objednat
   se dají i půlky (2 050 mm). Když je potřeba 4 500 mm, objedná se
   1,5 desky = 4 100 + 2 050 mm.

   Počet se NESMÍ počítat jen z celkové délky (4 200 mm → 1,5 desky), protože
   dva kusy po 2 100 mm se do půlky 2 050 nevejdou a jsou potřeba dvě desky.
   Proto se kusy opravdu skládají: hledá se nejmenší počet půlek, do kterých
   se všechny kusy vcelku vejdou. */

/* Vejde se seznam délek do daných kapacit? (nejdelší kusy první, backtracking) */
function lensPackable(lens, caps){
  if(!lens.length) return true;
  const L = lens[0], rest = lens.slice(1);
  const tried = [];
  for(let i=0;i<caps.length;i++){
    const c = caps[i];
    if(c + 1e-9 < L) continue;
    if(tried.some(t => Math.abs(t - c) < 1e-9)) continue;   // stejná kapacita = stejný výsledek
    tried.push(c);
    const nx = caps.slice(); nx[i] = c - L;
    nx.sort((a,b) => b - a);
    if(lensPackable(rest, nx)) return true;
  }
  return false;
}

/* Nejmenší počet CELÝCH desek (může být 0,5; 1; 1,5 …) na seznam délek kusů. */
function minBoardsInHalves(lengths, boardLen){
  const B = Math.max(200, +boardLen || 4100);
  const H = B / 2;                                   // půlka
  const lens = (lengths || []).filter(l => l > 0.5).sort((a,b) => b - a);
  if(!lens.length) return 0;
  const total = lens.reduce((a,b) => a + b, 0);
  let n = Math.max(1, Math.ceil(total / H - 1e-9));  // nejmenší možný počet půlek podle délky
  const maxN = lens.length * 2;                      // každý kus vlastní deska
  for(; n <= maxN; n++){
    const caps = [];
    for(let i=0;i<Math.floor(n/2);i++) caps.push(B);
    if(n % 2) caps.push(H);
    if(lensPackable(lens, caps)) return n / 2;
  }
  return lens.length;                                // pojistka
}

/* Rozdělí délku na kusy, které se vejdou na jeden panel/lištu – plné
   délky a zbytek na konci (10 100 → 4 100 + 4 100 + 1 900). Rovnoměrné
   dělení by zbytečně nutilo kupovat víc, než je potřeba. */
function splitLen(len, maxL){
  const L = Math.max(0, +len || 0), M = Math.max(200, +maxL || 4100);
  if(L <= 0) return [];
  const out = [];
  let rest = Math.round(L);
  while(rest > M + 1e-9){ out.push(M); rest -= M; }
  if(rest > 0.5) out.push(rest);
  return out;
}

/* 1,5 → „1,5“; 2 → „2“ */
function fmtQty(q){
  const v = Math.round((+q || 0) * 2) / 2;
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ',');
}
/* jednotka podle počtu: 1 panel, 1,5 panelu, 2 panely, 5 panelů */
function qtyUnit(q, forms){
  const v = Math.round((+q || 0) * 2) / 2;
  if(!Number.isInteger(v)) return forms.dec;
  if(v === 1) return forms.one;
  return v >= 5 ? forms.many : forms.few;
}
const QTY_FORMS = {
  top:  { one:'deska', few:'desky', many:'desek',  dec:'desky'  },
  zast: { one:'panel', few:'panely', many:'panelů', dec:'panelu' },
  tl:   { one:'lišta', few:'lišty', many:'lišt',   dec:'lišty'  }
};

function zastCalc(){
  const P = pricing();
  const wantZ = P.zastena === true;      // zástěna je samostatná položka
  const wantT = P.tl === true;           // TL (těsnící lišta) taky
  if(!wantZ && !wantT) return null;
  const gZ = P.groups.find(g => g.id === 'zast');
  const gT = P.groups.find(g => g.id === 'tl');
  if((wantZ && !gZ) || (wantT && !gT)) return null;
  const reserve = clamp(+P.zastReserve || 0, 0, 2000);
  const panelL  = Math.max(200, +gZ.bw || 4100);     // délka panelu zástěny
  const stripL  = Math.max(200, +gT.bw || 4100);     // délka lišty TL
  const all = dsRuns();
  const runs = [];
  let totalLen = 0;
  all.forEach((r, i) => {
    const horiz = (r.f === 'jih' || r.f === 'sever');
    const along = horiz ? (r.x1 - r.x0) : (r.y1 - r.y0);   // délka řady skříněk
    const deep  = horiz ? (r.y1 - r.y0) : (r.x1 - r.x0);   // hloubka sestavy
    /* zástěna = jen tam, kde stojí skříňky; žádné ohyby na koncích */
    const len = along + reserve;
    totalLen += len;
    runs.push({ i:i+1, along, deep, reserve, len });
  });
  /* Panely i lišty jdou objednat po půlkách a kusy z různých řad se dají
     vyříznout z jednoho kusu – počítá se proto skládáním kusů, ne zvlášť
     pro každou řadu (L 2 700 + 1 000 = 3 700 → 1 panel, ne 2). */
  /* dlouhou řadu nejde objednat vcelku – rozdělí se na kusy jako sokl */
  let piecesZ = [], piecesT = [];
  runs.forEach(r => {
    r.piecesZ = splitLen(r.len, panelL);
    r.piecesT = splitLen(r.len, stripL);
    piecesZ = piecesZ.concat(r.piecesZ);
    piecesT = piecesT.concat(r.piecesT);
  });
  const nZ = wantZ ? minBoardsInHalves(piecesZ, panelL) : 0;
  const nT = wantT ? minBoardsInHalves(piecesT, stripL) : 0;
  return {
    runs, totalLen, nZ, nT, gZ, gT, wantZ, wantT,
    totalZ: wantZ ? nZ * (+gZ.price || 0) : 0,
    totalT: wantT ? nT * (+gT.price || 0) : 0,
    reserve, panelL, stripL
  };
}

const num2 = n => (Math.round(n*100)/100).toLocaleString('cs-CZ',
  { minimumFractionDigits:2, maximumFractionDigits:2 }).replace(/\u00A0|\u202F/g, ' ');
const kc = n => Math.round(n).toLocaleString('cs-CZ').replace(/\u00A0|\u202F/g, ' ') + ' Kč';

/* Výpočet: plocha → celé desky s prořezem → cena; hrany z obvodů dílů. */
function priceCalc(){
  const P = pricing();
  const parts = materialParts();
  const area = {};
  let edgeM = 0;
  for(const pt of parts){
    area[pt.group] = (area[pt.group] || 0) + (pt.w * pt.h / 1e6) * pt.qty;
    if(pt.group !== 'back')                       // HDF záda se nehraní
      edgeM += 2 * (pt.w + pt.h) / 1000 * pt.qty;
  }
  edgeM = edgeM * (P.edgeShare / 100);

  /* po dílech pro každou skupinu – kvůli rozvržení na desky */
  const byGroup = {};
  for(const pt of parts) (byGroup[pt.group] = byGroup[pt.group] || []).push(pt);

  const rows = P.groups.filter(g => !g.lin).map(g => {
    const a  = area[g.id] || 0;
    const ba = (g.bw * g.bh) / 1e6;                       // plocha jedné desky [m²]
    /* PRACOVNÍ DESKA: objednává se po půlkách a počítá se z DÉLKY kusů,
       ne z plochy – 4 500 mm délky = 1,5 desky (viz minBoardsInHalves). */
    if(g.half){
      const pieces = byGroup[g.id] || [];
      const lens = [];
      pieces.forEach(pt => { for(let i=0;i<Math.max(0, Math.round(pt.qty || 0));i++) lens.push(+pt.w); });
      const totalLen = lens.reduce((x,y) => x + y, 0);
      const nPieces = lens.length;
      const qty = minBoardsInHalves(lens, g.bw);
      return { g, area:a, need:0, boardArea:ba, sheets:qty, qty, byLen:true,
               totalLen, nPieces, oversized: lens.some(l => l > (+g.bw || 4100) + 1e-6),
               nSplit:0, sheetsArea:0, sheetsPack:0, byArea:false,
               total: qty * (+g.price || 0) };
    }
    const need = a * (1 + (+g.waste || 0) / 100);         // včetně prořezu
    const pieces = byGroup[g.id] || [];
    const nPieces = pieces.reduce((s2, pt) => s2 + Math.max(0, Math.round(pt.qty || 0)), 0);
    /* plošný odhad (s prořezem) */
    const sheetsArea = (a > 0 && ba > 0) ? Math.ceil(need / ba) : 0;
    /* skutečné rozvržení dílů na desku – vždy bereme to větší */
    const packs = nPieces ? packSheets(pieces, g.bw, g.bh, P.rot, P.kerf) : [];
    const sheetsPack = packs.length;
    const oversize = packs.some(pk => pk.oversize);
    const nSplit = packs.reduce((a,pk) => a + pk.placed.filter(q => q.split).length, 0);
    const sheets = Math.max(sheetsArea, sheetsPack);
    return { g, area:a, need, boardArea:ba, sheets, sheetsArea, sheetsPack,
             nPieces, oversized:oversize, nSplit,
             byArea: sheetsArea >= sheetsPack,
             total:sheets * (+g.price || 0) };
  });
  /* zástěna a TL se počítají z DÉLKY, ne z plochy */
  const Z = zastCalc();
  if(Z){
    if(Z.wantZ) rows.push({ g:Z.gZ, area:0, need:0, boardArea:0, sheets:Z.nZ, qty:Z.nZ,
                total:Z.totalZ, lenM:Z.totalLen/1000, totalLen:Z.totalLen, linear:true });
    if(Z.wantT) rows.push({ g:Z.gT, area:0, need:0, boardArea:0, sheets:Z.nT, qty:Z.nT,
                total:Z.totalT, lenM:Z.totalLen/1000, totalLen:Z.totalLen, linear:true });
  }

  const edgeTotal = edgeM * (+P.edgePrice || 0);
  const materialTotal = rows.reduce((s2, r) => s2 + r.total, 0) + edgeTotal;
  const rate = +P.vatRate || 0;
  let base, vat, total;
  if(P.vatIncluded){                 // ceny už DPH obsahují
    total = materialTotal;
    base  = total / (1 + rate/100);
    vat   = total - base;
  } else {                           // k cenám se DPH připočte
    base  = materialTotal;
    vat   = base * rate/100;
    total = base + vat;
  }
  return {
    parts, rows, edgeM, edgeTotal, materialTotal,
    base, vat, total, rate, vatIncluded:P.vatIncluded,
    zast: Z,
    sheets: rows.reduce((s2, r) => s2 + r.sheets, 0)
  };
}

/* ── okno s kalkulací ── */
/* Kolik skříní má zapnutá čela (pro přehled v okně ceny). */
function frStats(){
  let on = 0, all = 0;
  for(const e of S.project.elements){
    const k = elKind3(e);
    if(k !== 'base' && k !== 'upper') continue;
    all += Math.max(1, Math.round(e.qty || 1));
    if(frontCfg(e).on) on += Math.max(1, Math.round(e.qty || 1));
  }
  return { on, all };
}
/* Hromadně zapne / vypne čela u všech skříní. */
function setAllFronts(on){
  let n = 0;
  for(const e of S.project.elements){
    const k = elKind3(e);
    if(k !== 'base' && k !== 'upper') continue;
    const cur = frontCfg(e);
    e.fronts = { on: !!on,
      doors:   cur.doors   || (on ? autoDoors(e) : 0),
      drawers: cur.drawers || 0 };
    n++;
  }
  pushHistoryQuiet();
  return n;
}

/* Malá tabulka: jak se zástěna spočítala po jednotlivých řadách DS. */
function theadRuns(Z){
  if(!Z || !Z.runs.length) return '';
  const rows = Z.runs.map(r => {
    return `<tr>
      <td>DS řada ${r.i}</td>
      <td class="num">${fmt(Math.round(r.along))}</td>
      <td class="num">${fmt(r.reserve)}</td>
      <td class="num"><b>${fmt(Math.round(r.len))}</b> mm</td>
    </tr>`;
  }).join('');
  return `
    <table class="p-tbl small" style="margin-bottom:8px">
      <thead><tr><th>Řada</th><th class="num">Délka skříněk</th>
        <th class="num">Rezerva</th><th class="num">Délka zástěny</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">Celkem (${Z.runs.length} ${Z.runs.length===1?'řada':'řady'})</td>
        <td class="num">${fmt(Z.runs.reduce((a,r)=>a+r.reserve,0))}</td>
        <td class="num"><b>${fmt(Math.round(Z.totalLen))}</b> mm</td></tr></tfoot>
    </table>
    <p class="p-note" style="margin:0 0 8px">Z délky ${fmt(Math.round(Z.totalLen))} mm vychází${''}
      ${Z.wantZ ? `<b>${fmtQty(Z.nZ)} ${qtyUnit(Z.nZ, QTY_FORMS.zast)}</b> zástěny` : ''}${Z.wantZ && Z.wantT ? ' a' : ''}${Z.wantT ? ` <b>${fmtQty(Z.nT)} ${qtyUnit(Z.nT, QTY_FORMS.tl)}</b> TL` : ''}.
      Kusy z různých řad se vyříznou z jednoho kusu a objednat se dá i půlka (2 050 mm).</p>`;
}

/* Buňka „kolik objednat“ – u desek/panelů jde objednat i půlka (1,5). */
function qtyCell(r){
  if(r.byLen || r.linear){
    const q = r.qty != null ? r.qty : r.sheets;
    const unit = qtyUnit(q, QTY_FORMS[r.g.id] || QTY_FORMS.top);
    const extra = r.totalLen ? `<div style="font-size:10.5px;color:var(--ink-3)">${fmt(Math.round(r.totalLen))} mm celkem</div>` : '';
    return `<b>${fmtQty(q)}</b> ${unit}${extra}`;
  }
  return `<b>${r.sheets}</b> ks`
    + ((r.sheetsArea !== r.sheetsPack)
        ? `<div style="font-size:10.5px;color:var(--ink-3)">plošně ${r.sheetsArea} / rozvrhem ${r.sheetsPack}</div>` : '')
    + (r.nSplit ? `<div style="font-size:10.5px;color:var(--ink-3)">${r.nSplit} dílů děleno</div>` : '')
    + (r.oversized ? `<div style="font-size:10.5px;color:#b91c1c">díl větší než deska!</div>` : '');
}

      Rozměry se počítají reálně: <b>výška dvířek ${fmt(P.doorH)} mm</b>, šířka = šířka skříně − 4 mm

      <b>${(P.drawerStack||[]).join(' / ')} mm</b> s mezerou ${P.drawerGap} mm – dohromady vždy ${fmt(P.doorH)} mm.

      (350 + 223 mm) – trouba, mikrovlnka a horní výklop mají vlastní čela a doměřují se.</p>

    <div class="p-h">Zástěna a těsnící lišta</div>

    ${C.zast ? theadRuns(C.zast) : '<p class="p-note" style="margin-top:0">Zástěna se zatím nepočítá – zapni ji, když ji má kuchyně mít.</p>'}

      <label>blende hloubka <input class="p-in num" id="pBlendeD" type="number" min="0" max="600" step="5" value="${P.blendeD}"> mm</label>

    </div>

    <p class="p-note" style="margin-top:6px">Hloubka pracovní desky je <b>standardně 600 mm</b>
      (hlubší varianta 635 mm, výjimečně 650). Pokud nastavíš víc, než je široká deska v ceníku,
      appka desku zvětší, aby se na ni hloubka vešla.</p>

    <details class="p-det">
      <summary>Rozpis dílů (${C.parts.length} položek)</summary>
      <div class="p-scroll">
        <table class="p-tbl small">

        </table>
      </div>
    </details>

    <div class="p-note">
      <b>Jak se počítají desky:</b> díly se skutečně rozkládají na desku (včetně řezu pilou) –
      bere se větší číslo z plošného výpočtu s prořezem a ze skutečného rozvržení. Plošný odhad sám
      podcení, když je mezi díly něco přes celou výšku desky (např. zadní díl sloupu 600 × 2030).
      <b>Co je v ceně:</b> deskový materiál (korpusy, pracovní deska, bok+, sokl, zadní díly),
      čela – jen u skříní, kde jsou zapnutá –, zástěna a TL (každá zvlášť, je-li zapnutá) a hrany. Pracovní deska,
      zástěna a TL se dají objednat i po půlkách (4 100 mm → půlka 2 050 mm). Počítají se celé desky včetně
      prořezu, takže cena je nákupní, ne „prořezaná".
      <b>Co v ceně není:</b> kování (panty, pojezdy, úchytky), práce, montáž a doprava –
      to doplníme v další fázi.
    </div>`;
  bindPriceInputs();
  updatePriceTotals();
}

function bindPriceInputs(){
  const body = $('#priceBody');
  if(!body || body._pbound) return;
  body._pbound = true;
  body.addEventListener('input', ev => {
    const el = ev.target, P = pricing();
    if(el.dataset && el.dataset.g){
      const g = P.groups.find(x => x.id === el.dataset.g);
      if(g){
        const f = el.dataset.f;
        if(f === 'name') g.name = String(el.value).slice(0, 60) || g.name;
        else if(f === 'bw' || f === 'bh') g[f] = clamp(+el.value || 0, 200, 20000);
        else if(f === 'waste') g.waste = clamp(+el.value || 0, 0, 100);
        else if(f === 'price') g.price = Math.max(0, +el.value || 0);
        updatePriceTotals();
      }
      return;
    }
    if(el.id === 'pEdgePrice'){ P.edgePrice = Math.max(0, +el.value || 0); updatePriceTotals(); }
    else if(el.id === 'pEdgeShare'){ P.edgeShare = clamp(+el.value || 0, 0, 100); updatePriceTotals(); }
    else if(el.id === 'pVat'){ P.vatRate = clamp(+el.value || 0, 0, 100); updatePriceTotals(); }
    else if(el.id === 'pDoorW'){ P.doorW = Math.max(200, +el.value || 600); updatePriceTotals(); }
    else if(el.id === 'pDoorH'){ P.doorH = clamp(+el.value || DOOR_H_DFLT, 100, 2000); updatePriceTotals(); }
    else if(el.id === 'pDrawerGap'){ P.drawerGap = clamp(+el.value || 0, 0, 20); updatePriceTotals(); }
    else if(el.id === 'pBlendeOn'){ P.blendeOn = el.checked; syncBlendeAuto(); render(); save(); }
    else if(el.id === 'pBlendeW'){ P.blendeW = clamp(+el.value || 0, 0, 400); renderPriceModal(); save(); }
    else if(el.id === 'pBlendeD'){ P.blendeD = clamp(+el.value || 0, 0, 600); renderPriceModal(); save(); }
    else if(el.id === 'pDrawerStack'){
      const st = String(el.value).split(/[^0-9.]+/).map(Number).filter(v => v > 0);
      if(st.length) P.drawerStack = st.map(v => Math.round(v));
      updatePriceTotals();
    }
    else if(el.id === 'pVatIncl'){ P.vatIncluded = !!el.checked; updatePriceTotals(); }
    else if(el.id === 'pInPrint'){ P.inPrint = !!el.checked; save(); }
    else if(el.id === 'pTopDepth'){
      P.topDepth = clamp(+el.value || TOP_DEPTH_DFLT, 300, 1200);
      const gt = P.groups.find(g => g.id === 'top');
      if(gt && gt.bh < P.topDepth){          // deska musí být aspoň tak hluboká
        gt.bh = Math.ceil(P.topDepth / 5) * 5;
        const inp = document.querySelector('[data-g="top"][data-f="bh"]');
        if(inp) inp.value = gt.bh;
        toast('Deska pracovní desky zvětšena na ' + fmt(gt.bw) + ' × ' + fmt(gt.bh) + ' mm');
      }
      updatePriceTotals();
    }
    else if(el.id === 'pKerf'){ P.kerf = clamp(+el.value || 0, 0, 20); updatePriceTotals(); }
    else if(el.id === 'pRot'){ P.rot = !!el.checked; updatePriceTotals(); }
    else if(el.id === 'pZast'){ P.zastena = !!el.checked; renderPriceModal(); save(); }
    else if(el.id === 'pTL'){   P.tl = !!el.checked;      renderPriceModal(); save(); }
    else if(el.id === 'pZastRes'){ P.zastReserve = clamp(+el.value || 0, 0, 2000); updatePriceTotals(); }
  });
  body.addEventListener('click', ev => {
    const b = ev.target.closest ? ev.target.closest('button') : null;
    if(!b) return;
    if(b.id === 'pFrAll'){
      const n = setAllFronts(true);
      renderPriceModal();
      toast('Čela zapnuta u ' + n + ' skříní – počty dvířek uprav v panelu vpravo');
    } else if(b.id === 'pFrNone'){
      const n = setAllFronts(false);
      renderPriceModal();
      toast('Čela vypnuta u ' + n + ' skříní');
    }
  });
}

/* Přepočítá jen čísla v otevřeném okně – fokus v poli zůstane. */
function updatePriceTotals(){
  const C = priceCalc();
  for(const r of C.rows){
    const a = $('#pArea_' + r.g.id);
    if(a) a.textContent = r.linear ? (num2(r.lenM) + ' m') : (num2(r.area) + ' m²');
    const pc = $('#pPieces_' + r.g.id); if(pc) pc.textContent = r.linear ? '—' : (r.nPieces + ' ks');
    const sh = $('#pSheets_' + r.g.id);
    if(sh) sh.innerHTML = qtyCell(r);
    const t = $('#pTotal_' + r.g.id);  if(t) t.innerHTML = '<b>' + kc(r.total) + '</b>';
  }
  const em = $('#pEdgeM');    if(em) em.textContent = num2(C.edgeM);
  const et = $('#pEdgeTotal'); if(et) et.innerHTML = '<b>' + kc(C.edgeTotal) + '</b>';
  const st = $('#pSumTotal'); if(st) st.textContent = kc(C.total);
  const sb = $('#pSumBase');  if(sb) sb.textContent = kc(C.base);
  const sv = $('#pSumVat');   if(sv) sv.textContent = kc(C.vat);
  const ss = $('#pSumSheets'); if(ss) ss.textContent = fmtQty(C.sheets) + ' ks';
  const ft = $('#pFootTotal'); if(ft) ft.innerHTML = '<b>' + kc(C.total) + '</b>';
  const sh = $('#pSumHint');  if(sh) sh.textContent = (C.vatIncluded ? 'včetně DPH' : 'bez DPH') + ' ' + fmt(C.rate) + ' %';
  save();
}

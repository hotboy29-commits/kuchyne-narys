    e.x = R(x1); e.y = R(y1); e.w = R(x2-x1); e.d = R(y2-y1);
    render();
    return;
  }
  if(drag.mode==='vtx'){
    const wall = S.project.walls.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    wall.pts[drag.i] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
  if(drag.mode==='gpt'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    g[drag.k] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
}

function onUp(ev){
  const w = screenToWorld(ev.clientX, ev.clientY);
  if(drag?.mode==='rect'){
    const r = normRect(S.draft.a, S.draft.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = finishNewElementKind(addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:DFLT_EL_D }));
      select('el', e.id);
      pushHistory();
      toast('Zadej přesné rozměry v panelu vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
  }
  if(drag?.mode==='guide'){
    const L = Math.hypot(S.draft.b.x-S.draft.a.x, S.draft.b.y-S.draft.a.y);
    if(L >= 50){
      const g = { id:uid('g'), a:{...S.draft.a}, b:{...S.draft.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id);
      pushHistory();
    }
    S.draft = null;
  }
  if(drag?.mode==='measure'){ S.draft = null; }
  if(drag?.mode==='wallDraw'){ commitWallPoint(); }
  if(drag?.mode==='move'){
    S.guides = [];
    if(drag.moved) commitPreDrag();
    else hist.preDrag = null;
  }
  if(drag && ['resize','vtx','gpt','winMove','symMove'].includes(drag.mode)) commitPreDrag();
  drag = null;
  render();
}

function hoverUpdate(w){
  const el = document.elementFromPoint?.(worldToScreen(w.x,w.y).x, worldToScreen(w.x,w.y).y);
  const id = el?.closest?.('[data-el]')?.dataset.el || null;
  if(id !== S.hover){ S.hover = id; }
}

function onDblClick(ev){
  if(S.tool==='wall'){ finishWall(false); return; }
  const t = ev.target;
  const elId = t.closest?.('[data-el]')?.dataset.el;
  if(elId){ select('el', elId); setTimeout(()=>$('#iName')?.focus(), 50); return; }
  if(t.dataset?.wallseg){
    const [wid, si] = t.dataset.wallseg.split(':');
    S.sel = { kind:'wall', id:wid, seg:+si };
    render();
    return;
  }
  if(t.dataset?.wallhit){ select('wall', t.dataset.wallhit); return; }
}

function onWheel(ev){
  /* Kolečko NAD PLÁTNEM vždy = zoom výkresu.
     Gesto „ctrl/cmd + kolečko“ (pinch na trackpadu) KDEKOLI v aplikaci taky =
     zoom výkresu a zablokuje se tím zoom celé stránky prohlížeče. Jinak by se
     uživateli zvětšil i panel vpravo a horní lišta a nešly by zase oddálit.
     Obyčejné kolečko mimo plátno (nad panelem vpravo) normálně roluje. */
  const t = (ev.target instanceof Element) ? ev.target : null;
  const overCanvas = !!(t && t.closest('#svg'));
  if(!overCanvas && !(ev.ctrlKey || ev.metaKey)) return;   // nech prohlížeč / panel
  ev.preventDefault();
  let cx = ev.clientX, cy = ev.clientY;
  if(!overCanvas){ const c = stageCenterPt(); cx = c.x; cy = c.y; }
  const z = S.view.zoom * (ev.deltaY < 0 ? 1.12 : 1/1.12);
  zoomAt(cx, cy, z);
}

/* ── vícedotyková gesta: dva prsty = přiblížení / oddálení a posun ── */
const pointers = new Map();          // pointerId → {x,y}
let pinch = null;

function ptrDown(ev){
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size === 2){
    drag = null;                     // tažení přerušíme, přebírá gesto
    const [a,b] = [...pointers.values()];
    pinch = {
      d0: Math.hypot(a.x-b.x, a.y-b.y) || 1,
      z0: S.view.zoom,
      cx: (a.x+b.x)/2, cy: (a.y+b.y)/2,
      tx0: S.view.tx, ty0: S.view.ty
    };
    return;
  }
  if(pointers.size === 1){
    svg().setPointerCapture?.(ev.pointerId);
    onDown(ev);
  }
}

function ptrMove(ev){
  if(!pointers.has(ev.pointerId)){ onMove(ev); return; }   // jen najetí myší
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size >= 2 && pinch){ pinchMove(); return; }
  onMove(ev);
}

function pinchMove(){
  const [a,b] = [...pointers.values()];
  const d  = Math.hypot(a.x-b.x, a.y-b.y) || 1;
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const r  = svg().getBoundingClientRect();
  const z  = clamp(pinch.z0 * (d / pinch.d0), 0.01, 8);
  /* světový bod, který byl na začátku gesta pod středem prstů,
     pod ním zůstane i teď – takže se zároveň přibližuje i posouvá */
  const wx = (pinch.cx - r.left - pinch.tx0) / pinch.z0;
  const wy = (pinch.cy - r.top  - pinch.ty0) / pinch.z0;
  S.view.zoom = z;
  S.view.tx = (cx - r.left) - wx*z;
  S.view.ty = (cy - r.top)  - wy*z;
  render();
}

function ptrUp(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size === 0) onUp(ev);
}

/* ─────────────────────────── 8. ZDI ─────────────────────────── */

/** Zapíše bod, na kterém se zvedl prst. */
function commitWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  const c = S.draft.cursor, pts = S.draft.pts;
  if(pts.length === 0){ pts.push({ x:c.x, y:c.y }); render(); return; }

  const last = pts[pts.length-1];
  /* Stejné místo jako poslední bod → ignorovat. Dřív se to bralo jako
     „dvojklik = hotovo“, jenže přichytávání na mřížku stáhne na stejné místo
     i dva různé kliky a zeď pak končila, kdy nechtěla. */
  if(Math.hypot(last.x-c.x, last.y-c.y) < 1) return;

  /* Klik na první bod zeď uzavře (obvod místnosti). */
  const first = pts[0];
  if(pts.length >= 3 && Math.hypot(first.x-c.x, first.y-c.y) <= Math.max(S.snapMm, 50)){
    finishWall(true);
    return;
  }
  pts.push({ x:c.x, y:c.y });
  render();
}

/** Poslední bod rozkreslené zdi zpátky. */
function undoWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  S.draft.pts.pop();
  if(S.draft.pts.length === 0) S.draft = null;
  render();
}

/**
 * Rozkreslenou kresbu VŽDY dokončí a uloží – nikdy ji nezahodí.
 * Volá se při přepnutí nástroje, takže zeď nemůže zmizet.
 */
function commitDraft(){
  const d = S.draft;
  if(!d) return false;
  if(d.kind === 'wall'){
    if(d.pts.length >= 2){ finishWall(!!d.closed); return true; }
    S.draft = null; render(); return false;
  }
  if(d.kind === 'rect'){
    const r = normRect(d.a, d.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:DFLT_EL_D });
      select('el', e.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  if(d.kind === 'guide'){
    const L = Math.hypot(d.b.x-d.a.x, d.b.y-d.a.y);
    S.draft = null;
    if(L >= 50){
      const g = { id:uid('g'), a:{...d.a}, b:{...d.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  S.draft = null; render();          // measure – není co ukládat
  return false;
}

function finishWall(closed){
  if(!S.draft || S.draft.kind!=='wall') return;
  const pts = S.draft.pts;
  if(pts.length >= 2){
    const wall = { id:uid('w'), pts, t:S.draft.t||WALL_T_DEFAULT, closed:!!closed, name:closed?'Místnost':'Zeď' };
    S.project.walls.push(wall);
    select('wall', wall.id);
    pushHistory();
    toast(closed ? 'Místnost vytvořena' : 'Zeď vytvořena – uprav délky úseků vpravo');
  }
  S.draft = null;
  render();
}

function createRoom(w, h, t){
  /* První místnost patří do počátku souřadnic – jinak by X/Y byly obrovská
     čísla podle toho, kam zrovna mířil pohled. Další místnosti jdou do pohledu. */
  let x, y;
  if(S.project.walls.length === 0){ x = 0; y = 0; }
  else { const c = viewCenter(); x = R(c.x - w/2); y = R(c.y - h/2); }
  const wall = { id:uid('w'), t:t||WALL_T_DEFAULT, closed:true, name:'Místnost',
    pts:[{x, y}, {x:R(x+w), y}, {x:R(x+w), y:R(y+h)}, {x, y:R(y+h)}] };
  S.project.walls.push(wall);
  select('wall', wall.id);
  pushHistory();
  fitView();
}

/** Přepíše délku i-tého úseku; bod B se posune po směru úsečky. */
/** Které konce úseku navazují na další stěnu (roh) – tam se měří od vnitřního líce. */
function segEnds(wall, i){
  const n = wall.pts.length;
  const count = wall.closed ? n : n-1;
  return { connA: wall.closed || i > 0, connB: wall.closed || i < count-1 };
}

/** Délka stěny tak, jak ji naměříš metrem/laserem.
 * – OTEVŘENÁ zeď (příčka, kuchyňská stěna): žádná matematika – zadané i
 *   zobrazené číslo je přesně délka té stěny, konec ke konci.
 * – UZAVŘENÝ obvod: světlá míra místnosti – od délky se odečte celá tloušťka
 *   zdi (půlka na každém rohu), protože laser měří mezi vnitřními líci. */
function segClearLength(wall, i){
  /* nakreslená čára JE naměřená stěna – číslo je vždy přesně její délka */
  return segLength(wallSegments(wall)[i]);
}

function setSegmentLength(wall, i, len){
  /* zadané číslo je přesně délka stěny – čára je naměřená hrana */
  const a = wall.pts[i], b = wall.pts[(i+1) % wall.pts.length];
  const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
  const nx = R(a.x + dx/L*len), ny = R(a.y + dy/L*len);
  if(wall.closed && i === wall.pts.length-1) wall.pts[0] = { x:nx, y:ny };
  else wall.pts[(i+1) % wall.pts.length] = { x:nx, y:ny };
  render();
}

/** Posune jen označenou stěnu (úsek) o dx/dy mm – společné body vtáhne s sebou,
 * sousední stěny se napojí. */
function moveSegment(wall, i, dx, dy){
  const n = wall.pts.length;
  if(i == null || i < 0 || i >= n) return;
  const a = wall.pts[i], b = wall.pts[(i+1) % n];
  a.x = R(a.x + dx); a.y = R(a.y + dy);
  if(b !== a){ b.x = R(b.x + dx); b.y = R(b.y + dy); }
  render();
}

/**
 * Srovná zeď do pravých úhlů BEZ ZMĚNY DÉLEK.
 *
 * Každý úsek si nechá svou naměřenou délku, změní se jen jeho směr —
 * a to vždy na nejbližší násobek 90° počítaný od směru PRVNÍHO úseku.
 * Díky společné referenci jsou sousední úseky buď rovnoběžné, nebo kolmé,
 * nikdy ne „téměř".
 *
 * Celý nákres se navíc otočí tak, aby NEJDELŠÍ stěna ležela přesně
 * vodorovně — rovnoběžně s dlouhou stranou papíru. Půdorys tak není
 * pootočený a dá se s ním pohodlně pracovat i tisknout.
 *
 * Vrátí rozdíl v mm, o který se uzavřený obvod po srovnání nezavře
 * (0 = zavřel se přesně). Délky nikdy nepřepisujeme — nesedí-li protilehlé
 * strany, řekneme to uživateli a on si délky upraví sám.
 */
function orthogonalizeWall(wall){
  const n = wall.pts.length;
  if(n < 2) return 0;
  const Q = Math.PI/2;
  const segs = [];
  for(let i=0;i<n-1;i++){
    const a = wall.pts[i], b = wall.pts[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    segs.push({ len:Math.hypot(dx,dy), ang:Math.atan2(dy,dx) });
  }
  /* společná reference = první úsek – sousední úseky pak vycházejí
     buď rovnoběžné, nebo kolmé */
  const base = segs[0].ang;
  for(const sg of segs) sg.dir = base + Math.round((sg.ang - base)/Q)*Q;

  /* otoč celý nákres, aby NEJDELŠÍ stěna ležela přesně vodorovně
     (rovnoběžně s papírem) – pootočený půdorys se špatně kótuje i tiskne */
  let m = 0;
  for(let i=1;i<segs.length;i++) if(segs[i].len > segs[m].len) m = i;
  let rot = segs[m].dir % Math.PI;
  if(rot > Q) rot -= Math.PI;
  if(rot < -Q) rot += Math.PI;
  for(const sg of segs) sg.dir -= rot;

  /* délky bereme z původních úseků a přenášíme je do nových směrů */
  const p0 = wall.pts[0];
  let x = p0.x, y = p0.y;
  for(let i=0;i<segs.length;i++){
    x = R(x + Math.cos(segs[i].dir)*segs[i].len);
    y = R(y + Math.sin(segs[i].dir)*segs[i].len);
    wall.pts[i+1] = { x, y };
  }

  /* u uzavřeného obvodu změříme, o kolik se konec rozešel se začátkem */
  let gap = 0;
  if(wall.closed && n > 2){
    const last = wall.pts[n-1];
    gap = Math.round(Math.hypot(p0.x-last.x, p0.y-last.y));
  }
  render();
  return gap;
}

/**
 * Posune celý nákres tak, aby jeho levý horní roh seděl v (0,0).
 * Proto v celém projektu — u zdí, prvků, odstupů i v kótách — vidíš
 * malá čísla od rohu obvodu místo obrovských souřadnic „odněkud z pohledu".
 * Pohled posuneme o stejný rozdíl, takže se obrázek na obrazovce nehne.
 */
function rebaseProject(){
  const OR = projectOrigin();
  const ox = OR.x, oy = OR.y;
  if(!ox && !oy) return false;
  const move = o => { o.x = R(o.x - ox); o.y = R(o.y - oy); };
  for(const w of S.project.walls) for(const p of w.pts) move(p);
  for(const e of S.project.elements){ e.x = R(e.x - ox); e.y = R(e.y - oy); }
  for(const g of S.project.guides){ move(g.a); move(g.b); }
  if(S.draft){ for(const p of S.draft.pts) move(p); if(S.draft.cursor) move(S.draft.cursor); }
  S.view.tx += ox*S.view.zoom;
  S.view.ty += oy*S.view.zoom;
  return true;
}

/* ─────────────────────────── 9. ODSTUPOVÉ ČÁRY ─────────────────────────── */

/** Vytvoří odstupovou čáru rovnoběžně se zdí ve vzdálenosti dist. */
function guideFromWall(wall, dist, side){
  const segs = wallSegments(wall).filter(s => segLength(s) > 1);
  if(!segs.length){ toast('Vyber zeď s alespoň jednou úsečkou'); return null; }
  const made = [];
  for(const s of segs){
    const n = segNormal(s);
    const sgn = side === 'auto' ? pickSide(wall, s, n) : (side==='left' ? 1 : -1);
    /* odstup se měří přímo od naměřené čáry (líce) */
    const off = dist;
    const a = { x:R(s.a.x + n.nx*off*sgn), y:R(s.a.y + n.ny*off*sgn) };
    const b = { x:R(s.b.x + n.nx*off*sgn), y:R(s.b.y + n.ny*off*sgn) };
    const g = { id:uid('g'), a, b, print:true, name:`Odstup ${fmt(dist)}` };
    S.project.guides.push(g); made.push(g);
  }
  if(made.length){ select('guide', made[0].id); pushHistory(); }
  toast(made.length ? `Vytvořeno ${made.length} odstupových čar` : 'Nic nevytvořeno');
  render();
  return made[0] || null;
}

/** Vybere stranu, na které je vnitřek místnosti (u uzavřené zdi), jinak libovolnou. */
function pickSide(wall, seg, n){
  if(!wall.closed) return 1;
  const mid = { x:(seg.a.x+seg.b.x)/2 + n.nx*10, y:(seg.a.y+seg.b.y)/2 + n.ny*10 };
  return pointInPoly(mid, wall.pts) ? 1 : -1;
}
function pointInPoly(p, pts){
  let inside = false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const a = pts[i], b = pts[j];
    if(((a.y>p.y) !== (b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y) + a.x)) inside = !inside;
  }
  return inside;
}

/* ─────────────────────────── 10. PRVKY ─────────────────────────── */

function getEl(id){ return S.project.elements.find(e => e.id === id); }

const DFLT_EL_D = 510;                    // výchozí hloubka obdélníku [mm]
function addElement(o={}){
  const e = {
    id: uid('e'),
    x: o.x ?? 0, y: o.y ?? 0,
    w: o.w ?? 600, d: o.d ?? DFLT_EL_D,
    name: o.name || '',
    note: o.note || '',
    qty: o.qty || 1,
    color: o.color || COLORS[0],
    front: o.front || 'jih'
  };
  S.project.elements.push(e);
  return e;
}

/** Krátké klepnutí nástrojem Obdélník: vloží výchozí 600 × 510 pod prst
   a přichytí ho k nejbližšímu cíli v dosahu magnetu. */
function addElementAtPoint(wx, wy, wmm=600, dmm=DFLT_EL_D){
  const e = finishNewElementKind(addElement({ x:R(wx - wmm/2), y:R(wy - dmm/2), w:wmm, d:dmm }));
  const r = computeSnap(e, e.x, e.y, 0, 0);
  e.x = R(r.x); e.y = R(r.y);
  return e;
}

function deleteSelection(){
  if(!S.sel) return;
  if(S.sel.kind==='el') S.project.elements = S.project.elements.filter(e=>e.id!==S.sel.id);
  if(S.sel.kind==='wall') S.project.walls = S.project.walls.filter(w=>w.id!==S.sel.id);
  if(S.sel.kind==='guide') S.project.guides = S.project.guides.filter(g=>g.id!==S.sel.id);
  if(S.sel.kind==='win') S.project.windows = S.project.windows.filter(x=>x.id!==S.sel.id);
  if(S.sel.kind==='sym') S.project.symbols = S.project.symbols.filter(x=>x.id!==S.sel.id);
  S.sel = null;
  pushHistory(); render();
}

function duplicateSelection(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const n = { ...e, id:uid('e'), x:R(e.x + e.w + 10), name:e.name };
  S.project.elements.push(n);
  select('el', n.id); pushHistory(); render();
}

/* Šířka prvku se měří podél jeho čela (čelo je otočené do místnosti, pryč
   od zdi). U čel k jihu/severu leží čelo v ose X, u východu/západu v ose Y.
   Šířka a hloubka se proto odvozují z osových rozměrů podle směru čela –
   po otočení o 90° zůstanou stejné (600 × 510 zůstává 600 × 510). */
const isHorizFront = f => (f === 'jih' || f === 'sever');
function elFrontW(e){ return isHorizFront(e.front || 'jih') ? e.w : e.d; }
function elFrontD(e){ return isHorizFront(e.front || 'jih') ? e.d : e.w; }
function setElFrontW(e, v){ if(isHorizFront(e.front || 'jih')) e.w = v; else e.d = v; }
function setElFrontD(e, v){ if(isHorizFront(e.front || 'jih')) e.d = v; else e.w = v; }

/* Bok+ – boční panel u skříně (NENÍ skříň). Je to tenký pruh (typicky 18 mm)
   na levém nebo pravém konci skříně „při pohledu na čelo". Jeho délka jde do
   hloubky skříně: hloubka skříně + 50 mm ke zdi (skříň stojí 50 mm od zdi)
   + 20 mm přesah před čelo → u skříně 510 mm je bok+ 580 mm. Geometrie se
   pokaždé počítá ze skříně → bok se pohybuje i otáčí spolu se skříní. */
const BOK_W_DFLT    = 18;  // tloušťka boku+ [mm]
const BOK_BACK_DFLT = 50;  // za zadní hranu skříně ke zdi [mm] (skříň stojí 50 mm od zdi)
const BOK_FRONT_DFLT = 20; // přesah před čelo (přes dvířka) [mm]
const BOK_H_DS = 900;      // výška boku+ u DS [mm] = sokl 150 + skříň 720 + deska ~30
const BOK_H_HS = 750;      // výška boku+ u HS [mm]
// Pozn.: hloubka boku+ = hloubka skříně + 50 (ke zdi) + 20 (před čelo) = 510+70 = 580 mm

function bokSides(e){
  /* Které strany mají bok+: {L, R}. Starší uložení (side:'L'/'R') se přečte. */
  const b = e && e.bok; const o = { L:false, R:false };
  if(!b) return o;
  if(b.sides){ o.L = !!b.sides.L; o.R = !!b.sides.R; return o; }
  if(b.side === 'L') o.L = true; else if(b.side === 'R') o.R = true;
  if(b.L) o.L = true; if(b.R) o.R = true;
  return o;
}
function bokAny(e){ const sd = bokSides(e); return sd.L || sd.R; }
function bokHas(e, side){ return !!bokSides(e)[side]; }
function bokCfg(e){ const b = e && e.bok; return b && bokAny(e) ? b : null; }
function bokW(e){ const b = bokCfg(e); return b && +b.w ? +b.w : BOK_W_DFLT; }
function bokBack(e){
  const b = bokCfg(e);
  if(b && b.back != null) return +b.back;
  /* horní skříň visí u zdi → bok+ začíná na líci zdi (odskok 0); spodní mají 50 mm */
  return elKind3(e)==='upper' ? 0 : BOK_BACK_DFLT;
}
function bokFront(e){ const b = bokCfg(e); return b && b.front != null ? +b.front : BOK_FRONT_DFLT; }
function bokDepthOf(e){ return (isHorizFront(e.front||'jih') ? e.d : e.w) + bokBack(e) + bokFront(e); }
/* Výška boku+ podle druhu prvku (u sloupu do výšky sloupu). */
function bokH(e){
  const k = elKind3(e);
  if(k==='upper') return BOK_H_HS;
  if(k==='column') return elH3(e);
  return BOK_H_DS;
}
/* Obdélník boku+ na zadané straně (L/R „při pohledu na čelo“). */
function bokRectFor(e, side){
  const W = bokW(e), back = bokBack(e), front = bokFront(e);
  const f = e.front || 'jih';
  const depth = isHorizFront(f) ? e.d : e.w;
  const L = side === 'L';
  let x, y, w, h;
  if(f === 'jih'){            // čelo dole, zadní hrana nahoře
    x = L ? e.x - W : e.x + e.w;
    y = e.y - back; w = W; h = depth + back + front;
  } else if(f === 'sever'){   // čelo nahoře, zadní hrana dole
    x = L ? e.x + e.w : e.x - W;
    y = e.y - front; w = W; h = depth + back + front;
  } else if(f === 'východ'){  // čelo vpravo, zadní hrana vlevo
    y = L ? e.y + e.d : e.y - W;
    x = e.x - back; w = depth + back + front; h = W;
  } else {                    // západ – čelo vlevo, zadní hrana vpravo
    y = L ? e.y - W : e.y + e.d;
    x = e.x - front; w = depth + back + front; h = W;
  }
  return { x, y, w, h };
}
/* Obdélníky všech nakonfigurovaných boků+ dané skříně. */
function bokRects(e){
  const sd = bokSides(e), out = [];
  if(sd.L) out.push(bokRectFor(e, 'L'));
  if(sd.R) out.push(bokRectFor(e, 'R'));
  return out;
}
/* Kreslení boků na plátně (obrazovka): tenký pruh u konce skříně. */
function bokMarkup(){
  const z = S.view.zoom;
  let out = '';
  for(const e of S.project.elements){
    if(!layerShowsEl(e)) continue;
    const thin = bokW(e);
    for(const r of bokRects(e)){
      out += `<rect x="${R(r.x)}" y="${R(r.y)}" width="${R(r.w)}" height="${R(r.h)}"
        fill="#cbd5e199" stroke="#475569" stroke-width="${1.6/z}" stroke-dasharray="${7/z} ${5/z}"/>`;
      /* popisek „Bok+“ jen když je panel na obrazovce dostatečně dlouhý */
      if(Math.max(r.w, r.h) * z > 40 && Math.min(r.w, r.h) * z > 4){
        const fs = clamp(thin * 1.05, 13, 60);
        const v = r.h > r.w;                      // svislý pruh → text na výšku
        const tx = R(r.x + r.w/2), ty = R(r.y + r.h/2);
        const rot = v ? ` transform="rotate(-90 ${tx} ${ty})"` : '';
        out += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"${rot}
          font-size="${fs}" font-weight="700" fill="#334155"
          style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.22}px">Bok+ ${thin}</text>`;
      }
    }
  }
  return out;
}

/* Kreslení boků do PDF (world souřadnice uvnitř <g scale(k)>). */
function boksPrintSvg(sw, filter){
  let out = '';
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    for(const r of bokRects(e)){
      out += `<rect x="${R(r.x)}" y="${R(r.y)}" width="${R(r.w)}" height="${R(r.h)}"
        fill="#cbd5e1aa" stroke="#334155" stroke-width="${sw(0.22)}" stroke-dasharray="${sw(2)} ${sw(1.4)}"/>`;
    }
  }
  return out;
}

/* Přeorientuje prvek na daný směr čela. Když se osa čela změní
   (vodorovná ↔ svislá), prvek se o 90° otočí kolem středu; šířka a
   hloubka prvku se přitom nemění. */
function orientElement(e, newFront){
  const oldH = isHorizFront(e.front || 'jih');
  const newH = isHorizFront(newFront);
  if(oldH !== newH){
    const cx = e.x + e.w/2, cy = e.y + e.d/2;
    const w = e.w; e.w = e.d; e.d = w;
    e.x = R(cx - e.w/2); e.y = R(cy - e.d/2);
  }
  e.front = newFront;
}

function rotateSelection(){
  if(S.sel?.kind !== 'el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const order = ['jih','západ','sever','východ'];
  orientElement(e, order[(order.indexOf(e.front||'jih')+1) % 4]);
  pushHistory(); render();
}

/** Přisune prvek k nejbližší zdi bez ohledu na dosah magnetu. Hledá se
    nejbližší hrana CELÉ sestavy (skříň + bok+) – tak se k zdi přichytí i
    bok+ svou venkovní hranou. */
function snapToWall(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const saved = S.snapMm;
  S.snapMm = 100000;
  const xs = [e.x, e.x+e.w], ys = [e.y, e.y+e.d];
  for(const b of bokRects(e)){ xs.push(b.x, b.x+b.w); ys.push(b.y, b.y+b.h); }
  let best = null;
  for(const c of snapCandidates(e.id)){
    if(c.kind !== 'wall') continue;
    if(c.axis === 'x'){
      for(const px of xs){
        const d = Math.abs(c.pos - px);
        if(!best || d < best.d){
          const test = { ...e, x: e.x + (c.pos - px) };
          const wall = findWall(c.id);
          if(!assemblyRects(test).some(r => elementHitsWall(r, wall))) best = { d, test };
        }
      }
    } else {
      for(const py of ys){
        const d = Math.abs(c.pos - py);
        if(!best || d < best.d){
          const test = { ...e, y: e.y + (c.pos - py) };
          const wall = findWall(c.id);
          if(!assemblyRects(test).some(r => elementHitsWall(r, wall))) best = { d, test };
        }
      }
    }
  }
  S.snapMm = saved;
  if(best){ e.x = R(best.test.x); e.y = R(best.test.y); pushHistory(); toast('Přitaženo ke zdi'); }
  else toast('V dosahu není žádná zeď');
  render();
}
function findWall(id){ return S.project.walls.find(w=>w.id===id) || { pts:[], t:0 }; }

/** Je-li bok+ zaseklý UVNITŘ zdi (např. zapnut u skříně, která už dosedala na
    líc), posune skříň kolmo ke zdi tak, že VENKOVNÍ hrana boku+ dosedne na líc.
    Vrací true, když prvkem pohnul. */
function healBokOverlap(e){
  const hitsAny = t => assemblyRects(t).some(r => S.project.walls.some(wl => elementHitsWall(r, wl)));
  const bokBad = () => bokRects(e).some(b => S.project.walls.some(wl => elementHitsWall(b, wl)));
  if(!bokBad()) return false;
  let moved = false;
  for(let pass=0; pass<4 && bokBad(); pass++){
    const xs = [e.x, e.x+e.w], ys = [e.y, e.y+e.d];
    for(const b of bokRects(e)){ xs.push(b.x, b.x+b.w); ys.push(b.y, b.y+b.h); }
    let best = null;
    for(const c of snapCandidates(e.id)){
      if(c.kind !== 'wall') continue;
      for(const p of (c.axis==='x' ? xs : ys)){
        const shift = c.pos - p;
        if(Math.abs(shift) < 0.01) continue;
        const test = c.axis==='x' ? { ...e, x: e.x + shift } : { ...e, y: e.y + shift };
        if(hitsAny(test)) continue;
        if(!best || Math.abs(shift) < best.d) best = { d: Math.abs(shift), test };
      }
    }
    if(!best) break;
    e.x = R(best.test.x); e.y = R(best.test.y);
    moved = true;
  }
  return moved;
}

/** Dovře mezeru k sousedovi ve stejné řadě. */
function closeGap(dir){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const others = S.project.elements.filter(o => o.id!==e.id
    && Math.abs((o.y+o.d/2) - (e.y+e.d/2)) < GAP_TOL);
  let best = null;
  for(const o of others){
    const gap = dir==='right' ? e.x - (o.x+o.w) : o.x - (e.x+e.w);
    if(gap <= 0 || gap > 2000) continue;
    if(!best || gap < best.gap) best = { gap, o };
  }
  if(best){
    e.x = R(dir==='right' ? e.x - best.gap : e.x + best.gap);
    pushHistory(); toast('Mezera dovřena');
  } else toast('V této řadě není soused s mezerou');
  render();
}

function select(kind, id){
  S.sel = kind ? { kind, id } : null;
  render();
}

/* ─────────────────────────── 11. HISTORIE ─────────────────────────── */

let history = [], historyIndex = -1;
const hist = { preDrag: null };

function snapshot(){ return JSON.stringify({
  walls:S.project.walls, elements:S.project.elements, guides:S.project.guides,
  windows:S.project.windows, symbols:S.project.symbols, info:S.project.info }); }
function pushHistory(){
  const s = snapshot();
  if(history[historyIndex] === s){ save(); return; }
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save(); render();
}
/** Uloží do historie a na disk BEZ překreslení inspektoru – pro úpravy polí
    vpravo, aby psaní a Tab nepřišly o fokus. */
function pushHistoryQuiet(){
  const s = snapshot();
  if(history[historyIndex] === s){ save(); return; }
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save();
}
function commitPreDrag(){
  if(!hist.preDrag) return;
  const before = hist.preDrag; hist.preDrag = null;
  const s = snapshot();
  if(before === s) return;
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save();
}
function restore(s){
  const o = JSON.parse(s);
  S.project.walls = o.walls || [];
  S.project.elements = o.elements || [];
  S.project.guides = o.guides || [];
  S.project.windows = o.windows || [];
  S.project.symbols = o.symbols || [];
  if(o.info) S.project.info = { ...S.project.info, ...o.info };
  if(S.sel){
    const k = S.sel.kind;
    const list = k==='el'?S.project.elements : k==='wall'?S.project.walls : S.project.guides;
    if(!list.find(x=>x.id===S.sel.id)) S.sel = null;
  }
  render();
}
function undo(){ if(historyIndex>0){ historyIndex--; restore(history[historyIndex]); save(); } }
function redo(){ if(historyIndex<history.length-1){ historyIndex++; restore(history[historyIndex]); save(); } }

    const wName = $('#wName'); if(wName){

    /* Délky úseků: Tab potvrdí číslo a skočí na další řádek, Shift+Tab zpět,

    $$('[data-seg]').forEach(inp => {

    box.innerHTML = `

    $('#gName').addEventListener('input', ev => { g.name = ev.target.value; });

    $('#gPos').addEventListener('change', ev => {

      else { const c = (g.a.y+g.b.y)/2; g.a.y = R(c-v/2); g.b.y = R(c+v/2); }

/* Safari na iPadu blokuje localStorage u file:// a v soukromém okně –
   pak ukládáme do paměti a aplikace běží dál. */
const STORE = (() => {
  try{ localStorage.setItem('__t__','1'); localStorage.removeItem('__t__');
    return { mode:'localStorage', getItem:k=>localStorage.getItem(k),
             setItem:(k,v)=>localStorage.setItem(k,v), removeItem:k=>localStorage.removeItem(k) };
  }catch(e){
    const m = new Map();
    return { mode:'paměť', getItem:k=>m.has(k)?m.get(k):null,
             setItem:(k,v)=>void m.set(k,String(v)), removeItem:k=>void m.delete(k) };
  }
})();

/* ═════════════════════════ 3D EXPORT (OBJ + MTL v ZIP) ═════════════════════════
   Z přesného 2D plánku postaví 3D model (metry) – skříně (spodní/horní/sloupy
   podle názvu a pole „Výška“), bok+, pracovní desky nad souvislými řadami,
   stěny se skutečnými okenními otvory, podlaha a strop. Soubor se stáhne jako
   ZIP (model.obj + model.mtl + návod). Rozměry odpovídají plánku 1:1. */

const B3D = {
  wallH:    2600,   // výška místnosti / zdí [mm]
  ceilT:    120,    // tloušťka stropní desky [mm]
  floorT:   120,    // tloušťka podlahové desky [mm]
  pad:      600,    // přesah podlahy/stropu přes obrys [mm]
  sill:     950,    // parapet okna [mm]
  winTop:   2450,   // horní hrana okna [mm]
  baseH:    720,    // spodní skříň (bok DS = 720 × 510) [mm]
  upperH:   710,    // horní skříň [mm]
  upperBot: 1400,   // spodní hrana horních skříněk [mm]
  colH:     2100,   // sloup [mm]
  fridgeH:  2030,   // sloup s lednicí [mm]
  counterT: 30,     // tloušťka pracovní desky [mm] (DS: 150 + 720 + 30 = 900)
  sokl:     150     // výška čelního soklu pod spodními skříněmi [mm]
};

/* Druh prvku – spodní / horní skříň (sloup se odvozuje z názvu). */
const EL_WALL_GAP = 50;    // mezera zadní hrany spodní skříně od zdi [mm]
const UP_D_DFLT   = 320;   // hloubka horní skříně po přepnutí [mm]
const UP_H_DFLT   = 710;   // výška horní skříně po přepnutí [mm]
const SOKL_RESERVE = 100;  // rezerva k délce soklu [mm] na každou řadu DS

function hexRgb(h){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h||'').trim());
  if(!m) return '0.85 0.83 0.80';
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].map(v => R(v/255)).join(' ');
}
function san3(s){ return String(s??'').replace(/[^A-Za-z0-9_.\-]/g,'_').slice(0,28); }

/* Odvození druhu a výšky prvku podle názvu/poznámky („Výška“ v inspektoru
   hodnotu přepíše). */
function guessKind3(e){
  const n = ((e.name||'') + ' ' + (e.note||'')).toLowerCase();
  if(/sloup|sloupc/.test(n) || /lednic|chladnic|mraz/.test(n)) return 'column';
  if(/horn|nástěnn|nasteen|vrchn|vrni/.test(n)) return 'upper';
  return 'base';
}
/* Druh prvku: přednost má přepínač uživatele (e.kind), jinak odhad z názvu. */
function elKind3(e){
  if(e.kind==='upper') return 'upper';
  if(e.kind==='base')  return 'base';
  return guessKind3(e);
}
const isUpperEl = e => elKind3(e)==='upper';
function defaultH3(e){
  const k = elKind3(e);
  if(k==='upper') return B3D.upperH;
  if(k==='column') return /lednic|chladnic|mraz/.test(((e.name||'')+' '+(e.note||'')).toLowerCase()) ? B3D.fridgeH : B3D.colH;
  return B3D.baseH;
}
function elH3(e){ const h = +e.h; return h>=100 ? h : defaultH3(e); }
function kindLabel3(e){
  const k = elKind3(e);
  return k==='upper' ? 'horní skříň' : k==='column' ? 'sloup' : 'spodní skříň';
}
/* Spodní hrana boxu prvku v [mm] (horní skříňky visí; ostatní stojí na podlaze). */
function elZ0(e){
  const k = elKind3(e);
  if(k==='upper')  return B3D.upperBot;
  if(k==='base')   return B3D.floorT + B3D.sokl;   // DS stojí na soklu 150
  return B3D.floorT;                                // sloup
}

/* Najde líc zdi nejblíž ZADNÍ hraně prvku (rovnoběžný úsek) a vrátí souřadnici
   toho líce (y u vodorovné zdi / x u svislé), nebo null. */
function wallFaceBehind(e){
  const f = e.front || 'jih';
  const horiz = (f==='jih' || f==='sever');      // zadní hrana vodorovná
  let back, a0, a1;
  if(f==='jih')      { back=e.y;         a0=e.x; a1=e.x+e.w; }
  else if(f==='sever'){ back=e.y+e.d;    a0=e.x; a1=e.x+e.w; }
  else if(f==='východ'){ back=e.x;       a0=e.y; a1=e.y+e.d; }
  else               { back=e.x+e.w;     a0=e.y; a1=e.y+e.d; }
  let best = null;
  for(const w of S.project.walls){
    for(const [aa,bb] of wallBandOutline(w)){
      const dx=bb.x-aa.x, dy=bb.y-aa.y, L=Math.hypot(dx,dy);
      if(L < 1) continue;
      const isH = Math.abs(dy) < Math.abs(dx);
      if(isH !== horiz) continue;
      const lo = horiz ? Math.min(aa.x,bb.x) : Math.min(aa.y,bb.y);
      const hi = horiz ? Math.max(aa.x,bb.x) : Math.max(aa.y,bb.y);
      if(Math.max(lo, a0) - 1 > Math.min(hi, a1)) continue;   // neleží za zadní hranou
      const face = horiz ? aa.y : aa.x;
      const d = Math.abs(face - back);
      if(!best || d < best.d - 1e-6) best = { d, face };
    }
  }
  return best ? best.face : null;
}

/* Přepne druh prvku. Horní skříň: přisune zadní hranu na líc zdi, hloubka 320,
   výška 710. Spodní: vrátí zadní hranu do mezery EL_WALL_GAP (50 mm) od zdi. */
function setElKind3(e, kind){
  e.kind = (kind==='upper') ? 'upper' : 'base';
  const f = e.front || 'jih';
  const face = wallFaceBehind(e);
  if(face == null){
    if(kind==='upper') e.h = UP_H_DFLT;
    pushHistory(); render();
    toast('Nenašel jsem zeď u prvku – změnil jsem jen druh, polohu uprav ručně');
    return;
  }
  if(kind==='upper'){
    if(f==='jih')       { e.y = R(face); e.d = UP_D_DFLT; }
    else if(f==='sever'){ e.d = UP_D_DFLT; e.y = R(face - UP_D_DFLT); }
    else if(f==='východ'){ e.x = R(face); e.w = UP_D_DFLT; }
    else                { e.w = UP_D_DFLT; e.x = R(face - UP_D_DFLT); }
    e.h = UP_H_DFLT;
  } else {
    if(f==='jih')       { e.y = R(face + EL_WALL_GAP); }
    else if(f==='sever'){ e.y = R(face - EL_WALL_GAP - e.d); }
    else if(f==='východ'){ e.x = R(face + EL_WALL_GAP); }
    else                { e.x = R(face - EL_WALL_GAP - e.w); }
    e.h = B3D.baseH;
  }
  /* bok+ se přizpůsobí druhu: HS u zdi (odskok 0), DS s odskokem 50 */
  if(bokAny(e)) e.bok.back = kind==='upper' ? 0 : BOK_BACK_DFLT;
  pushHistory(); render();
  toast(kind==='upper'
    ? 'Horní skříň: u zdi, hloubka ' + UP_D_DFLT + ' mm, výška ' + UP_H_DFLT + ' mm'
    : 'Spodní skříň: zadní hrana ' + EL_WALL_GAP + ' mm od zdi');
}

/* ── VRSTVY DS / HS ─────────────────────────────────────────────────────
   Sloupy (lednice/trouba…) se zobrazují v OBOU vrstvách; DS vrstva = spodní
   skříňky + sloupy, HS vrstva = horní skříňky + sloupy. */
function layerShowsEl(e){
  if(S.layer === 'all') return true;
  const k = elKind3(e);
  if(S.layer === 'DS') return k === 'base' || k === 'column';
  if(S.layer === 'HS') return k === 'upper' || k === 'column';
  return true;
}
function updLayerUI(){
  for(const l of ['all','DS','HS']){
    const b = document.getElementById('btnLayer' + l);
    if(b) b.setAttribute('aria-pressed', S.layer===l ? 'true':'false');
  }
}
function setLayer(l){
  if(!['all','DS','HS'].includes(l)) l = 'all';
  S.layer = l;
  if(S.sel && S.sel.kind==='el'){
    const ee = getEl(S.sel.id);
    if(ee && !layerShowsEl(ee)) S.sel = null;
  }
  updLayerUI();
  render();
  toast(l==='all' ? 'Zobrazeno vše (DS + HS + sloupy)'
     : l==='DS'  ? 'Vrstva DS: spodní skříňky + sloupy'
     :            'Vrstva HS: horní skříňky + sloupy');
}
/* Nový prvek nakreslený ve vrstvě HS je rovnou HORNÍ skříň: přisune se ke
   zdi, hloubka 320, výška 710. */
function finishNewElementKind(e){
  if(S.layer === 'HS'){
    e.kind = 'upper'; e.h = UP_H_DFLT;
    const f = e.front || 'jih';
    const face = wallFaceBehind(e);
    if(face != null){
      if(f==='jih')        { e.y = R(face); e.d = UP_D_DFLT; }
      else if(f==='sever') { e.d = UP_D_DFLT; e.y = R(face - UP_D_DFLT); }
      else if(f==='východ'){ e.x = R(face); e.w = UP_D_DFLT; }
      else                 { e.w = UP_D_DFLT; e.x = R(face - UP_D_DFLT); }
    } else {
      e.d = Math.min(e.d, UP_D_DFLT);
    }
  }
  return e;
}

/* Souvislé řady spodních skříněk (pro sokl a délky materiálu). */
function dsRuns(){
  /* Do „řady DS“ patří spodní skříňky (base) i sloupy (column) stojící na stejné
     čelní linii – sloup uprostřed řady (např. lednice) řadu nerozdělí. Řada,
     která neobsahuje žádnou spodní skříňku, sokl nedostává. */
  const items = [];
  for(const e of S.project.elements){
    const k = elKind3(e);
    if(k!=='base' && k!=='column') continue;
    const f = e.front || 'jih';
    let s0, s1, face;
    if(f==='jih')        { face=e.y+e.d; s0=e.x;   s1=e.x+e.w; }
    else if(f==='sever') { face=e.y;    s0=e.x;   s1=e.x+e.w; }
    else if(f==='východ'){ face=e.x;    s0=e.y;   s1=e.y+e.d; }
    else                 { face=e.x+e.w;s0=e.y;   s1=e.y+e.d; }
    items.push({ e, k, f, face:R(face), s0, s1 });
  }
  const groups = {};
  for(const it of items){ const key = it.f+':'+it.face; (groups[key]=groups[key]||[]).push(it); }
  const runs = [];
  for(const key in groups){
    const g = groups[key].sort((a,b)=>a.s0-b.s0);
    let cur = null;
    for(const b of g){
      if(!cur){
        cur = { f:b.f, face:b.face, s0:b.s0, s1:b.s1, el:[b.e], n:(b.k==='base'?1:0) };
      } else if(b.s0 - cur.s1 <= 90){
        cur.s1 = Math.max(cur.s1, b.s1); cur.el.push(b.e); if(b.k==='base') cur.n++;
      } else {
        if(cur.n > 0) runs.push(cur);
        cur = { f:b.f, face:b.face, s0:b.s0, s1:b.s1, el:[b.e], n:(b.k==='base'?1:0) };
      }
    }
    if(cur && cur.n > 0) runs.push(cur);
  }
  const out = [];
  for(const r of runs){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const e of r.el){ x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); }
    const len = (r.f==='jih'||r.f==='sever') ? (x1-x0) : (y1-y0);
    out.push({ f:r.f, face:r.face, len, x0, y0, x1, y1, n:r.n });
  }
  return out;
}

/* ── čelní sokl (150 mm) pod řadami DS – do 3D/PNG modelu ── */
function plinths3(sc, mats){
  for(const r of dsRuns()){
    scBox(sc, r.x0, r.y0, r.x1, r.y1, B3D.floorT, B3D.floorT + B3D.sokl, mats.plinth);
  }
}

/* ── zjednodušená scéna: vrcholy + plochy (materiál po ploše) ── */
function mkScene(){ return { verts:[], facs:[] }; }
function scAddPt(sc, x, y, z){
  const q = n => Math.round(n*1000)/1000;      // 0.001 m = 1 mm
  sc.verts.push([q(x/1000), q(-y/1000), q(z/1000)]);
  return sc.verts.length - 1;
}
function vec3(a,b){ return [b[0]-a[0], b[1]-a[1], b[2]-a[2]]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot3(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function mid3(ps){ return ps.reduce((s,p)=>{ s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; return s; },[0,0,0]).map(v=>v/ps.length); }

/* Čtyřúhelník mezi 4 3D body; normálu otočí vždy VEN od středu tělesa cen. */
function scQuad(sc, pts, cen, mat){
  const cc = mid3(pts);
  let n = cross3(vec3(pts[0],pts[1]), vec3(pts[0],pts[2]));
  const out = vec3(cc, cen);
  if(dot3(n, out) < 0){
    sc.facs.push({ mat, v:[scAddPt(sc,pts[0][0],pts[0][1],pts[0][2]), scAddPt(sc,pts[3][0],pts[3][1],pts[3][2]), scAddPt(sc,pts[2][0],pts[2][1],pts[2][2]), scAddPt(sc,pts[1][0],pts[1][1],pts[1][2])] });
  } else {
    sc.facs.push({ mat, v:pts.map(p=>scAddPt(sc,p[0],p[1],p[2])) });
  }
}

/* Hranol z rovinného polygonu (plan x,y v mm) mezi z0 a z1 [mm]. */
function scPrism(sc, corners, z0, z1, mat){
  const n = corners.length;
  if(n < 3 || z1 - z0 < 0.5) return;
  const btm = [], top = [], all = [];
  for(const c of corners){
    btm.push([c.x, c.y, z0]); top.push([c.x, c.y, z1]);
  }
  all.push(...btm, ...top);
  const cen = mid3(all);
  for(let i=0;i<n;i++){
    const j = (i+1)%n;
    scQuad(sc, [btm[i], btm[j], top[j], top[i]], cen, mat);   // bok
  }
  scQuad(sc, btm, cen, mat);                                    // dno (dolů)
  scQuad(sc, top, cen, mat);                                    // vrch (nahoru)
}
/* Obdélník (x0,y0)-(x1,y1) v mm jako hranol. */
function scBox(sc, x0,y0,x1,y1, z0,z1, mat){
  scPrism(sc, [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}], z0, z1, mat);
}

/* ── pracovní desky nad souvislými řadami spodních skříněk ── */
function counters3(sc){
  const bases = [];
  for(const e of S.project.elements){
    if(elKind3(e) !== 'base') continue;
    const f = e.front || 'jih', w = e.w, d = e.d;
    let front, range0, range1, rect;
    if(f==='jih')      { front = e.y + d; range0 = e.x;         range1 = e.x + w; rect = { y0:e.y,  y1:e.y+d }; }
    else if(f==='sever'){ front = e.y;   range0 = e.x;         range1 = e.x + w; rect = { y0:e.y,  y1:e.y+d }; }
    else if(f==='východ'){ front = e.x + w; range0 = e.y;      range1 = e.y + d; rect = { x0:e.x,  x1:e.x+w }; }
    else                { front = e.x;   range0 = e.y;         range1 = e.y + d; rect = { x0:e.x,  x1:e.x+w }; }
    bases.push({ e, f, front:R(front), r0:R(range0), r1:R(range1), rect, h:elH3(e) });
  }
  const groups = {};
  for(const b of bases){
    const key = b.f + ':' + b.front;
    (groups[key] = groups[key] || []).push(b);
  }
  for(const key in groups){
    const row = groups[key];
    const hTop = Math.max(...row.map(b => b.h));
    row.sort((a,b) => a.r0 - b.r0);
    let runs = [];
    for(const b of row){
      if(runs.length && b.r0 - runs[runs.length-1].r1 <= 90) runs[runs.length-1].r1 = Math.max(runs[runs.length-1].r1, b.r1);
      else runs.push({ r0:b.r0, r1:b.r1, rect:b.rect });
    }
    for(const run of runs){
      const f = row[0].f, z0 = B3D.floorT + B3D.sokl + hTop, z1 = B3D.floorT + B3D.sokl + hTop + B3D.counterT;
      let x0,y0,x1,y1;
      if(f==='jih')      { x0 = run.r0; x1 = run.r1; y1 = row[0].front; y0 = Math.min(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.y0)); }
      else if(f==='sever'){ x0 = run.r0; x1 = run.r1; y0 = row[0].front; y1 = Math.max(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.y1)); }
      else if(f==='východ'){ y0 = run.r0; y1 = run.r1; x1 = row[0].front; x0 = Math.min(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.x0)); }
      else               { y0 = run.r0; y1 = run.r1; x0 = row[0].front; x1 = Math.max(...row.filter(b=>b.r0>=run.r0-1&&b.r1<=run.r1+1).map(b=>b.rect.x1)); }
      scBox(sc, x0,y0,x1,y1, z0,z1, 'counter');
    }
  }
}

/* ── celá sestava prvků (skříně + sloupy + bok+) ── */
function elements3(sc, mats){
  S.project.elements.forEach((e, i) => {
    const h = elH3(e), z0 = elZ0(e), z1 = z0 + h;
    const mat = mats.el(e.color || '#c9c3b8');
    scBox(sc, e.x, e.y, e.x + e.w, e.y + e.d, z0, z1, mat);
    /* bok+ = tenký svislý panel(y) na boku/bocích skříně */
    for(const b of bokRects(e)){
      let zB0, zB1; const kb = elKind3(e);
      if(kb==='upper')        { zB0 = B3D.upperBot;                 zB1 = B3D.upperBot + BOK_H_HS; }
      else if(kb==='column')  { zB0 = z0;                           zB1 = z1; }
      else                    { zB0 = B3D.floorT;                   zB1 = B3D.floorT + BOK_H_DS; }
      scBox(sc, b.x, b.y, b.x + b.w, b.y + b.h, zB0, zB1, mats.el('#d8d3c8'));
    }
  });
}

/* ── místnost: podlaha, strop, stěny s otvory oken ── */
function room3(sc, mats, noCeil){
  const c = contentBBox({ skipGuides:true });
  if(!c) return;
  const P = B3D.pad;
  scBox(sc, c.x-P, c.y-P, c.x+c.w+P, c.y+c.h+P, 0, B3D.floorT, mats.floor);
  if(!noCeil) scBox(sc, c.x-P, c.y-P, c.x+c.w+P, c.y+c.h+P, B3D.wallH, B3D.wallH+B3D.ceilT, mats.ceil);
  /* okna načtená podle zdi a úseku */
  const winsBy = {};
  for(const w of S.project.windows) winsBy[w.wallId+':'+w.seg] = winsBy[w.wallId+':'+w.seg] || [];
  for(const w of S.project.windows) winsBy[w.wallId+':'+w.seg].push(w);

  for(const w of S.project.walls){
    const t = w.t || WALL_T_DEFAULT, side = wallSide(w);
    for(const sg of wallSegments(w)){
      const dx = sg.b.x - sg.a.x, dy = sg.b.y - sg.a.y, L = Math.hypot(dx,dy);
      if(L < 1) continue;
      const ux = dx/L, uy = dy/L;
      /* směr pásu ven z místnosti (stejná konvence jako 2D výplň zdi) */
      const onx = -uy*side, ony = ux*side;
      const ext = t;                      // prodloužení přes rohy, ať rohy sedí
      const s0 = -ext, s1 = L + ext;
      /* otevřené úseky (okna) */
      const open = [];
      for(const win of (winsBy[w.id+':'+sg.i] || [])){
        const half = Math.min(win.w, L)/2;
        const a = Math.max(s0, win.off - half), b = Math.min(s1, win.off + half);
        if(b - a > 1) open.push([a,b]);
      }
      open.sort((p,q) => p[0]-q[0]);
      const parts = [];
      let cur = s0;
      for(const [a,b] of open){
        if(a - cur > 1) parts.push({ a:cur, b:a, open:false });
        parts.push({ a, b, open:true });
        cur = b;
      }
      if(s1 - cur > 1) parts.push({ a:cur, b:s1, open:false });
      for(const seg of parts){
        const pA = { x:sg.a.x + ux*seg.a, y:sg.a.y + uy*seg.a };
        const pB = { x:sg.a.x + ux*seg.b, y:sg.a.y + uy*seg.b };
        const corners = [
          { x:pA.x,          y:pA.y },
          { x:pB.x,          y:pB.y },
          { x:pB.x + onx*t,  y:pB.y + ony*t },
          { x:pA.x + onx*t,  y:pA.y + ony*t }
        ];
        if(seg.open){
          scPrism(sc, corners, 0, B3D.sill, mats.wall);                  // parapet
          scPrism(sc, corners, B3D.sill, B3D.winTop, mats.glass);        // zasklení
          scPrism(sc, corners, B3D.winTop, B3D.wallH, mats.wall);        // nadpraží
        } else {
          scPrism(sc, corners, 0, B3D.wallH, mats.wall);
        }
      }
    }
  }
}

/* ── sestavení OBJ + MTL ── */
function buildScene3(noCeil){
  const sc = mkScene();
  const used = {};
  const mats = { wall:'#ece8e0', floor:'#d8d0c2', ceil:'#f6f4ef', glass:'#bcd7e8', counter:'#f0ede6', plinth:'#e7e0d3' };
  mats.el = hex => { used[hex]=1; return 'el_' + hex.replace('#',''); };
  elements3(sc, mats);
  counters3(sc);
  plinths3(sc, mats);
  room3(sc, mats, noCeil);
  const matList = Object.keys(used).map(h => ({ name:'el_'+h.replace('#',''), hex:h }));
  matList.push({ name:'wall', hex:mats.wall }, { name:'floor', hex:mats.floor },
               { name:'ceil', hex:mats.ceil }, { name:'glass', hex:mats.glass },
               { name:'counter', hex:mats.counter }, { name:'plinth', hex:mats.plinth });
  return { sc, matList };
}
function buildObj3(){
  const { sc, matList } = buildScene3(false);
  let obj = '# 3D model z plánku (kuchyne-narys)\n# souradnice v metrech (plan x,y; -y = nahoru), Z nahoru\n';
  obj += '# meritko 1:1 k planku; materialy viz model.mtl\n';
  for(const v of sc.verts) obj += 'v ' + v.join(' ') + '\n';
  const byMat = {};
  sc.facs.forEach((f, i) => { (byMat[f.mat] = byMat[f.mat] || []).push([i, f.v]); });
  let oi = 0;
  for(const m in byMat){
    obj += '\no cast_' + (oi++) + '\n';
    obj += 'usemtl ' + m + '\n';
    for(const [, v] of byMat[m]){
      obj += 'f ' + v.map(i => (i+1)).join(' ') + '\n';
    }
  }
  let mtl = '# materialy (kd = barva; v Blenderu je nahrad plnohodnotnymi)\n';
  for(const m of matList) mtl += 'newmtl ' + m.name + '\nKd ' + hexRgb(m.hex) + '\nKs 0 0 0\nKa 0 0 0\n\n';
  return { obj, mtl };
}

/* ── ZIP (bez komprese) + stažení ── */
function crc32(bytes){
  let c; const t = [];
  for(let n=0;n<256;n++){ c = n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n] = c>>>0; }
  let crc = 0xFFFFFFFF;
  for(const b of bytes) crc = t[(crc ^ b) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const u16 = v => [v & 255, (v >> 8) & 255];
  const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
  const body = [], centr = [];
  let off = 0;
  for(const f of files){
    const nb = [...enc.encode(f.name)];
    const db = (typeof f.data === 'string') ? [...enc.encode(f.data)] : [...f.data];
    const crc = crc32(new Uint8Array(db));
    body.push(...[80,75,3,4,20,0,0,0,0,0], ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...nb, ...db);
    centr.push(...[80,75,1,2,20,0,20,0,0,0,0,0], ...u32(crc), ...u32(db.length), ...u32(db.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...nb);
    off += 30 + nb.length + db.length;
  }
  const cdSize = centr.length;
  body.push(...centr, ...[80,75,5,6,0,0,0,0], ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0));
  return new Uint8Array(body);
}

/* ═══════════════ 3D POHLEDY → PNG (vstup pro AI vizualizaci, např. Nano Banana) ═══════
   Vyrendruje z přesného 3D modelu plánku čisté obrázky BEZ popisků a kót:
   pohled shora + dva izometrické + nízký boční. Stěny jsou průsvitné, aby bylo
   vidět celou kuchyni v místnosti (okna jsou vidět jako zasklení). Vše je
   neutrálně světlé – konečný styl pak určí prompt. Stáhne se ZIP s PNG a
   šablonou promptu. */

const PNG_VIEWS = [
  { name:'1_shora',         az:0,   el:90, desc:'pohled shora (dispozice 1:1)' },
  { name:'2_izometricky_A', az:45,  el:32, desc:'izometrický pohled A' },
  { name:'3_izometricky_B', az:225, el:32, desc:'izometrický pohled B' },
  { name:'4_nizky_bocni',   az:90,  el:14, desc:'nízký boční pohled' }
];

function hexToRgbArr(h){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h||'').trim());
  if(!m) return [0.8,0.78,0.75];
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].map(v => v/255);
}
function nrm3(v){ const L = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/L, v[1]/L, v[2]/L]; }

function pngStyle(mat){
  if(mat === 'wall')    return { c:[0.86,0.84,0.80], a:0.45 };
  if(mat === 'glass')   return { c:[0.68,0.80,0.90], a:0.85 };
  if(mat === 'floor')   return { c:[0.93,0.91,0.88], a:1 };
  if(mat === 'counter') return { c:[0.90,0.88,0.84], a:1 };
  if(mat === 'ceil')    return { c:[0.95,0.94,0.92], a:0.15 };
  return { c:[0.78,0.79,0.83], a:1 };              // skříně – neutrální světle šedá
}

/* Nakreslí jeden pohled scény do canvasu a vrátí base64 PNG (bez hlavičky). */
function renderPngView(sc, az, el){
  const W = 1500, H = 1500;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const E = el * Math.PI/180, A = az * Math.PI/180;
  /* směr od počátku ke kameře */
  const d = [Math.cos(E)*Math.sin(A), Math.cos(E)*Math.cos(A), Math.sin(E)];
  /* g = směr pohledu (od kamery k počátku) */
  const g = [-d[0], -d[1], -d[2]];
  let right, upv;
  if(el > 89){ right = [1,0,0]; upv = [0,1,0]; }        // pohled shora, sever nahoru
  else {
    right = nrm3(cross3([0,0,1], g));                   // doprava na obrazovce
    if(!(Math.abs(right[0])+Math.abs(right[1])+Math.abs(right[2]) > 0.5)) right = [1,0,0];
    upv = nrm3(cross3(g, right));                       // nahoru na obrazovce
  }

  /* plochy + světelný stín (přibližný 3D dojem) */
  const light = nrm3([0.5, 0.3, 0.8]);
  const polys = [];
  for(const f of sc.facs){
    const pts = f.v.map(i => sc.verts[i]);
    if(pts.length < 3) continue;
    const n0 = nrm3(cross3(vec3(pts[0], pts[1]), vec3(pts[0], pts[2])));
    const bright = 0.58 + 0.42 * Math.abs(dot3(n0, light));
    let dep = 0; for(const p of pts) dep += dot3(p, d); dep /= pts.length;
    polys.push({ pts, dep, bright, mat:f.mat });
  }
  polys.sort((a,b) => a.dep - b.dep);                   // daleké nejdřív

  /* rozsah pro vystředění */
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  for(const p of polys) for(const q of p.pts){
    const X = dot3(q, right), Y = dot3(q, upv);
    if(X<x0)x0=X; if(X>x1)x1=X; if(Y<y0)y0=Y; if(Y>y1)y1=Y;
  }
  if(!isFinite(x0)) return '';
  const mrg = 90;
  const scale = Math.min((W-2*mrg)/(x1-x0 || 1), (H-2*mrg)/(y1-y0 || 1));
  const mx = (x0+x1)/2, my = (y0+y1)/2;
  const px = p => (dot3(p, right) - mx) * scale + W/2;
  const py = p => H/2 - (dot3(p, upv)   - my) * scale;

  for(const poly of polys){
    const st = pngStyle(poly.mat);
    const r = Math.round(clamp(st.c[0]*poly.bright,0,1)*255);
    const gg = Math.round(clamp(st.c[1]*poly.bright,0,1)*255);
    const b = Math.round(clamp(st.c[2]*poly.bright,0,1)*255);
    ctx.beginPath();
    for(let i=0;i<poly.pts.length;i++){
      const X = px(poly.pts[i]), Y = py(poly.pts[i]);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(' + r + ',' + gg + ',' + b + ',' + st.a + ')';
    ctx.fill();
  }
  return cv.toDataURL('image/png').split(',')[1] || '';
}

function b64ToBytes(b64){
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}

  const totalLen = els.reduce((s,e)=> s + elFrontW(e)*(e.qty||1), 0);
  const pages = [];

  /* 1) titulní strana */
  pages.push(`
  <section class="pr-page cover">

      <div class="pr-block"><h3>Podklady</h3><p>Půdorys DS a HS s kótami v mm\nVýpis prvků na další straně</p></div>
    </div>
    ${info.notes ? `<div class="pr-notes"><h3>Poznámky</h3><p>${esc(info.notes)}</p></div>` : ''}
    <div class="pr-cover-foot"><span>${esc(info.name || 'Název projektu')}</span><span>${dateCs}</span></div>
  </section>`);

  /* 2) výkresy – DS a HS zvlášť (sloupy jsou v obou), aby se nepřekrývaly */
  const winsAll = S.project.windows, symsAll = S.project.symbols;
  const showList = !!(els.length || winsAll.length || symsAll.length);

  const fHS = e => { const k = elKind3(e); return k==='upper' || k==='column'; };
  const showDS = els.some(fDS);

  const nPages = 1 + (showDS?1:0) + (showHS?1:0) + (showList?1:0);
  let pg = 1;
  const drawOne = (kicker, title, sub, filter, fname) => {
    pg++;
    pages.push(`
  <section class="pr-page">
    <div class="pr-head">
      <div><span class="pr-kicker">${kicker}</span><h2>${title} – ${esc(info.name || 'Název projektu')}</h2></div>
      <div class="pr-meta">${esc(info.client || '')}<br>${dateCs} · Kóty v mm · ${sub}</div>
    </div>
    <div class="pr-drawing">${drawingSvg(P, { filter })}</div>
    <div class="pr-legend">${legendHtml(filter)}</div>
    ${info.notes ? `<div class="pr-notes-inline"><b>Poznámky:</b> ${esc(info.notes)}</div>` : ''}
    <div class="pr-foot"><span>${esc(info.name || 'Projekt')} – ${fname}</span><span>Strana ${pg} / ${nPages}</span></div>
  </section>`);
  };
  if(showDS) drawOne('Výkres 1', 'Půdorys DS', 'spodní skříňky + sloupy', fDS, 'půdorys DS');
  if(showHS) drawOne('Výkres 2', 'Půdorys HS', 'horní skříňky + sloupy', fHS, 'půdorys HS');

  /* 3) výpis prvků + oken + instalací */
  const wins = S.project.windows, syms = S.project.symbols;
  if(els.length || wins.length || syms.length){
    const LAM = 18;   // síla lamina – půda je o dvě síly užší
    const rowFor = (e, i) => {
      const wNom = elFrontW(e), dNom = elFrontD(e);
      const pw = wNom - 2*LAM;            // šířka půdy i latí (podél čela)
      const k3v = elKind3(e);
      const noteX = (k3v==='base') ? (e.note||'') : ((k3v==='upper'?'horní skříň':'sloup') + (e.note?' — '+e.note:''));
      let out = `<tr>
        <td class="num">${i+1}</td>
        <td><span class="pr-tdot" style="background:${e.color}"></span>${esc(e.name || '—')}</td>

      </tr>`;

        .map(([,str]) => `<tr class="pr-sub"><td class="num"></td>
          <td>└ Bok+ (${elKind3(e)==='upper'?'HS':'DS'} – ${str})</td>
          <td class="num">${fmt(bh)}</td>

          <td class="num">1</td>
          <td class="num">${fmt(bh)}</td>
          <td>panel ${fmt(bh)} × ${fmt(bokDepthOf(e))} × ${bkw} mm (v × hl × tl)</td>
        </tr>`).join('');
      if(bokRows) out += bokRows;
      if(elKind3(e)==='base' && pw >= 1){
        out += `<tr class="pr-sub"><td class="num"></td>
          <td>└ půda</td>
          <td class="num">${fmt(pw)}</td>
          <td class="num">${fmt(dNom)}</td>
          <td class="num">1</td>
          <td class="num">${fmt(pw)}</td>
          <td>šířka skříně − 2× ${LAM} mm</td>

        <tr class="pr-sub"><td class="num"></td>
          <td>└ lať</td>
          <td class="num">${fmt(pw)}</td>
          <td class="num">120</td>
          <td class="num">2</td>
          <td class="num">${fmt(pw*2)}</td>
          <td>2 ks, hloubka 120 mm</td>
        </tr>`;
      }
      return out;
    };
    /* Výpis se dělí stejně jako výkresy: DS (spodní skříňky + sloupy)
       a HS (horní skříňky). Sloupy se ve výpisu počítají JEDNOU, v sekci DS. */
    const listDS = els.filter(e=>{ const k = elKind3(e); return k==='base' || k==='column'; });

    const sumW = list => list.reduce((s,e)=> s + elFrontW(e)*(e.qty||1), 0);
    const totalDS = sumW(listDS), totalHS = sumW(listHS);
    const nCols = els.filter(e=>elKind3(e)==='column').length;
    const tableHead = `<thead><tr>
      <th class="num">#</th><th>Název prvku</th>
      <th class="num">Šířka (mm)</th><th class="num">Hloubka (mm)</th>
      <th class="num">Ks</th><th class="num">Celkem (mm)</th><th>Poznámka</th>

      const runs = dsRuns();

/**
 * Výkres v souřadnicích PAPÍRU (mm). Tloušťky čar i písma jsou zadány v mm na
 * papíře a přepočteny přes měřítko k – proto nejsou „rozmazané“.
 */
function drawingSvg(P, opt){
  const filter = (opt && opt.filter) || null;
  const b = contentBBox({ skipGuides:true, filter });
  if(!b) return `<svg viewBox="0 0 ${P.w} ${P.h}"></svg>`;
  const M = 12;                                  // okraj [mm papíru]
  const iw = P.w - M*2, ih = P.h - M*2;
  const pad = 1250;                              // místo na kóty [mm skutečnosti]
  const k = Math.min(iw / (b.w + pad*2), ih / (b.h + pad*2));
  const ox = M + (iw - (b.w + pad*2)*k)/2 - (b.x - pad)*k;
  const oy = M + (ih - (b.h + pad*2)*k)/2 - (b.y - pad)*k;
  const sw = pen => R(pen/k);                    // mm papíru → user units
  const fs = mm => R(mm/k);                      // výška písma [mm papíru]

  const parts = [];
  parts.push(`<g transform="translate(${R(ox)},${R(oy)}) scale(${k})">`);

  // zdi
  for(const w of S.project.walls){
    if(w.pts.length < 2) continue;
    const d = w.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + (w.closed?' Z':'');
    if(w.closed) parts.push(`<path d="${d}" fill="#fafafa" stroke="none"/>`);
    parts.push(`<path d="${wallBandPath(w)}" fill="#22262b" fill-rule="evenodd"
      stroke="#22262b" stroke-width="${sw(0.18)}" stroke-linejoin="miter"/>`);
  }

  // okna ve zdech
  parts.push(windowsSvg(sw, false, 0.25));

  // prvky – tenká linka, žádná výplň přes sousedy (jen prvky dané vrstvy)
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    const upEl = elKind3(e)==='upper';
    parts.push(`<rect x="${e.x}" y="${e.y}" width="${Math.max(e.w,1)}" height="${Math.max(e.d,1)}"
      fill="${e.color}${upEl?'08':'14'}" stroke="#1f2937" stroke-width="${sw(PEN.el)}"${upEl?` stroke-dasharray="${R(1.7/k)} ${R(1.1/k)}"`:''}/>`);
    const fv = FRONT_VEC[e.front||'jih'];
    const m = Math.min(80, e.w*0.14, e.d*0.14);
    let dl = '';
    if(fv[1]===1)  dl = `M${e.x+m} ${e.y+e.d-m} H${e.x+e.w-m}`;
    if(fv[1]===-1) dl = `M${e.x+m} ${e.y+m} H${e.x+e.w-m}`;
    if(fv[0]===1)  dl = `M${e.x+e.w-m} ${e.y+m} V${e.y+e.d-m}`;
    if(fv[0]===-1) dl = `M${e.x+m} ${e.y+m} V${e.y+e.d-m}`;
    if(dl) parts.push(`<path d="${dl}" stroke="${e.color}" stroke-width="${sw(PEN.el)}" fill="none"/>`);

    const capPx = Math.min(e.w, e.d);
    if(capPx*k >= 5){                            // ~5 mm na papíře → popisek se vejde
      const cx = e.x+e.w/2, cy = e.y+e.d/2;
      const size = fs(clamp(capPx*k*0.30, 2.0, 3.4));
      parts.push(`<text x="${R(cx)}" y="${R(cy)}" text-anchor="middle" dominant-baseline="middle"
        font-size="${size}" font-weight="700" fill="#0d1117"
        style="font-family:Helvetica,Arial,sans-serif">${esc(e.name||'')}</text>`);
    }
  }

  // bok+ (boční panely) – kreslí se zvlášť, nejsou skříně
  parts.push(boksPrintSvg(sw, filter));

  // značky instalací
  parts.push(symbolsSvg(sw, false, x => R(x), false, 0.35, mm => R(mm/k), 640)); // písmo kót instalací v mm papíru

  // Kóty šířek skříní – KAŽDÁ skříň má vlastní kótu podél šířky. Kreslí se
  // VŽDY do středu místnosti (nikdy ke kraji, kde je kóta zdi), takže se
  // s obvodovými kótami nemůžou překrývat. Kóty sousedních skříněk ve stejné
  // řadě leží na jedné přímce a tvoří přehledný řetězec 600/600/…
  let wbR = wallsBBox();
  if(!wbR){
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(const e of S.project.elements){ x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); }
    if(x0<Infinity) wbR = { x:x0, y:y0, w:x1-x0, h:y1-y0 };
  }
  const rcx = wbR ? wbR.x + wbR.w/2 : 0, rcy = wbR ? wbR.y + wbR.h/2 : 0;
  const OFF_EL = 360;                        // odsazení kóty od skříně [mm]
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    const front = e.front || 'jih';
    const wF = elFrontW(e);
    if(wF < 40) continue;
    const cx = e.x+e.w/2, cy = e.y+e.d/2;
    if(front==='jih' || front==='sever'){
      const below = (cy < rcy) ? 1 : -1;        // do středu místnosti
      const fy = below>0 ? e.y+e.d+OFF_EL : e.y-OFF_EL;
      parts.push(dimPrint(e.x, fy, e.x+e.w, fy, 'x', k, 1.1, '#0d6b5f'));
    } else {
      const right = (cx < rcx) ? 1 : -1;
      const fx = right>0 ? e.x+e.w+OFF_EL : e.x-OFF_EL;
      parts.push(dimPrint(fx, e.y, fx, e.y+e.d, 'y', k, 1.1, '#0d6b5f'));
    }
  }
  // vnější kóty místnosti – odsazené DÁL od výkresu, skříně mají vlastní prostor
  if(wbR){
    parts.push(dimPrint(wbR.x, wbR.y-950, wbR.x+wbR.w, wbR.y-950, 'x', k, 1.1, '#334155'));
    parts.push(dimPrint(wbR.x-950, wbR.y, wbR.x-950, wbR.y+wbR.h, 'y', k, 1.1, '#334155'));
  }
  // měřítko
  /* měřítko – jasně označené a odsazené pod výkres, ať nejde zaměnit s kótou */
  const bx = b.x + b.w - 1000, by = b.y + b.h + 700;
  parts.push(`<line x1="${bx}" y1="${by}" x2="${bx+1000}" y2="${by}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx}" y1="${by-60}" x2="${bx}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<line x1="${bx+1000}" y1="${by-60}" x2="${bx+1000}" y2="${by+60}" stroke="#111" stroke-width="${sw(PEN.scale)}"/>`);
  parts.push(`<text x="${bx+500}" y="${by-110}" text-anchor="middle" font-size="${fs(2.6)}" fill="#111"
    style="font-family:Helvetica,Arial,sans-serif">MĚŘÍTKO · úsečka = 1 000 mm</text>`);

  parts.push(`</g>`);
  return `<svg viewBox="0 0 ${P.w} ${P.h}" width="${P.w}mm" height="${P.h}mm" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}

/** Kóta v souřadnicích skutečnosti, tloušťky/písmo přepočtené z mm papíru. */
function dimPrint(x1,y1,x2,y2,axis,k,mul=1,color='#0d6b5f'){
  const len = axis==='x' ? Math.abs(x2-x1) : Math.abs(y2-y1);
  if(len < 20) return '';
  const swp = p => R(p/k);
  const textMm = 2.6*mul;
  const gap = textMm/k*2.6;
  let line;
  if(axis==='x'){
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1+gap}" y2="${y1}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2-gap}" y1="${y2}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  } else {
    line = len > gap*2
      ? `<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y1+gap}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/><line x1="${x2}" y1="${y2-gap}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`
      : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${swp(PEN.dim)}"/>`;
  }
  const tick = 30*mul;
  const a1 = axis==='x' ? `M${x1} ${y1-tick} l${tick*1.4} ${tick} l${-tick*1.4} ${tick}`
                        : `M${x1-tick} ${y1} l${tick} ${tick*1.4} l${tick} ${-tick*1.4}`;
  const a2 = axis==='x' ? `M${x2} ${y2-tick} l${-tick*1.4} ${tick} l${tick*1.4} ${tick}`
                        : `M${x2+tick} ${y2} l${-tick} ${-tick*1.4} l${-tick} ${tick*1.4}`;
  const halo = swp(1.0);                         // bílá halo pro čitelnost přes čáry
  const txt = `<text x="${R((x1+x2)/2)}" y="${R((y1+y2)/2)}" text-anchor="middle" dominant-baseline="middle"
    font-size="${R(textMm/k)}" fill="${color}" font-weight="700"
    style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${halo}">${fmt(len)}</text>`;
  return line + `<path d="${a1}" fill="${color}"/><path d="${a2}" fill="${color}"/>` + txt;
}

function setTool(t){
  commitDraft();                       // rozdělaná zeď se uloží, ne zahodí
  S.tool = t;
  $$('.tool-btn').forEach(b => {
    const on = b.dataset.tool === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true':'false');
  });
  $('#hint').textContent = HINTS[t] || '';
  render();
}
const HINTS = {
  select: 'Klepni na prvek, zeď nebo odstupovou čáru a uprav ji vpravo. Táhnout = přesun, bílé body = změna velikosti.',
  rect:   'Táhni a nakresli obdélník – rozměry pak přepíšeš vpravo. Krátké klepnutí vloží obdélník 600 × 510.',
  wall:   'Klikej body zdi. Hotovo stiskni nahoře (nebo Enter) – klik na první bod zeď uzavře. Délky úseků pak přepíšeš vpravo.',
  guide:  'Táhni odstupovou čáru. Přichytává se k ní stejně jako ke zdi.',
  window: 'Klepni na zeď – vloží se okno 600 mm. Šířku a polohu pak upravíš vpravo; oknem jde táhnout podél zdi.',
  sym:    'Dole vyber značku a klepej do půdorysu. Vpravo ji přichytíš k zdi a zadáš přesné mm od rohu i od líce; poznámku (myčka, trouba…) doplníš tamtéž.',
  measure:'Táhni pro změření vzdálenosti – měří se jen vodorovně (X) nebo svisle (Y), nikdy šikmo. Chytá se na rohy/hrany skříní, boků+ a zdí. Nic se neukládá.'

function toast(msg){
  const t = $('#toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}

function buildTools(){
  const tools = [
    ['select','⬚','Výběr a úpravy'],
    ['rect','▭','Obdélník'],
    ['wall','▬','Zeď / příčka'],
    ['guide','⇢','Odstupová čára'],
    ['window','◫','Okno'],
    ['sym','⌁','Značky instalací'],
    ['measure','↔','Změřit']
  ];
  $('#tools').innerHTML = tools.map(([id,ic,label]) =>
    `<button class="tool-btn" data-tool="${id}" title="${label}" aria-pressed="false">
       <span class="tool-ic">${ic}</span><span class="tool-lb">${label}</span>
     </button>`).join('');
  $('#tools').addEventListener('click', ev => {
    const b = ev.target.closest('.tool-btn'); if(!b) return;
    /* Klik na nástroj, kterým právě kreslím, kresbu dokončí a nechá nástroj
       aktivní – další klik začne novou zeď. */
    if(b.dataset.tool === S.tool && S.draft){ commitDraft(); return; }
    setTool(b.dataset.tool);
  });
  // krátké klepnutí nástrojem Obdélník (bez tažení) vloží výchozí obdélník
  let downAt = null;
  $('#svg').addEventListener('pointerdown', ev => { downAt = { x:ev.clientX, y:ev.clientY, t:Date.now() }; });
  $('#svg').addEventListener('pointerup', ev => {
    if(S.tool!=='rect' || !downAt) return;
    const moved = Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y);
    if(moved < 6 && Date.now()-downAt.t < 500){
      const wpt = screenToWorld(ev.clientX, ev.clientY);
      const e = addElementAtPoint(wpt.x, wpt.y);
      select('el', e.id); pushHistory();
      toast(S.layer==='HS' ? 'Horní skříň 600 × 320 (š × hl) u zdi – uprav rozměry vpravo' : 'Obdélník 600 × 510 (š × hl) – uprav rozměry vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
    downAt = null;
  });
}

  $('#btnPdf').onclick = doExportPdf;
  $('#btnPng').onclick = doExportPng;
  $('#btnImport').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = ev => {
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const p = JSON.parse(r.result);
        if(!p.elements || !p.walls) throw new Error('neplatný formát');
        loadProject(p);
        toast('Nárys načten');
      }catch(err){ toast('Soubor se nepodařilo načíst'); }
    };
    r.readAsText(f);
  };
  $('#snapRange').oninput = ev => { S.snapMm = +ev.target.value; $('#snapOut').textContent = S.snapMm + ' mm'; };

  const s = svg();
  s.addEventListener('pointerdown', ptrDown);
  s.addEventListener('pointermove', ptrMove);
  s.addEventListener('pointerup', ptrUp);
  s.addEventListener('pointercancel', ptrUp);
  s.addEventListener('dblclick', onDblClick);
  /* wheel se chytá na celém okně, aby pinch/ctrl+kolečko kdekoli
     zoomoval výkres a ne celou stránku (viz onWheel) */
  window.addEventListener('wheel', onWheel, { passive:false });
  s.addEventListener('contextmenu', ev => ev.preventDefault());

  window.addEventListener('keydown', ev => {
    const inField = /input|textarea|select/i.test(document.activeElement?.tagName || '');
    if(inField) return;
    const meta = ev.metaKey || ev.ctrlKey;
    const k = ev.key.toLowerCase();
    if(meta && k==='z'){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if(meta && k==='s'){ ev.preventDefault(); save(); exportJson(); return; }
    if(meta && k==='p'){ ev.preventDefault(); doExportPdf(); return; }
    if(meta && k==='d'){ ev.preventDefault(); duplicateSelection(); return; }
    /* Zoom výkresu klávesnicí – aby se nezvětšovala celá stránka (a s ní
       panel vpravo a lišty), které pak nejdou oddálit. */
    if(meta && (k==='+' || k==='=')){ ev.preventDefault(); zoomBy(1.25); return; }
    if(meta && k==='-'){ ev.preventDefault(); zoomBy(1/1.25); return; }
    if(ev.key==='Delete' || ev.key==='Backspace'){ ev.preventDefault(); deleteSelection(); return; }
    if(ev.key==='Enter'){ if(S.draft?.kind==='wall'){ ev.preventDefault(); finishWall(false); } return; }
    if(ev.key==='Backspace' && S.draft?.kind==='wall'){ ev.preventDefault(); undoWallPoint(); return; }
    if(ev.key==='Escape'){
      S.draft = null; S.measure = null; select(null,null); setTool('select'); return;
    }
    if(k==='v'){ setTool('select'); }
    if(k==='r'){ setTool('rect'); }
    if(k==='z' && !meta){ setTool('wall'); }
    if(k==='g'){ setTool('guide'); }
    if(k==='m'){ setTool('measure'); }
    if(k==='o'){ rotateSelection(); }
  });

  window.addEventListener('beforeprint', () => { try{ buildPrint(); }catch(e){ console.warn(e); } });
  window.addEventListener('resize', () => render());
}

function loadProject(p, {resetHistory=true}={}){
  S.project = {
    id: p.id || uid('p'),
    info: { ...newProject().info, ...(p.info||{}) },
    walls: (p.walls||[]).map(w => ({ id:w.id||uid('w'), pts:(w.pts||[]).map(q=>({x:+q.x||0,y:+q.y||0})),
                                    t:w.t||WALL_T_DEFAULT, closed:!!w.closed, name:w.name||'Zeď', side:w.side ?? null })),
    elements: (p.elements||[]).map(e => ({ id:e.id||uid('e'), x:+e.x||0, y:+e.y||0,
      w:+e.w||600, d:+e.d||600, name:e.name||'', note:e.note||'', qty:e.qty||1,
      color:e.color||COLORS[0], front:e.front||'jih' })),
    guides: (p.guides||[]).map(g => ({ id:g.id||uid('g'), a:{x:+g.a?.x||0,y:+g.a?.y||0},
      b:{x:+g.b?.x||0,y:+g.b?.y||0}, print:g.print!==false, name:g.name||'Odstup' })),
    windows: (p.windows||[]).map(o => ({ id:o.id||uid('o'), wallId:o.wallId, seg:+o.seg||0,
      off:+o.off||0, w:Math.max(100,+o.w||600) })),
    symbols: (p.symbols||[]).map(o => ({ id:o.id||uid('s'), x:+o.x||0, y:+o.y||0,
      type:symType(o.type).id, note:o.note||'', wallId:o.wallId ?? null,
      seg:+o.seg||0, along:+o.along||0, off:+o.off||0 })),
    created: p.created || new Date().toISOString()
  };
  S.sel = null;
  /* starší uložené nákresy mají souřadnice od bývalého středu pohledu –
     hned je ukotvíme do počátku, ať v nich nejsou obrovská čísla */
  rebaseProject();
  $('#projTitle').textContent = S.project.info.name || 'Nový nárys';
  if(resetHistory){ history = [snapshot()]; historyIndex = 0; }
  fitView();
  save();
}

function init(){
  buildTools();
  $('#symPal')?.addEventListener('click', ev => {
    const b = ev.target.closest('[data-symtype]'); if(!b) return;
    S.symType = b.dataset.symtype;
    render();
  });
  bindUi();
  setTool('select');
  $('#snapRange').value = S.snapMm;

  let restored = null;
  try{ restored = JSON.parse(STORE.getItem(STORE_KEY) || 'null'); }catch(e){}
  if(restored && (restored.walls?.length || restored.elements?.length)){
    /* Projekty z doby, kdy byl výchozí formát A3 na šířku, se jednorázově
       přepnou na A4 na šířku (tisk na běžný A4) – viz MIG_PAPER. */
    if(restored.info?.paper === 'A3L' && !STORE.getItem('MIG_PAPER_A4L')){
      restored.info.paper = 'A4L';
      try{ STORE.setItem(STORE_KEY, JSON.stringify(restored)); }catch(e){}
    }
    loadProject(restored);
    toast('Obnoven poslední nárys');
  } else {
    S.project = newProject();
    $('#projTitle').textContent = 'Nový nárys';
    history = [snapshot()]; historyIndex = 0;
    openProjectModal();
  }
  try{ STORE.setItem('MIG_PAPER_A4L','1'); }catch(e){}
  requestAnimationFrame(()=>{ fitView(); render(); });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
</body>

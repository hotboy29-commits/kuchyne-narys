<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Nárysy – prototyp pro iPad</title>
<style>
/* ═══════════════════════════════════════════════════════════
   Nárysy – prototyp pro iPad
   Bez externích fontů a knihoven: funguje i offline.
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --surface-2:#f4f6f8;
  --ink:#12161c;
  --ink-2:#5c6673;
  --ink-3:#8a93a0;
  --line:#dfe4ea;
  --line-2:#c9d1da;
  --accent:#0f62fe;
  --accent-ink:#ffffff;
  --accent-soft:#e5eeff;
  --guide:#c2410c;
  --dim:#0d6b5f;
  --wall:#2b3138;
  --danger:#c62828;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 10px 30px rgba(16,24,40,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
  overscroll-behavior:none;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}

/* Mřížka: inspektor je sloupec VPRAVO. (Dřív tu byl flex-direction:column,
   takže se inspektor vykresloval jako pruh ve spodní části obrazovky.) */
.app{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) var(--insp,320px);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:
    "top    top"
    "stage  insp"
    "status status";
}
.topbar{grid-area:top}
.stage{grid-area:stage}
.inspector{grid-area:insp}
.statusbar{grid-area:status}
.hidden{display:none !important}
.spacer{flex:1}

/* ───────── horní lišta ───────── */
.topbar{
  min-height:54px;display:flex;flex-wrap:wrap;align-items:center;
  column-gap:10px;row-gap:6px;
  padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--line);
  min-width:0;
}

.chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:5px 12px;border:1.5px solid var(--accent);border-radius:var(--radius-s);
  background:#fff;cursor:pointer;min-width:120px;max-width:220px;flex:0 0 auto;
  box-shadow:0 1px 3px rgba(15,23,42,.12);font-family:var(--font);
}
.chip:active{background:var(--accent-soft)}
.chip-k{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--accent)}
.chip-v{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:196px}

/* nástroje */
.tools{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tool-btn{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:62px;padding:5px 8px;border:0;border-radius:9px;background:transparent;
  cursor:pointer;font-family:var(--font);color:var(--ink-2);touch-action:pan-y;
}
.tool-btn:active{background:rgba(15,98,254,.12)}
.tool-btn.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tool-ic{font-size:16px;line-height:1.1}
.tool-lb{font-size:10.5px;font-weight:600;white-space:nowrap}

/* tlačítka */
.group{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:0 0 auto}
.tb{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;min-width:40px;padding:0 11px;border:0;border-radius:9px;
  background:transparent;color:var(--ink);cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:600;touch-action:pan-y;
}
.tb:active{background:rgba(15,98,254,.12)}
.tb.wide{min-width:66px}
.tb.primary{background:var(--accent);color:var(--accent-ink)}
.tb.primary:active{background:#0b50d0}
.tb.danger{color:var(--danger);border:1px solid #f2c9c9}
.tb.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb[aria-pressed="false"]{opacity:.55}
.tb.full{grid-column:1 / -1}
.tb span{white-space:nowrap}
.insp-toggle{display:none}
.tb[disabled]{opacity:.4}

/* ───────── plátno ───────── */
.stage{flex:1;position:relative;min-height:0;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
/* plovoucí ovládání pohledu v pravém dolním rohu plátna */
.viewctl{
  position:absolute;right:14px;bottom:14px;z-index:25;
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  padding:6px;box-shadow:var(--shadow);
}
.vb{
  width:46px;height:44px;border:0;border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.vb:active{background:var(--accent-soft);color:var(--accent)}
.vb.wide{font-size:12.5px;height:34px}

/* lišta pro dokončení rozkreslené zdi */
.drawbar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);z-index:30;max-width:94vw;
}
.drawbar .db-info{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 6px 0 4px;white-space:nowrap}
.drawbar .db-info b{color:var(--ink)}
.drawbar .tb{height:42px;font-size:13.5px;padding:0 14px;border:1px solid var(--line);background:var(--surface)}
.drawbar .tb.done{background:#12805c;border-color:#12805c;color:#fff;min-width:104px}
.drawbar .tb.close2{background:var(--accent-soft);color:var(--accent);border-color:#c3d9ff}
.drawbar .tb.cancel{color:var(--ink-3)}

.hintbar{
  position:absolute;left:0;right:0;bottom:0;padding:8px 14px;
  background:linear-gradient(to top,rgba(236,239,243,.96),rgba(236,239,243,0));
  color:var(--ink-2);font-size:12.5px;line-height:1.4;pointer-events:none;
}

/* ───────── inspektor ───────── */
.inspector{
  background:var(--surface);border-left:1px solid var(--line);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 30px;
  min-width:0;
}
.insp-empty{color:var(--ink-3);font-size:13.5px;line-height:1.6}
.insp-empty h3{font-size:15px;color:var(--ink);margin:0 0 6px}
.insp-empty h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:16px 0 6px}
.insp-empty ol{margin:0;padding-left:18px}
.insp-empty li{margin-bottom:5px}
.insp-empty b{color:var(--ink-2)}

.insp-title{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.insp-title .tool-dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,.18)}
.insp-title strong{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.tool-dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.18);display:inline-block}

.insp-sec{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.insp-sec:last-child{border-bottom:0}
.insp-sec>h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 9px}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin:8px 0 0}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.fld:last-child{margin-bottom:0}
.fld>span{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:var(--radius-s);
  background:var(--surface);font-family:var(--font);font-size:14px;color:var(--ink);
}
.fld textarea{resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-row{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.seg-row>span{font-size:12.5px}
.seg-len{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3)}
.seg-len input{width:88px;padding:6px 8px;text-align:right}

/* hlavička inspektoru s editovatelným názvem rovnou v titulku */
.insp-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.insp-name{
  font-size:16px;font-weight:700;color:var(--ink);border:1px solid transparent;
  border-radius:8px;padding:5px 7px;background:transparent;width:100%;font-family:var(--font);
}
.insp-name:hover{border-color:var(--line)}
.insp-name:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface);border-color:var(--accent)}
.insp-kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding-left:7px;border-left:3px solid var(--k,var(--line-2))}

.big-stat{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:11px 13px;margin-bottom:16px;
}
.big-stat span{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.big-stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big-stat i{font-size:12px;font-style:normal;color:var(--ink-3);margin-left:4px;font-weight:600}

/* seznam úseků */
.seg-list{display:flex;flex-direction:column;gap:6px}
.seg-item{display:flex;align-items:center;gap:8px;margin:0}
.seg-n{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-2);
}
.seg-item input{
  flex:1;min-width:0;text-align:right;padding:8px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--font);
}
.seg-item input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg-u{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}

.inline-row{display:flex;gap:8px;align-items:stretch}
.inline-row .tb{border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.inline-fld{display:flex;align-items:center;gap:6px;margin:0}
.inline-fld input{width:88px;text-align:right;padding:8px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--font)}
.inline-fld span{font-size:11.5px;color:var(--ink-3)}
.mini-select{margin-top:8px;width:100%;padding:7px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:12.5px;color:var(--ink-2);background:var(--surface);font-family:var(--font)}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw-btn{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw-btn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

.insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp-actions .tb{border:1px solid var(--line);background:var(--surface);width:100%}
.insp-actions .tb.danger{color:var(--danger);border-color:#f2c9c9}
.insp-actions .tb.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--accent)}

/* ───────── stavová lišta ───────── */
.statusbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}
.snapctl{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3)}
.snapctl input[type=range]{width:150px;accent-color:var(--accent)}
.snapctl b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px}

/* ───────── modaly ───────── */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(16,24,40,.42);padding:20px}
.sheet{
  width:min(720px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;
}
.sheet.narrow{width:min(430px,100%)}
.sheet header h2{margin:0 0 4px;font-size:19px}
.sheet header p{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .grid .span2{grid-column:1 / -1}
.sheet footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.sheet footer .tb{border:1px solid var(--line);background:var(--surface)}
.sheet footer .tb.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ───────── kalkulace materiálu ───────── */
.sheet.wide{width:min(1000px,100%)}
.p-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.p-sum>div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.p-sum span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.p-sum b{font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.p-sum small{font-size:11px;color:var(--ink-3)}
@media (max-width:760px){.p-sum{grid-template-columns:1fr 1fr}}
.p-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.p-tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  text-align:left;border-bottom:1px solid var(--line);padding:6px;font-weight:700}
.p-tbl td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.p-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-in{width:100%;border:1px solid var(--line-2);border-radius:7px;padding:6px 7px;font:inherit;background:#fff;color:var(--ink)}
.p-in.num{width:78px;text-align:right}
.p-name{font-weight:600}
.p-sub{margin-top:4px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.p-sub .p-in.num{width:66px;padding:3px 5px;font-size:11.5px}
.p-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);margin:20px 0 6px}
.p-note{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:12px}
details.p-det{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.p-det summary{cursor:pointer;font-weight:700;font-size:13px}
.p-tbl.small{font-size:11.5px}
.p-tbl.small td{padding:4px 6px}
.p-scroll{max-height:260px;overflow:auto;margin-top:8px}

/* ───────── toast ───────── */
.toast{
  position:fixed;left:50%;bottom:70px;transform:translate(-50%,14px);
  background:#12161c;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:80;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ───────── užší okna a iPad ───────── */
@media (max-width:1180px){
  .app{--insp:280px}
  .chip{max-width:170px}
  .tb .lb{display:none}          /* u tlačítek zůstanou jen ikony */
  .tb{min-width:40px;padding:0 9px}
}
@media (max-width:1000px){
  .tool-lb{display:none}
  .tool-btn{min-width:46px}
  .chip{max-width:130px}
  .chip-k{display:none}
}
@media (max-width:760px){
  .app{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"top" "stage" "status";
  }
  .inspector{
    position:fixed;top:62px;bottom:42px;right:0;width:min(320px,88vw);
    box-shadow:var(--shadow);z-index:20;transform:translateX(102%);
    transition:transform .18s ease;
  }
  .inspector.open{transform:translateX(0)}
  .insp-toggle{display:inline-flex !important}
}

/* ═══════════════════════ TISK / PDF ═══════════════════════ */

#printRoot{display:none}

.pr-page{
  background:#fff;color:#111;page-break-after:always;overflow:hidden;
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
  font-family:Helvetica,Arial,sans-serif;
}
.pr-page:last-child{page-break-after:auto}
.pr-page.cover{page:coverPage}

.pr-cover-head{border-bottom:2.2pt solid #111;padding-bottom:7mm;margin-bottom:9mm}
.pr-kicker{font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:#666;margin-bottom:3mm}
.pr-title{font-size:26pt;line-height:1.15;margin:0;letter-spacing:-.01em}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm 12mm}
.pr-block h3{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:0 0 2mm}
.pr-block p{margin:0;font-size:11pt;line-height:1.5;white-space:pre-wrap;color:#111}
.pr-notes{margin-top:10mm;border-top:.6pt solid #ccc;padding-top:5mm}
.pr-notes h3{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:0 0 3mm}
.pr-notes p{margin:0;font-size:10.5pt;line-height:1.55;white-space:pre-wrap}
.pr-cover-foot{
  position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  border-top:.6pt solid #ccc;padding-top:4mm;font-size:8.5pt;color:#666;
}
.pr-page.cover{position:relative}

.pr-head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1.4pt solid #111;padding-bottom:3mm;margin-bottom:5mm}
.pr-head h2{margin:1mm 0 0;font-size:15pt;letter-spacing:-.01em}
.pr-meta{font-size:8.5pt;color:#555;text-align:right;line-height:1.5}
.pr-drawing{display:flex;justify-content:center;align-items:center}
.pr-drawing svg{max-width:100%;height:auto}
.pr-legend{display:flex;flex-wrap:wrap;gap:4mm 7mm;margin-top:5mm;font-size:8.5pt;color:#333;
  border-top:.6pt solid #ccc;padding-top:3mm}
.lg{display:inline-flex;align-items:center;gap:2mm}
.lg .sw{width:4mm;height:4mm;border-radius:.6mm;display:inline-block;flex:0 0 auto}
.pr-notes-inline{margin-top:3mm;font-size:9pt;color:#444;line-height:1.5}
.pr-foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  border-top:.6pt solid #ccc;padding-top:3mm;font-size:8pt;color:#666}
.pr-page:not(.cover){position:relative}

.pr-table{width:100%;border-collapse:collapse;font-size:9pt}
.pr-table th{text-align:left;font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;
  color:#666;border-bottom:1pt solid #111;padding:2mm 2mm}
.pr-table td{border-bottom:.4pt solid #ddd;padding:2.2mm 2mm;vertical-align:top}
.pr-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-table tfoot td{border-bottom:0;border-top:1pt solid #111;font-weight:700}
.pr-tdot{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.5mm;margin-right:2mm;vertical-align:-0.2mm}

@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  .app,.toast,#fileInput,#modalProject,#modalRoom,#modalPrice{display:none !important}
  #printRoot{display:block}
  .pr-page{margin:0;box-shadow:none}
}

/* označená stěna v seznamu úseků */
.seg-item.active { border-color:#2563eb; background:#eff6ff; }
.seg-item.active .seg-n { background:#2563eb; color:#fff; }
.statusbar #appVer { opacity:.45; font-size:11px; margin-left:10px; white-space:nowrap; }

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Nárysy – prototyp pro iPad
   Půdorys (pohled shora), jednotky v milimetrech.
   Model: ZDI (lomené čáry s tloušťkou) + OBDELNIKY + ODSTUPOVE CARY.
   Žádné externí knihovny: SVG + Pointer Events + nativní tisk do PDF.
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';

/* ─────────────────────────── 1. KONSTANTY ─────────────────────────── */

const STORE_KEY = 'narysy-v2';
const SNAP_MM_DEFAULT = 40;      // výchozí dosah magnetu [mm skutečnosti]
const MIN_SIZE = 1;              // minimální rozměr [mm] – jde až na 1 mm
const APP_VERSION = '2026-08-29o'; // viditelné v liště dole – ať jde poznat, co je nasazeno
const GAP_TOL = 3;               // tolerance „dotyku“ pro celkové kóty [mm]
const HISTORY_MAX = 100;
const WALL_T_DEFAULT = 120;      // výchozí tloušťka zdi [mm]
const GRID_MM = 50;

/* Barvy obdélníků – uživatel volí, žádné přednastavené „typy“. */
const COLORS = ['#4a5568','#3b82f6','#0ea5e9','#14b8a6','#22c55e','#f59e0b',
                '#ef4444','#8b5cf6','#b08968','#64748b'];

const FRONTS = ['jih','západ','sever','východ'];
const FRONT_VEC = { jih:[0,1], západ:[-1,0], sever:[0,-1], východ:[1,0] };

/* Papíry ve SKUTEČNÝCH rozměrech [mm]. ix/iy = plocha pro výkres po odečtení
   okrajů, záhlaví a legendy. */
const PAPER = {
  'A4':  { w:210, h:297 },
  'A4L': { w:297, h:210 },
  'A3':  { w:297, h:420 },
  'A3L': { w:420, h:297 }
};
/* Tloušťky čar na papíře [mm] – technický výkres, ne fixy. */
const PEN = { wall:0.50, el:0.35, guide:0.18, dim:0.18, tick:0.25, scale:0.35 };
const TOP_RESERVE = 20;      // rezerva k délce pracovní desky [mm] NA KAŽDÝ KUS
const TOP_DEPTH_DFLT = 600;  // standardní hloubka pracovní desky [mm] (635 = hlubší varianta)
/* ── čela (dvířka a čela zásuvek) – reálné rozměry ──────────────────────
   Výška dvířek je u spodních i horních skříní 704 mm.
   Šířka dvířek = šířka skříně − 4 mm (2 mm na každé straně):
   skříň 600 → dvířka 596, myčka 600 → 596, myčka 450 → 446.
   Když jsou dvířka dvě, mezi nimi je 2 mm: (600 − 4 − 2) / 2 = 297.
   Čela zásuvek od spodu 350 / 223 / 125 mm s mezerou 3 mm → 704 mm.
   (350 + 3 + 223 + 3 + 125 = 704) */
const FRONT_T_DFLT  = 18;                     // tloušťka dvířek / čela zásuvky [mm]
/* ── blende (výplň do rohu, dilatace mezi skříněmi do L/U) ───────────────
   ČTVEREC 50 × 50 mm. Leží v rohu, kde se potkají dvě kolmé řady, a dotýká
   se líce obou skříní. Dvířka obou skříní jsou od blende 2 mm a od konce
   skříně taky 2 mm. Líc blende je v rovině dveří – přesahuje korpus
   sousední skříně o tloušťku dvířka (18 mm), takže s nimi tvoří jednu
   rovinu. Roh se hledá sám z geometrie půdorysu. */
const BLENDE_W_DFLT = 50;      // blende podél čela [mm]
const BLENDE_D_DFLT = 50;      // blende do hloubky [mm]
const BLENDE_GAP    = 2;       // mezera blende ↔ dvířka [mm]
const BLENDE_TOL    = 90;      // jak blízko u sebe musí řady být, aby tvořily roh [mm]
const DOOR_H_DFLT   = 704;                    // výška dvířek [mm]
const DOOR_EDGE     = 4;                      // úbytek na šířku celkem (2+2) [mm]
const DOOR_GAP_W    = 2;                      // mezera mezi dvířky vedle sebe [mm]
const DRAWER_GAP    = 3;                      // mezera mezi čely nad sebou [mm]
const DRAWER_STACK_DFLT = [350, 223, 125];    // čela zásuvek od spodu [mm]

/* ─────────────────────────── 2. STAV ─────────────────────────── */

const S = {
  project: newProject(),
  sel: null,                 // {kind:'el'|'wall'|'guide', id}
  hover: null,
  tool: 'select',            // select | rect | wall | guide | measure
  view: { zoom: 0.25, tx: 0, ty: 0 },
  snapMm: SNAP_MM_DEFAULT,
  magnet: true,
  showGrid: true,
  showDims: true,
  showFronts: true,     // kreslit čela (dvířka, zásuvky) i v půdorysu
  showDimInst: true,      // kóty instalací (voda/elektro…) – barva = typ značky
  layer: 'all',            // zobrazená vrstva: all | DS | HS
  guides: [],                // dočasná magnetická vodítka během tažení
  draft: null,               // rozkreslená zeď / obdélník / odstup
  measure: null
};

function newProject(){
  return {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    info: {
      name:'', client:'', clientPhone:'', address:'', designer:'', designerContact:'',
      date: new Date().toISOString().slice(0,10), paper:'A4L', notes:''
    },
    windows: [], symbols: [],
    walls: [],
    elements: [],
    guides: [],
    pricing: PRICE_DEFAULTS(),
    created: new Date().toISOString()
  };
}

/* ─────────────────────────── 3. POMOCNÉ FUNKCE ─────────────────────────── */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = n => Math.round(n).toLocaleString('cs-CZ').replace(/\u00A0|\u202F/g,' ');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = n => Math.round(n*100)/100;

function bbox(e){ return { x:e.x, y:e.y, w:e.w, h:e.d }; }
function rectsTouch(a, b, tol=0){
  return a.x < b.x+b.w+tol && a.x+a.w+tol > b.x && a.y < b.y+b.h+tol && a.y+a.h+tol > b.y;
}

/** Úsečky středové osy zdi. */
function wallSegments(w){
  const pts = w.pts, segs = [];
  const n = w.closed ? pts.length : pts.length - 1;
  for(let i=0;i<n;i++){
    const a = pts[i], b = pts[(i+1) % pts.length];
    if(a.x===b.x && a.y===b.y) continue;
    segs.push({ a, b, i });
  }
  return segs;
}
function segNormal(s){
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, L = Math.hypot(dx,dy) || 1;
  return { nx: -dy/L, ny: dx/L };
}
function segLength(s){ return Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y); }
function polygonArea(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return a/2;
}

/* ─────────────── OKNA A ZNAČKY INSTALACÍ ───────────────
   Okno = výřez ve zdi (bílá mezera + tři linky skla), drží se úseku zdi.
   Značka = kroužek s kódem (V/O/Z/VD/P) + volná poznámka („myčka“, „trouba“).
   Obojí jde do výkresu, legendy i tabulek v PDF. */
const SYMBOL_TYPES = [
  { id:'voda',    code:'V',  label:'Voda – přívod',        color:'#2563eb' },
  { id:'odpad',   code:'O',  label:'Odpad',                color:'#475569' },
  { id:'zasuvka', code:'Z',  label:'Zásuvka 230 V',        color:'#ea580c' },
  { id:'vd',      code:'VD', label:'Varná deska – 400 V',  color:'#dc2626' },
  { id:'spot',    code:'P',  label:'Připojení spotřebiče', color:'#16a34a' },
];
const symType = id => SYMBOL_TYPES.find(t=>t.id===id) || SYMBOL_TYPES[2];
const SYM_R = 140;   // poloměr značky [mm světa]

/** Nejbližší úsek zdi k bodu: index, poměr u, vzdálenost, offset od začátku. */
function wallSegAt(wall, p){
  let best = null;
  wallSegments(wall).forEach((sg,i)=>{
    const dx=sg.b.x-sg.a.x, dy=sg.b.y-sg.a.y, L2=dx*dx+dy*dy||1;
    let u=((p.x-sg.a.x)*dx+(p.y-sg.a.y)*dy)/L2; u=Math.max(0,Math.min(1,u));
    const d=Math.hypot(p.x-(sg.a.x+dx*u), p.y-(sg.a.y+dy*u));
    if(!best||d<best.d) best={ i, u, d, off:Math.sqrt(L2)*u, L:Math.sqrt(L2) };
  });
  return best;
}
/** Zeď + úsek pod bodem (uvnitř pásu + malá rezerva), jinak null. */
function wallAt(p){
  let best=null;
  for(const w of S.project.walls){
    const h=wallSegAt(w,p), t=w.t||WALL_T_DEFAULT;
    if(h && h.L > 1 && h.d <= t + 60 && (!best || h.d < best.d)) best={ ...h, wall:w };
  }
  return best;
}
/** Geometrie okna: koncové body líce, směr, normála a ofsazení rubu. */
function windowGeom(win){
  const wall=S.project.walls.find(x=>x.id===win.wallId); if(!wall) return null;
  const sg=wallSegments(wall)[win.seg]; if(!sg) return null;
  const L=segLength(sg)||1, ux=(sg.b.x-sg.a.x)/L, uy=(sg.b.y-sg.a.y)/L;
  const half=Math.min(win.w,L)/2, c=Math.max(half,Math.min(win.off,L-half));
  const n=segNormal(sg), side=wallSide(wall), t=wall.t||WALL_T_DEFAULT;
  return { a:{x:sg.a.x+ux*(c-half), y:sg.a.y+uy*(c-half)},
           b:{x:sg.a.x+ux*(c+half), y:sg.a.y+uy*(c+half)},
           nx:n.nx, ny:n.ny, o:side*t, L };
}
function windowsSvg(pen, hits, lw=2){
  return S.project.windows.map(win=>{
    const g=windowGeom(win); if(!g) return '';
    const sel=S.sel?.kind==='win'&&S.sel.id===win.id;
    const a2={x:g.a.x+g.nx*g.o, y:g.a.y+g.ny*g.o}, b2={x:g.b.x+g.nx*g.o, y:g.b.y+g.ny*g.o};
    const gl=f=>`<line x1="${R(g.a.x+g.nx*g.o*f)}" y1="${R(g.a.y+g.ny*g.o*f)}" x2="${R(g.b.x+g.nx*g.o*f)}" y2="${R(g.b.y+g.ny*g.o*f)}"/>`;
    return `<g>
      <polygon points="${R(g.a.x)},${R(g.a.y)} ${R(g.b.x)},${R(g.b.y)} ${R(b2.x)},${R(b2.y)} ${R(a2.x)},${R(a2.y)}" fill="#ffffff" stroke="none"/>
      <g stroke="${sel?'#2563eb':'#0f172a'}" stroke-width="${pen(lw)}" fill="none">
        ${gl(0)}${gl(0.5)}${gl(1)}
        <line x1="${R(g.a.x)}" y1="${R(g.a.y)}" x2="${R(a2.x)}" y2="${R(a2.y)}"/>
        <line x1="${R(g.b.x)}" y1="${R(g.b.y)}" x2="${R(b2.x)}" y2="${R(b2.y)}"/>
      </g>
      ${hits?`<line x1="${R((g.a.x+a2.x)/2)}" y1="${R((g.a.y+a2.y)/2)}" x2="${R((g.b.x+b2.x)/2)}" y2="${R((g.b.y+b2.y)/2)}"
        stroke="transparent" stroke-width="${pen(24)+Math.abs(g.o)}" data-winhit="${win.id}" style="cursor:pointer"/>`:''}
    </g>`;
  }).join('');
}
function symbolsSvg(pen, hits, fsz, halo, lw=3.5, dimFs, dimOut){
  /* Kóty instalací mají barvu PODLE TYPU ZNAČKY (V/O/Z/VD/P), aby se daly
     odlišit od tyrkysových kót skříní. VEDOU VEN Z VÝKRESU (přes zeď do okraje
     papíru), aby nebyly přes skříně a jejich kóty. dimFs přepočítá velikost
     písma: na plátně ~px (default), v tisku mm papíru. dimOut = vzdálenost
     popisku od líce zdi (world). */
  const dimF = (typeof dimFs === 'function') ? dimFs : (mm => pen(mm*4.5833));
  const out = (typeof dimOut === 'number' && dimOut > 0) ? dimOut : 520;
  return S.project.symbols.map(sm=>{
    const t=symType(sm.type); const sel=S.sel?.kind==='sym'&&S.sel.id===sm.id;
    const hs=halo?`paint-order:stroke;stroke:#fff;stroke-width:${fsz(36)}px;`:'';
    const a=symbolAnchor(sm);
    let dim='';
    if(a && S.showDimInst !== false){
      const dc = t.color;                         // barva = barva značky
      /* Kóta instalace: MĚŘENÁ ČÁRA vede po zdi od ZAČÁTKU ÚSEKU (roh)
         až k patce značky; z patky pak čára pokračuje ven z výkresu
         k číslům (vzdálenost od rohu a odsazení od líce). */
      const st = a.sg.a, ft = a.foot;
      const lx = ft.x - a.rx*out, ly = ft.y - a.ry*out;
      const ths='paint-order:stroke;stroke:#fff;stroke-width:'+dimF(0.7)+'px;';
      const fs1 = dimF(2.8);
      dim=`<g stroke="${dc}" fill="none">
        <line x1="${R(st.x)}" y1="${R(st.y)}" x2="${R(ft.x)}" y2="${R(ft.y)}" stroke-width="${pen(1.6)}" stroke-dasharray="${pen(2.2)} ${pen(2.2)}"/>
        <line x1="${R(ft.x)}" y1="${R(ft.y)}" x2="${R(lx)}" y2="${R(ly)}" stroke-width="${pen(1.0)}" stroke-dasharray="${pen(4)} ${pen(3)}"/>
        <line x1="${R(sm.x)}" y1="${R(sm.y)}" x2="${R(ft.x)}" y2="${R(ft.y)}" stroke-width="${pen(0.9)}" stroke-dasharray="${pen(3)} ${pen(3)}"/>
        <line x1="${R(st.x - a.rx*90)}" y1="${R(st.y - a.ry*90)}" x2="${R(st.x + a.rx*90)}" y2="${R(st.y + a.ry*90)}" stroke-width="${pen(1.4)}"/>
        <circle cx="${R(ft.x)}" cy="${R(ft.y)}" r="${dimF(1.7)}" fill="${dc}" stroke="#fff" stroke-width="${pen(0.5)}"/>
      </g>
      <text x="${R(lx)}" y="${R(ly)}" text-anchor="middle" dominant-baseline="middle" font-size="${fs1}" font-weight="700" fill="${dc}" style="font-family:Helvetica,Arial,sans-serif;${ths}">od rohu ${fmt(a.along)}</text>`;
    }
    return `<g>${dim}
      <circle cx="${sm.x}" cy="${sm.y}" r="${SYM_R}" fill="#ffffff" stroke="${sel?'#2563eb':t.color}" stroke-width="${pen(lw*(sel?1.8:1))}"/>
      <text x="${sm.x}" y="${sm.y}" text-anchor="middle" dominant-baseline="central" font-size="${fsz(140)}"
        font-weight="700" fill="${t.color}" style="font-family:Helvetica,Arial,sans-serif;${hs}">${t.code}</text>
      ${sm.note?`<text x="${sm.x}" y="${sm.y+SYM_R+fsz(130)}" text-anchor="middle" font-size="${fsz(120)}" fill="#334155"
        style="font-family:Helvetica,Arial,sans-serif;${hs}">${esc(sm.note)}</text>`:''}
      ${hits?`<circle cx="${sm.x}" cy="${sm.y}" r="${SYM_R+40}" fill="transparent" data-symhit="${sm.id}" style="cursor:pointer"/>`:''}
    </g>`;
  }).join('');
}
/** Zarovná střed nejbližší skříně a střed okna na značku – varná deska
    pak sedí přesně ve středu obojího. Vrací, co se povedlo zarovnat. */
function alignElementToWindow(e){
  /* skříň se posune PODÉL ZDI na střed okna; dosednutí (kolmá vzdálenost) zůstává */
  let best=null;
  for(const win of S.project.windows){
    const wall=S.project.walls.find(x=>x.id===win.wallId); if(!wall) continue;
    const sg=wallSegments(wall)[win.seg]; if(!sg) continue;
    const L=segLength(sg)||1, dx=(sg.b.x-sg.a.x)/L, dy=(sg.b.y-sg.a.y)/L;
    const cx=e.x+e.w/2, cy=e.y+e.d/2;
    const u=(cx-sg.a.x)*dx+(cy-sg.a.y)*dy;
    const d=Math.hypot(cx-(sg.a.x+dx*u), cy-(sg.a.y+dy*u));
    if(!best||d<best.d) best={ win, dx, dy, u, d };
  }
  if(!best) return false;
  const delta=best.win.off-best.u;
  e.x=R(e.x+best.dx*delta); e.y=R(e.y+best.dy*delta);
  return true;
}
function alignSymbolToElementAlong(sm){
  /* značka PODÉL ZDI na střed nejbližší skříně; „od líce" se nemění */
  if(sm.wallId==null && !attachSymbolToWall(sm)) return false;
  const a=symbolAnchor(sm); if(!a) return false;
  let be=null;
  for(const e of S.project.elements){
    const d=Math.hypot(e.x+e.w/2-sm.x, e.y+e.d/2-sm.y);
    if(!be||d<be.d) be={e,d};
  }
  if(!be) return false;
  const sg=a.sg, L=a.L, dx=(sg.b.x-sg.a.x)/L, dy=(sg.b.y-sg.a.y)/L;
  const u=((be.e.x+be.e.w/2-sg.a.x)*dx + (be.e.y+be.e.d/2-sg.a.y)*dy);
  sm.along=R(Math.max(0,Math.min(u,L)));
  applySymbolAnchor(sm);
  return true;
}
function addWindowAt(p){
  const h=wallAt(p); if(!h){ toast('Klepni přímo na zeď – okno se vloží do ní'); return; }
  const half=Math.min(600,h.L)/2;
  const win={ id:uid('o'), wallId:h.wall.id, seg:h.i, off:R(Math.max(half,Math.min(h.off,h.L-half))), w:600 };
  S.project.windows.push(win);
  select('win',win.id); pushHistory();
}
function addSymbolAt(p){
  const sm={ id:uid('s'), x:R(p.x), y:R(p.y), type:S.symType||'zasuvka', note:'' };
  S.project.symbols.push(sm);
  select('sym',sm.id); pushHistory();
}
/* Přesná poloha značky: přichycení ke zdi = dva rozměry v mm –
   „od začátku úseku" (podél zdi) a „od líce zdi" (kolmo do místnosti). */
function symbolAnchor(sm){
  if(sm.wallId == null) return null;
  const wall=S.project.walls.find(x=>x.id===sm.wallId); if(!wall) return null;
  const segs=wallSegments(wall); let si=+sm.seg||0; if(!segs[si]) si=0;
  const sg=segs[si], L=segLength(sg)||1, n=segNormal(sg), side=wallSide(wall);
  const rx=-n.nx*side, ry=-n.ny*side;                 // směr dovnitř místnosti
  const along=Math.max(0, Math.min(+sm.along||0, L));
  const foot={ x:sg.a.x+(sg.b.x-sg.a.x)*(along/L), y:sg.a.y+(sg.b.y-sg.a.y)*(along/L) };
  return { wall, si, L, sg, foot, rx, ry, along, off:+sm.off||0 };
}
function applySymbolAnchor(sm){
  const a=symbolAnchor(sm); if(!a) return;
  sm.x=R(a.foot.x+a.rx*a.off); sm.y=R(a.foot.y+a.ry*a.off);
}
function attachSymbolToWall(sm){
  let best=null;
  for(const wl of S.project.walls){
    const h=wallSegAt(wl,sm);
    if(h && h.L>1 && (!best || h.d<best.h.d)) best={ wl, h };
  }
  if(!best) return false;
  const n=segNormal(best.h.seg ?? wallSegments(best.wl)[best.h.i]);
  const sg=wallSegments(best.wl)[best.h.i], side=wallSide(best.wl);
  const rx=-n.nx*side, ry=-n.ny*side;
  const fx=sg.a.x+(sg.b.x-sg.a.x)*best.h.u, fy=sg.a.y+(sg.b.y-sg.a.y)*best.h.u;
  sm.wallId=best.wl.id; sm.seg=best.h.i;
  sm.along=R(best.h.off);
  sm.off=R((sm.x-fx)*rx + (sm.y-fy)*ry);
  applySymbolAnchor(sm);
  return true;
}
/** Nejbližší bod úsečky + vzdálenost. */
function closestOnSeg(px,py,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L2 = dx*dx+dy*dy || 1;
  let t = ((px-a.x)*dx + (py-a.y)*dy)/L2;
  t = clamp(t,0,1);
  const x = a.x + t*dx, y = a.y + t*dy;
  return { x, y, d: Math.hypot(px-x, py-y), t };
}
/** Protíná úsečka obdélník? (pro zákaz protažení prvku zdí) */
function segHitsRect(a, b, r){
  const inside = p => p.x >= r.x && p.x <= r.x+r.w && p.y >= r.y && p.y <= r.y+r.h;
  if(inside(a) || inside(b)) return true;
  const corners = [ {x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h} ];
  for(let i=0;i<4;i++){
    if(segIntersect(a, b, corners[i], corners[(i+1)%4])) return true;
  }
  return false;
}
function segIntersect(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d) < 1e-12) return false;
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x)) / d;
  const u = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x)) / d;
  return t >= -1e-9 && t <= 1+1e-9 && u >= -1e-9 && u <= 1+1e-9;
}
/** Leží prvek v překryvu se zdí (středová osa + půl tloušťky)? */
function elementHitsWall(e, wall){
  /* prvek dosedající přesně na líc se pásu jen dotýká – nesmí být vyhodnocen
     jako překryv, jinak magnet ke zdi nikdy neprojde. Proto obdélník o 1 mm
     ztenčíme: do zdi se počítá jen to, co skutečně proniklo DOVNTŘ pásu. */
  const r = { x:e.x+1, y:e.y+1, w:Math.max(0,e.w-2), h:Math.max(0,e.d-2) };
  if(wallBandOutline(wall).some(([a,b]) => segHitsRect(a, b, r))) return true;
  /* Tenký prvek (bok+ 18 mm) se vejde CELÝ do pásu zdi (120 mm), aniž by se
     dotkl jeho obrysu – bez tohohle testu by „pohřbený" bok+ prošel jako OK
     a skříň by se přichytila vnitřní hranou boku+ na líc zdi. */
  const corners = [{x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h}];
  return wallBandQuads(wall).some(q => corners.some(p => pointStrictlyInQuad(p, q)));
}

/* ─────────────────────────── 4. SOUŘADNICE / POHLED ─────────────────────────── */

const svg = () => $('#svg');

function screenToWorld(cx, cy){
  const r = svg().getBoundingClientRect();
  return { x: (cx - r.left - S.view.tx) / S.view.zoom,
           y: (cy - r.top  - S.view.ty) / S.view.zoom };
}
function worldToScreen(x, y){
  const r = svg().getBoundingClientRect();
  return { x: x*S.view.zoom + S.view.tx + r.left, y: y*S.view.zoom + S.view.ty + r.top };
}
function viewBBox(){
  const r = svg().getBoundingClientRect();
  const x = -S.view.tx / S.view.zoom, y = -S.view.ty / S.view.zoom;
  return { x, y, w: r.width / S.view.zoom, h: r.height / S.view.zoom };
}
function contentBBox(opts){
  const skipGuides = !!(opts && opts.skipGuides);
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, any=false;
  for(const w of S.project.walls){
    const h = (w.t||WALL_T_DEFAULT)/2;
    for(const p of w.pts){ x0=Math.min(x0,p.x-h); y0=Math.min(y0,p.y-h); x1=Math.max(x1,p.x+h); y1=Math.max(y1,p.y+h); any=true; }
  }
  for(const e of S.project.elements){
    if(opts && opts.filter && !opts.filter(e)) continue;
    x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); any=true;
  }
  if(!skipGuides) for(const g of S.project.guides){
    for(const p of [g.a,g.b]){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); any=true; }
  }
  for(const sm of S.project.symbols){
    x0=Math.min(x0,sm.x-SYM_R); y0=Math.min(y0,sm.y-SYM_R); x1=Math.max(x1,sm.x+SYM_R); y1=Math.max(y1,sm.y+SYM_R); any=true;
  }
  return any ? { x:x0, y:y0, w:x1-x0, h:y1-y0 } : null;
}
function fitView(padMm=400){
  const b = contentBBox();
  const r = svg().getBoundingClientRect();
  if(!b || !r.width || !r.height) return;
  const z = Math.min((r.width - 40) / (b.w + padMm*2), (r.height - 40) / (b.h + padMm*2));
  S.view.zoom = clamp(z, 0.01, 8);
  S.view.tx = r.width/2  - (b.x + b.w/2) * S.view.zoom;
  S.view.ty = r.height/2 - (b.y + b.h/2) * S.view.zoom;
  render();
}
function stageCenterPt(){
  const r = svg().getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}
/* Zoom kolem středu plátna o násobek f (pro tlačítka a klávesnici). */
function zoomBy(f){
  const c = stageCenterPt();
  zoomAt(c.x, c.y, S.view.zoom * f);
}
function zoomAt(cx, cy, z){
  const r = svg().getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const wx = (px - S.view.tx)/S.view.zoom, wy = (py - S.view.ty)/S.view.zoom;
  S.view.zoom = clamp(z, 0.01, 8);
  S.view.tx = px - wx*S.view.zoom;
  S.view.ty = py - wy*S.view.zoom;
  render();
}
function viewCenter(){
  const r = svg().getBoundingClientRect();
  return screenToWorld(r.left + r.width/2, r.top + r.height/2);
}

/* ─────────────────────────── 5. RENDER ─────────────────────────── */

let renderQueued = false, renderKind = 'full';
function requestRender(kind){
  if(renderQueued){ if(kind === 'full') renderKind = 'full'; return; }
  renderQueued = true; renderKind = kind;
  requestAnimationFrame(() => {
    const k = renderKind; renderQueued = false; renderKind = 'full';
    if(k === 'canvas') doRenderCanvas(); else doRender();
  });
}
function render(){ syncBlendeAuto(); requestRender('full'); }
/* Stav vypínače automatické blende v liště. */
function syncBlendeAuto(){
  const b = document.querySelector('#btnBlendeAuto');
  if(b) b.setAttribute('aria-pressed', pricing().blendeOn === false ? 'false' : 'true');
}
/* Překreslí jen výkres; panel vpravo zůstane stát, takže psaní a Tab
   v polích nepřijdou o fokus. */
function renderCanvas(){ requestRender('canvas'); }

function doRender(){ doRenderCanvas(); renderInspector(); }

function doRenderCanvas(){
  /* dokud netáhneš, držíme celý nákres ukotvený v počátku (0,0) */
  if(!drag) rebaseProject();
  for(const sm of S.project.symbols) if(sm.wallId != null) applySymbolAnchor(sm);
  const v = S.view;
  $('#zoomLabel').textContent = Math.round(v.zoom*100) + ' %';
  const el = $('#svg');
  el.setAttribute('viewBox', `0 0 ${el.clientWidth||1200} ${el.clientHeight||800}`);
  $('#root').setAttribute('transform', `translate(${v.tx},${v.ty}) scale(${v.zoom})`);
  $('#layerGrid').innerHTML   = S.showGrid ? gridMarkup() : '';
  $('#layerWalls').innerHTML  = wallsMarkup();
  $('#layerElems').innerHTML  = elementsMarkup() + frontsMarkup() + windowsSvg(x=>x/S.view.zoom,true) + symbolsSvg(x=>x/S.view.zoom,true,x=>x,true,undefined,150/S.view.zoom) + bokMarkup() + guidesMarkup();
  $('#layerGuides').innerHTML = snapGuidesMarkup() + draftMarkup();
  /* přepínač Kóty řídí jen celkové kóty; kóty vybrané zdi svítí vždy */
  $('#layerDims').innerHTML   = dimsMarkup();
  $('#layerUI').innerHTML     = uiMarkup();
  updateStatus();
  updateDrawbar();
  updateSymPal();
}

/** Plovoucí paleta typů značek instalací – viditelná jen s nástrojem Značky. */
function updateSymPal(){
  const pal = $('#symPal'); if(!pal) return;
  if(S.tool !== 'sym'){ pal.classList.add('hidden'); return; }
  pal.classList.remove('hidden');
  pal.innerHTML = SYMBOL_TYPES.map(t=>`<button class="tb${(S.symType||'zasuvka')===t.id?' on':''}"
    data-symtype="${t.id}" title="${t.label}"><b style="color:${t.color}">${t.code}</b>&nbsp;${t.label}</button>`).join('');
}

/** Lišta s tlačítky pro dokončení rozkreslené zdi – dvojklik není nutný. */
function updateDrawbar(){
  const bar = $('#drawbar');
  if(!bar) return;
  const d = S.draft;
  if(!d || d.kind !== 'wall' || d.pts.length < 1){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  const n = d.pts.length;
  let len = 0;
  for(let i=1;i<n;i++) len += Math.hypot(d.pts[i].x-d.pts[i-1].x, d.pts[i].y-d.pts[i-1].y);
  bar.classList.remove('hidden');
  const info = n === 0
    ? 'Klikni první bod zdi'
    : `Zeď · <b>${n}</b> ${n===1?'bod':(n<5?'body':'bodů')} · <b>${fmt(len)}</b> mm`;
  bar.innerHTML = `
    <span class="db-info">${info}</span>
    <button class="tb" id="dbUndo" ${n<2?'disabled style="opacity:.4"':''}>↩ Zpět</button>
    ${n>=3 ? '<button class="tb close2" id="dbClose">⌐ Uzavřít</button>' : ''}
    <button class="tb done" id="dbDone" ${n<2?'disabled style="opacity:.4"':''}>✓ Hotovo</button>
    <button class="tb cancel" id="dbCancel">✕</button>`;
  $('#dbUndo').onclick   = undoWallPoint;
  $('#dbDone').onclick   = () => finishWall(false);
  $('#dbCancel').onclick = () => { S.draft = null; render(); toast('Kresba zdi zrušena'); };
  const c = $('#dbClose'); if(c) c.onclick = () => finishWall(true);
}

function gridMarkup(){
  const v = viewBBox();
  const step = GRID_MM;
  const parts = [];
  const x0 = Math.floor(v.x/step)*step, x1 = v.x + v.w;
  const y0 = Math.floor(v.y/step)*step, y1 = v.y + v.h;
  const major = 500;
  for(let x=x0; x<=x1; x+=step){
    const isM = Math.abs(x % major) < 0.5;
    parts.push(`<line x1="${x}" y1="${v.y}" x2="${x}" y2="${y1}" stroke="${isM?'#cbd5e1':'#eef2f6'}" stroke-width="${(isM?1:0.6)/v.zoom}"/>`);
  }
  for(let y=y0; y<=y1; y+=step){
    const isM = Math.abs(y % major) < 0.5;
    parts.push(`<line x1="${v.x}" y1="${y}" x2="${x1}" y2="${y}" stroke="${isM?'#cbd5e1':'#eef2f6'}" stroke-width="${(isM?1:0.6)/v.zoom}"/>`);
  }
  return parts.join('');
}

function wallsMarkup(){
  const z = S.view.zoom;
  return S.project.walls.map(w => {
    if(w.pts.length < 2) return '';
    const t = w.t || WALL_T_DEFAULT;
    const d = w.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + (w.closed?' Z':'');
    const sel = S.sel?.kind==='wall' && S.sel.id===w.id;
    /* označíš-li JEDNU stěnu, zbytek zdi zůstane tmavý – modrá je jen ona */
    let hl = '';
    if(sel && S.sel.seg != null){
      const sgm = wallSegments(w)[S.sel.seg];
      if(sgm) hl = `<path d="M${sgm.a.x} ${sgm.a.y} L${sgm.b.x} ${sgm.b.y}" fill="none"
            stroke="#2563eb" stroke-width="${t + 8/z}" stroke-linecap="square" data-seghl="${S.sel.seg}"/>`;
    }
    /* každá stěna má vlastní klikací pás → označíš ji jednotlivě */
    const side = wallSide(w);
    const hits = wallSegments(w).map((sg,i)=>{
      const nn = segNormal(sg), ox = nn.nx*side*t/2, oy = nn.ny*side*t/2;
      return `<path d="M${sg.a.x+ox} ${sg.a.y+oy} L${sg.b.x+ox} ${sg.b.y+oy}"
        fill="none" stroke="transparent" stroke-width="${Math.max(t, 24/z)}"
        data-wallseg="${w.id}:${i}" style="cursor:pointer"/>`;
    }).join('');
    const col = sel && S.sel.seg == null ? '#2563eb' : '#2b3138';
    return `<g data-wall="${w.id}">
      ${w.closed ? `<path d="${d}" fill="#f8fafc" stroke="none"/>` : ''}
      <path d="${wallBandPath(w)}" fill="${col}" fill-rule="evenodd" stroke="${col}" stroke-width="${1.5/z}" stroke-linejoin="miter"/>
      ${hl}
      <path d="${wallBandPath(w)}" fill="transparent" stroke="transparent" stroke-width="${2/z}" data-wallhit="${w.id}" style="cursor:pointer"/>
      ${hits}
    </g>`;
  }).join('');
}

function elementsMarkup(){
  const z = S.view.zoom;
  return S.project.elements.filter(layerShowsEl).map(e => {
    const sel = S.sel?.kind==='el' && S.sel.id===e.id;
    const fs = clamp(Math.min(e.w, e.d)/5, 90, 320);
    const c = e.color || COLORS[0];
    const fv = FRONT_VEC[e.front||'jih'];
    const m = Math.min(80, e.w*0.14, e.d*0.14);
    let dl = '';
    if(fv[1]===1)  dl = `M${e.x+m} ${e.y+e.d-m} H${e.x+e.w-m}`;
    if(fv[1]===-1) dl = `M${e.x+m} ${e.y+m} H${e.x+e.w-m}`;
    if(fv[0]===1)  dl = `M${e.x+e.w-m} ${e.y+m} V${e.y+e.d-m}`;
    if(fv[0]===-1) dl = `M${e.x+m} ${e.y+m} V${e.y+e.d-m}`;
    const up = elKind3(e)==='upper';
    const dash = up ? ` stroke-dasharray="${R(11/z)} ${R(7/z)}"` : '';
    return `<g data-el="${e.id}">
      <rect x="${e.x}" y="${e.y}" width="${Math.max(e.w,1)}" height="${Math.max(e.d,1)}"
            fill="${c}${up?'0a':'22'}" stroke="${sel?'#2563eb':c}" stroke-width="${(sel?3.5:2)/z}"${dash} style="cursor:move"/>
      <path d="${dl}" stroke="${c}" stroke-width="${2/z}" fill="none" opacity=".8"/>
      <text x="${e.x+e.w/2}" y="${e.y+e.d/2 - fs*0.15}" text-anchor="middle" dominant-baseline="middle"
            font-size="${fs}" font-weight="700" fill="#111827"
            style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.22}px">${esc(e.name||'')}</text>
      <text x="${e.x+e.w/2}" y="${e.y+e.d/2 + fs*0.72}" text-anchor="middle" dominant-baseline="middle"
            font-size="${fs*0.62}" fill="#374151"
            style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.18}px">${fmt(e.w)} × ${fmt(e.d)}</text>
    </g>`;
  }).join('');
}

function guidesMarkup(){
  const z = S.view.zoom;
  return S.project.guides.map(g => {
    const sel = S.sel?.kind==='guide' && S.sel.id===g.id;
    const ex = 1e5;                       // odstupová čára je „nekonečná“
    const dx = g.b.x-g.a.x, dy = g.b.y-g.a.y;
    const L = Math.hypot(dx,dy) || 1;
    const ux = dx/L, uy = dy/L;
    const a = { x:g.a.x-ux*ex, y:g.a.y-uy*ex }, b = { x:g.b.x+ux*ex, y:g.b.y+uy*ex };
    return `<g data-guide="${g.id}">
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${sel?'#2563eb':'#c2410c'}"
            stroke-width="${(sel?2.4:1.6)/z}" stroke-dasharray="${18/z} ${10/z}" opacity=".9"/>
      <line x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" stroke="transparent"
            stroke-width="${24/z}" data-guidehit="${g.id}" style="cursor:pointer"/>
    </g>`;
  }).join('');
}

function snapGuidesMarkup(){
  const z = S.view.zoom;
  return S.guides.map(g => g.axis==='x'
    ? `<line x1="${g.pos}" y1="${g.from}" x2="${g.pos}" y2="${g.to}" stroke="#2563eb" stroke-width="${1.4/z}" stroke-dasharray="${8/z} ${6/z}"/>`
    : `<line x1="${g.from}" y1="${g.pos}" x2="${g.to}" y2="${g.pos}" stroke="#2563eb" stroke-width="${1.4/z}" stroke-dasharray="${8/z} ${6/z}"/>`
  ).join('');
}

function draftMarkup(){
  const z = S.view.zoom, d = S.draft;
  if(!d) return '';
  if(d.kind==='wall'){
    const pts = d.pts;
    if(!pts.length){
      return `<circle cx="${d.cursor.x}" cy="${d.cursor.y}" r="${9/z}" fill="none"
        stroke="#2563eb" stroke-width="${2.5/z}"/>`;
    }
    const last = pts[pts.length-1];
    const segLen = Math.hypot(d.cursor.x-last.x, d.cursor.y-last.y);
    const path = pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + ` L${d.cursor.x} ${d.cursor.y}`;
    return `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="${d.t}" opacity=".55" stroke-linejoin="miter"/>`
      + pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${10/z}" fill="#2563eb"/>`).join('')
      + `<circle cx="${d.cursor.x}" cy="${d.cursor.y}" r="${8/z}" fill="#2563eb" opacity=".5"/>`
      + (segLen > 20
          ? `<text x="${(last.x+d.cursor.x)/2}" y="${(last.y+d.cursor.y)/2 - 90/z}" text-anchor="middle"
               font-size="${clamp(170/z,110,400)}" font-weight="700" fill="#1d4ed8"
               style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${45/z}px">${fmt(segLen)}</text>`
          : '');
  }
  if(d.kind==='rect'){
    const r = normRect(d.a, d.b);
    return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#2563eb22" stroke="#2563eb" stroke-width="${2/z}" stroke-dasharray="${12/z} ${8/z}"/>
      <text x="${r.x+r.w/2}" y="${r.y+r.h/2}" text-anchor="middle" dominant-baseline="middle" font-size="${clamp(Math.min(r.w,r.h)/5,90,320)}" font-weight="700" fill="#1d4ed8" style="font-family:Helvetica,Arial,sans-serif">${fmt(r.w)} × ${fmt(r.h)}</text>`;
  }
  if(d.kind==='guide' || d.kind==='measure'){
    const col = d.kind==='guide' ? '#c2410c' : '#0d6b5f';
    const ends = d.kind==='measure'
      ? `<circle cx="${d.a.x}" cy="${d.a.y}" r="${7/z}" fill="#0d6b5f"/><circle cx="${d.b.x}" cy="${d.b.y}" r="${7/z}" fill="#0d6b5f"/>`
      : '';
    /* Popisek měrky: malý (stálá velikost na obrazovce ~14 px) a umístěný
       VEDLE dráhy, ne na ní – vodorovná měrka → nad linkou, svislá → vpravo
       od linky. Bílá halo obrysová linka jen tenká, ať nepřekrývá kresbu. */
    const mx = (d.a.x+d.b.x)/2, my = (d.a.y+d.b.y)/2;
    const fs = 14/z;
    const horiz = Math.abs(d.b.x-d.a.x) >= Math.abs(d.b.y-d.a.y);
    const tx = horiz ? mx : mx + 9/z;
    const ty = horiz ? my - 9/z : my;
    const anchor = horiz ? 'middle' : 'start';
    const baseline = horiz ? 'auto' : 'middle';
    return `<line x1="${d.a.x}" y1="${d.a.y}" x2="${d.b.x}" y2="${d.b.y}" stroke="${col}" stroke-width="${2/z}" stroke-dasharray="${12/z} ${8/z}"/>
      <text x="${tx}" y="${ty}" text-anchor="${anchor}" dominant-baseline="${baseline}" font-size="${fs}" font-weight="600" fill="${col}" style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.22}px">${fmt(Math.hypot(d.b.x-d.a.x, d.b.y-d.a.y))}</text>${ends}`;
  }
  return '';
}

function dimText(x, y, str, color, px, rot=0){
  const z = S.view.zoom;
  const fs = px / z;
  return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}"
    fill="${color}" font-weight="600" transform="${rot?`rotate(${rot} ${x} ${y})`:''}"
    style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.28}px">${str}</text>`;
}

function dimLine(x1,y1,x2,y2,axis,color='#0d6b5f'){
  /* všechno kreslíme v „obrazových“ tloušťkách dělených zoomem, takže kóta
     je na displeji vždy stejně velká a při oddálení se nepromění v obra */
  const z = S.view.zoom;
  const len = axis==='x' ? Math.abs(x2-x1) : Math.abs(y2-y1);
  if(len < 20) return '';
  const sw = 1.2/z, tick = 5/z;
  const a1 = axis==='x' ? `M${x1} ${y1-tick} l${tick} ${tick} l${-tick} ${tick}`
                        : `M${x1-tick} ${y1} l${tick} ${tick} l${tick} ${-tick}`;
  const a2 = axis==='x' ? `M${x2} ${y2-tick} l${-tick} ${tick} l${tick} ${tick}`
                        : `M${x2+tick} ${y2} l${-tick} ${-tick} l${-tick} ${tick}`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}"/>
    <path d="${a1}" fill="${color}"/><path d="${a2}" fill="${color}"/>`
    + dimText((x1+x2)/2, (y1+y2)/2, fmt(len), color, 12, axis==='y'?-90:0);
}

function centroid(pts){
  let x=0, y=0;
  for(const p of pts){ x+=p.x; y+=p.y; }
  return { x:x/pts.length, y:y/pts.length };
}

/** Kóta podél úsečky – délka zdi přímo ve výkresu. U uzavřeného obvodu
 * sedí UVNITŘ místnosti těsně pod vnitřním lícem, aby se nikde nepletla;
 * text se otočí podél i šikmé úsečky. Vše v konstantní velikosti na displeji. */
function dimAlongSeg(sgm, wall, opts={}){
  const z = S.view.zoom;
  const len = segLength(sgm);
  if(len < 20) return '';
  const n = segNormal(sgm);
  const t = wall.t || WALL_T_DEFAULT;
  let sgn = opts.sgn != null ? opts.sgn : 1;
  if(wall.closed && opts.sgn == null){
    const c = centroid(wall.pts);
    const mx = (sgm.a.x+sgm.b.x)/2, my = (sgm.a.y+sgm.b.y)/2;
    sgn = (n.nx*(c.x-mx) + n.ny*(c.y-my)) > 0 ? 1 : -1;   // směrem dovnitř
  }
  const off = (opts.off != null ? opts.off : 150) * sgn;
  const a = { x:sgm.a.x + n.nx*off, y:sgm.a.y + n.ny*off };
  const b = { x:sgm.b.x + n.nx*off, y:sgm.b.y + n.ny*off };
  const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI;
  const rot = (ang > 90 || ang < -90) ? ang + 180 : ang;
  const sw = (opts.w || 1.1)/z, tick = 5/z, fs = (opts.fs || 12.5)/z;
  const ux = (b.x-a.x)/len, uy = (b.y-a.y)/len;
  const qx = -uy, qy = ux;
  const ar = (pt,dir) => `M${pt.x+qx*tick} ${pt.y+qy*tick}
     l${-qx*tick + ux*tick*dir} ${-qy*tick + uy*tick*dir}
     l${qx*2*tick} ${qy*2*tick} Z`;
  const color = opts.color || '#0f62fe';
  return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${sw}"/>`
    + `<path d="${ar(a,1)}" fill="${color}"/><path d="${ar(b,-1)}" fill="${color}"/>`
    + `<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" text-anchor="middle" dominant-baseline="middle"
        font-size="${fs}" font-weight="700" fill="${color}" transform="rotate(${rot} ${(a.x+b.x)/2} ${(a.y+b.y)/2})"
        style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.3}px">${opts.text || fmt(len)}</text>`;
}

function dimsMarkup(){
  const parts = [];
  /* celkové kóty obvodu a souvislých řad jen se zapnutým tlačítkem Kóty */
  if(S.showDims){
    for(const run of computeRuns())
      if(run.ids.length > 1)   // jednu skříň nekótujeme dvakrát
        parts.push(dimLine(run.x1, run.y+520, run.x2, run.y+520, 'x', '#0d6b5f'));
    const closedWalls = S.project.walls.filter(w => w.closed && w.pts.length > 2);
    if(closedWalls.length){
      /* čára je vnitřní líc → bbox je přímo světlá míra místnosti */
      for(const w of closedWalls){
        const bb = wallBBox(w);
        parts.push(dimLine(bb.x, bb.y+250, bb.x+bb.w, bb.y+250, 'x', '#334155'));
        parts.push(dimLine(bb.x+250, bb.y, bb.x+250, bb.y+bb.h, 'y', '#334155'));
      }
    } else {
      const wb = wallsBBox();
      if(wb){
        parts.push(dimLine(wb.x, wb.y-420, wb.x+wb.w, wb.y-420, 'x', '#334155'));
        parts.push(dimLine(wb.x-420, wb.y, wb.x-420, wb.y+wb.h, 'y', '#334155'));
      }
    }
  }
  /* šířka vybrané skříně: kóta podél šířky, kreslená do středu místnosti
     (aby nekolidovala s obvodovou kótou zdi). Otočená skříň ukáže šířku 600. */
  if(S.sel?.kind === 'el'){
    const e = getEl(S.sel.id);
    if(e){
      let rb = wallsBBox();
      if(!rb){
        let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
        for(const ee of S.project.elements){ x0=Math.min(x0,ee.x); y0=Math.min(y0,ee.y); x1=Math.max(x1,ee.x+ee.w); y1=Math.max(y1,ee.y+ee.d); }
        if(x0<Infinity) rb = { x:x0, y:y0, w:x1-x0, h:y1-y0 };
      }
      const rcx = rb ? rb.x+rb.w/2 : 0, rcy = rb ? rb.y+rb.h/2 : 0;
      const cx = e.x+e.w/2, cy = e.y+e.d/2;
      if(isHorizFront(e.front || 'jih')){
        const fy = (cy < rcy) ? e.y+e.d+160 : e.y-160;
        parts.push(dimLine(e.x, fy, e.x+e.w, fy, 'x', '#0d6b5f'));
      } else {
        const fx = (cx < rcx) ? e.x+e.w+160 : e.x-160;
        parts.push(dimLine(fx, e.y, fx, e.y+e.d, 'y', '#0d6b5f'));
      }
    }
  }
  /* vybraná zeď: délky úseků UVNITŘ obvodu; označená stěna svítí */
  if(S.sel?.kind === 'wall'){
    const w = S.project.walls.find(x => x.id === S.sel.id);
    if(w) wallSegments(w).forEach((sg,i)=>{
      const selSeg = S.sel.seg == null ? null : S.sel.seg;
      parts.push(dimAlongSeg(sg, w, {
        color: selSeg === i ? '#0f62fe' : (selSeg == null ? '#0f62fe' : '#94a3b8'),
        w: selSeg === i ? 2 : 1.1,
        fs: selSeg === i ? 14 : 12,
        text: fmt(Math.round(segClearLength(w,i)))
      }));
    });
  }
  return parts.join('');
}

/** Počátek projektu – levý horní roh vnějšího líce obvodu. Od něj se počítají
    souřadnice v inspektoru, aby to nebyla nesmyslně velká čísla. */
function projectOrigin(){
  const b = wallsBBox();
  if(b) return { x: Math.round(b.x), y: Math.round(b.y) };
  /* ještě žádné zdi – vezmeme za roh první obdélník, ať už od začátku
     nepracujeme s obrovskými souřadnicemi */
  let x0=Infinity, y0=Infinity, any=false;
  for(const e of S.project.elements){
    x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); any=true;
  }
  return any ? { x:Math.round(x0), y:Math.round(y0) } : { x:0, y:0 };
}

/** Směr, kam se přidává tloušťka zdi (1 / -1). U uzavřeného obvodu vždy ven,
 * aby nakreslená čára zůstala přesně naměřeným vnitřním lícem. */
function wallSide(w){
  if(w.side != null) return w.side;
  if(w.closed && w.pts.length > 2){
    const t = w.t || WALL_T_DEFAULT;
    const n0 = segNormal(wallSegments(w)[0]);
    const out1 = w.pts.map(q => ({ x:q.x+n0.nx*t, y:q.y+n0.ny*t }));
    return Math.abs(polygonArea(out1)) > Math.abs(polygonArea(w.pts)) ? 1 : -1;
  }
  /* Otevřený obvod nakreslený kolem místnosti (U, L, C…): tloušťka musí jít
     VEN z půdorysu, jinak pás ukousne z vnitřního prostoru a skříň o stejné
     délce, jako je stěna, se dovnitř nevejde. Poznám směr podle toho, na které
     straně je těžiště bodů – pás patří na stranu od něj. Rovná zeď (1 úsek)
     drží dosavadní výchozí stranu. */
  const segs = wallSegments(w).filter(sg => segLength(sg) > 1);
  if(segs.length >= 2){
    let cx = 0, cy = 0;
    for(const p of w.pts){ cx += p.x; cy += p.y; }
    cx /= w.pts.length; cy /= w.pts.length;
    let score = 0;
    for(const sg of segs){
      const n = segNormal(sg);
      score += (n.nx*((sg.a.x+sg.b.x)/2 - cx) + n.ny*((sg.a.y+sg.b.y)/2 - cy)) * segLength(sg);
    }
    if(Math.abs(score) > 1) return score > 0 ? 1 : -1;
  }
  return -1;
}

/** Obrys pásu zdi jako seznam úseček (pro kolize) – čára + rub + čela. */
function bandOffsets(w){
  const t = w.t || WALL_T_DEFAULT, side = wallSide(w);
  const pts = w.pts, n = pts.length, count = w.closed ? n : n-1;
  const N=[]; for(let i=0;i<count;i++){ const a=pts[i],b=pts[(i+1)%n];
    const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; N.push({x:-dy/L*t*side,y:dx/L*t*side}); }
  const O=[];
  for(let i=0;i<n;i++){
    if(!w.closed && i===0){ O.push(N[0]); continue; }
    if(!w.closed && i===n-1){ O.push(N[count-1]); continue; }
    const n0=N[((i-1)+count)%count], n1=N[i%count];
    let mx=n0.x+n1.x,my=n0.y+n1.y; const ml=Math.hypot(mx,my);
    if(ml<1e-9){ O.push(n0); continue; }
    mx/=ml;my/=ml;
    const cos=(n0.x*mx+n0.y*my)/t;
    const k=cos>0.25?t/cos:t/0.25;
    O.push({x:mx*k,y:my*k});
  }
  return O;
}

function wallBandOutline(w){
  const pts = w.pts, n = pts.length, count = w.closed ? n : n-1;
  const off = bandOffsets(w);
  const edges = [];
  for(let i=0;i<count;i++){
    const a=pts[i], b=pts[(i+1)%n];
    edges.push([a,b]);
    edges.push([{x:a.x+off[i].x,y:a.y+off[i].y},{x:b.x+off[(i+1)%n].x,y:b.y+off[(i+1)%n].y}]);
  }
  if(!w.closed){
    edges.push([pts[0],{x:pts[0].x+off[0].x,y:pts[0].y+off[0].y}]);
    edges.push([pts[n-1],{x:pts[n-1].x+off[n-1].x,y:pts[n-1].y+off[n-1].y}]);
  }
  return edges;
}

/** Čtyřúhelníky pásu zdi po úsecích – pro test „je obdélník CELÝ uvnitř zdi". */
function wallBandQuads(w){
  const pts = w.pts, n = pts.length, count = w.closed ? n : n-1;
  const off = bandOffsets(w);
  const quads = [];
  for(let i=0;i<count;i++){
    const a=pts[i], b=pts[(i+1)%n];
    const oa={x:a.x+off[i].x,y:a.y+off[i].y}, ob={x:b.x+off[(i+1)%n].x,y:b.y+off[(i+1)%n].y};
    quads.push([a,b,ob,oa]);
  }
  return quads;
}

/** Leží bod OSTŘE uvnitř konvexního čtyřúhelníku (s rezervou 0,05 mm)? */
function pointStrictlyInQuad(p, q){
  let pos = 0, neg = 0;
  for(let i=0;i<4;i++){
    const a=q[i], b=q[(i+1)%4];
    const ex=b.x-a.x, ey=b.y-a.y, L=Math.hypot(ex,ey)||1;
    const dist = (ex*(p.y-a.y) - ey*(p.x-a.x)) / L;
    if(dist > 0.05) pos++;
    else if(dist < -0.05) neg++;
    else return false;
  }
  return pos===4 || neg===4;
}

/** SVG path pásu zdi – vyplní přesně to, co zabírá skutečná zeď. */
function wallBandPath(w){
  const pts=w.pts, n=pts.length;
  if(n<2) return '';
  const off = wallBandOutline(w); // jen pro výpočet offsetů níže
  const t=w.t||WALL_T_DEFAULT, side=wallSide(w), count=w.closed?n:n-1;
  const N=[]; for(let i=0;i<count;i++){ const a=pts[i],b=pts[(i+1)%n];
    const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; N.push({x:-dy/L*t*side,y:dx/L*t*side}); }
  const O=[];
  for(let i=0;i<n;i++){
    if(!w.closed&&i===0){O.push(N[0]);continue;}
    if(!w.closed&&i===n-1){O.push(N[count-1]);continue;}
    const n0=N[((i-1)+count)%count],n1=N[i%count];
    let mx=n0.x+n1.x,my=n0.y+n1.y;const ml=Math.hypot(mx,my);
    if(ml<1e-9){O.push(n0);continue;}
    mx/=ml;my/=ml;const cos=(n0.x*mx+n0.y*my)/t;const k=cos>0.25?t/cos:t/0.25;
    O.push({x:mx*k,y:my*k});
  }
  if(w.closed){
    const ring=a=>a.map((q,i)=>(i?'L':'M')+R(q.x)+' '+R(q.y)).join(' ')+' Z';
    return ring(pts)+ring(pts.map((q,i)=>({x:q.x+O[i].x,y:q.y+O[i].y})));
  }
  let d=pts.map((q,i)=>(i?'L':'M')+R(q.x)+' '+R(q.y)).join(' ');
  for(let i=n-1;i>=0;i--) d+=' L'+R(pts[i].x+O[i].x)+' '+R(pts[i].y+O[i].y);
  return d+' Z';
}

function wallBBox(w){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of w.pts){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}

function wallsBBox(){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,any=false;
  for(const w of S.project.walls) for(const p of w.pts){
    x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); any=true;
  }
  return any ? { x:x0, y:y0, w:x1-x0, h:y1-y0 } : null;
}

/** Souvislé řady prvků ve stejné ose – pro celkové kóty. */
function computeRuns(){
  const els = [...S.project.elements].sort((a,b)=>a.x-b.x);
  const runs = [];
  for(const e of els){
    const cy = e.y + e.d/2;
    let run = runs.find(r => Math.abs(r.y - cy) < GAP_TOL && e.x - r.x2 <= GAP_TOL);
    if(run){ run.x2 = e.x + e.w; }
    else runs.push({ x1:e.x, x2:e.x+e.w, y:e.y+e.d, ids:[e.id] });
  }
  return runs.filter(r => r.x2 - r.x1 > GAP_TOL);
}

function uiMarkup(){
  const z = S.view.zoom, parts = [];
  if(S.sel?.kind==='el'){
    const e = getEl(S.sel.id);
    if(e){
      const hs = 14/z;
      const corners = [['nw',e.x,e.y],['ne',e.x+e.w,e.y],['sw',e.x,e.y+e.d],['se',e.x+e.w,e.y+e.d]];
      for(const [k,x,y] of corners){
        parts.push(`<rect data-handle="${k}" x="${x-hs/2}" y="${y-hs/2}" width="${hs}" height="${hs}"
          fill="#fff" stroke="#2563eb" stroke-width="${2/z}" style="cursor:${k==='nw'||k==='se'?'nwse-resize':'nesw-resize'}"/>`);
      }
    }
  }
  if(S.sel?.kind==='wall'){
    const w = S.project.walls.find(x=>x.id===S.sel.id);
    if(w) for(let i=0;i<w.pts.length;i++){
      parts.push(`<circle data-vtx="${i}" cx="${w.pts[i].x}" cy="${w.pts[i].y}" r="${12/z}"
        fill="#fff" stroke="#2563eb" stroke-width="${2.5/z}" style="cursor:grab"/>`);
    }
  }
  if(S.sel?.kind==='guide'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    if(g) for(const [k,p] of [['a',g.a],['b',g.b]]){
      parts.push(`<circle data-gpt="${k}" cx="${p.x}" cy="${p.y}" r="${12/z}"
        fill="#fff" stroke="#c2410c" stroke-width="${2.5/z}" style="cursor:grab"/>`);
    }
  }
  return parts.join('');
}

/* ─────────────────────────── 6. MAGNET ─────────────────────────── */

const KIND_RANK = { wall:0, guide:1, el:2 };

/** Seznam osouhlasných cílových čar, ke kterým se může prvek přichytit. */
function snapCandidates(excludeId){
  const out = [];
  for(const w of S.project.walls){
    const t = w.t || WALL_T_DEFAULT, side = wallSide(w);
    for(const s of wallSegments(w)){
      const n = segNormal(s);
      for(const offv of [0, t*side]){
        const ax = s.a.x + n.nx*offv, ay = s.a.y + n.ny*offv;
        const bx = s.b.x + n.nx*offv, by = s.b.y + n.ny*offv;
        if(Math.abs(ax-bx) < 1e-6)      out.push({ axis:'x', pos:ax, from:Math.min(ay,by), to:Math.max(ay,by), kind:'wall', id:w.id, n });
        else if(Math.abs(ay-by) < 1e-6) out.push({ axis:'y', pos:ay, from:Math.min(ax,bx), to:Math.max(ax,bx), kind:'wall', id:w.id, n });
      }
    }
    /* Čelní (koncové) hrany otevřené zdi – „hrana zdi", na kterou se má dát
       přichytit venkovní hrana sestavy (bok+). */
    if(!w.closed){
      const off = bandOffsets(w);
      const np = w.pts.length;
      for(const [p, o] of [[w.pts[0], off[0]], [w.pts[np-1], off[np-1]]]){
        const qx = p.x + o.x, qy = p.y + o.y;
        if(Math.abs(p.y-qy) < 1e-6)      out.push({ axis:'y', pos:p.y, from:Math.min(p.x,qx), to:Math.max(p.x,qx), kind:'wall', id:w.id });
        else if(Math.abs(p.x-qx) < 1e-6) out.push({ axis:'x', pos:p.x, from:Math.min(p.y,qy), to:Math.max(p.y,qy), kind:'wall', id:w.id });
      }
    }
  }
  for(const g of S.project.guides){
    if(Math.abs(g.a.x-g.b.x) < 1e-6)      out.push({ axis:'x', pos:g.a.x, from:Math.min(g.a.y,g.b.y), to:Math.max(g.a.y,g.b.y), kind:'guide', id:g.id });
    else if(Math.abs(g.a.y-g.b.y) < 1e-6) out.push({ axis:'y', pos:g.a.y, from:Math.min(g.a.x,g.b.x), to:Math.max(g.a.x,g.b.x), kind:'guide', id:g.id });
  }
  for(const e of S.project.elements){
    if(e.id === excludeId) continue;
    if(!layerShowsEl(e)) continue;
    out.push({ axis:'x', pos:e.x,      from:e.y, to:e.y+e.d, kind:'el', id:e.id });
    out.push({ axis:'x', pos:e.x+e.w,  from:e.y, to:e.y+e.d, kind:'el', id:e.id });
    out.push({ axis:'y', pos:e.y,      from:e.x, to:e.x+e.w, kind:'el', id:e.id });
    out.push({ axis:'y', pos:e.y+e.d,  from:e.x, to:e.x+e.w, kind:'el', id:e.id });
  }
  return out;
}

/** Obdélníky sestavy „prvek + bok+“ (pro kolize se zdí i pro přichytávání).
    Bok+ není prvek sám o sobě – patří ke skříni, takže při pohybu/kolizích
    hlídáme skříň i bok společně, aby se bok+ nemohl zaříznout do zdi. */
function assemblyRects(e){
  const rs = [{ x:e.x, y:e.y, w:e.w, d:e.d }];
  for(const b of bokRects(e)) rs.push({ x:b.x, y:b.y, w:b.w, d:b.d });
  return rs;
}

/**
 * Vrátí {x, y, guides:[…]} – přichycenou polohu prvku.
 * Pravidla: vyhrává NEJBLIŽŠÍ cíl; zeď má přednost při shodě;
 * prvek se nikdy neprotáhne zdí; mřížka jen když nic jiného nepřipadá v úvahu.
 * Přichytávají se VŠECHNY hrany sestavy = hrany skříně i hrany boku+ – díky
 * tomu se bok+ chytne svou venkovní hranou přesně na hranu zdi.
 */
function computeSnap(e, nx, ny, dxMoved, dyMoved){
  if(!S.magnet) return { x:nx, y:ny, guides:[] };
  const th = S.snapMm;
  const cands = snapCandidates(e.id);
  const shown = [];
  let bestX = null, bestY = null;

  /* Hrany sestavy relativně k (e.x, e.y): skříň [0,e.w]/[0,e.d] + bok+. */
  const xo = [0, e.w], yo = [0, e.d];
  for(const b of bokRects(e)){
    xo.push(b.x - e.x, b.x + b.w - e.x);
    yo.push(b.y - e.y, b.y + b.h - e.y);
  }
  const xMin = Math.min(...xo), xMax = Math.max(...xo);
  const yMin = Math.min(...yo), yMax = Math.max(...yo);
  const axLo = nx + xMin, axHi = nx + xMax;
  const ayLo = ny + yMin, ayHi = ny + yMax;
  const cx = nx + (xMin + xMax)/2, cy = ny + (yMin + yMax)/2;

  for(const c of cands){
    if(c.axis === 'x'){
      if(c.to < ayLo - th || c.from > ayHi + th) continue;
      /* Ke ZDI se přikládá vždy NEJZAJÍCÍ hrana sestavy ve směru zdi:
         je-li v tom směru bok+, přiloží se venkovní hrana boku+, ne korpus.
         (K sousedům/vodítkům se pořád mohou přikládat obě hrany.) */
      const offs = (c.kind === 'wall')
        ? [ (c.pos < cx) ? xMin : xMax ]
        : xo;
      for(const off of offs){
        const d = c.pos - (nx + off);
        if(Math.abs(d) > th) continue;
        const cand = { d:Math.abs(d), nx: nx + d, c };
        if(!bestX || cand.d < bestX.d - 1e-9 ||
           (Math.abs(cand.d - bestX.d) < 1e-9 && KIND_RANK[c.kind] < KIND_RANK[bestX.c.kind])) bestX = cand;
      }
    } else {
      if(c.to < axLo - th || c.from > axHi + th) continue;
      const offs = (c.kind === 'wall')
        ? [ (c.pos < cy) ? yMin : yMax ]
        : yo;
      for(const off of offs){
        const d = c.pos - (ny + off);
        if(Math.abs(d) > th) continue;
        const cand = { d:Math.abs(d), ny: ny + d, c };
        if(!bestY || cand.d < bestY.d - 1e-9 ||
           (Math.abs(cand.d - bestY.d) < 1e-9 && KIND_RANK[c.kind] < KIND_RANK[bestY.c.kind])) bestY = cand;
      }
    }
  }

  /* Mřížka je záloha – skočí jen na ose, kde není zeď, odstup ani soused.
     Chytá obě osy zvlášť, aby se prvek choval předvídatelně i při šikmém tažení. */
  if(!bestX){
    const t = Math.round(nx/GRID_MM)*GRID_MM - nx;
    if(Math.abs(t) <= th) bestX = { d:Math.abs(t), nx:nx+t, c:{kind:'grid'} };
  }
  if(!bestY){
    const t = Math.round(ny/GRID_MM)*GRID_MM - ny;
    if(Math.abs(t) <= th) bestY = { d:Math.abs(t), ny:ny+t, c:{kind:'grid'} };
  }

  let x = nx, y = ny;
  if(bestX){
    const test = { ...e, x: bestX.nx, y };
    if(!blockedByWall(test, e)) { x = bestX.nx; pushGuide(shown, bestX, e, 'x'); }
  }
  if(bestY){
    const test = { ...e, x, y: bestY.ny };
    if(!blockedByWall(test, e)) { y = bestY.ny; pushGuide(shown, bestY, e, 'y'); }
  }
  return { x, y, guides: shown };
}

function pushGuide(out, cand, e, axis){
  if(cand.c.kind === 'grid') return;
  if(axis === 'x') out.push({ axis:'x', pos:cand.c.pos, from:Math.min(cand.c.from, e.y)-100, to:Math.max(cand.c.to, e.y+e.d)+100 });
  else             out.push({ axis:'y', pos:cand.c.pos, from:Math.min(cand.c.from, e.x)-100, to:Math.max(cand.c.to, e.x+e.w)+100 });
}

/** Neskončila by SESTAVA (skříň + bok+) v překryvu se zdí? */
function blockedByWall(test, orig){
  for(const w of S.project.walls){
    const hitT = assemblyRects(test).some(r => elementHitsWall(r, w));
    if(!hitT) continue;
    const hitO = assemblyRects(orig).some(r => elementHitsWall(r, w));
    if(!hitO) return true;
  }
  return false;
}

/** Přichytne bod (pro kreslení zdí a odstupů) na mřížku / konce zdí. */
function snapPoint(w, ortho=false){
  let best = { ...w, d:Infinity };
  const th = S.snapMm;
  const g = { x: Math.round(w.x/GRID_MM)*GRID_MM, y: Math.round(w.y/GRID_MM)*GRID_MM };
  if(Math.hypot(g.x-w.x, g.y-w.y) <= th) best = { ...g, d: Math.hypot(g.x-w.x, g.y-w.y) };
  for(const wall of S.project.walls) for(const p of wall.pts){
    const d = Math.hypot(p.x-w.x, p.y-w.y);
    if(d <= th && d < best.d) best = { x:p.x, y:p.y, d };
  }
  for(const el of S.project.elements){
    for(const p of [{x:el.x,y:el.y},{x:el.x+el.w,y:el.y},{x:el.x,y:el.y+el.d},{x:el.x+el.w,y:el.y+el.d}]){
      const d = Math.hypot(p.x-w.x, p.y-w.y);
      if(d <= th && d < best.d) best = { x:p.x, y:p.y, d };
    }
    for(const bk of bokRects(el)) for(const p of [{x:bk.x,y:bk.y},{x:bk.x+bk.w,y:bk.y},{x:bk.x,y:bk.y+bk.h},{x:bk.x+bk.w,y:bk.y+bk.h}]){
      const d = Math.hypot(p.x-w.x, p.y-w.y);
      if(d <= th && d < best.d) best = { x:p.x, y:p.y, d };
    }
  }
  if(ortho && best.d === Infinity){
    best = { x: Math.round(w.x/GRID_MM)*GRID_MM, y: Math.round(w.y/GRID_MM)*GRID_MM, d:0 };
  }
  return best;
}

function normRect(a,b){
  return { x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y) };
}

/** Přichycení bodu měření: chytá se na ROHY a HRANY skříní, boků+ a zdí
    (hrany = kolmá vzdálenost k líci), takže naměříš skutečnou mezeru. */
function measureSnapPoint(w){
  if(!S.magnet) return { x:w.x, y:w.y };
  const th = Math.max(S.snapMm, 45);
  let best = { d:Infinity, x:w.x, y:w.y };
  const chk = (x,y) => {
    const d = Math.hypot(x-w.x, y-w.y);
    if(d <= th && d < best.d) best = { d, x, y };
  };
  /* rohy zdí a prvků (i boků+) */
  for(const wall of S.project.walls) for(const p of wall.pts) chk(p.x, p.y);
  for(const e of S.project.elements){
    if(!layerShowsEl(e)) continue;
    chk(e.x,e.y); chk(e.x+e.w,e.y); chk(e.x,e.y+e.d); chk(e.x+e.w,e.y+e.d);
    for(const b of bokRects(e)){ chk(b.x,b.y); chk(b.x+b.w,b.y); chk(b.x,b.y+b.h); chk(b.x+b.w,b.y+b.h); }
  }
  /* hrany: průmět na líce zdí a na hrany prvků/boků */
  const foot = (sx,sy,ex,ey) => {
    const dx=ex-sx, dy=ey-sy, L2=dx*dx+dy*dy;
    if(L2 < 1) return;
    let u = ((w.x-sx)*dx + (w.y-sy)*dy)/L2;
    u = Math.max(0, Math.min(1, u));
    const fx = sx+dx*u, fy = sy+dy*u;
    const d = Math.hypot(w.x-fx, w.y-fy);
    if(d <= th && d < best.d) best = { d, x:fx, y:fy };
  };
  for(const wall of S.project.walls){
    const t = wall.t || WALL_T_DEFAULT, side = wallSide(wall);
    for(const sg of wallSegments(wall)){
      const n = segNormal(sg);
      for(const offv of [0, t*side]){
        foot(sg.a.x+n.nx*offv, sg.a.y+n.ny*offv, sg.b.x+n.nx*offv, sg.b.y+n.ny*offv);
      }
    }
  }
  for(const e of S.project.elements){
    if(!layerShowsEl(e)) continue;
    foot(e.x,e.y,e.x+e.w,e.y); foot(e.x+e.w,e.y,e.x+e.w,e.y+e.d);
    foot(e.x+e.w,e.y+e.d,e.x,e.y+e.d); foot(e.x,e.y+e.d,e.x,e.y);
    for(const b of bokRects(e)){
      foot(b.x,b.y,b.x+b.w,b.y); foot(b.x+b.w,b.y,b.x+b.w,b.y+b.h);
      foot(b.x+b.w,b.y+b.h,b.x,b.y+b.h); foot(b.x,b.y+b.h,b.x,b.y);
    }
  }
  /* záloha: mřížka */
  if(best.d === Infinity){
    const gx = Math.round(w.x/GRID_MM)*GRID_MM, gy = Math.round(w.y/GRID_MM)*GRID_MM;
    const d = Math.hypot(gx-w.x, gy-w.y);
    if(d <= th) best = { d, x:gx, y:gy };
  }
  return { x:R(best.x), y:R(best.y) };
}

/* ─────────────────────────── 7. INTERAKCE ─────────────────────────── */

let drag = null;

function onDown(ev){
  const t = ev.target;
  const w = screenToWorld(ev.clientX, ev.clientY);

  if(S.tool==='wall'){
    /* Bod se zapíše až při ZVEDNUTÍ prstu. Během stisknutí běží náhled, takže
       úsek vidíš táhnout za prstem dřív, než ho potvrdíš. */
    const sp = snapPoint(w, true);
    if(!S.draft || S.draft.kind !== 'wall'){
      S.draft = { kind:'wall', pts:[], cursor:{x:R(sp.x), y:R(sp.y)}, t:WALL_T_DEFAULT };
    } else {
      S.draft.cursor = { x:R(sp.x), y:R(sp.y) };
    }
    drag = { mode:'wallDraw' };
    render();
    return;
  }
  if(S.tool==='rect'){
    S.draft = { kind:'rect', a:w, b:w };
    drag = { mode:'rect' };
    return;
  }
  if(S.tool==='guide'){
    const s = snapPoint(w, true);
    S.draft = { kind:'guide', a:{x:s.x,y:s.y}, b:{x:s.x,y:s.y} };
    drag = { mode:'guide' };
    return;
  }
  if(S.tool==='measure'){
    const sp = measureSnapPoint(w);
    S.measure = { a:sp, b:sp };
    S.draft = { kind:'measure', a:{x:sp.x,y:sp.y}, b:{x:sp.x,y:sp.y} };
    drag = { mode:'measure' };
    return;
  }

  if(S.tool==='window'){ addWindowAt(w); return; }
  if(S.tool==='sym'){
    const sp = snapPoint(w, false);
    addSymbolAt(sp);
    return;
  }

  // nástroj select
  const handle = t.dataset?.handle;
  if(handle && S.sel?.kind==='el'){
    const e = getEl(S.sel.id);
    hist.preDrag = snapshot();
    drag = { mode:'resize', handle, start:{...e}, a:w };
    return;
  }
  const vtx = t.dataset?.vtx;
  if(vtx !== undefined && S.sel?.kind==='wall'){
    hist.preDrag = snapshot();
    drag = { mode:'vtx', i:+vtx };
    return;
  }
  const gpt = t.dataset?.gpt;
  if(gpt && S.sel?.kind==='guide'){
    hist.preDrag = snapshot();
    drag = { mode:'gpt', k:gpt };
    return;
  }
  const winHit = t.dataset?.winhit;
  if(winHit){
    select('win', winHit);
    hist.preDrag = snapshot();
    drag = { mode:'winMove', id:winHit, moved:false };
    return;
  }
  const symHit = t.dataset?.symhit;
  if(symHit){
    select('sym', symHit);
    hist.preDrag = snapshot();
    drag = { mode:'symMove', id:symHit, moved:false };
    return;
  }
  const elId = t.closest?.('[data-el]')?.dataset.el;
  if(elId){
    const e = getEl(elId);
    select('el', elId);
    hist.preDrag = snapshot();
    drag = { mode:'move', id:elId, start:{x:e.x, y:e.y}, at:w, moved:false };
    return;
  }
  const segHit = t.dataset?.wallseg;
  if(segHit){
    const [wid, si] = segHit.split(':');
    S.sel = { kind:'wall', id:wid, seg:+si };
    render();
    return;
  }
  const wallHit = t.dataset?.wallhit;
  if(wallHit){ select('wall', wallHit); return; }
  const guideHit = t.dataset?.guidehit;
  if(guideHit){ select('guide', guideHit); return; }

  select(null, null);
  drag = { mode:'pan', sx:ev.clientX, sy:ev.clientY, tx:S.view.tx, ty:S.view.ty };
}

function onMove(ev){
  const w = screenToWorld(ev.clientX, ev.clientY);

  if(!drag){ hoverUpdate(w); return; }

  if(drag.mode==='pan'){
    S.view.tx = drag.tx + (ev.clientX - drag.sx);
    S.view.ty = drag.ty + (ev.clientY - drag.sy);
    render();
    return;
  }
  if(drag.mode==='wallDraw'){
    /* Náhledová čára musí Following prst. Dřív se S.draft.cursor nastavil jen
       jednou u prvního bodu, takže guma pořád mířila zpátky na začátek. */
    if(S.draft?.kind === 'wall'){
      const sp = snapPoint(w, true);
      S.draft.cursor = { x:R(sp.x), y:R(sp.y) };
      render();
    }
    return;
  }
  if(drag.mode==='rect' || drag.mode==='measure'){
    if(drag.mode==='measure'){
      /* Měření pouze po ose X nebo Y – rozhodne větší pohyb myši; druhá osa
         se zafixuje na výchozí bod, takže měrka nikdy není šikmá. */
      const a = S.draft.a;
      const horiz = Math.abs(w.x - a.x) >= Math.abs(w.y - a.y);
      const p = horiz ? { x:w.x, y:a.y } : { x:a.x, y:w.y };
      const sp = measureSnapPoint(p);
      S.draft.b = horiz ? { x:sp.x, y:a.y } : { x:a.x, y:sp.y };
    } else {
      S.draft.b = w;
    }
    render(); return;
  }
  if(drag.mode==='guide'){
    const s = snapPoint(w, true);
    S.draft.b = { x:s.x, y:s.y }; render(); return;
  }
  if(drag.mode==='winMove'){
    const win=S.project.windows.find(x=>x.id===drag.id); if(!win) return;
    const wall=S.project.walls.find(x=>x.id===win.wallId); if(!wall) return;
    const sg=wallSegments(wall)[win.seg]; if(!sg) return;
    const dx=sg.b.x-sg.a.x, dy=sg.b.y-sg.a.y, L2=dx*dx+dy*dy||1;
    let u=((w.x-sg.a.x)*dx+(w.y-sg.a.y)*dy)/L2; u=Math.max(0,Math.min(1,u));
    const L=Math.sqrt(L2), half=Math.min(win.w,L)/2;
    win.off=R(Math.max(half,Math.min(u*L,L-half)));
    drag.moved=true; render(); return;
  }
  if(drag.mode==='symMove'){
    const sm=S.project.symbols.find(x=>x.id===drag.id); if(!sm) return;
    if(sm.wallId != null){
      const wall=S.project.walls.find(x=>x.id===sm.wallId);
      const sg=wall ? wallSegments(wall)[sm.seg] : null;
      if(sg){

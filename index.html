        const dx=sg.b.x-sg.a.x, dy=sg.b.y-sg.a.y, L2=dx*dx+dy*dy||1, L=Math.sqrt(L2);
        let u=((w.x-sg.a.x)*dx+(w.y-sg.a.y)*dy)/L2; u=Math.max(0,Math.min(1,u));
        const n=segNormal(sg), side=wallSide(wall);
        const fx=sg.a.x+dx*u, fy=sg.a.y+dy*u;
        sm.along=R(u*L);
        sm.off=R((w.x-fx)*(-n.nx*side) + (w.y-fy)*(-n.ny*side));
        applySymbolAnchor(sm);
        drag.moved=true; render(); return;
      }
    }
    const sp=snapPoint(w, ev.shiftKey);
    sm.x=R(sp.x); sm.y=R(sp.y);
    drag.moved=true; render(); return;
  }
  if(drag.mode==='move'){
    const e = getEl(drag.id);
    const nx = drag.start.x + (w.x - drag.at.x);
    const ny = drag.start.y + (w.y - drag.at.y);
    const r = computeSnap(e, nx, ny, nx - drag.start.x, ny - drag.start.y);

    /* Zeď je neprůchozí. Testuje se celá DRÁHA, ne jen cílový bod – jinak by
       prvek zeď „přeskočil“ při rychlém švihu. Když cíl není dosažitelný,
       prvek po zdi klouže (nejdřív zkusí osu X, pak Y). Hlídá se celá sestava
       skříň + bok+, aby se bok+ nezařízl do zdi. */
    const hitsAt = (x, y) => {
      const mov = { ...e, x, y };
      return assemblyRects(mov).some(r => S.project.walls.some(wl => elementHitsWall(r, wl)));
    };
    const last = drag.lastOk || { x:drag.start.x, y:drag.start.y };
    const STEPS = 12;
    const pathClear = to => {
      for(let i=1;i<=STEPS;i++){
        const t = i/STEPS;
        if(hitsAt(last.x + (to.x-last.x)*t, last.y + (to.y-last.y)*t)) return false;
      }
      return true;
    };
    let fx, fy;
    if(hitsAt(last.x, last.y))                  { fx = r.x;    fy = r.y; }     // už je v překryvu → volný pohyb
    else if(pathClear({ x:r.x,    y:r.y }))     { fx = r.x;    fy = r.y; }
    else if(pathClear({ x:r.x,    y:last.y }))  { fx = r.x;    fy = last.y; }
    else if(pathClear({ x:last.x, y:r.y }))     { fx = last.x; fy = r.y; }
    else                                        { fx = last.x; fy = last.y; }
    e.x = R(fx); e.y = R(fy);
    drag.lastOk = { x:e.x, y:e.y };
    S.guides = r.guides;
    drag.moved = true;
    render();
    return;
  }
  if(drag.mode==='resize'){
    const e = getEl(S.sel.id), s = drag.start;
    let x2 = s.x + s.w, y2 = s.y + s.d, x1 = s.x, y1 = s.y;
    if(drag.handle.includes('e')) x2 = Math.max(s.x + MIN_SIZE, w.x);
    if(drag.handle.includes('s')) y2 = Math.max(s.y + MIN_SIZE, w.y);
    if(drag.handle.includes('w')) x1 = Math.min(s.x + s.w - MIN_SIZE, w.x);
    if(drag.handle.includes('n')) y1 = Math.min(s.y + s.d - MIN_SIZE, w.y);
    e.x = R(x1); e.y = R(y1); e.w = R(x2-x1); e.d = R(y2-y1);
    render();
    return;
  }
  if(drag.mode==='vtx'){
    const wall = S.project.walls.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    wall.pts[drag.i] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
  if(drag.mode==='gpt'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    g[drag.k] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
}

function onUp(ev){
  const w = screenToWorld(ev.clientX, ev.clientY);
  if(drag?.mode==='rect'){
    const r = normRect(S.draft.a, S.draft.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = finishNewElementKind(addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:DFLT_EL_D }));
      select('el', e.id);
      pushHistory();
      toast('Zadej přesné rozměry v panelu vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
  }
  if(drag?.mode==='guide'){
    const L = Math.hypot(S.draft.b.x-S.draft.a.x, S.draft.b.y-S.draft.a.y);
    if(L >= 50){
      const g = { id:uid('g'), a:{...S.draft.a}, b:{...S.draft.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id);
      pushHistory();
    }
    S.draft = null;
  }
  if(drag?.mode==='measure'){ S.draft = null; }
  if(drag?.mode==='wallDraw'){ commitWallPoint(); }
  if(drag?.mode==='move'){
    S.guides = [];
    if(drag.moved) commitPreDrag();
    else hist.preDrag = null;
  }
  if(drag && ['resize','vtx','gpt','winMove','symMove'].includes(drag.mode)) commitPreDrag();
  drag = null;
  render();
}

function hoverUpdate(w){
  const el = document.elementFromPoint?.(worldToScreen(w.x,w.y).x, worldToScreen(w.x,w.y).y);
  const id = el?.closest?.('[data-el]')?.dataset.el || null;
  if(id !== S.hover){ S.hover = id; }
}

function onDblClick(ev){
  if(S.tool==='wall'){ finishWall(false); return; }
  const t = ev.target;
  const elId = t.closest?.('[data-el]')?.dataset.el;
  if(elId){ select('el', elId); setTimeout(()=>$('#iName')?.focus(), 50); return; }
  if(t.dataset?.wallseg){
    const [wid, si] = t.dataset.wallseg.split(':');
    S.sel = { kind:'wall', id:wid, seg:+si };
    render();
    return;
  }
  if(t.dataset?.wallhit){ select('wall', t.dataset.wallhit); return; }
}

function onWheel(ev){
  /* Kolečko NAD PLÁTNEM vždy = zoom výkresu.
     Gesto „ctrl/cmd + kolečko“ (pinch na trackpadu) KDEKOLI v aplikaci taky =
     zoom výkresu a zablokuje se tím zoom celé stránky prohlížeče. Jinak by se
     uživateli zvětšil i panel vpravo a horní lišta a nešly by zase oddálit.
     Obyčejné kolečko mimo plátno (nad panelem vpravo) normálně roluje. */
  const t = (ev.target instanceof Element) ? ev.target : null;
  const overCanvas = !!(t && t.closest('#svg'));
  if(!overCanvas && !(ev.ctrlKey || ev.metaKey)) return;   // nech prohlížeč / panel
  ev.preventDefault();
  let cx = ev.clientX, cy = ev.clientY;
  if(!overCanvas){ const c = stageCenterPt(); cx = c.x; cy = c.y; }
  const z = S.view.zoom * (ev.deltaY < 0 ? 1.12 : 1/1.12);
  zoomAt(cx, cy, z);
}

/* ── vícedotyková gesta: dva prsty = přiblížení / oddálení a posun ── */
const pointers = new Map();          // pointerId → {x,y}
let pinch = null;

function ptrDown(ev){
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size === 2){
    drag = null;                     // tažení přerušíme, přebírá gesto
    const [a,b] = [...pointers.values()];
    pinch = {
      d0: Math.hypot(a.x-b.x, a.y-b.y) || 1,
      z0: S.view.zoom,
      cx: (a.x+b.x)/2, cy: (a.y+b.y)/2,
      tx0: S.view.tx, ty0: S.view.ty
    };
    return;
  }
  if(pointers.size === 1){
    svg().setPointerCapture?.(ev.pointerId);
    onDown(ev);
  }
}

function ptrMove(ev){
  if(!pointers.has(ev.pointerId)){ onMove(ev); return; }   // jen najetí myší
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size >= 2 && pinch){ pinchMove(); return; }
  onMove(ev);
}

function pinchMove(){
  const [a,b] = [...pointers.values()];
  const d  = Math.hypot(a.x-b.x, a.y-b.y) || 1;
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const r  = svg().getBoundingClientRect();
  const z  = clamp(pinch.z0 * (d / pinch.d0), 0.01, 8);
  /* světový bod, který byl na začátku gesta pod středem prstů,
     pod ním zůstane i teď – takže se zároveň přibližuje i posouvá */
  const wx = (pinch.cx - r.left - pinch.tx0) / pinch.z0;
  const wy = (pinch.cy - r.top  - pinch.ty0) / pinch.z0;
  S.view.zoom = z;
  S.view.tx = (cx - r.left) - wx*z;
  S.view.ty = (cy - r.top)  - wy*z;
  render();
}

function ptrUp(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size === 0) onUp(ev);
}

/* ─────────────────────────── 8. ZDI ─────────────────────────── */

/** Zapíše bod, na kterém se zvedl prst. */
function commitWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  const c = S.draft.cursor, pts = S.draft.pts;
  if(pts.length === 0){ pts.push({ x:c.x, y:c.y }); render(); return; }

  const last = pts[pts.length-1];
  /* Stejné místo jako poslední bod → ignorovat. Dřív se to bralo jako
     „dvojklik = hotovo“, jenže přichytávání na mřížku stáhne na stejné místo
     i dva různé kliky a zeď pak končila, kdy nechtěla. */
  if(Math.hypot(last.x-c.x, last.y-c.y) < 1) return;

  /* Klik na první bod zeď uzavře (obvod místnosti). */
  const first = pts[0];
  if(pts.length >= 3 && Math.hypot(first.x-c.x, first.y-c.y) <= Math.max(S.snapMm, 50)){
    finishWall(true);
    return;
  }
  pts.push({ x:c.x, y:c.y });
  render();
}

/** Poslední bod rozkreslené zdi zpátky. */
function undoWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  S.draft.pts.pop();
  if(S.draft.pts.length === 0) S.draft = null;
  render();
}

/**
 * Rozkreslenou kresbu VŽDY dokončí a uloží – nikdy ji nezahodí.
 * Volá se při přepnutí nástroje, takže zeď nemůže zmizet.
 */
function commitDraft(){
  const d = S.draft;
  if(!d) return false;
  if(d.kind === 'wall'){
    if(d.pts.length >= 2){ finishWall(!!d.closed); return true; }
    S.draft = null; render(); return false;
  }
  if(d.kind === 'rect'){
    const r = normRect(d.a, d.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:DFLT_EL_D });
      select('el', e.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  if(d.kind === 'guide'){
    const L = Math.hypot(d.b.x-d.a.x, d.b.y-d.a.y);
    S.draft = null;
    if(L >= 50){
      const g = { id:uid('g'), a:{...d.a}, b:{...d.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  S.draft = null; render();          // measure – není co ukládat
  return false;
}

function finishWall(closed){
  if(!S.draft || S.draft.kind!=='wall') return;
  const pts = S.draft.pts;
  if(pts.length >= 2){
    const wall = { id:uid('w'), pts, t:S.draft.t||WALL_T_DEFAULT, closed:!!closed, name:closed?'Místnost':'Zeď' };
    S.project.walls.push(wall);
    select('wall', wall.id);
    pushHistory();
    toast(closed ? 'Místnost vytvořena' : 'Zeď vytvořena – uprav délky úseků vpravo');
  }
  S.draft = null;
  render();
}

function createRoom(w, h, t){
  /* První místnost patří do počátku souřadnic – jinak by X/Y byly obrovská
     čísla podle toho, kam zrovna mířil pohled. Další místnosti jdou do pohledu. */
  let x, y;
  if(S.project.walls.length === 0){ x = 0; y = 0; }
  else { const c = viewCenter(); x = R(c.x - w/2); y = R(c.y - h/2); }
  const wall = { id:uid('w'), t:t||WALL_T_DEFAULT, closed:true, name:'Místnost',
    pts:[{x, y}, {x:R(x+w), y}, {x:R(x+w), y:R(y+h)}, {x, y:R(y+h)}] };
  S.project.walls.push(wall);
  select('wall', wall.id);
  pushHistory();
  fitView();
}

/** Přepíše délku i-tého úseku; bod B se posune po směru úsečky. */
/** Které konce úseku navazují na další stěnu (roh) – tam se měří od vnitřního líce. */
function segEnds(wall, i){
  const n = wall.pts.length;
  const count = wall.closed ? n : n-1;
  return { connA: wall.closed || i > 0, connB: wall.closed || i < count-1 };
}

/** Délka stěny tak, jak ji naměříš metrem/laserem.
 * – OTEVŘENÁ zeď (příčka, kuchyňská stěna): žádná matematika – zadané i
 *   zobrazené číslo je přesně délka té stěny, konec ke konci.
 * – UZAVŘENÝ obvod: světlá míra místnosti – od délky se odečte celá tloušťka
 *   zdi (půlka na každém rohu), protože laser měří mezi vnitřními líci. */
function segClearLength(wall, i){
  /* nakreslená čára JE naměřená stěna – číslo je vždy přesně její délka */
  return segLength(wallSegments(wall)[i]);
}

function setSegmentLength(wall, i, len){
  /* zadané číslo je přesně délka stěny – čára je naměřená hrana */
  const a = wall.pts[i], b = wall.pts[(i+1) % wall.pts.length];
  const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
  const nx = R(a.x + dx/L*len), ny = R(a.y + dy/L*len);
  if(wall.closed && i === wall.pts.length-1) wall.pts[0] = { x:nx, y:ny };
  else wall.pts[(i+1) % wall.pts.length] = { x:nx, y:ny };
  render();
}

/** Posune jen označenou stěnu (úsek) o dx/dy mm – společné body vtáhne s sebou,
 * sousední stěny se napojí. */
function moveSegment(wall, i, dx, dy){
  const n = wall.pts.length;
  if(i == null || i < 0 || i >= n) return;
  const a = wall.pts[i], b = wall.pts[(i+1) % n];
  a.x = R(a.x + dx); a.y = R(a.y + dy);
  if(b !== a){ b.x = R(b.x + dx); b.y = R(b.y + dy); }
  render();
}

/**
 * Srovná zeď do pravých úhlů.
 *
 * Každý úsek si nechá svou naměřenou délku, změní se jen jeho směr — a to
 * na nejbližší násobek 90°. Orientace celého půdorysu zůstává TAKOVÁ, JAK
 * BYL NAKRESLENÝ: nákres se pootočí jen o průměrnou odchylku (váženou
 * délkou stran), tedy nanejvýš o 45°. Neotáčí se podle nejdelší stěny —
 * místnost nakreslená na výšku zůstane na výšku.
 *
 * U uzavřené místnosti se srovnají i závěrečná strana a obvod se dorovná,
 * aby se opravdu zavřel; když nakreslené délky protilehlých stran nesedí,
 * upraví se o pár mm ta nejdelší (a uživatel to dostane do hlášky).
 *
 * Vrací { gap, adj }:
 *   gap – o kolik mm se obvod před dorovnáním nesešel (0 = seděl)
 *   adj – [{ i, delta }] úpravy délek úseků, aby obvod zavřel
 */
function orthogonalizeWall(wall){
  const n = wall.pts.length;
  if(n < 2) return { gap:0, adj:[] };
  const Q = Math.PI/2;
  const isClosed = !!wall.closed && n > 2;
  const count = isClosed ? n : n - 1;      // uzavřený obvod má i závěrečnou stranu
  const segs = [];
  for(let i=0;i<count;i++){
    const a = wall.pts[i], b = wall.pts[(i+1) % n];
    const dx = b.x-a.x, dy = b.y-a.y;
    segs.push({ i, len:Math.hypot(dx,dy), ang:Math.atan2(dy,dx) });
  }

  /* Průměrná odchylka stran od nejbližšího násobku 90° (vážená délkou) =
     o kolik je půdorys pootočený. Srovnáme ho jen o tuhle malou hodnotu,
     takže zůstane ve stejné orientaci, v jaké ho uživatel nakreslil. */
  const wrapQ = a => { const r = ((a % Q) + Q) % Q; return r > Q/2 ? r - Q : r; };
  let sx = 0, sy = 0;
  for(const sg of segs){
    if(!(sg.len > 1)) continue;
    const a2 = 2*wrapQ(sg.ang);              // dvojnásobek kvůli znaménku ±45°
    sx += Math.cos(a2)*sg.len;
    sy += Math.sin(a2)*sg.len;
  }
  const alpha = (sx || sy) ? Math.atan2(sy, sx)/2 : 0;   // (-45°; 45°]
  /* výsledný směr každé strany = násobek 90° → vše je přesně vodorovné
     nebo svislé a sousední strany jsou vždy rovnoběžné, nebo kolmé */
  for(const sg of segs) sg.dir = Math.round((sg.ang - alpha)/Q)*Q;

  const p0 = { x:wall.pts[0].x, y:wall.pts[0].y };
  const endPt = () => {
    let x = p0.x, y = p0.y;
    for(const sg of segs){ x += Math.cos(sg.dir)*sg.len; y += Math.sin(sg.dir)*sg.len; }
    return { x, y };
  };

  /* Uzavřený obvod: dorovnání délek protilehlých stran tak, aby se obvod
     zavřel. Mění se nejvýš dva nejdelší úseky (jeden v X, jeden v Y)
     a jen o skutečný rozdíl – typicky pár mm. */
  const adj = [];
  let gap = 0;
  if(isClosed){
    const e0 = endPt();
    const dx = e0.x - p0.x, dy = e0.y - p0.y;
    const fixAxis = (axis, err) => {
      if(Math.abs(err) < 0.5) return;         // rozdíl do půl milimetru ignoruj
      const cands = segs
        .filter(sg => Math.abs(axis === 'x' ? Math.cos(sg.dir) : Math.sin(sg.dir)) > 0.5)
        .sort((a,b) => b.len - a.len);
      for(const sg of cands){
        const u = axis === 'x' ? Math.cos(sg.dir) : Math.sin(sg.dir);
        const d = -err / u;                   // přesně ubere/přidá přebytek v ose
        if(sg.len + d >= 1){ sg.len += d; adj.push({ i:sg.i, delta:Math.round(d) }); return; }
      }
    };
    fixAxis('x', dx);
    fixAxis('y', dy);
    const e1 = endPt();
    gap = Math.round(Math.hypot(e1.x - p0.x, e1.y - p0.y));
  }

  /* přenos délek do nových směrů – body se přepíšou z počátku */
  let x = p0.x, y = p0.y;
  for(const sg of segs){
    x += Math.cos(sg.dir)*sg.len;
    y += Math.sin(sg.dir)*sg.len;
    const idx = (sg.i + 1) % n;
    if(idx === 0) continue;                  // závěrečná strana ústí zpět do počátku
    wall.pts[idx] = { x:R(x), y:R(y) };
  }
  render();
  return { gap, adj };
}

/**
 * Posune celý nákres tak, aby jeho levý horní roh seděl v (0,0).
 * Proto v celém projektu — u zdí, prvků, odstupů i v kótách — vidíš
 * malá čísla od rohu obvodu místo obrovských souřadnic „odněkud z pohledu".
 * Pohled posuneme o stejný rozdíl, takže se obrázek na obrazovce nehne.
 */
function rebaseProject(){
  const OR = projectOrigin();
  const ox = OR.x, oy = OR.y;
  if(!ox && !oy) return false;
  const move = o => { o.x = R(o.x - ox); o.y = R(o.y - oy); };
  for(const w of S.project.walls) for(const p of w.pts) move(p);
  for(const e of S.project.elements){ e.x = R(e.x - ox); e.y = R(e.y - oy); }
  for(const g of S.project.guides){ move(g.a); move(g.b); }
  if(S.draft){ for(const p of S.draft.pts) move(p); if(S.draft.cursor) move(S.draft.cursor); }
  S.view.tx += ox*S.view.zoom;
  S.view.ty += oy*S.view.zoom;
  return true;
}

/* ─────────────────────────── 9. ODSTUPOVÉ ČÁRY ─────────────────────────── */

/** Vytvoří odstupovou čáru rovnoběžně se zdí ve vzdálenosti dist. */
function guideFromWall(wall, dist, side){
  const segs = wallSegments(wall).filter(s => segLength(s) > 1);
  if(!segs.length){ toast('Vyber zeď s alespoň jednou úsečkou'); return null; }
  const made = [];
  for(const s of segs){
    const n = segNormal(s);
    const sgn = side === 'auto' ? pickSide(wall, s, n) : (side==='left' ? 1 : -1);
    /* odstup se měří přímo od naměřené čáry (líce) */
    const off = dist;
    const a = { x:R(s.a.x + n.nx*off*sgn), y:R(s.a.y + n.ny*off*sgn) };
    const b = { x:R(s.b.x + n.nx*off*sgn), y:R(s.b.y + n.ny*off*sgn) };
    const g = { id:uid('g'), a, b, print:true, name:`Odstup ${fmt(dist)}` };
    S.project.guides.push(g); made.push(g);
  }
  if(made.length){ select('guide', made[0].id); pushHistory(); }
  toast(made.length ? `Vytvořeno ${made.length} odstupových čar` : 'Nic nevytvořeno');
  render();
  return made[0] || null;
}

/** Vybere stranu, na které je vnitřek místnosti (u uzavřené zdi), jinak libovolnou. */
function pickSide(wall, seg, n){
  if(!wall.closed) return 1;
  const mid = { x:(seg.a.x+seg.b.x)/2 + n.nx*10, y:(seg.a.y+seg.b.y)/2 + n.ny*10 };
  return pointInPoly(mid, wall.pts) ? 1 : -1;
}
function pointInPoly(p, pts){
  let inside = false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const a = pts[i], b = pts[j];
    if(((a.y>p.y) !== (b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y) + a.x)) inside = !inside;
  }
  return inside;
}

/* ─────────────────────────── 10. PRVKY ─────────────────────────── */

function getEl(id){ return S.project.elements.find(e => e.id === id); }

const DFLT_EL_D = 510;                    // výchozí hloubka obdélníku [mm]
function addElement(o={}){
  const e = {
    id: uid('e'),
    x: o.x ?? 0, y: o.y ?? 0,
    w: o.w ?? 600, d: o.d ?? DFLT_EL_D,
    name: o.name || '',
    note: o.note || '',
    qty: o.qty || 1,
    color: o.color || COLORS[0],
    front: o.front || 'jih'
  };
  S.project.elements.push(e);
  return e;
}

/** Krátké klepnutí nástrojem Obdélník: vloží výchozí 600 × 510 pod prst
   a přichytí ho k nejbližšímu cíli v dosahu magnetu. */
function addElementAtPoint(wx, wy, wmm=600, dmm=DFLT_EL_D){
  const e = finishNewElementKind(addElement({ x:R(wx - wmm/2), y:R(wy - dmm/2), w:wmm, d:dmm }));
  const r = computeSnap(e, e.x, e.y, 0, 0);
  e.x = R(r.x); e.y = R(r.y);
  return e;
}

function deleteSelection(){
  if(!S.sel) return;
  if(S.sel.kind==='el') S.project.elements = S.project.elements.filter(e=>e.id!==S.sel.id);
  if(S.sel.kind==='wall') S.project.walls = S.project.walls.filter(w=>w.id!==S.sel.id);
  if(S.sel.kind==='guide') S.project.guides = S.project.guides.filter(g=>g.id!==S.sel.id);
  if(S.sel.kind==='win') S.project.windows = S.project.windows.filter(x=>x.id!==S.sel.id);
  if(S.sel.kind==='sym') S.project.symbols = S.project.symbols.filter(x=>x.id!==S.sel.id);
  S.sel = null;
  pushHistory(); render();
}

function duplicateSelection(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const n = { ...e, id:uid('e'), x:R(e.x + e.w + 10), name:e.name };
  S.project.elements.push(n);
  select('el', n.id); pushHistory(); render();
}

/* Šířka prvku se měří podél jeho čela (čelo je otočené do místnosti, pryč
   od zdi). U čel k jihu/severu leží čelo v ose X, u východu/západu v ose Y.
   Šířka a hloubka se proto odvozují z osových rozměrů podle směru čela –
   po otočení o 90° zůstanou stejné (600 × 510 zůstává 600 × 510). */
const isHorizFront = f => (f === 'jih' || f === 'sever');
function elFrontW(e){ return isHorizFront(e.front || 'jih') ? e.w : e.d; }
function elFrontD(e){ return isHorizFront(e.front || 'jih') ? e.d : e.w; }
function setElFrontW(e, v){ if(isHorizFront(e.front || 'jih')) e.w = v; else e.d = v; }
function setElFrontD(e, v){ if(isHorizFront(e.front || 'jih')) e.d = v; else e.w = v; }

/* Bok+ – boční panel u skříně (NENÍ skříň). Je to tenký pruh (typicky 18 mm)
   na levém nebo pravém konci skříně „při pohledu na čelo". Jeho délka jde do
   hloubky skříně: hloubka skříně + 50 mm ke zdi (skříň stojí 50 mm od zdi)
   + 20 mm přesah před čelo → u skříně 510 mm je bok+ 580 mm. Geometrie se
   pokaždé počítá ze skříně → bok se pohybuje i otáčí spolu se skříní. */
const BOK_W_DFLT    = 18;  // tloušťka boku+ [mm]
const BOK_BACK_DFLT = 50;  // za zadní hranu skříně ke zdi [mm] (skříň stojí 50 mm od zdi)
const BOK_FRONT_DFLT = 20; // přesah před čelo (přes dvířka) [mm]
const BOK_H_DS = 900;      // výška boku+ u DS [mm] = sokl 150 + skříň 720 + deska ~30
const BOK_H_HS = 750;      // výška boku+ u HS [mm]
// Pozn.: hloubka boku+ = hloubka skříně + 50 (ke zdi) + 20 (před čelo) = 510+70 = 580 mm

function bokSides(e){
  /* Které strany mají bok+: {L, R}. Starší uložení (side:'L'/'R') se přečte. */
  const b = e && e.bok; const o = { L:false, R:false };
  if(!b) return o;
  if(b.sides){ o.L = !!b.sides.L; o.R = !!b.sides.R; return o; }
  if(b.side === 'L') o.L = true; else if(b.side === 'R') o.R = true;
  if(b.L) o.L = true; if(b.R) o.R = true;
  return o;
}
/* Sanitizace uloženého bok+ (nový i starý formát). Vrací null, když bok
   nemá žádnou stranu – pak se do projektu vůbec neukládá. */
function normBok(b){
  if(!b || typeof b !== 'object') return null;
  const sd = { L:false, R:false };
  if(b.sides){ sd.L = !!b.sides.L; sd.R = !!b.sides.R; }
  if(b.side === 'L' || b.L) sd.L = true;
  if(b.side === 'R' || b.R) sd.R = true;
  if(!sd.L && !sd.R) return null;
  const out = { sides: sd };
  if(b.w != null)     out.w     = clamp(+b.w || BOK_W_DFLT, 5, 60);
  if(b.front != null) out.front = clamp(+b.front || 0, 0, 500);
  if(b.back != null)  out.back  = clamp(+b.back  || 0, 0, 500);
  return out;
}
function bokAny(e){ const sd = bokSides(e); return sd.L || sd.R; }
function bokHas(e, side){ return !!bokSides(e)[side]; }

/* Čela do kalkulace: u každé skříně volitelně zapnutá, s ručním počtem
   dvířek a zásuvek. Rozměry se počítají reálně (viz frontPieces):
   šířka skříně − 4 mm na šířku, výška 704 mm, zásuvky 350/223/125. */
function frontCfg(e){
  const f = e && e.fronts;
  return {
    on:      !!(f && f.on),
    doors:   f && f.doors   != null ? clamp(Math.round(+f.doors   || 0), 0, 20) : 0,
    drawers: f && f.drawers != null ? clamp(Math.round(+f.drawers || 0), 0, 20) : 0
  };
}
/* Rozumný návrh počtu dvířek podle šířky skříně a max. šířky čela. */
function autoDoors(e){
  const maxW = Math.max(200, +pricing().doorW || 600);
  return Math.max(1, Math.ceil(elFrontW(e) / maxW));
}
/* ── BLENDE V ROHU – počítá se sama z půdorysu ────────────────────────────
   Blende je čtverec 50 × 50 mm. Sedí v rohu, kde se potkají dvě kolmé řady
   (čelní roviny se protnou), a dotýká se líce obou skříní. Dvířka jsou od
   blende 2 mm a od konce skříně taky 2 mm. Líc blende je v rovině dveří
   (přesahuje korpus o 18 mm = tloušťku dvířka).
   Nic se nezadává, žádné zaškrtávátko u skříně: rohy se najdou z geometrie. */
function blendeSize(){
  const P = pricing();
  return { w: Math.max(0, +P.blendeW || 0), d: Math.max(0, +P.blendeD || 0), gap: BLENDE_GAP };
}
/* Líc (čelní rovina) skříně a její rozsah podél čela.
   face = souřadnice líce, a0/a1 = rozsah podél čela. */
function elFaceInfo(e){
  const f = e.front || 'jih';
  const horiz = (f === 'jih' || f === 'sever');
  const face = f === 'jih'    ? e.y + e.d
             : f === 'sever'  ? e.y
             : f === 'východ' ? e.x + e.w
             :                  e.x;
  return { f, horiz, face,
           a0: horiz ? e.x : e.y,
           a1: horiz ? e.x + e.w : e.y + e.d };
}
function rectGapM(a, b){
  const dx = Math.max(0, a.x - (b.x + b.w), b.x - (a.x + a.w));
  const dy = Math.max(0, a.y - (b.y + b.h), b.y - (a.y + a.h));
  return Math.max(dx, dy);
}
function rectsCrossM(a, b){
  return a.x < b.x + b.w - 0.5 && b.x < a.x + a.w - 0.5 &&
         a.y < b.y + b.h - 0.5 && b.y < a.y + a.h - 0.5;
}

/* Všechny blende v projektu – jedna na roh. [{ x, y, w, h, els:[id,id] }] */
let _blCache = { key:'', list:[] };
function blendeCorners(){
  const P = pricing();
  const on = P.blendeOn !== false;
  let key = (on ? '1' : '0') + '|' + P.blendeW + '|' + P.blendeD;
  for(const e of S.project.elements)
    key += '|' + e.id + ',' + e.x + ',' + e.y + ',' + e.w + ',' + e.d + ',' +
           (e.front || 'jih') + ',' + elKind3(e);
  if(key === _blCache.key) return _blCache.list;
  const list = blendeCornersCalc(P, on);
  _blCache = { key, list };
  return list;
}
function blendeCornersCalc(P, on){
  if(!on) return [];
  const W = Math.max(0, +P.blendeW || 0), D = Math.max(0, +P.blendeD || 0);
  if(!(W > 0) || !(D > 0)) return [];
  const ds = S.project.elements.filter(e => {
    const k = elKind3(e);
    if(k !== 'base' && k !== 'column') return false;
    /* Dvířka (18 mm), blende (50 mm) nebo lišty nejsou skříně – kdyby se
       počítaly, vznikaly by z nich falešné rohy. Skříň má v půdorysu
       nejméně 120 mm v obou směrech. */
    return Math.min(e.w, e.d) >= 120;
  });
  const out = [], seen = new Set();
  for(let i = 0; i < ds.length; i++) for(let j = i + 1; j < ds.length; j++){
    const a = ds[i], b = ds[j];
    const fa = elFaceInfo(a), fb = elFaceInfo(b);
    if(fa.horiz === fb.horiz) continue;                  // jen kolmá čela
    const A  = fa.horiz ? a : b;
    const B  = fa.horiz ? b : a;
    const FA = fa.horiz ? fa : fb;                       // FA = vodorovné čelo
    const FB = fa.horiz ? fb : fa;                       // FB = svislé čelo
    const ra = { x:a.x, y:a.y, w:a.w, h:a.d };
    const rb = { x:b.x, y:b.y, w:b.w, h:b.d };
    if(rectsCrossM(ra, rb)) continue;                    // skříně se nesmí překrývat
    if(rectGapM(ra, rb) > BLENDE_TOL) continue;          // musí spolu sousedit
    const px = FB.face, py = FA.face;                    // protnutí čelních rovin
    if(px < FA.a0 - 120 || px > FA.a1 + 120) continue;   // protnutí musí být u skříně
    if(py < FB.a0 - 120 || py > FB.a1 + 120) continue;
    /* Líc blende je v ROVINĚ DVEŘÍ sousední řady: blende přesahuje její
       korpus o tloušťku dvířka (18 mm), takže s dvířky tvoří jednu rovinu.
       Druhým směrem blende vyplňuje 50mm mezeru mezi řadami – dotýká se
       líce jedné skříně i konce druhé. */
    const T = FRONT_T_DFLT;
    const x = FB.f === 'východ' ? px + T - W : px - T;
    const y = FA.f === 'jih'    ? py : py - D;
    const key = Math.round(x) + ':' + Math.round(y);
    if(seen.has(key)) continue;
    seen.add(key);
    /* Dvířka jsou vždy na straně OD sousední řady: blende sedí na té straně
       čela, kde je druhá řada, takže z čela ubírá právě tam. */
    const cuts = {};
    cuts[A.id] = (B.x + B.w / 2) < px ? 'L' : 'R';   // A = vodorovné čelo
    cuts[B.id] = (A.y + A.d / 2) < py ? 'L' : 'R';   // B = svislé čelo
    out.push({ x:R(x), y:R(y), w:W, h:D, els:[A.id, B.id], cuts });
  }
  return out;
}
/* Jak blende zasahuje do čela jedné skříně.
   cutL = mm zabrané na začátku čela, cutR = mm na konci. */
function blendeForEl(e){
  const res = { on:false, cutL:0, cutR:0 };
  if(!e) return res;
  const list = blendeCorners();
  if(!list.length) return res;
  const W = elFrontW(e);
  const horiz = isHorizFront(e.front || 'jih');
  const a0 = horiz ? e.x : e.y;
  for(const b of list){
    if(!b.els.includes(e.id)) continue;
    res.on = true;
    const s = (horiz ? b.x : b.y) - a0;          // začátek blende podél čela
    const t = s + (horiz ? b.w : b.h);           // konec blende podél čela
    /* strana se bere podle toho, kde leží sousední řada (viz cuts výše);
       bez ní rozhodne, na kterém konci čela blende je */
    const side = (b.cuts && b.cuts[e.id]) ||
                 ((s + t) / 2 <= W / 2 ? 'L' : 'R');
    if(side === 'L') res.cutL = Math.max(res.cutL, clamp(t, 0, W));
    else             res.cutR = Math.max(res.cutR, W - clamp(s, 0, W));
  }
  return res;
}
/* Zpětná kompatibilita pro starší uložené projekty (ruční blende se ignoruje,
   počítá se vždy z geometrie). */
function blendeCfg(e){
  const BI = blendeForEl(e);
  return { on: BI.on, side: BI.cutR > BI.cutL ? 'R' : 'L' };
}

/* Reálné rozměry čel jedné skříně.
   Vrací { doors:[výšky], drawers:[výšky od spodu], wDoor, wDraw, total, ok }.
   - šířka dvířek  = (W − 4 − (n−1)×2) / n     → 600 mm skříň = 596, na půl 297
   - šířka zásuvky = W − 4                     → 600 mm skříň = 596
   - výška dvířek  = 704 mm (DS i HS)
   - čela zásuvek od spodu 350 / 223 / 125 mm, mezera 3 mm; horní čelo
     (poslední zásuvka nebo dvířka nad nimi) vždy dorovná do 704 mm */
function frontPieces(e){
  const P = pricing();
  const W = elFrontW(e);
  const total = Math.max(100, +P.doorH || DOOR_H_DFLT);
  const gap   = +P.drawerGap >= 0 ? +P.drawerGap : DRAWER_GAP;
  const stack = (Array.isArray(P.drawerStack) && P.drawerStack.length) ? P.drawerStack : DRAWER_STACK_DFLT;

  const FR = frontCfg(e);
  const isCol = elKind3(e) === 'column';
  let nD = FR.doors, nZ = FR.drawers;
  if(isCol) nD = 0;                            // sloup – dvířka nemá, spotřebiče mají vlastní
  if(!nD && !nZ) nD = isCol ? 0 : 1;           // zapnuto, ale nic nezadáno
  nD = Math.max(0, Math.min(20, nD));
  nZ = Math.max(0, Math.min(20, nZ));

  /* blende v rohu ubere z čela jen to, co je za rovinou dveří; dvířka
     jsou od ní 2 mm a 2 mm od konce skříně (skříň 600 v rohu = 578 mm) */
  const BI = blendeForEl(e), BS = blendeSize();
  const cutL = BI.cutL, cutR = BI.cutR;
  const usable = Math.max(100, W - cutL - cutR);
  const wDoor = nD > 0 ? Math.max(50, Math.round((usable - DOOR_EDGE - (nD - 1) * DOOR_GAP_W) / nD)) : 0;
  const wDraw = Math.max(50, Math.round(usable - DOOR_EDGE));

  const nSlots   = nZ + (nD > 0 ? 1 : 0);          // čel nad sebou
  const gapTotal = Math.max(0, nSlots - 1) * gap;

  const drawers = [];
  let used = 0;
  if(nZ === 1 && nD === 0){
    /* jediná zásuvka = celé čelo */
    drawers.push(total); used = total;
  } else if(nZ === 2 && nD === 0){
    /* dvě stejná čela 350 + 350, mezera vyjde 4 mm (704 − 700) */
    const h = Math.round(stack[0] || 350);
    drawers.push(h, h); used = 2 * h;
  } else {
    for(let i = 0; i < nZ; i++){
      const top = (i === nZ - 1) && nD === 0;      // nad poslední zásuvkou nic není
      let h = top ? (total - used - gapTotal)
                  : (stack[i] != null ? stack[i] : stack[stack.length - 1]);
      h = Math.round(Math.max(20, h));
      drawers.push(h);
      used += h;
    }
  }
  /* SLOUP: dole jsou dva výsuvy 350 a 223 mm, nad nimi jsou vestavné
     spotřebiče (trouba, mikrovlnka) a výklop – ten se doměřuje.
     Čela výsuvů se proto berou přímo ze seznamu, nic se nedorovnává. */
  if(isCol && nZ > 0){
    drawers.length = 0;
    for(let i = 0; i < nZ; i++)
      drawers.push(Math.round(stack[i] != null ? stack[i] : stack[stack.length - 1]));
    used = drawers.reduce((a,b) => a + b, 0);
  }
  let doorH = 0;
  if(nD > 0){
    doorH = Math.round(total - used - gapTotal);
    if(doorH < 20) doorH = 0;                      // nevychází – dvířka se nedají
  }
  return { doors: nD > 0 && doorH > 0 ? Array.from({length:nD}, () => doorH) : [],
           drawers, wDoor, wDraw, total,
           blende: BI.on ? { w:BS.w, d:BS.d, gap:BS.gap, cutL, cutR,
                             cut: cutL + cutR } : null,
           ok: drawers.length === nZ && (nD === 0 || doorH > 0) };
}

/* Text „596 × 704 mm × 2“ / „350 / 223 / 125 × 596 mm“ pro inspektor. */
function frontSizesText(e){
  const FP = frontPieces(e);
  const out = [];
  if(FP.doors.length) out.push('dvířka ' + fmt(FP.wDoor) + ' × ' + fmt(FP.doors[0]) + ' mm' +
    (FP.doors.length > 1 ? ' (' + FP.doors.length + ' ks vedle sebe)' : ''));
  if(FP.drawers.length) out.push('výsuvy ' + fmt(FP.wDraw) + ' × ' + FP.drawers.map(h => fmt(h)).join(' / ') + ' mm');
  if(!out.length) return '—';
  const sum = FP.drawers.reduce((a,b) => a + b, 0) + (FP.doors.length ? FP.doors[0] : 0)
            + Math.max(0, FP.drawers.length + (FP.doors.length ? 1 : 0) - 1) * pricing().drawerGap;
  let txt = out.join(' · ') + ' · celkem na výšku ' + fmt(Math.round(sum)) + ' mm';
  if(FP.blende) txt += ' · blende ' + FP.blende.w + ' × ' + FP.blende.d +
    ' v rohu (−' + fmt(Math.round(FP.blende.cut)) + ' mm)';
  return txt;
}

/* Čela fyzicky v půdorysu.
   Dvířka i čela zásuvek jsou naložené panely tl. 18 mm na líci skříně,
   takže v půdorysu vypadají jako tenký pruh PŘED skříní. Pruh je rozdělený
   na jednotlivá dvířka (mezera 2 mm); u zásuvkové skříně je jeden pruh
   (čela jsou nad sebou, v půdorysu se kryjí) s počtem zásuvek.
   Vrací pole obdélníků { x, y, w, h, drawers, doors }. */
function frontStrips(e){
  const FR = frontCfg(e);
  if(!FR.on) return [];
  const k = elKind3(e);
  if(k !== 'base' && k !== 'upper' && k !== 'column') return [];
  const FP = frontPieces(e);
  if(!FP.doors.length && !FP.drawers.length) return [];

  const f  = e.front || 'jih';
  const fv = FRONT_VEC[f];
  const W  = elFrontW(e);                      // šířka podél čela
  const T  = FRONT_T_DFLT;                     // tloušťka čela

  /* Blende v rohu zabírá začátek (nebo konec) čela. Dvířka jsou od ní 2 mm
     a 2 mm od konce skříně. Blende samotná se kreslí zvlášť jako čtverec
     50 × 50 (viz blendeCorners), ne jako pruh na čele. */
  const BL = FP.blende;
  const EDGE = DOOR_EDGE / 2;                          // 2 mm od kraje
  const inner0 = EDGE + (BL ? BL.cutL : 0);
  const inner1 = W - EDGE - (BL ? BL.cutR : 0);

  /* úseky podél čela */
  const segs = [];
  if(FP.doors.length){
    const n = FP.doors.length, w = FP.wDoor, gap = DOOR_GAP_W;
    const used = n * w + (n - 1) * gap;
    let a = inner0 + ((inner1 - inner0) - used) / 2;
    for(let i = 0; i < n; i++){ segs.push({ a0:a, a1:a + w }); a += w + gap; }
  } else {
    segs.push({ a0: inner0 + ((inner1 - inner0) - FP.wDraw) / 2,
                a1: inner0 + ((inner1 - inner0) + FP.wDraw) / 2 });
  }

  const tag = { doors:FP.doors.length, drawers:FP.drawers.length };
  const D = 18;                                // jak daleko čelo vystupuje před skříň
  return segs.map(sg => {
    const len = sg.a1 - sg.a0;
    if(fv[1] === 1)  return { x:e.x + sg.a0, y:e.y + e.d, w:len, h:T, ...tag };  // jih
    if(fv[1] === -1) return { x:e.x + sg.a0, y:e.y - T,   w:len, h:T, ...tag };  // sever
    if(fv[0] === 1)  return { x:e.x + e.w, y:e.y + sg.a0, w:T, h:len, ...tag };  // východ
    return                  { x:e.x - T,   y:e.y + sg.a0, w:T, h:len, ...tag };  // západ
  });
}

function bokCfg(e){ const b = e && e.bok; return b && bokAny(e) ? b : null; }
function bokW(e){ const b = bokCfg(e); return b && +b.w ? +b.w : BOK_W_DFLT; }
function bokBack(e){
  const b = bokCfg(e);
  if(b && b.back != null) return +b.back;
  /* horní skříň visí u zdi → bok+ začíná na líci zdi (odskok 0); spodní mají 50 mm */
  return elKind3(e)==='upper' ? 0 : BOK_BACK_DFLT;
}
function bokFront(e){ const b = bokCfg(e); return b && b.front != null ? +b.front : BOK_FRONT_DFLT; }
function bokDepthOf(e){ return (isHorizFront(e.front||'jih') ? e.d : e.w) + bokBack(e) + bokFront(e); }
/* Výška boku+ podle druhu prvku (u sloupu do výšky sloupu). */
function bokH(e){
  const k = elKind3(e);
  if(k==='upper') return BOK_H_HS;
  if(k==='column') return elH3(e);
  return BOK_H_DS;
}
/* Obdélník boku+ na zadané straně (L/R „při pohledu na čelo“). */
function bokRectFor(e, side){
  const W = bokW(e), back = bokBack(e), front = bokFront(e);
  const f = e.front || 'jih';
  const depth = isHorizFront(f) ? e.d : e.w;
  const L = side === 'L';
  let x, y, w, h;
  if(f === 'jih'){            // čelo dole, zadní hrana nahoře
    x = L ? e.x - W : e.x + e.w;
    y = e.y - back; w = W; h = depth + back + front;
  } else if(f === 'sever'){   // čelo nahoře, zadní hrana dole
    x = L ? e.x + e.w : e.x - W;
    y = e.y - front; w = W; h = depth + back + front;
  } else if(f === 'východ'){  // čelo vpravo, zadní hrana vlevo
    y = L ? e.y + e.d : e.y - W;
    x = e.x - back; w = depth + back + front; h = W;
  } else {                    // západ – čelo vlevo, zadní hrana vpravo
    y = L ? e.y - W : e.y + e.d;
    x = e.x - front; w = depth + back + front; h = W;
  }
  return { x, y, w, h };
}
/* Obdélníky všech nakonfigurovaných boků+ dané skříně. */
function bokRects(e){
  const sd = bokSides(e), out = [];
  if(sd.L) out.push(bokRectFor(e, 'L'));
  if(sd.R) out.push(bokRectFor(e, 'R'));
  return out;
}
/* Kreslení boků na plátně (obrazovka): tenký pruh u konce skříně. */
/* Čela v půdorysu – tenké pruhy na líci skříně (dvířka po kusech). */
function frontsMarkup(){
  if(!S.showFronts) return '';
  const z = S.view.zoom;
  let out = '';
  for(const e of S.project.elements){
    if(!layerShowsEl(e)) continue;
    const sel = S.sel?.kind==='el' && S.sel.id===e.id;
    const c = e.color || COLORS[0];
    for(const r of frontStrips(e)){
      const fillC = r.blende ? '#dc262655' : (sel ? '#2563eb44' : c + '55');
      const strk  = r.blende ? '#b91c1c' : (sel ? '#2563eb' : '#111827');
      out += `<rect x="${R(r.x)}" y="${R(r.y)}" width="${Math.max(R(r.w), 0.5)}" height="${Math.max(R(r.h), 0.5)}"
        fill="${fillC}" stroke="${strk}"
        stroke-width="${1.4/z}" pointer-events="none"/>`;
      /* u zásuvkové skříně napiš počet čel, když je na to místo */
      if(!r.doors && r.drawers > 0){
        const along = Math.max(r.w, r.h) * z;
        if(along > 46){
          const tx = R(r.x + r.w/2), ty = R(r.y + r.h/2);
          const rot = r.h > r.w ? ` transform="rotate(-90 ${tx} ${ty})"` : '';
          const fs = clamp(Math.max(r.w, r.h) * 0.14, 80, 240);
          out += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"${rot}
            font-size="${fs}" font-weight="700" fill="#111827" pointer-events="none"
            style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.2}px">${r.drawers}×</text>`;
        }
      }
    }
  }
  /* blende v rohu – čtverec 50 × 50, tmavě červený */
  for(const b of blendeCorners()){
    out += `<rect x="${R(b.x)}" y="${R(b.y)}" width="${Math.max(R(b.w),0.5)}" height="${Math.max(R(b.h),0.5)}"
      fill="#dc2626" stroke="#7f1d1d" stroke-width="${1.4/z}" pointer-events="none"/>`;
    if(Math.min(b.w, b.h) * z > 34){
      out += `<text x="${R(b.x + b.w/2)}" y="${R(b.y + b.h/2)}" text-anchor="middle" dominant-baseline="middle"
        font-size="${clamp(Math.min(b.w, b.h) * 0.40, 60, 220)}" font-weight="700" fill="#fff"
        pointer-events="none" style="font-family:Helvetica,Arial,sans-serif">B</text>`;
    }
  }
  return out;
}

function bokMarkup(){
  const z = S.view.zoom;
  let out = '';
  for(const e of S.project.elements){
    if(!layerShowsEl(e)) continue;
    const thin = bokW(e);
    for(const r of bokRects(e)){
      out += `<rect x="${R(r.x)}" y="${R(r.y)}" width="${R(r.w)}" height="${R(r.h)}"
        fill="#cbd5e199" stroke="#475569" stroke-width="${1.6/z}" stroke-dasharray="${7/z} ${5/z}"/>`;
      /* popisek „Bok+“ jen když je panel na obrazovce dostatečně dlouhý */
      if(Math.max(r.w, r.h) * z > 40 && Math.min(r.w, r.h) * z > 4){
        const fs = clamp(thin * 1.05, 13, 60);
        const v = r.h > r.w;                      // svislý pruh → text na výšku
        const tx = R(r.x + r.w/2), ty = R(r.y + r.h/2);
        const rot = v ? ` transform="rotate(-90 ${tx} ${ty})"` : '';
        out += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"${rot}
          font-size="${fs}" font-weight="700" fill="#334155"
          style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.22}px">Bok+ ${thin}</text>`;
      }
    }
  }
  return out;
}

/* Kreslení boků do PDF (world souřadnice uvnitř <g scale(k)>). */
function boksPrintSvg(sw, filter){
  let out = '';
  for(const e of S.project.elements){
    if(filter && !filter(e)) continue;
    for(const r of bokRects(e)){
      out += `<rect x="${R(r.x)}" y="${R(r.y)}" width="${R(r.w)}" height="${R(r.h)}"
        fill="#cbd5e1aa" stroke="#334155" stroke-width="${sw(0.22)}" stroke-dasharray="${sw(2)} ${sw(1.4)}"/>`;
    }
  }
  return out;
}

/* Přeorientuje prvek na daný směr čela. Když se osa čela změní
   (vodorovná ↔ svislá), prvek se o 90° otočí kolem středu; šířka a
   hloubka prvku se přitom nemění. */
function orientElement(e, newFront){
  const oldH = isHorizFront(e.front || 'jih');
  const newH = isHorizFront(newFront);
  if(oldH !== newH){
    const cx = e.x + e.w/2, cy = e.y + e.d/2;
    const w = e.w; e.w = e.d; e.d = w;
    e.x = R(cx - e.w/2); e.y = R(cy - e.d/2);
  }
  e.front = newFront;
}

function rotateSelection(){
  if(S.sel?.kind !== 'el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const order = ['jih','západ','sever','východ'];
  orientElement(e, order[(order.indexOf(e.front||'jih')+1) % 4]);
  pushHistory(); render();
}

/** Přisune prvek k nejbližší zdi bez ohledu na dosah magnetu. Hledá se
    nejbližší hrana CELÉ sestavy (skříň + bok+) – tak se k zdi přichytí i
    bok+ svou venkovní hranou. */
function snapToWall(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const saved = S.snapMm;
  S.snapMm = 100000;
  const xs = [e.x, e.x+e.w], ys = [e.y, e.y+e.d];
  for(const b of bokRects(e)){ xs.push(b.x, b.x+b.w); ys.push(b.y, b.y+b.h); }
  let best = null;
  for(const c of snapCandidates(e.id)){
    if(c.kind !== 'wall') continue;
    if(c.axis === 'x'){
      for(const px of xs){
        const d = Math.abs(c.pos - px);
        if(!best || d < best.d){
          const test = { ...e, x: e.x + (c.pos - px) };
          const wall = findWall(c.id);
          if(!assemblyRects(test).some(r => elementHitsWall(r, wall))) best = { d, test };
        }
      }
    } else {
      for(const py of ys){
        const d = Math.abs(c.pos - py);
        if(!best || d < best.d){
          const test = { ...e, y: e.y + (c.pos - py) };
          const wall = findWall(c.id);
          if(!assemblyRects(test).some(r => elementHitsWall(r, wall))) best = { d, test };
        }
      }
    }
  }
  S.snapMm = saved;
  if(best){ e.x = R(best.test.x); e.y = R(best.test.y); pushHistory(); toast('Přitaženo ke zdi'); }
  else toast('V dosahu není žádná zeď');
  render();
}
function findWall(id){ return S.project.walls.find(w=>w.id===id) || { pts:[], t:0 }; }

/** Je-li bok+ zaseklý UVNITŘ zdi (např. zapnut u skříně, která už dosedala na
    líc), posune skříň kolmo ke zdi tak, že VENKOVNÍ hrana boku+ dosedne na líc.
    Vrací true, když prvkem pohnul. */
function healBokOverlap(e){
  const hitsAny = t => assemblyRects(t).some(r => S.project.walls.some(wl => elementHitsWall(r, wl)));
  const bokBad = () => bokRects(e).some(b => S.project.walls.some(wl => elementHitsWall(b, wl)));
  if(!bokBad()) return false;
  let moved = false;
  for(let pass=0; pass<4 && bokBad(); pass++){
    const xs = [e.x, e.x+e.w], ys = [e.y, e.y+e.d];
    for(const b of bokRects(e)){ xs.push(b.x, b.x+b.w); ys.push(b.y, b.y+b.h); }
    let best = null;
    for(const c of snapCandidates(e.id)){
      if(c.kind !== 'wall') continue;
      for(const p of (c.axis==='x' ? xs : ys)){
        const shift = c.pos - p;
        if(Math.abs(shift) < 0.01) continue;
        const test = c.axis==='x' ? { ...e, x: e.x + shift } : { ...e, y: e.y + shift };
        if(hitsAny(test)) continue;
        if(!best || Math.abs(shift) < best.d) best = { d: Math.abs(shift), test };
      }
    }
    if(!best) break;
    e.x = R(best.test.x); e.y = R(best.test.y);
    moved = true;
  }
  return moved;
}

/** Dovře mezeru k sousedovi ve stejné řadě. */
function closeGap(dir){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const others = S.project.elements.filter(o => o.id!==e.id
    && Math.abs((o.y+o.d/2) - (e.y+e.d/2)) < GAP_TOL);
  let best = null;
  for(const o of others){
    const gap = dir==='right' ? e.x - (o.x+o.w) : o.x - (e.x+e.w);
    if(gap <= 0 || gap > 2000) continue;
    if(!best || gap < best.gap) best = { gap, o };
  }
  if(best){
    e.x = R(dir==='right' ? e.x - best.gap : e.x + best.gap);
    pushHistory(); toast('Mezera dovřena');
  } else toast('V této řadě není soused s mezerou');
  render();
}

function select(kind, id){
  S.sel = kind ? { kind, id } : null;
  render();
}

/* ─────────────────────────── 11. HISTORIE ─────────────────────────── */

let history = [], historyIndex = -1;
const hist = { preDrag: null };

function snapshot(){ return JSON.stringify({
  walls:S.project.walls, elements:S.project.elements, guides:S.project.guides,
  windows:S.project.windows, symbols:S.project.symbols, info:S.project.info,
  pricing:S.project.pricing }); }
function pushHistory(){
  const s = snapshot();
  if(history[historyIndex] === s){ save(); return; }
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save(); render();
}
/** Uloží do historie a na disk BEZ překreslení inspektoru – pro úpravy polí
    vpravo, aby psaní a Tab nepřišly o fokus. */
function pushHistoryQuiet(){
  const s = snapshot();
  if(history[historyIndex] === s){ save(); return; }
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save();
}
function commitPreDrag(){
  if(!hist.preDrag) return;
  const before = hist.preDrag; hist.preDrag = null;
  const s = snapshot();
  if(before === s) return;
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save();
}
function restore(s){
  const o = JSON.parse(s);
  S.project.walls = o.walls || [];
  S.project.elements = o.elements || [];
  S.project.guides = o.guides || [];
  S.project.windows = o.windows || [];
  S.project.symbols = o.symbols || [];
  if(o.info) S.project.info = { ...S.project.info, ...o.info };
  if(o.pricing) S.project.pricing = o.pricing;
  if(S.sel){
    const k = S.sel.kind;
    const list = k==='el'?S.project.elements : k==='wall'?S.project.walls : S.project.guides;
    if(!list.find(x=>x.id===S.sel.id)) S.sel = null;
  }
  render();
}
function undo(){ if(historyIndex>0){ historyIndex--; restore(history[historyIndex]); save(); } }
function redo(){ if(historyIndex<history.length-1){ historyIndex++; restore(history[historyIndex]); save(); } }

          <input type="checkbox" id="iFrOn" ${frontCfg(e).on?'checked':''}> počítat čela v kalkulaci
        </label>
        <div class="row2">
          ${elKind3(e)==='column' ? '' : `<label class="fld"><span>Dvířka (ks)</span><input id="iFrDoors" type="number" min="0" max="20" step="1" value="${frontCfg(e).doors}"></label>`}
          <label class="fld"><span>${elKind3(e)==='column' ? 'Výsuvy dole (ks)' : 'Zásuvky (ks)'}</span><input id="iFrDrawers" type="number" min="0" max="20" step="1" value="${frontCfg(e).drawers}"></label>
        </div>
        <p class="hint" style="margin-top:6px"><b>Rozměry čel:</b> ${frontSizesText(e)}</p>
        ${(() => {
          const BI = blendeForEl(e), BS = blendeSize();
          if(BI.on)
            return `<p class="hint" style="margin-top:6px;padding:7px 9px;background:#fef2f2;border:1px solid #fecaca;border-radius:7px">
              <b style="color:#b91c1c">Blende v rohu ${BS.w} × ${BS.d} mm.</b>
              Z čela ubírá ${fmt(Math.round(BI.cutL + BI.cutR))} mm → mezi blende a dvířky 2 mm,
              na druhém konci skříně taky 2 mm.</p>`;
          if(pricing().blendeOn === false)
            return `<p class="hint" style="margin-top:6px;padding:7px 9px;background:#fff7ed;border:1px solid #fed7aa;border-radius:7px">
              <b>Automatická blende je vypnutá.</b> Nic se nedopočítává – blende si nakresli sám
              (nebo ji <a href="#" id="iBlendeAutoOn" style="color:#b45309;font-weight:700">zapni</a>).
              Dvířka jsou proto jen o 4 mm menší než skříň (${fmt(elFrontW(e) - 4)} mm).</p>`;
          return `<p class="hint" style="margin-top:6px">Blende: tahle skříň není v rohu.
            Blende ${BS.w} × ${BS.d} mm se přidá sama, když se dvě kolmé řady potkají (L nebo U roh).</p>`;
        })()}
        <p class="hint">Čela se do ceny nepočítají sama – zapni je u skříní, kde je chceš.
          Šířka čela = šířka skříně − 4 mm (600 → 596, na dvě 297, myčka 450 → 446),
          výška dvířek je vždy 704 mm, čela zásuvek od spodu ${(pricing().drawerStack||[]).join(' / ')} mm
          s mezerou ${pricing().drawerGap} mm – dohromady vždy 704 mm (dvě zásuvky = 350 + 350 s mezerou 4 mm).
          ${elKind3(e)==='column'
            ? 'U sloupu se počítají jen spodní výsuvy (' + (pricing().drawerStack||[]).slice(0,2).join(' + ') + ' mm); trouba, mikrovlnka a horní výklop mají vlastní čela a doměřují se.'
            : 'Sloupy (lednice, trouba): počítají se jen spodní výsuvy, zbytek se doměřuje.'}</p>
      </div>
      <div class="insp-sec">
        <h4>Barva</h4>
        <div class="swatches">${COLORS.map(c=>`<button class="sw-btn${c===e.color?' on':''}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>
      </div>
      <div class="insp-sec">
        <h4>Poznámka</h4>
        <label class="fld"><textarea id="iNote" rows="3" placeholder="materiál, kování, atyp…">${esc(e.note)}</textarea></label>
      </div>
      <div class="insp-sec">
        <h4>Úpravy</h4>
        <div class="insp-actions">
          <button class="tb" id="iRot">⟳ Otočit 90°</button>
          <button class="tb" id="iDup">⧉ Duplikovat</button>
          <button class="tb full" id="iWall">⤒ Přitáhnout ke zdi</button>
          <button class="tb" id="iGapL">◀ Dovřít</button>
          <button class="tb" id="iGapR">Dovřít ▶</button>
          <button class="tb full" id="elWinAlign">⌖ Střed na střed okna</button>
          <button class="tb danger full" id="iDel">🗑 Smazat</button>
        </div>
      </div>`;

    const bind = (id, fn, ev='change') => { const el = $(id); if(el) el.addEventListener(ev, fn); };
    /* Pole vpravo nesmí přestavět panel ani při psaní, ani při potvrzení
       (Tab/Enter) – jinak by po každém písmenu / tabulátoru vypadl fokus.
       Překreslí se jen výkres; do historie se uloží až při opuštění pole. */
    bind('#iName', ev => { e.name = ev.target.value; renderCanvas(); }, 'input');
    bind('#iName', () => pushHistoryQuiet(), 'change');
    bind('#iNote', ev => { e.note = ev.target.value; }, 'input');
    bind('#iNote', () => pushHistoryQuiet(), 'change');
    bind('#iW', ev => { setElFrontW(e, Math.max(MIN_SIZE, +ev.target.value||MIN_SIZE)); pushHistoryQuiet(); renderCanvas(); });
    bind('#iD', ev => { setElFrontD(e, Math.max(MIN_SIZE, +ev.target.value||MIN_SIZE)); pushHistoryQuiet(); renderCanvas(); });
    bind('#iX', ev => { e.x = R(OR.x + (+ev.target.value||0)); pushHistoryQuiet(); renderCanvas(); });
    bind('#iY', ev => { e.y = R(OR.y + (+ev.target.value||0)); pushHistoryQuiet(); renderCanvas(); });
    bind('#iQty', ev => { e.qty = clamp(+ev.target.value||1,1,99); pushHistoryQuiet(); renderCanvas(); });
    $('#iH').addEventListener('change', ev => { e.h = clamp(+ev.target.value||0,100,3000); pushHistoryQuiet(); renderCanvas(); });
    $('#iFrOn').addEventListener('change', ev => {
      const on = !!ev.target.checked;
      if(on){
        e.fronts = { on:true,
          doors:  (e.fronts && +e.fronts.doors)   || autoDoors(e),
          drawers:(e.fronts && +e.fronts.drawers) || 0 };
      } else {
        e.fronts = { on:false,
          doors:  e.fronts ? (Math.round(+e.fronts.doors)   || 0) : autoDoors(e),
          drawers:e.fronts ? (Math.round(+e.fronts.drawers) || 0) : 0 };
      }
      pushHistoryQuiet(); renderInspector(); renderCanvas();
    });
    $('#iFrDoors').addEventListener('change', ev => {
      e.fronts = e.fronts || { on:false, doors:0, drawers:0 };
      e.fronts.doors = clamp(Math.round(+ev.target.value || 0), 0, 20);
      pushHistoryQuiet(); renderCanvas();
    });
    const bA = $('#iBlendeAutoOn');
    if(bA) bA.onclick = ev => {
      ev.preventDefault();
      const P = pricing(); P.blendeOn = true; syncBlendeAuto(); save(); render();
    };
    $('#iFrDrawers').addEventListener('change', ev => {
      e.fronts = e.fronts || { on:false, doors:0, drawers:0 };
      e.fronts.drawers = clamp(Math.round(+ev.target.value || 0), 0, 20);
      pushHistoryQuiet(); renderCanvas();
    });
    $('#iKindBase').onclick  = () => setElKind3(e, 'base');
    $('#iKindUpper').onclick = () => setElKind3(e, 'upper');
    bind('#iFront', ev => { orientElement(e, ev.target.value); pushHistoryQuiet(); renderCanvas(); });
    /* Bok+ – přepínání stran (může být vlevo i vpravo zároveň). Klik na tlačítko
       zapne/vypne danou stranu; čísla polí se převezmou a uloží. */
    const toggleBokSide = (side) => {
      e.bok = e.bok || {};
      e.bok.w = clamp(+$('#iBokW').value || BOK_W_DFLT, 5, 60);
      e.bok.front = clamp(+$('#iBokFront').value || BOK_FRONT_DFLT, 0, 500);
      e.bok.back = clamp(+$('#iBokBack').value || (elKind3(e)==='upper' ? 0 : BOK_BACK_DFLT), 0, 500);
      const sd = bokSides(e);            // starší uložení (side) se převede na obě strany
      delete e.bok.side; delete e.bok.L; delete e.bok.R;
      sd[side] = !sd[side];
      if(sd.L || sd.R){
        e.bok.sides = { L:sd.L, R:sd.R };
        if(healBokOverlap(e)) toast('Bok+ by byl ve zdi – skříň se vysunula, venkovní hrana boku+ dosedá na líc zdi');
      }
      else { delete e.bok; }
      pushHistory(); render();
    };
    $('#iBokL').onclick = () => toggleBokSide('L');
    $('#iBokR').onclick = () => toggleBokSide('R');
    $('#iBokW').addEventListener('change', ev => {
      if(e.bok){ e.bok.w = clamp(+ev.target.value || BOK_W_DFLT, 5, 60); pushHistoryQuiet(); renderCanvas(); }
    });
    $('#iBokFront').addEventListener('change', ev => {
      if(e.bok){ e.bok.front = clamp(+ev.target.value || BOK_FRONT_DFLT, 0, 500); pushHistoryQuiet(); renderCanvas(); }
    });
    $('#iBokBack').addEventListener('change', ev => {
      if(e.bok){ e.bok.back = clamp(+ev.target.value || BOK_BACK_DFLT, 0, 500); pushHistoryQuiet(); renderCanvas(); }
    });
    $('#iRot').onclick = rotateSelection;
    $('#iDup').onclick = duplicateSelection;
    $('#iWall').onclick = snapToWall;
    $('#iGapL').onclick = () => closeGap('right');
    $('#iGapR').onclick = () => closeGap('left');
    $('#elWinAlign')?.addEventListener('click', () => {
      if(alignElementToWindow(e)){ pushHistory(); toast('Skříň zarovnána podél zdi na střed okna'); }
      else toast('Nakresli nejdřív okno do zdi');
    });
    $('#iDel').onclick = deleteSelection;
    $$('.sw-btn').forEach(b => b.onclick = () => { e.color = b.dataset.color; pushHistory(); render(); });
    return;
  }

  if(S.sel?.kind==='wall'){
    const w = S.project.walls.find(x=>x.id===S.sel.id);
    if(!w){ S.sel = null; return renderInspector(); }
    const segs = wallSegments(w);
    const total = segs.reduce((a,sg,i)=> a + segClearLength(w,i), 0);
    box.innerHTML = `
      <div class="insp-head">
        <input class="insp-name" id="wName" maxlength="40" value="${esc(w.name||'')}" placeholder="Název zdi">
        <span class="insp-kind" style="--k:#2b3138">${w.closed?'uzavřený obvod':'otevřená zeď'}</span>
      </div>

      <div class="big-stat">
        <span>Délka celkem</span>
        <b>${fmt(total)}<i>mm</i></b>
      </div>

      <div class="insp-sec">
        <h4>Délky úseků</h4>
        <div class="seg-list">${segs.map((sg,i)=>`
          <label class="seg-item${S.sel?.seg === i ? ' active':''}">
            <span class="seg-n">${i+1}</span>
            <input data-seg="${i}" type="number" step="5" min="10" value="${Math.round(segClearLength(w,i))}">
            <span class="seg-u">mm</span>
          </label>`).join('') || '<p class="hint">Zeď nemá žádný úsek.</p>'}</div>
        <p class="hint">Číslo je <b>přesně délka stěny, jak jsi ji naměřil</b> – nakreslená čára je skutečná hrana, žádný střed. Klepni přímo na stěnu ve výkresu – označí se jen ona.</p>
      </div>

      ${S.sel?.seg != null ? `
      <div class="insp-sec">
        <h4>Posun označené stěny</h4>
        <div class="seg-move">
          <button class="tb" data-mv="0,-1" title="o krok nahoru">▲</button>
          <button class="tb" data-mv="-1,0" title="o krok doleva">◀</button>
          <button class="tb" data-mv="0,1" title="o krok dolů">▼</button>
          <button class="tb" data-mv="1,0" title="o krok doprava">▶</button>
        </div>
        <label class="inline-fld"><input id="segStep" type="number" step="5" min="1" value="${S.segStep||50}"><span>mm / krok</span></label>
        <p class="hint">Šipky posunou jen označenou stěnu o krok; sousední stěny se napojí.</p>
      </div>` : ''}

      <div class="insp-sec">
        <h4>Tloušťka zdi</h4>
        <label class="inline-fld"><input id="wT" type="number" step="5" min="20" max="1000" value="${w.t||WALL_T_DEFAULT}"><span>mm</span></label>
        <p class="hint">Nakreslená čára je přesně naměřená stěna; tloušťka se přidává dozadu. Když roste špatným směrem, přepni ji tlačítkem ⇄.</p>
      </div>

      <div class="insp-sec">
        <h4>Odstupová čára</h4>
        <div class="inline-row">
          <label class="inline-fld"><input id="gDist" type="number" step="5" min="0" value="50"><span>mm</span></label>
          <button class="tb" id="gMake">⇢ Vytvořit</button>
        </div>
        <select id="gSide" class="mini-select">
          <option value="auto">dovnitř místnosti</option>
          <option value="left">strana A</option>
          <option value="right">strana B</option>
        </select>
      </div>

      <div class="insp-actions">
        <button class="tb" id="wFlip">⇄ Tloušťka na druhou stranu</button>
        <button class="tb" id="wOrtho">⌐ Pravé úhly</button>
        <button class="tb" id="wClose">${w.closed?'Otevřít':'Uzavřít'}</button>
        <button class="tb danger full" id="wDel">🗑 Smazat zeď</button>
      </div>`;

    const wName = $('#wName'); if(wName){
      wName.addEventListener('input', ev => { w.name = ev.target.value; renderCanvas(); });
      wName.addEventListener('change', () => pushHistoryQuiet());
    }
    const wT = $('#wT'); if(wT) wT.addEventListener('change', ev => { w.t = clamp(+ev.target.value||WALL_T_DEFAULT,20,1000); pushHistoryQuiet(); renderCanvas(); });
    /* Délky úseků: Tab potvrdí číslo a skočí na další řádek, Shift+Tab zpět,
       Enter potvrdí a kurzor nechá na místě. render() přepisuje panel až
       v requestAnimationFrame – fokus proto NEVRACÍME hned (starý input by
       vzápětí zmizel), ale přes S.sel.seg: po přepsání panelu se příslušný
       řádek sám zaměří a označí. Jinak by „psaní zhaslo“ po každém čísle. */
    $$('[data-seg]').forEach(inp => {
      inp.addEventListener('keydown', ev => {
        if(ev.key !== 'Tab') return;
        ev.preventDefault();
        const i = +inp.dataset.seg, n = $$('[data-seg]').length;
        S.sel.seg = ev.shiftKey ? (i - 1 + n) % n : (i + 1) % n;
        setSegmentLength(w, i, Math.max(10, +inp.value||10));
        pushHistory();
      });
      inp.addEventListener('change', ev => {
        const i = +inp.dataset.seg;
        if(document.activeElement === inp) S.sel.seg = i;  // Enter – kurzor zůstane
        setSegmentLength(w, i, Math.max(10, +ev.target.value||10));
        pushHistory();
      });
    });
    $$('[data-mv]').forEach(btn => btn.addEventListener('click', () => {
      const [dx, dy] = btn.dataset.mv.split(',').map(Number);
      const step = Math.max(1, +$('#segStep')?.value || 50);
      S.segStep = step;
      moveSegment(w, S.sel.seg, dx*step, dy*step);
      pushHistory();
    }));
    /* označená stěna → rovnou aktivní pole s délkou */
    if(S.sel?.seg != null){
      const act = $(`[data-seg="${S.sel.seg}"]`);
      if(act) setTimeout(()=>{ act.focus(); act.select?.(); }, 40);
    }
    $('#gMake').onclick = () => guideFromWall(w, Math.max(0, +$('#gDist').value||0), $('#gSide').value);
    $('#wFlip').onclick = () => { w.side = -wallSide(w); pushHistory(); render(); };
    $('#wOrtho').onclick = () => {
      const res = orthogonalizeWall(w);
      pushHistory();
      const adjTxt = res.adj.length
        ? ' Aby obvod zavřel, upravil jsem délku: ' +
          res.adj.map(a => `úsek ${a.i+1} ${a.delta > 0 ? '+' : ''}${fmt(a.delta)} mm`).join(', ') + '.'
        : '';
      const gapTxt = res.gap > 1
        ? ` Obvod se ale pořád nesešel o ${fmt(res.gap)} mm – zkontroluj délky protilehlých stran.`
        : '';
      toast('Srovnáno do pravých úhlů – orientace zůstala, jak jsi ji nakreslil.' + adjTxt + gapTxt);
    };
    $('#wClose').onclick = () => { w.closed = !w.closed; pushHistory(); render(); };
    $('#wDel').onclick = deleteSelection;
    return;
  }

  if(S.sel?.kind==='guide'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    if(!g){ S.sel = null; return renderInspector(); }
    const L = Math.hypot(g.b.x-g.a.x, g.b.y-g.a.y);
    const horiz = Math.abs(g.a.y-g.b.y) <= Math.abs(g.a.x-g.b.x);
    box.innerHTML = `
      <div class="insp-title"><i class="tool-dot" style="background:#c2410c"></i><strong>${esc(g.name||'Odstupová čára')}</strong></div>
      <div class="insp-sec">
        <h4>Název</h4>
        <label class="fld"><input id="gName" maxlength="40" value="${esc(g.name||'')}"></label>
      </div>
      <div class="insp-sec">
        <h4>Poloha (mm)</h4>
        <div class="row2">
          <label class="fld"><span>${horiz?'Y':'X'}</span><input id="gPos" type="number" step="5" value="${Math.round(horiz?g.a.y:g.a.x)}"></label>
          <label class="fld"><span>Délka</span><input id="gLen" type="number" step="5" min="10" value="${Math.round(L)}"></label>
        </div>
        <p class="hint">Čára je ve výkresu nekonečná; délka určuje jen úsek pro kótu.</p>
      </div>
      <div class="insp-sec">
        <h4>Tisk</h4>
        <label class="chk"><input type="checkbox" id="gPrint" ${g.print?'checked':''}> Vytisknout do výkresu</label>
      </div>
      <div class="insp-sec">
        <h4>Úpravy</h4>
        <div class="insp-actions">
          <button class="tb danger full" id="gDel">🗑 Smazat</button>
        </div>
      </div>`;
    $('#gName').addEventListener('input', ev => { g.name = ev.target.value; });
    $('#gName').addEventListener('change', () => pushHistoryQuiet());
    $('#gPos').addEventListener('change', ev => {
      const v = +ev.target.value||0;
      if(horiz){ g.a.y = v; g.b.y = v; } else { g.a.x = v; g.b.x = v; }
      pushHistoryQuiet(); renderCanvas();
    });
    $('#gLen').addEventListener('change', ev => {
      const v = Math.max(10, +ev.target.value||10);
      if(horiz){ const c = (g.a.x+g.b.x)/2; g.a.x = R(c-v/2); g.b.x = R(c+v/2); }
      else { const c = (g.a.y+g.b.y)/2; g.a.y = R(c-v/2); g.b.y = R(c+v/2); }
      pushHistoryQuiet(); renderCanvas();
    });
    $('#gPrint').addEventListener('change', ev => { g.print = ev.target.checked; pushHistoryQuiet(); renderCanvas(); });
    $('#gDel').onclick = deleteSelection;
    return;
  }

  if(S.sel?.kind==='win'){
    const win = S.project.windows.find(x=>x.id===S.sel.id);
    if(!win){ S.sel = null; return renderInspector(); }
    const wall = S.project.walls.find(x=>x.id===win.wallId);
    const sg = wall ? wallSegments(wall)[win.seg] : null;
    const L = sg ? Math.round(segLength(sg)) : 0;
    const half = Math.round(Math.min(win.w,L)/2);
    box.innerHTML = `
      <div class="insp-title"><i class="tool-dot" style="background:#0ea5e9"></i><strong>Okno</strong></div>
      <div class="insp-sec">
        <h4>Šířka a poloha</h4>
        <label class="fld"><span>Šířka okna (mm)</span><input id="winW" type="number" step="50" min="100" value="${win.w}"></label>
        <label class="fld"><span>Střed od začátku úseku (mm)</span><input id="winOff" type="number" step="10" min="${half}" max="${L-half}" value="${Math.round(win.off)}"></label>
        <p class="hint">Zeď ${esc(wall?.name||'')} · úsek ${win.seg+1} (${fmt(L)} mm). Oknem můžeš táhnout podél zdi přímo ve výkresu.</p>
      </div>
      <div class="insp-actions"><button class="tb danger full" id="winDel">🗑 Smazat okno</button></div>`;
    $('#winW').addEventListener('change', ev => {
      win.w = Math.max(100, +ev.target.value||100);
      const s2 = wall ? wallSegments(wall)[win.seg] : null;
      if(s2){ const h2=Math.min(win.w,segLength(s2))/2; win.off=R(Math.max(h2,Math.min(win.off,segLength(s2)-h2))); }
      pushHistoryQuiet(); renderCanvas();
    });
    $('#winOff').addEventListener('change', ev => {
      win.off = R(Math.max(half, Math.min(+ev.target.value||0, L-half)));
      pushHistoryQuiet(); renderCanvas();
    });
    $('#winDel').onclick = deleteSelection;
    return;
  }

  if(S.sel?.kind==='sym'){
    const sm = S.project.symbols.find(x=>x.id===S.sel.id);
    if(!sm){ S.sel = null; return renderInspector(); }
    const OR = projectOrigin();
    box.innerHTML = `
      <div class="insp-title"><i class="tool-dot" style="background:${symType(sm.type).color}"></i><strong>${symType(sm.type).label}</strong></div>
      <div class="insp-sec">
        <h4>Značka instalace</h4>
        <label class="fld"><span>Typ</span><select id="symType">${SYMBOL_TYPES.map(t=>`<option value="${t.id}" ${t.id===sm.type?'selected':''}>${t.code} – ${t.label}</option>`).join('')}</select></label>
        <label class="fld"><span>Poznámka (myčka, trouba, výška…)</span><input id="symNote" maxlength="40" value="${esc(sm.note)}" placeholder="např. myčka +1200"></label>
        <p class="hint">Poloha: ${fmt(Math.round(sm.x-OR.x))} / ${fmt(Math.round(sm.y-OR.y))} mm od rohu obvodu. Značkou lze táhnout.</p>
      </div>
      <div class="insp-sec">
        <h4>Přesná poloha od zdi</h4>
        ${sm.wallId != null ? (()=>{ const wa=S.project.walls.find(x=>x.id===sm.wallId);
          const nSeg=wa?wallSegments(wa).length:0; return `
          <label class="fld"><span>Zeď</span><select id="symWall">${S.project.walls.map(w2=>`<option value="${w2.id}" ${w2.id===sm.wallId?'selected':''}>${esc(w2.name||'zeď')}</option>`).join('')}</select></label>
          <label class="fld"><span>Úsek</span><select id="symSeg">${Array.from({length:nSeg},(_,i)=>`<option value="${i}" ${i===(+sm.seg||0)?'selected':''}>${i+1}</option>`).join('')}</select></label>
          <div class="row2">
            <label class="fld"><span>Od začátku úseku (mm)</span><input id="symAlong" type="number" step="10" min="0" value="${Math.round(sm.along||0)}"></label>

/* ═════════════════════════ 3D EXPORT (OBJ + MTL v ZIP) ═════════════════════════
   Z přesného 2D plánku postaví 3D model (metry) – skříně (spodní/horní/sloupy
   podle názvu a pole „Výška“), bok+, pracovní desky nad souvislými řadami,
   stěny se skutečnými okenními otvory, podlaha a strop. Soubor se stáhne jako
   ZIP (model.obj + model.mtl + návod). Rozměry odpovídají plánku 1:1. */

const B3D = {
  wallH:    2600,   // výška místnosti / zdí [mm]
  ceilT:    120,    // tloušťka stropní desky [mm]
  floorT:   120,    // tloušťka podlahové desky [mm]
  pad:      600,    // přesah podlahy/stropu přes obrys [mm]
  sill:     950,    // parapet okna [mm]
  winTop:   2450,   // horní hrana okna [mm]
  baseH:    720,    // spodní skříň (bok DS = 720 × 510) [mm]
  upperH:   710,    // horní skříň [mm]
  upperBot: 1400,   // spodní hrana horních skříněk [mm]
  colH:     2100,   // sloup [mm]
  fridgeH:  2030,   // sloup s lednicí [mm]
  counterT: 30,     // tloušťka pracovní desky [mm] (DS: 150 + 720 + 30 = 900)
  sokl:     150     // výška čelního soklu pod spodními skříněmi [mm]
};

/* Druh prvku – spodní / horní skříň (sloup se odvozuje z názvu). */
const EL_WALL_GAP = 50;    // mezera zadní hrany spodní skříně od zdi [mm]
const UP_D_DFLT   = 320;   // hloubka horní skříně po přepnutí [mm]
const UP_H_DFLT   = 710;   // výška horní skříně po přepnutí [mm]
const SOKL_RESERVE = 100;  // rezerva k délce soklu [mm] NA KAŽDÝ KUS

/* ── verze výchozího ceníku (kvůli migraci starých projektů) ── */

   a při změně výchozích cen se automaticky přepíše na nové. */

var PRICE_OLD_NAMES = { back:'Zadní díl – sololit 3 mm' };

function hexRgb(h){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h||'').trim());
  if(!m) return '0.85 0.83 0.80';
  const n = parseInt(m[1], 16);
  return [(n>>16)&255, (n>>8)&255, n&255].map(v => R(v/255)).join(' ');
}
function san3(s){ return String(s??'').replace(/[^A-Za-z0-9_.\-]/g,'_').slice(0,28); }

/* Odvození druhu a výšky prvku podle názvu/poznámky („Výška“ v inspektoru
   hodnotu přepíše). */
function guessKind3(e){
  const n = ((e.name||'') + ' ' + (e.note||'')).toLowerCase();
  if(/sloup|sloupc/.test(n) || /lednic|chladnic|mraz|troub|mikrovl|vinoték|vinotek/.test(n)) return 'column';
  if(/horn|nástěnn|nasteen|vrchn|vrni/.test(n)) return 'upper';
  return 'base';
}
/* Druh prvku: přednost má přepínač uživatele (e.kind), jinak odhad z názvu. */
function elKind3(e){
  if(e.kind==='upper')  return 'upper';
  if(e.kind==='base')   return 'base';
  if(e.kind==='column') return 'column';   // ruční volba má vždy přednost
  return guessKind3(e);
}
const isUpperEl = e => elKind3(e)==='upper';
function defaultH3(e){
  const k = elKind3(e);
  if(k==='upper') return B3D.upperH;
  if(k==='column') return /lednic|chladnic|mraz/.test(((e.name||'')+' '+(e.note||'')).toLowerCase()) ? B3D.fridgeH : B3D.colH;
  return B3D.baseH;
}
function elH3(e){ const h = +e.h; return h>=100 ? h : defaultH3(e); }
function kindLabel3(e){
  const k = elKind3(e);
  return k==='upper' ? 'horní skříň' : k==='column' ? 'sloup' : 'spodní skříň';
}
/* Spodní hrana boxu prvku v [mm] (horní skříňky visí; ostatní stojí na podlaze). */
function elZ0(e){
  const k = elKind3(e);
  if(k==='upper')  return B3D.upperBot;
  if(k==='base')   return B3D.floorT + B3D.sokl;   // DS stojí na soklu 150
  return B3D.floorT;                                // sloup
}

/* Najde líc zdi nejblíž ZADNÍ hraně prvku (rovnoběžný úsek) a vrátí souřadnici
   toho líce (y u vodorovné zdi / x u svislé), nebo null. */
function wallFaceBehind(e){
  const f = e.front || 'jih';
  const horiz = (f==='jih' || f==='sever');      // zadní hrana vodorovná
  let back, a0, a1;
  if(f==='jih')      { back=e.y;         a0=e.x; a1=e.x+e.w; }
  else if(f==='sever'){ back=e.y+e.d;    a0=e.x; a1=e.x+e.w; }
  else if(f==='východ'){ back=e.x;       a0=e.y; a1=e.y+e.d; }
  else               { back=e.x+e.w;     a0=e.y; a1=e.y+e.d; }
  let best = null;
  for(const w of S.project.walls){
    for(const [aa,bb] of wallBandOutline(w)){
      const dx=bb.x-aa.x, dy=bb.y-aa.y, L=Math.hypot(dx,dy);
      if(L < 1) continue;
      const isH = Math.abs(dy) < Math.abs(dx);
      if(isH !== horiz) continue;
      const lo = horiz ? Math.min(aa.x,bb.x) : Math.min(aa.y,bb.y);
      const hi = horiz ? Math.max(aa.x,bb.x) : Math.max(aa.y,bb.y);
      if(Math.max(lo, a0) - 1 > Math.min(hi, a1)) continue;   // neleží za zadní hranou
      const face = horiz ? aa.y : aa.x;
      const d = Math.abs(face - back);
      if(!best || d < best.d - 1e-6) best = { d, face };
    }
  }
  return best ? best.face : null;
}

/* Přepne druh prvku. Horní skříň: přisune zadní hranu na líc zdi, hloubka 320,
   výška 710. Spodní: vrátí zadní hranu do mezery EL_WALL_GAP (50 mm) od zdi. */
function setElKind3(e, kind){
  e.kind = (kind==='upper') ? 'upper' : 'base';
  const f = e.front || 'jih';
  const face = wallFaceBehind(e);
  if(face == null){
    if(kind==='upper') e.h = UP_H_DFLT;
    pushHistory(); render();
    toast('Nenašel jsem zeď u prvku – změnil jsem jen druh, polohu uprav ručně');
    return;
  }
  if(kind==='upper'){
    if(f==='jih')       { e.y = R(face); e.d = UP_D_DFLT; }
    else if(f==='sever'){ e.d = UP_D_DFLT; e.y = R(face - UP_D_DFLT); }
    else if(f==='východ'){ e.x = R(face); e.w = UP_D_DFLT; }
    else                { e.w = UP_D_DFLT; e.x = R(face - UP_D_DFLT); }
    e.h = UP_H_DFLT;
  } else {
    if(f==='jih')       { e.y = R(face + EL_WALL_GAP); }
    else if(f==='sever'){ e.y = R(face - EL_WALL_GAP - e.d); }
    else if(f==='východ'){ e.x = R(face + EL_WALL_GAP); }
    else                { e.x = R(face - EL_WALL_GAP - e.w); }
    e.h = B3D.baseH;
  }
  /* bok+ se přizpůsobí druhu: HS u zdi (odskok 0), DS s odskokem 50 */
  if(bokAny(e)) e.bok.back = kind==='upper' ? 0 : BOK_BACK_DFLT;
  pushHistory(); render();
  toast(kind==='upper'
    ? 'Horní skříň: u zdi, hloubka ' + UP_D_DFLT + ' mm, výška ' + UP_H_DFLT + ' mm'
    : 'Spodní skříň: zadní hrana ' + EL_WALL_GAP + ' mm od zdi');
}

/* ── VRSTVY DS / HS ─────────────────────────────────────────────────────
   Sloupy (lednice/trouba…) se zobrazují v OBOU vrstvách; DS vrstva = spodní
   skříňky + sloupy, HS vrstva = horní skříňky + sloupy. */
function layerShowsEl(e){
  if(S.layer === 'all') return true;
  const k = elKind3(e);
  if(S.layer === 'DS') return k === 'base' || k === 'column';
  if(S.layer === 'HS') return k === 'upper' || k === 'column';
  return true;
}
function updLayerUI(){

    const b = document.getElementById('btnLayer' + l);

}
function setLayer(l){

  S.layer = l;

    const ee = getEl(S.sel.id);

  }

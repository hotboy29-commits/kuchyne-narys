<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Nárysy – prototyp pro iPad</title>
<style>
/* ═══════════════════════════════════════════════════════════
   Nárysy – prototyp pro iPad
   Bez externích fontů a knihoven: funguje i offline.
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#eceff3;
  --surface:#ffffff;
  --surface-2:#f4f6f8;
  --ink:#12161c;
  --ink-2:#5c6673;
  --ink-3:#8a93a0;
  --line:#dfe4ea;
  --line-2:#c9d1da;
  --accent:#0f62fe;
  --accent-ink:#ffffff;
  --accent-soft:#e5eeff;
  --guide:#c2410c;
  --dim:#0d6b5f;
  --wall:#2b3138;
  --danger:#c62828;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 10px 30px rgba(16,24,40,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
  overscroll-behavior:none;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}

/* Mřížka: inspektor je sloupec VPRAVO. (Dřív tu byl flex-direction:column,
   takže se inspektor vykresloval jako pruh ve spodní části obrazovky.) */
.app{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) var(--insp,320px);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:
    "top    top"
    "stage  insp"
    "status status";
}
.topbar{grid-area:top}
.stage{grid-area:stage}
.inspector{grid-area:insp}
.statusbar{grid-area:status}
.hidden{display:none !important}
.spacer{flex:1}

/* ───────── horní lišta ───────── */
.topbar{
  height:62px;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);
  overflow:hidden;                       /* nic se nesmí ztratit mimo obrazovku */
  min-width:0;
}

.chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--surface-2);cursor:pointer;min-width:0;max-width:230px;
  font-family:var(--font);
}
.chip:active{background:var(--accent-soft);border-color:var(--accent)}
.chip-k{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--ink-3)}
.chip-v{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}

/* nástroje */
.tools{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tool-btn{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:62px;padding:5px 8px;border:0;border-radius:9px;background:transparent;
  cursor:pointer;font-family:var(--font);color:var(--ink-2);touch-action:pan-y;
}
.tool-btn:active{background:rgba(15,98,254,.12)}
.tool-btn.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tool-ic{font-size:16px;line-height:1.1}
.tool-lb{font-size:10.5px;font-weight:600;white-space:nowrap}

/* tlačítka */
.group{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:0 0 auto}
.tb{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;min-width:40px;padding:0 11px;border:0;border-radius:9px;
  background:transparent;color:var(--ink);cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:600;touch-action:pan-y;
}
.tb:active{background:rgba(15,98,254,.12)}
.tb.wide{min-width:66px}
.tb.primary{background:var(--accent);color:var(--accent-ink)}
.tb.primary:active{background:#0b50d0}
.tb.danger{color:var(--danger);border:1px solid #f2c9c9}
.tb.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb[aria-pressed="false"]{opacity:.55}
.tb.full{grid-column:1 / -1}
.tb span{white-space:nowrap}
.insp-toggle{display:none}
.tb[disabled]{opacity:.4}

/* ───────── plátno ───────── */
.stage{flex:1;position:relative;min-height:0;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
/* plovoucí ovládání pohledu v pravém dolním rohu plátna */
.viewctl{
  position:absolute;right:14px;bottom:14px;z-index:25;
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  padding:6px;box-shadow:var(--shadow);
}
.vb{
  width:46px;height:44px;border:0;border-radius:10px;background:var(--surface-2);
  color:var(--ink);font-size:20px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.vb:active{background:var(--accent-soft);color:var(--accent)}
.vb.wide{font-size:12.5px;height:34px}

/* lišta pro dokončení rozkreslené zdi */
.drawbar{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);z-index:30;max-width:94vw;
}
.drawbar .db-info{font-size:12.5px;font-weight:600;color:var(--ink-2);padding:0 6px 0 4px;white-space:nowrap}
.drawbar .db-info b{color:var(--ink)}
.drawbar .tb{height:42px;font-size:13.5px;padding:0 14px;border:1px solid var(--line);background:var(--surface)}
.drawbar .tb.done{background:#12805c;border-color:#12805c;color:#fff;min-width:104px}
.drawbar .tb.close2{background:var(--accent-soft);color:var(--accent);border-color:#c3d9ff}
.drawbar .tb.cancel{color:var(--ink-3)}

.hintbar{
  position:absolute;left:0;right:0;bottom:0;padding:8px 14px;
  background:linear-gradient(to top,rgba(236,239,243,.96),rgba(236,239,243,0));
  color:var(--ink-2);font-size:12.5px;line-height:1.4;pointer-events:none;
}

/* ───────── inspektor ───────── */
.inspector{
  background:var(--surface);border-left:1px solid var(--line);
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 30px;
  min-width:0;
}
.insp-empty{color:var(--ink-3);font-size:13.5px;line-height:1.6}
.insp-empty h3{font-size:15px;color:var(--ink);margin:0 0 6px}
.insp-empty h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:16px 0 6px}
.insp-empty ol{margin:0;padding-left:18px}
.insp-empty li{margin-bottom:5px}
.insp-empty b{color:var(--ink-2)}

.insp-title{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.insp-title .tool-dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,.18)}
.insp-title strong{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.tool-dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.18);display:inline-block}

.insp-sec{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.insp-sec:last-child{border-bottom:0}
.insp-sec>h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 9px}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin:8px 0 0}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.fld:last-child{margin-bottom:0}
.fld>span{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:var(--radius-s);
  background:var(--surface);font-family:var(--font);font-size:14px;color:var(--ink);
}
.fld textarea{resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg-row{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.seg-row>span{font-size:12.5px}
.seg-len{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3)}
.seg-len input{width:88px;padding:6px 8px;text-align:right}

/* hlavička inspektoru s editovatelným názvem rovnou v titulku */
.insp-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.insp-name{
  font-size:16px;font-weight:700;color:var(--ink);border:1px solid transparent;
  border-radius:8px;padding:5px 7px;background:transparent;width:100%;font-family:var(--font);
}
.insp-name:hover{border-color:var(--line)}
.insp-name:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface);border-color:var(--accent)}
.insp-kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding-left:7px;border-left:3px solid var(--k,var(--line-2))}

.big-stat{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:11px 13px;margin-bottom:16px;
}
.big-stat span{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.big-stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big-stat i{font-size:12px;font-style:normal;color:var(--ink-3);margin-left:4px;font-weight:600}

/* seznam úseků */
.seg-list{display:flex;flex-direction:column;gap:6px}
.seg-item{display:flex;align-items:center;gap:8px;margin:0}
.seg-n{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--ink-2);
}
.seg-item input{
  flex:1;min-width:0;text-align:right;padding:8px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--font);
}
.seg-item input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg-u{font-size:11.5px;color:var(--ink-3);flex:0 0 auto}

.inline-row{display:flex;gap:8px;align-items:stretch}
.inline-row .tb{border:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.inline-fld{display:flex;align-items:center;gap:6px;margin:0}
.inline-fld input{width:88px;text-align:right;padding:8px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:14px;font-variant-numeric:tabular-nums;font-family:var(--font)}
.inline-fld span{font-size:11.5px;color:var(--ink-3)}
.mini-select{margin-top:8px;width:100%;padding:7px 9px;border:1px solid var(--line-2);
  border-radius:8px;font-size:12.5px;color:var(--ink-2);background:var(--surface);font-family:var(--font)}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw-btn{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw-btn.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

.insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp-actions .tb{border:1px solid var(--line);background:var(--surface);width:100%}
.insp-actions .tb.danger{color:var(--danger);border-color:#f2c9c9}
.insp-actions .tb.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--accent)}

/* ───────── stavová lišta ───────── */
.statusbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:14px;
  padding:0 14px;background:var(--surface);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}
.snapctl{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3)}
.snapctl input[type=range]{width:150px;accent-color:var(--accent)}
.snapctl b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px}

/* ───────── modaly ───────── */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(16,24,40,.42);padding:20px}
.sheet{
  width:min(720px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;
}
.sheet.narrow{width:min(430px,100%)}
.sheet header h2{margin:0 0 4px;font-size:19px}
.sheet header p{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .grid .span2{grid-column:1 / -1}
.sheet footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.sheet footer .tb{border:1px solid var(--line);background:var(--surface)}
.sheet footer .tb.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ───────── toast ───────── */
.toast{
  position:fixed;left:50%;bottom:70px;transform:translate(-50%,14px);
  background:#12161c;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:80;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ───────── užší okna a iPad ───────── */
@media (max-width:1180px){
  .app{--insp:280px}
  .chip{max-width:170px}
  .tb .lb{display:none}          /* u tlačítek zůstanou jen ikony */
  .tb{min-width:40px;padding:0 9px}
}
@media (max-width:1000px){
  .tool-lb{display:none}
  .tool-btn{min-width:46px}
  .chip{max-width:130px}
  .chip-k{display:none}
}
@media (max-width:760px){
  .app{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"top" "stage" "status";
  }
  .inspector{
    position:fixed;top:62px;bottom:42px;right:0;width:min(320px,88vw);
    box-shadow:var(--shadow);z-index:20;transform:translateX(102%);
    transition:transform .18s ease;
  }
  .inspector.open{transform:translateX(0)}
  .insp-toggle{display:inline-flex !important}
}

/* ═══════════════════════ TISK / PDF ═══════════════════════ */

#printRoot{display:none}

.pr-page{
  background:#fff;color:#111;page-break-after:always;overflow:hidden;
  print-color-adjust:exact;-webkit-print-color-adjust:exact;
  font-family:Helvetica,Arial,sans-serif;
}
.pr-page:last-child{page-break-after:auto}
.pr-page.cover{page:coverPage}

.pr-cover-head{border-bottom:2.2pt solid #111;padding-bottom:7mm;margin-bottom:9mm}
.pr-kicker{font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:#666;margin-bottom:3mm}
.pr-title{font-size:26pt;line-height:1.15;margin:0;letter-spacing:-.01em}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm 12mm}
.pr-block h3{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:0 0 2mm}
.pr-block p{margin:0;font-size:11pt;line-height:1.5;white-space:pre-wrap;color:#111}
.pr-notes{margin-top:10mm;border-top:.6pt solid #ccc;padding-top:5mm}
.pr-notes h3{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#777;margin:0 0 3mm}
.pr-notes p{margin:0;font-size:10.5pt;line-height:1.55;white-space:pre-wrap}
.pr-cover-foot{
  position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  border-top:.6pt solid #ccc;padding-top:4mm;font-size:8.5pt;color:#666;
}
.pr-page.cover{position:relative}

.pr-head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1.4pt solid #111;padding-bottom:3mm;margin-bottom:5mm}
.pr-head h2{margin:1mm 0 0;font-size:15pt;letter-spacing:-.01em}
.pr-meta{font-size:8.5pt;color:#555;text-align:right;line-height:1.5}
.pr-drawing{display:flex;justify-content:center;align-items:center}
.pr-drawing svg{max-width:100%;height:auto}
.pr-legend{display:flex;flex-wrap:wrap;gap:4mm 7mm;margin-top:5mm;font-size:8.5pt;color:#333;
  border-top:.6pt solid #ccc;padding-top:3mm}
.lg{display:inline-flex;align-items:center;gap:2mm}
.lg .sw{width:4mm;height:4mm;border-radius:.6mm;display:inline-block;flex:0 0 auto}
.pr-notes-inline{margin-top:3mm;font-size:9pt;color:#444;line-height:1.5}
.pr-foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
  border-top:.6pt solid #ccc;padding-top:3mm;font-size:8pt;color:#666}
.pr-page:not(.cover){position:relative}

.pr-table{width:100%;border-collapse:collapse;font-size:9pt}
.pr-table th{text-align:left;font-size:7.5pt;letter-spacing:.1em;text-transform:uppercase;
  color:#666;border-bottom:1pt solid #111;padding:2mm 2mm}
.pr-table td{border-bottom:.4pt solid #ddd;padding:2.2mm 2mm;vertical-align:top}
.pr-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-table tfoot td{border-bottom:0;border-top:1pt solid #111;font-weight:700}
.pr-tdot{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.5mm;margin-right:2mm;vertical-align:-0.2mm}

@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  .app,.toast,#fileInput,#modalProject,#modalRoom{display:none !important}
  #printRoot{display:block}
  .pr-page{margin:0;box-shadow:none}
}

/* označená stěna v seznamu úseků */
.seg-item.active { border-color:#2563eb; background:#eff6ff; }
.seg-item.active .seg-n { background:#2563eb; color:#fff; }
.statusbar #appVer { opacity:.45; font-size:11px; margin-left:10px; white-space:nowrap; }

</style>
</head>
<body>

<div class="app">

  <!-- ── horní lišta ── -->
  <header class="topbar">
    <button class="chip" id="btnProjectInfo" title="Název projektu a kontaktní údaje">
      <span class="chip-k">PROJEKT</span><span class="chip-v" id="projTitle">Nový nárys</span>
    </button>

    <nav class="tools" id="tools" aria-label="Nástroje"></nav>

    <div class="spacer"></div>

    <div class="group">
      <button class="tb" id="btnUndo" title="Zpět (⌘Z)">↶</button>
      <button class="tb" id="btnRedo" title="Vpřed (⇧⌘Z)">↷</button>
    </div>

    <div class="group">
      <button class="tb toggle" id="btnGrid" aria-pressed="true" title="Mřížka 50 / 500 mm">▦</button>
      <button class="tb toggle" id="btnDims" aria-pressed="true" title="Kóty">↔</button>
      <button class="tb toggle" id="btnMagnet" aria-pressed="true" title="Magnetické přichytávání">🧲</button>
    </div>

    <div class="group">
      <button class="tb" id="btnRoomTool" title="Obdélníková místnost">▢<span class="lb">Místnost</span></button>
      <button class="tb" id="btnImport" title="Načíst ze souboru JSON">↥<span class="lb">Načíst</span></button>
      <button class="tb" id="btnSave" title="Uložit do souboru JSON">↧<span class="lb">Uložit</span></button>
      <button class="tb primary" id="btnPdf" title="Export do PDF">⎙<span class="lb">PDF</span></button>
    </div>

    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </header>

  <!-- ── plátno ── -->
  <main class="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="root">
        <g id="layerGrid"></g>
        <g id="layerWalls"></g>
        <g id="layerElems"></g>
        <g id="layerGuides"></g>
        <g id="layerDims" style="pointer-events:none"></g>
        <g id="layerUI"></g>
      </g>
    </svg>

    <!-- ovládání pohledu – vždy viditelné na plátně -->
    <div class="viewctl">
      <button class="vb" id="btnZoomIn"  title="Přiblížit" aria-label="Přiblížit">+</button>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Nárysy – prototyp pro iPad
   Půdorys (pohled shora), jednotky v milimetrech.
   Model: ZDI (lomené čáry s tloušťkou) + OBDELNIKY + ODSTUPOVE CARY.
   Žádné externí knihovny: SVG + Pointer Events + nativní tisk do PDF.
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';

/* ─────────────────────────── 1. KONSTANTY ─────────────────────────── */

const STORE_KEY = 'narysy-v2';
const SNAP_MM_DEFAULT = 40;      // výchozí dosah magnetu [mm skutečnosti]
const MIN_SIZE = 1;              // minimální rozměr [mm] – jde až na 1 mm
const APP_VERSION = '2026-08-29b'; // viditelné v liště dole – ať jde poznat, co je nasazeno
const GAP_TOL = 3;               // tolerance „dotyku“ pro celkové kóty [mm]
const HISTORY_MAX = 100;
const WALL_T_DEFAULT = 120;      // výchozí tloušťka zdi [mm]
const GRID_MM = 50;

/* Barvy obdélníků – uživatel volí, žádné přednastavené „typy“. */
const COLORS = ['#4a5568','#3b82f6','#0ea5e9','#14b8a6','#22c55e','#f59e0b',
                '#ef4444','#8b5cf6','#b08968','#64748b'];

const FRONTS = ['jih','západ','sever','východ'];
const FRONT_VEC = { jih:[0,1], západ:[-1,0], sever:[0,-1], východ:[1,0] };

/* Papíry ve SKUTEČNÝCH rozměrech [mm]. ix/iy = plocha pro výkres po odečtení
   okrajů, záhlaví a legendy. */
const PAPER = {
  'A4':  { w:210, h:297 },
  'A4L': { w:297, h:210 },
  'A3':  { w:297, h:420 },
  'A3L': { w:420, h:297 }
};
/* Tloušťky čar na papíře [mm] – technický výkres, ne fixy. */
const PEN = { wall:0.50, el:0.35, guide:0.18, dim:0.18, tick:0.25, scale:0.35 };

/* ─────────────────────────── 2. STAV ─────────────────────────── */

const S = {
  project: newProject(),
  sel: null,                 // {kind:'el'|'wall'|'guide', id}
  hover: null,
  tool: 'select',            // select | rect | wall | guide | measure
  view: { zoom: 0.25, tx: 0, ty: 0 },
  snapMm: SNAP_MM_DEFAULT,
  magnet: true,
  showGrid: true,
  showDims: true,
  guides: [],                // dočasná magnetická vodítka během tažení
  draft: null,               // rozkreslená zeď / obdélník / odstup
  measure: null
};

function newProject(){
  return {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    info: {
      name:'', client:'', clientPhone:'', address:'', designer:'', designerContact:'',
      date: new Date().toISOString().slice(0,10), paper:'A3L', notes:''
    },
    walls: [],
    elements: [],
    guides: [],
    created: new Date().toISOString()
  };
}

/* ─────────────────────────── 3. POMOCNÉ FUNKCE ─────────────────────────── */

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = n => Math.round(n).toLocaleString('cs-CZ').replace(/\u00A0|\u202F/g,' ');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = n => Math.round(n*100)/100;

function bbox(e){ return { x:e.x, y:e.y, w:e.w, h:e.d }; }
function rectsTouch(a, b, tol=0){
  return a.x < b.x+b.w+tol && a.x+a.w+tol > b.x && a.y < b.y+b.h+tol && a.y+a.h+tol > b.y;
}

/** Úsečky středové osy zdi. */
function wallSegments(w){
  const pts = w.pts, segs = [];
  const n = w.closed ? pts.length : pts.length - 1;
  for(let i=0;i<n;i++){
    const a = pts[i], b = pts[(i+1) % pts.length];
    if(a.x===b.x && a.y===b.y) continue;
    segs.push({ a, b, i });
  }
  return segs;
}
function segNormal(s){
  const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y, L = Math.hypot(dx,dy) || 1;
  return { nx: -dy/L, ny: dx/L };
}
function segLength(s){ return Math.hypot(s.b.x - s.a.x, s.b.y - s.a.y); }
function polygonArea(pts){
  let a = 0;
  for(let i=0;i<pts.length;i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return a/2;
}
/** Nejbližší bod úsečky + vzdálenost. */
function closestOnSeg(px,py,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L2 = dx*dx+dy*dy || 1;
  let t = ((px-a.x)*dx + (py-a.y)*dy)/L2;
  t = clamp(t,0,1);
  const x = a.x + t*dx, y = a.y + t*dy;
  return { x, y, d: Math.hypot(px-x, py-y), t };
}
/** Protíná úsečka obdélník? (pro zákaz protažení prvku zdí) */
function segHitsRect(a, b, r){
  const inside = p => p.x >= r.x && p.x <= r.x+r.w && p.y >= r.y && p.y <= r.y+r.h;
  if(inside(a) || inside(b)) return true;
  const corners = [ {x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h} ];
  for(let i=0;i<4;i++){
    if(segIntersect(a, b, corners[i], corners[(i+1)%4])) return true;
  }
  return false;
}
function segIntersect(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d) < 1e-12) return false;
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x)) / d;
  const u = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x)) / d;
  return t >= -1e-9 && t <= 1+1e-9 && u >= -1e-9 && u <= 1+1e-9;
}
/** Leží prvek v překryvu se zdí (středová osa + půl tloušťky)? */
function elementHitsWall(e, wall){
  /* -1 mm: prvek, který přesně dosedá na líc, se dotýká středové osy jen
     „na hraně“ a nesmí být vyhodnocen jako překryv – jinak magnet ke zdi
     nikdy neprojde. */
  const half = Math.max(0, (wall.t || WALL_T_DEFAULT)/2 - 1);
  const r = { x:e.x-half, y:e.y-half, w:e.w+half*2, h:e.d+half*2 };
  return wallSegments(wall).some(s => segHitsRect(s.a, s.b, r));
}

/* ─────────────────────────── 4. SOUŘADNICE / POHLED ─────────────────────────── */

const svg = () => $('#svg');

function screenToWorld(cx, cy){
  const r = svg().getBoundingClientRect();
  return { x: (cx - r.left - S.view.tx) / S.view.zoom,
           y: (cy - r.top  - S.view.ty) / S.view.zoom };
}
function worldToScreen(x, y){
  const r = svg().getBoundingClientRect();
  return { x: x*S.view.zoom + S.view.tx + r.left, y: y*S.view.zoom + S.view.ty + r.top };
}
function viewBBox(){
  const r = svg().getBoundingClientRect();
  const x = -S.view.tx / S.view.zoom, y = -S.view.ty / S.view.zoom;
  return { x, y, w: r.width / S.view.zoom, h: r.height / S.view.zoom };
}
function contentBBox(){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, any=false;
  for(const w of S.project.walls){
    const h = (w.t||WALL_T_DEFAULT)/2;
    for(const p of w.pts){ x0=Math.min(x0,p.x-h); y0=Math.min(y0,p.y-h); x1=Math.max(x1,p.x+h); y1=Math.max(y1,p.y+h); any=true; }
  }
  for(const e of S.project.elements){
    x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+e.w); y1=Math.max(y1,e.y+e.d); any=true;
  }
  for(const g of S.project.guides){
    for(const p of [g.a,g.b]){ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); any=true; }
  }
  return any ? { x:x0, y:y0, w:x1-x0, h:y1-y0 } : null;
}
function fitView(padMm=400){
  const b = contentBBox();
  const r = svg().getBoundingClientRect();
  if(!b || !r.width || !r.height) return;
  const z = Math.min((r.width - 40) / (b.w + padMm*2), (r.height - 40) / (b.h + padMm*2));
  S.view.zoom = clamp(z, 0.01, 8);
  S.view.tx = r.width/2  - (b.x + b.w/2) * S.view.zoom;
  S.view.ty = r.height/2 - (b.y + b.h/2) * S.view.zoom;
  render();
}
function zoomAt(cx, cy, z){
  const r = svg().getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const wx = (px - S.view.tx)/S.view.zoom, wy = (py - S.view.ty)/S.view.zoom;
  S.view.zoom = clamp(z, 0.01, 8);
  S.view.tx = px - wx*S.view.zoom;
  S.view.ty = py - wy*S.view.zoom;
  render();
}
function viewCenter(){
  const r = svg().getBoundingClientRect();
  return screenToWorld(r.left + r.width/2, r.top + r.height/2);
}

/* ─────────────────────────── 5. RENDER ─────────────────────────── */

let renderQueued = false;
function render(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; doRender(); });
}

function doRender(){
  /* dokud netáhneš, držíme celý nákres ukotvený v počátku (0,0) */
  if(!drag) rebaseProject();
  const v = S.view;
  $('#zoomLabel').textContent = Math.round(v.zoom*100) + ' %';
  const el = $('#svg');
  el.setAttribute('viewBox', `0 0 ${el.clientWidth||1200} ${el.clientHeight||800}`);
  $('#root').setAttribute('transform', `translate(${v.tx},${v.ty}) scale(${v.zoom})`);
  $('#layerGrid').innerHTML   = S.showGrid ? gridMarkup() : '';
  $('#layerWalls').innerHTML  = wallsMarkup();
  $('#layerElems').innerHTML  = elementsMarkup() + guidesMarkup();
  $('#layerGuides').innerHTML = snapGuidesMarkup() + draftMarkup();
  /* přepínač Kóty řídí jen celkové kóty; kóty vybrané zdi svítí vždy */
  $('#layerDims').innerHTML   = dimsMarkup();
  $('#layerUI').innerHTML     = uiMarkup();
  renderInspector();
  updateStatus();
  updateDrawbar();
}

/** Lišta s tlačítky pro dokončení rozkreslené zdi – dvojklik není nutný. */
function updateDrawbar(){
  const bar = $('#drawbar');
  if(!bar) return;
  const d = S.draft;
  if(!d || d.kind !== 'wall' || d.pts.length < 1){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  const n = d.pts.length;
  let len = 0;
  for(let i=1;i<n;i++) len += Math.hypot(d.pts[i].x-d.pts[i-1].x, d.pts[i].y-d.pts[i-1].y);
  bar.classList.remove('hidden');
  const info = n === 0
    ? 'Klikni první bod zdi'
    : `Zeď · <b>${n}</b> ${n===1?'bod':(n<5?'body':'bodů')} · <b>${fmt(len)}</b> mm`;
  bar.innerHTML = `
    <span class="db-info">${info}</span>
    <button class="tb" id="dbUndo" ${n<2?'disabled style="opacity:.4"':''}>↩ Zpět</button>
    ${n>=3 ? '<button class="tb close2" id="dbClose">⌐ Uzavřít</button>' : ''}
    <button class="tb done" id="dbDone" ${n<2?'disabled style="opacity:.4"':''}>✓ Hotovo</button>
    <button class="tb cancel" id="dbCancel">✕</button>`;
  $('#dbUndo').onclick   = undoWallPoint;
  $('#dbDone').onclick   = () => finishWall(false);
  $('#dbCancel').onclick = () => { S.draft = null; render(); toast('Kresba zdi zrušena'); };
  const c = $('#dbClose'); if(c) c.onclick = () => finishWall(true);
}

function gridMarkup(){
  const v = viewBBox();
  const step = GRID_MM;
  const parts = [];
  const x0 = Math.floor(v.x/step)*step, x1 = v.x + v.w;
  const y0 = Math.floor(v.y/step)*step, y1 = v.y + v.h;
  const major = 500;
  for(let x=x0; x<=x1; x+=step){
    const isM = Math.abs(x % major) < 0.5;
    parts.push(`<line x1="${x}" y1="${v.y}" x2="${x}" y2="${y1}" stroke="${isM?'#cbd5e1':'#eef2f6'}" stroke-width="${(isM?1:0.6)/v.zoom}"/>`);
  }
  for(let y=y0; y<=y1; y+=step){
    const isM = Math.abs(y % major) < 0.5;
    parts.push(`<line x1="${v.x}" y1="${y}" x2="${x1}" y2="${y}" stroke="${isM?'#cbd5e1':'#eef2f6'}" stroke-width="${(isM?1:0.6)/v.zoom}"/>`);
  }
  return parts.join('');
}

function wallsMarkup(){
  const z = S.view.zoom;
  return S.project.walls.map(w => {
    if(w.pts.length < 2) return '';
    const t = w.t || WALL_T_DEFAULT;
    const d = w.pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + (w.closed?' Z':'');
    const sel = S.sel?.kind==='wall' && S.sel.id===w.id;
    /* označená jednotlivá stěna (úsek) se zvýrazní modrým pásem */
    let hl = '';
    if(sel && S.sel.seg != null && w.pts[S.sel.seg] && w.pts[S.sel.seg+1]){
      const a = w.pts[S.sel.seg], b = w.pts[S.sel.seg+1];
      hl = `<path d="M${a.x} ${a.y} L${b.x} ${b.y}" fill="none" stroke="#2563eb"
            stroke-width="${t + 10/z}" stroke-linecap="square" opacity="0.5"/>`;
    }
    /* každá stěna má vlastní klikací pás → označíš ji jednotlivě */
    const hits = wallSegments(w).map((sg,i)=>`<path d="M${sg.a.x} ${sg.a.y} L${sg.b.x} ${sg.b.y}"
      fill="none" stroke="transparent" stroke-width="${Math.max(t, 24/z)}"
      data-wallseg="${w.id}:${i}" style="cursor:pointer"/>`).join('');
    return `<g data-wall="${w.id}">
      <path d="${d}" fill="${w.closed?'#f8fafc':'none'}" stroke="${sel?'#2563eb':'#2b3138'}"
            stroke-width="${t}" stroke-linejoin="miter" stroke-linecap="square"/>
      ${hl}
      <path d="${d}" fill="none" stroke="transparent" stroke-width="${Math.max(t, 24/z)}" data-wallhit="${w.id}" style="cursor:pointer"/>
      ${hits}
    </g>`;
  }).join('');
}

function elementsMarkup(){
  const z = S.view.zoom;
  return S.project.elements.map(e => {
    const sel = S.sel?.kind==='el' && S.sel.id===e.id;
    const fs = clamp(Math.min(e.w, e.d)/5, 90, 320);
    const c = e.color || COLORS[0];
    const fv = FRONT_VEC[e.front||'jih'];
    const m = Math.min(80, e.w*0.14, e.d*0.14);
    let dl = '';
    if(fv[1]===1)  dl = `M${e.x+m} ${e.y+e.d-m} H${e.x+e.w-m}`;
    if(fv[1]===-1) dl = `M${e.x+m} ${e.y+m} H${e.x+e.w-m}`;
    if(fv[0]===1)  dl = `M${e.x+e.w-m} ${e.y+m} V${e.y+e.d-m}`;
    if(fv[0]===-1) dl = `M${e.x+m} ${e.y+m} V${e.y+e.d-m}`;
    return `<g data-el="${e.id}">
      <rect x="${e.x}" y="${e.y}" width="${Math.max(e.w,1)}" height="${Math.max(e.d,1)}"
            fill="${c}22" stroke="${sel?'#2563eb':c}" stroke-width="${(sel?3.5:2)/z}" style="cursor:move"/>
      <path d="${dl}" stroke="${c}" stroke-width="${2/z}" fill="none" opacity=".8"/>
      <text x="${e.x+e.w/2}" y="${e.y+e.d/2 - fs*0.15}" text-anchor="middle" dominant-baseline="middle"
            font-size="${fs}" font-weight="700" fill="#111827"
            style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.22}px">${esc(e.name||'')}</text>
      <text x="${e.x+e.w/2}" y="${e.y+e.d/2 + fs*0.72}" text-anchor="middle" dominant-baseline="middle"
            font-size="${fs*0.62}" fill="#374151"
            style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.18}px">${fmt(e.w)} × ${fmt(e.d)}</text>
    </g>`;
  }).join('');
}

function guidesMarkup(){
  const z = S.view.zoom;
  return S.project.guides.map(g => {
    const sel = S.sel?.kind==='guide' && S.sel.id===g.id;
    const ex = 1e5;                       // odstupová čára je „nekonečná“
    const dx = g.b.x-g.a.x, dy = g.b.y-g.a.y;
    const L = Math.hypot(dx,dy) || 1;
    const ux = dx/L, uy = dy/L;
    const a = { x:g.a.x-ux*ex, y:g.a.y-uy*ex }, b = { x:g.b.x+ux*ex, y:g.b.y+uy*ex };
    return `<g data-guide="${g.id}">
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${sel?'#2563eb':'#c2410c'}"
            stroke-width="${(sel?2.4:1.6)/z}" stroke-dasharray="${18/z} ${10/z}" opacity=".9"/>
      <line x1="${g.a.x}" y1="${g.a.y}" x2="${g.b.x}" y2="${g.b.y}" stroke="transparent"
            stroke-width="${24/z}" data-guidehit="${g.id}" style="cursor:pointer"/>
    </g>`;
  }).join('');
}

function snapGuidesMarkup(){
  const z = S.view.zoom;
  return S.guides.map(g => g.axis==='x'
    ? `<line x1="${g.pos}" y1="${g.from}" x2="${g.pos}" y2="${g.to}" stroke="#2563eb" stroke-width="${1.4/z}" stroke-dasharray="${8/z} ${6/z}"/>`
    : `<line x1="${g.from}" y1="${g.pos}" x2="${g.to}" y2="${g.pos}" stroke="#2563eb" stroke-width="${1.4/z}" stroke-dasharray="${8/z} ${6/z}"/>`
  ).join('');
}

function draftMarkup(){
  const z = S.view.zoom, d = S.draft;
  if(!d) return '';
  if(d.kind==='wall'){
    const pts = d.pts;
    if(!pts.length){
      return `<circle cx="${d.cursor.x}" cy="${d.cursor.y}" r="${9/z}" fill="none"
        stroke="#2563eb" stroke-width="${2.5/z}"/>`;
    }
    const last = pts[pts.length-1];
    const segLen = Math.hypot(d.cursor.x-last.x, d.cursor.y-last.y);
    const path = pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ') + ` L${d.cursor.x} ${d.cursor.y}`;
    return `<path d="${path}" fill="none" stroke="#2563eb" stroke-width="${d.t}" opacity=".55" stroke-linejoin="miter"/>`
      + pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${10/z}" fill="#2563eb"/>`).join('')
      + `<circle cx="${d.cursor.x}" cy="${d.cursor.y}" r="${8/z}" fill="#2563eb" opacity=".5"/>`
      + (segLen > 20
          ? `<text x="${(last.x+d.cursor.x)/2}" y="${(last.y+d.cursor.y)/2 - 90/z}" text-anchor="middle"
               font-size="${clamp(170/z,110,400)}" font-weight="700" fill="#1d4ed8"
               style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${45/z}px">${fmt(segLen)}</text>`
          : '');
  }
  if(d.kind==='rect'){
    const r = normRect(d.a, d.b);
    return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#2563eb22" stroke="#2563eb" stroke-width="${2/z}" stroke-dasharray="${12/z} ${8/z}"/>
      <text x="${r.x+r.w/2}" y="${r.y+r.h/2}" text-anchor="middle" dominant-baseline="middle" font-size="${clamp(Math.min(r.w,r.h)/5,90,320)}" font-weight="700" fill="#1d4ed8" style="font-family:Helvetica,Arial,sans-serif">${fmt(r.w)} × ${fmt(r.h)}</text>`;
  }
  if(d.kind==='guide' || d.kind==='measure'){
    const col = d.kind==='guide' ? '#c2410c' : '#0d6b5f';
    return `<line x1="${d.a.x}" y1="${d.a.y}" x2="${d.b.x}" y2="${d.b.y}" stroke="${col}" stroke-width="${2/z}" stroke-dasharray="${12/z} ${8/z}"/>
      <text x="${(d.a.x+d.b.x)/2}" y="${(d.a.y+d.b.y)/2 - 120/z}" text-anchor="middle" font-size="${clamp(220/z,120,420)}" font-weight="600" fill="${col}" style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${60/z}px">${fmt(Math.hypot(d.b.x-d.a.x, d.b.y-d.a.y))}</text>`;
  }
  return '';
}

function dimText(x, y, str, color, px, rot=0){
  const z = S.view.zoom;
  const fs = px / z;
  return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}"
    fill="${color}" font-weight="600" transform="${rot?`rotate(${rot} ${x} ${y})`:''}"
    style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.28}px">${str}</text>`;
}

function dimLine(x1,y1,x2,y2,axis,color='#0d6b5f'){
  /* všechno kreslíme v „obrazových“ tloušťkách dělených zoomem, takže kóta
     je na displeji vždy stejně velká a při oddálení se nepromění v obra */
  const z = S.view.zoom;
  const len = axis==='x' ? Math.abs(x2-x1) : Math.abs(y2-y1);
  if(len < 20) return '';
  const sw = 1.2/z, tick = 5/z;
  const a1 = axis==='x' ? `M${x1} ${y1-tick} l${tick} ${tick} l${-tick} ${tick}`
                        : `M${x1-tick} ${y1} l${tick} ${tick} l${tick} ${-tick}`;
  const a2 = axis==='x' ? `M${x2} ${y2-tick} l${-tick} ${tick} l${tick} ${tick}`
                        : `M${x2+tick} ${y2} l${-tick} ${-tick} l${-tick} ${tick}`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}"/>
    <path d="${a1}" fill="${color}"/><path d="${a2}" fill="${color}"/>`
    + dimText((x1+x2)/2, (y1+y2)/2, fmt(len), color, 12, axis==='y'?-90:0);
}

function centroid(pts){
  let x=0, y=0;
  for(const p of pts){ x+=p.x; y+=p.y; }
  return { x:x/pts.length, y:y/pts.length };
}

/** Kóta podél úsečky – délka zdi přímo ve výkresu. U uzavřeného obvodu
 * sedí UVNITŘ místnosti těsně pod vnitřním lícem, aby se nikde nepletla;
 * text se otočí podél i šikmé úsečky. Vše v konstantní velikosti na displeji. */
function dimAlongSeg(sgm, wall, opts={}){
  const z = S.view.zoom;
  const len = segLength(sgm);
  if(len < 20) return '';
  const n = segNormal(sgm);
  const t = wall.t || WALL_T_DEFAULT;
  let sgn = opts.sgn != null ? opts.sgn : 1;
  if(wall.closed && opts.sgn == null){
    const c = centroid(wall.pts);
    const mx = (sgm.a.x+sgm.b.x)/2, my = (sgm.a.y+sgm.b.y)/2;
    sgn = (n.nx*(c.x-mx) + n.ny*(c.y-my)) > 0 ? 1 : -1;   // směrem dovnitř
  }
  const off = (opts.off != null ? opts.off : t/2 + 150) * sgn;
  const a = { x:sgm.a.x + n.nx*off, y:sgm.a.y + n.ny*off };
  const b = { x:sgm.b.x + n.nx*off, y:sgm.b.y + n.ny*off };
  const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI;
  const rot = (ang > 90 || ang < -90) ? ang + 180 : ang;
  const sw = (opts.w || 1.1)/z, tick = 5/z, fs = (opts.fs || 12.5)/z;
  const ux = (b.x-a.x)/len, uy = (b.y-a.y)/len;
  const qx = -uy, qy = ux;
  const ar = (pt,dir) => `M${pt.x+qx*tick} ${pt.y+qy*tick}
     l${-qx*tick + ux*tick*dir} ${-qy*tick + uy*tick*dir}
     l${qx*2*tick} ${qy*2*tick} Z`;
  const color = opts.color || '#0f62fe';
  return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${sw}"/>`
    + `<path d="${ar(a,1)}" fill="${color}"/><path d="${ar(b,-1)}" fill="${color}"/>`
    + `<text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" text-anchor="middle" dominant-baseline="middle"
        font-size="${fs}" font-weight="700" fill="${color}" transform="rotate(${rot} ${(a.x+b.x)/2} ${(a.y+b.y)/2})"
        style="font-family:Helvetica,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:${fs*0.3}px">${fmt(len)}</text>`;
}

function dimsMarkup(){
  const parts = [];
  /* celkové kóty obvodu a souvislých řad jen se zapnutým tlačítkem Kóty */
  if(S.showDims){
    for(const run of computeRuns())
      parts.push(dimLine(run.x1, run.y+520, run.x2, run.y+520, 'x', '#64748b'));
    const wb = wallsBBox();
    if(wb){
      parts.push(dimLine(wb.x, wb.y-420, wb.x+wb.w, wb.y-420, 'x', '#334155'));
      parts.push(dimLine(wb.x-420, wb.y, wb.x-420, wb.y+wb.h, 'y', '#334155'));
    }
  }
  /* šířka skříně jen u vybrané – při kreslení nic nepřekáží */
  if(S.sel?.kind === 'el'){
    const e = getEl(S.sel.id);
    if(e) parts.push(dimLine(e.x, e.y+e.d+160, e.x+e.w, e.y+e.d+160, 'x', '#0d6b5f'));
  }
  /* vybraná zeď: délky úseků UVNITŘ obvodu; označená stěna svítí */
  if(S.sel?.kind === 'wall'){
    const w = S.project.walls.find(x => x.id === S.sel.id);
    if(w) wallSegments(w).forEach((sg,i)=>{
      const selSeg = S.sel.seg == null ? null : S.sel.seg;
      parts.push(dimAlongSeg(sg, w, {
        color: selSeg === i ? '#0f62fe' : (selSeg == null ? '#0f62fe' : '#94a3b8'),
        w: selSeg === i ? 2 : 1.1,
        fs: selSeg === i ? 14 : 12
      }));
    });
  }
  return parts.join('');
}

/** Počátek projektu – levý horní roh vnějšího líce obvodu. Od něj se počítají
    souřadnice v inspektoru, aby to nebyla nesmyslně velká čísla. */
function projectOrigin(){
  const b = wallsBBox();
  if(b) return { x: Math.round(b.x), y: Math.round(b.y) };
  /* ještě žádné zdi – vezmeme za roh první obdélník, ať už od začátku
     nepracujeme s obrovskými souřadnicemi */
  let x0=Infinity, y0=Infinity, any=false;
  for(const e of S.project.elements){
    x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); any=true;
  }
  return any ? { x:Math.round(x0), y:Math.round(y0) } : { x:0, y:0 };
}

function wallsBBox(){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,any=false;
  for(const w of S.project.walls) for(const p of w.pts){
    x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); any=true;
  }
  return any ? { x:x0, y:y0, w:x1-x0, h:y1-y0 } : null;
}

/** Souvislé řady prvků ve stejné ose – pro celkové kóty. */
function computeRuns(){
  const els = [...S.project.elements].sort((a,b)=>a.x-b.x);
  const runs = [];
  for(const e of els){
    const cy = e.y + e.d/2;
    let run = runs.find(r => Math.abs(r.y - cy) < GAP_TOL && e.x - r.x2 <= GAP_TOL);
    if(run){ run.x2 = e.x + e.w; }
    else runs.push({ x1:e.x, x2:e.x+e.w, y:e.y+e.d, ids:[e.id] });
  }
  return runs.filter(r => r.x2 - r.x1 > GAP_TOL);
}

function uiMarkup(){
  const z = S.view.zoom, parts = [];
  if(S.sel?.kind==='el'){
    const e = getEl(S.sel.id);
    if(e){
      const hs = 14/z;
      const corners = [['nw',e.x,e.y],['ne',e.x+e.w,e.y],['sw',e.x,e.y+e.d],['se',e.x+e.w,e.y+e.d]];
      for(const [k,x,y] of corners){
        parts.push(`<rect data-handle="${k}" x="${x-hs/2}" y="${y-hs/2}" width="${hs}" height="${hs}"
          fill="#fff" stroke="#2563eb" stroke-width="${2/z}" style="cursor:${k==='nw'||k==='se'?'nwse-resize':'nesw-resize'}"/>`);
      }
    }
  }
  if(S.sel?.kind==='wall'){
    const w = S.project.walls.find(x=>x.id===S.sel.id);
    if(w) for(let i=0;i<w.pts.length;i++){
      parts.push(`<circle data-vtx="${i}" cx="${w.pts[i].x}" cy="${w.pts[i].y}" r="${12/z}"
        fill="#fff" stroke="#2563eb" stroke-width="${2.5/z}" style="cursor:grab"/>`);
    }
  }
  if(S.sel?.kind==='guide'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    if(g) for(const [k,p] of [['a',g.a],['b',g.b]]){
      parts.push(`<circle data-gpt="${k}" cx="${p.x}" cy="${p.y}" r="${12/z}"
        fill="#fff" stroke="#c2410c" stroke-width="${2.5/z}" style="cursor:grab"/>`);
    }
  }
  return parts.join('');
}

/* ─────────────────────────── 6. MAGNET ─────────────────────────── */

const KIND_RANK = { wall:0, guide:1, el:2 };

/** Seznam osouhlasných cílových čar, ke kterým se může prvek přichytit. */
function snapCandidates(excludeId){
  const out = [];
  for(const w of S.project.walls){
    const half = (w.t || WALL_T_DEFAULT)/2;
    for(const s of wallSegments(w)){
      const n = segNormal(s);
      for(const sgn of [1,-1]){
        const ax = s.a.x + n.nx*half*sgn, ay = s.a.y + n.ny*half*sgn;
        const bx = s.b.x + n.nx*half*sgn, by = s.b.y + n.ny*half*sgn;
        if(Math.abs(ax-bx) < 1e-6)      out.push({ axis:'x', pos:ax, from:Math.min(ay,by), to:Math.max(ay,by), kind:'wall', id:w.id, n, sgn });
        else if(Math.abs(ay-by) < 1e-6) out.push({ axis:'y', pos:ay, from:Math.min(ax,bx), to:Math.max(ax,bx), kind:'wall', id:w.id, n, sgn });
      }
    }
  }
  for(const g of S.project.guides){
    if(Math.abs(g.a.x-g.b.x) < 1e-6)      out.push({ axis:'x', pos:g.a.x, from:Math.min(g.a.y,g.b.y), to:Math.max(g.a.y,g.b.y), kind:'guide', id:g.id });
    else if(Math.abs(g.a.y-g.b.y) < 1e-6) out.push({ axis:'y', pos:g.a.y, from:Math.min(g.a.x,g.b.x), to:Math.max(g.a.x,g.b.x), kind:'guide', id:g.id });
  }
  for(const e of S.project.elements){
    if(e.id === excludeId) continue;
    out.push({ axis:'x', pos:e.x,      from:e.y, to:e.y+e.d, kind:'el', id:e.id });
    out.push({ axis:'x', pos:e.x+e.w,  from:e.y, to:e.y+e.d, kind:'el', id:e.id });
    out.push({ axis:'y', pos:e.y,      from:e.x, to:e.x+e.w, kind:'el', id:e.id });
    out.push({ axis:'y', pos:e.y+e.d,  from:e.x, to:e.x+e.w, kind:'el', id:e.id });
  }
  return out;
}

/**
 * Vrátí {x, y, guides:[…]} – přichycenou polohu prvku.
 * Pravidla: vyhrává NEJBLIŽŠÍ cíl; zeď má přednost při shodě;
 * prvek se nikdy neprotáhne zdí; mřížka jen když nic jiného nepřipadá v úvahu.
 */
function computeSnap(e, nx, ny, dxMoved, dyMoved){
  if(!S.magnet) return { x:nx, y:ny, guides:[] };
  const th = S.snapMm;
  const cands = snapCandidates(e.id);
  const shown = [];
  let bestX = null, bestY = null;

  const yLo = ny, yHi = ny + e.d, xLo = nx, xHi = nx + e.w;

  for(const c of cands){
    if(c.axis === 'x'){
      if(c.to < yLo - th || c.from > yHi + th) continue;
      for(const [edge, pos] of [['l', xLo], ['r', xHi]]){
        const d = c.pos - pos;
        if(Math.abs(d) > th) continue;
        const cand = { d:Math.abs(d), nx: nx + d, c, edge };
        if(!bestX || cand.d < bestX.d - 1e-9 ||
           (Math.abs(cand.d - bestX.d) < 1e-9 && KIND_RANK[c.kind] < KIND_RANK[bestX.c.kind])) bestX = cand;
      }
    } else {
      if(c.to < xLo - th || c.from > xHi + th) continue;
      for(const [edge, pos] of [['t', yLo], ['b', yHi]]){
        const d = c.pos - pos;
        if(Math.abs(d) > th) continue;
        const cand = { d:Math.abs(d), ny: ny + d, c, edge };
        if(!bestY || cand.d < bestY.d - 1e-9 ||
           (Math.abs(cand.d - bestY.d) < 1e-9 && KIND_RANK[c.kind] < KIND_RANK[bestY.c.kind])) bestY = cand;
      }
    }
  }

  /* Mřížka je záloha – skočí jen na ose, kde není zeď, odstup ani soused.
     Chytá obě osy zvlášť, aby se prvek choval předvídatelně i při šikmém tažení. */
  if(!bestX){
    const t = Math.round(nx/GRID_MM)*GRID_MM - nx;
    if(Math.abs(t) <= th) bestX = { d:Math.abs(t), nx:nx+t, c:{kind:'grid'}, edge:'l' };
  }
  if(!bestY){
    const t = Math.round(ny/GRID_MM)*GRID_MM - ny;
    if(Math.abs(t) <= th) bestY = { d:Math.abs(t), ny:ny+t, c:{kind:'grid'}, edge:'t' };
  }

  let x = nx, y = ny;
  if(bestX){
    const test = { ...e, x: bestX.nx, y };
    if(!blockedByWall(test, e)) { x = bestX.nx; pushGuide(shown, bestX, e, 'x'); }
  }
  if(bestY){
    const test = { ...e, x, y: bestY.ny };
    if(!blockedByWall(test, e)) { y = bestY.ny; pushGuide(shown, bestY, e, 'y'); }
  }
  return { x, y, guides: shown };
}

function pushGuide(out, cand, e, axis){
  if(cand.c.kind === 'grid') return;
  if(axis === 'x') out.push({ axis:'x', pos:cand.c.pos, from:Math.min(cand.c.from, e.y)-100, to:Math.max(cand.c.to, e.y+e.d)+100 });
  else             out.push({ axis:'y', pos:cand.c.pos, from:Math.min(cand.c.from, e.x)-100, to:Math.max(cand.c.to, e.x+e.w)+100 });
}

/** Neskončil by prvek v překryvu se zdí? */
function blockedByWall(test, orig){
  for(const w of S.project.walls){
    if(elementHitsWall(test, w) && !elementHitsWall(orig, w)) return true;
  }
  return false;
}

/** Přichytne bod (pro kreslení zdí a odstupů) na mřížku / konce zdí. */
function snapPoint(w, ortho=false){
  let best = { ...w, d:Infinity };
  const th = S.snapMm;
  const g = { x: Math.round(w.x/GRID_MM)*GRID_MM, y: Math.round(w.y/GRID_MM)*GRID_MM };
  if(Math.hypot(g.x-w.x, g.y-w.y) <= th) best = { ...g, d: Math.hypot(g.x-w.x, g.y-w.y) };
  for(const wall of S.project.walls) for(const p of wall.pts){
    const d = Math.hypot(p.x-w.x, p.y-w.y);
    if(d <= th && d < best.d) best = { x:p.x, y:p.y, d };
  }
  for(const el of S.project.elements){
    for(const p of [{x:el.x,y:el.y},{x:el.x+el.w,y:el.y},{x:el.x,y:el.y+el.d},{x:el.x+el.w,y:el.y+el.d}]){
      const d = Math.hypot(p.x-w.x, p.y-w.y);
      if(d <= th && d < best.d) best = { x:p.x, y:p.y, d };
    }
  }
  if(ortho && best.d === Infinity){
    best = { x: Math.round(w.x/GRID_MM)*GRID_MM, y: Math.round(w.y/GRID_MM)*GRID_MM, d:0 };
  }
  return best;
}

function normRect(a,b){
  return { x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y) };
}

/* ─────────────────────────── 7. INTERAKCE ─────────────────────────── */

let drag = null;

function onDown(ev){
  const t = ev.target;
  const w = screenToWorld(ev.clientX, ev.clientY);

  if(S.tool==='wall'){
    /* Bod se zapíše až při ZVEDNUTÍ prstu. Během stisknutí běží náhled, takže
       úsek vidíš táhnout za prstem dřív, než ho potvrdíš. */
    const sp = snapPoint(w, true);
    if(!S.draft || S.draft.kind !== 'wall'){
      S.draft = { kind:'wall', pts:[], cursor:{x:R(sp.x), y:R(sp.y)}, t:WALL_T_DEFAULT };
    } else {
      S.draft.cursor = { x:R(sp.x), y:R(sp.y) };
    }
    drag = { mode:'wallDraw' };
    render();
    return;
  }
  if(S.tool==='rect'){
    S.draft = { kind:'rect', a:w, b:w };
    drag = { mode:'rect' };
    return;
  }
  if(S.tool==='guide'){
    const s = snapPoint(w, true);
    S.draft = { kind:'guide', a:{x:s.x,y:s.y}, b:{x:s.x,y:s.y} };
    drag = { mode:'guide' };
    return;
  }
  if(S.tool==='measure'){
    S.measure = { a:w, b:w };
    S.draft = { kind:'measure', a:w, b:w };
    drag = { mode:'measure' };
    return;
  }

  // nástroj select
  const handle = t.dataset?.handle;
  if(handle && S.sel?.kind==='el'){
    const e = getEl(S.sel.id);
    hist.preDrag = snapshot();
    drag = { mode:'resize', handle, start:{...e}, a:w };
    return;
  }
  const vtx = t.dataset?.vtx;
  if(vtx !== undefined && S.sel?.kind==='wall'){
    hist.preDrag = snapshot();
    drag = { mode:'vtx', i:+vtx };
    return;
  }
  const gpt = t.dataset?.gpt;
  if(gpt && S.sel?.kind==='guide'){
    hist.preDrag = snapshot();
    drag = { mode:'gpt', k:gpt };
    return;
  }
  const elId = t.closest?.('[data-el]')?.dataset.el;
  if(elId){
    const e = getEl(elId);
    select('el', elId);
    hist.preDrag = snapshot();
    drag = { mode:'move', id:elId, start:{x:e.x, y:e.y}, at:w, moved:false };
    return;
  }
  const segHit = t.dataset?.wallseg;
  if(segHit){
    const [wid, si] = segHit.split(':');
    S.sel = { kind:'wall', id:wid, seg:+si };
    render();
    return;
  }
  const wallHit = t.dataset?.wallhit;
  if(wallHit){ select('wall', wallHit); return; }
  const guideHit = t.dataset?.guidehit;
  if(guideHit){ select('guide', guideHit); return; }

  select(null, null);
  drag = { mode:'pan', sx:ev.clientX, sy:ev.clientY, tx:S.view.tx, ty:S.view.ty };
}

function onMove(ev){
  const w = screenToWorld(ev.clientX, ev.clientY);

  if(!drag){ hoverUpdate(w); return; }

  if(drag.mode==='pan'){
    S.view.tx = drag.tx + (ev.clientX - drag.sx);
    S.view.ty = drag.ty + (ev.clientY - drag.sy);
    render();
    return;
  }
  if(drag.mode==='wallDraw'){
    /* Náhledová čára musí Following prst. Dřív se S.draft.cursor nastavil jen
       jednou u prvního bodu, takže guma pořád mířila zpátky na začátek. */
    if(S.draft?.kind === 'wall'){
      const sp = snapPoint(w, true);
      S.draft.cursor = { x:R(sp.x), y:R(sp.y) };
      render();
    }
    return;
  }
  if(drag.mode==='rect' || drag.mode==='measure'){
    S.draft.b = w; render(); return;
  }
  if(drag.mode==='guide'){
    const s = snapPoint(w, true);
    S.draft.b = { x:s.x, y:s.y }; render(); return;
  }
  if(drag.mode==='move'){
    const e = getEl(drag.id);
    const nx = drag.start.x + (w.x - drag.at.x);
    const ny = drag.start.y + (w.y - drag.at.y);
    const r = computeSnap(e, nx, ny, nx - drag.start.x, ny - drag.start.y);

    /* Zeď je neprůchozí. Testuje se celá DRÁHA, ne jen cílový bod – jinak by
       prvek zeď „přeskočil“ při rychlém švihu. Když cíl není dosažitelný,
       prvek po zdi klouže (nejdřív zkusí osu X, pak Y). */
    const hits = rect => S.project.walls.some(wl => elementHitsWall(rect, wl));
    const last = drag.lastOk || { x:drag.start.x, y:drag.start.y };
    const STEPS = 12;
    const pathClear = to => {
      for(let i=1;i<=STEPS;i++){
        const t = i/STEPS;
        if(hits({ ...e, x: last.x + (to.x-last.x)*t, y: last.y + (to.y-last.y)*t })) return false;
      }
      return true;
    };
    let fx, fy;
    if(hits({ ...e, x:last.x, y:last.y }))      { fx = r.x;    fy = r.y; }     // už je v překryvu → volný pohyb
    else if(pathClear({ x:r.x,    y:r.y }))     { fx = r.x;    fy = r.y; }
    else if(pathClear({ x:r.x,    y:last.y }))  { fx = r.x;    fy = last.y; }
    else if(pathClear({ x:last.x, y:r.y }))     { fx = last.x; fy = r.y; }
    else                                        { fx = last.x; fy = last.y; }
    e.x = R(fx); e.y = R(fy);
    drag.lastOk = { x:e.x, y:e.y };
    S.guides = r.guides;
    drag.moved = true;
    render();
    return;
  }
  if(drag.mode==='resize'){
    const e = getEl(S.sel.id), s = drag.start;
    let x2 = s.x + s.w, y2 = s.y + s.d, x1 = s.x, y1 = s.y;
    if(drag.handle.includes('e')) x2 = Math.max(s.x + MIN_SIZE, w.x);
    if(drag.handle.includes('s')) y2 = Math.max(s.y + MIN_SIZE, w.y);
    if(drag.handle.includes('w')) x1 = Math.min(s.x + s.w - MIN_SIZE, w.x);
    if(drag.handle.includes('n')) y1 = Math.min(s.y + s.d - MIN_SIZE, w.y);
    e.x = R(x1); e.y = R(y1); e.w = R(x2-x1); e.d = R(y2-y1);
    render();
    return;
  }
  if(drag.mode==='vtx'){
    const wall = S.project.walls.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    wall.pts[drag.i] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
  if(drag.mode==='gpt'){
    const g = S.project.guides.find(x=>x.id===S.sel.id);
    const s = snapPoint(w, ev.shiftKey);
    g[drag.k] = { x:R(s.x), y:R(s.y) };
    render();
    return;
  }
}

function onUp(ev){
  const w = screenToWorld(ev.clientX, ev.clientY);
  if(drag?.mode==='rect'){
    const r = normRect(S.draft.a, S.draft.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:R(r.h) });
      select('el', e.id);
      pushHistory();
      toast('Zadej přesné rozměry v panelu vpravo');
      setTimeout(()=>$('#iW')?.focus(), 60);
    }
  }
  if(drag?.mode==='guide'){
    const L = Math.hypot(S.draft.b.x-S.draft.a.x, S.draft.b.y-S.draft.a.y);
    if(L >= 50){
      const g = { id:uid('g'), a:{...S.draft.a}, b:{...S.draft.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id);
      pushHistory();
    }
    S.draft = null;
  }
  if(drag?.mode==='measure'){ S.draft = null; }
  if(drag?.mode==='wallDraw'){ commitWallPoint(); }
  if(drag?.mode==='move'){
    S.guides = [];
    if(drag.moved) commitPreDrag();
    else hist.preDrag = null;
  }
  if(drag && ['resize','vtx','gpt'].includes(drag.mode)) commitPreDrag();
  drag = null;
  render();
}

function hoverUpdate(w){
  const el = document.elementFromPoint?.(worldToScreen(w.x,w.y).x, worldToScreen(w.x,w.y).y);
  const id = el?.closest?.('[data-el]')?.dataset.el || null;
  if(id !== S.hover){ S.hover = id; }
}

function onDblClick(ev){
  if(S.tool==='wall'){ finishWall(false); return; }
  const t = ev.target;
  const elId = t.closest?.('[data-el]')?.dataset.el;
  if(elId){ select('el', elId); setTimeout(()=>$('#iName')?.focus(), 50); return; }
  if(t.dataset?.wallseg){
    const [wid, si] = t.dataset.wallseg.split(':');
    S.sel = { kind:'wall', id:wid, seg:+si };
    render();
    return;
  }
  if(t.dataset?.wallhit){ select('wall', t.dataset.wallhit); return; }
}

function onWheel(ev){
  ev.preventDefault();
  const z = S.view.zoom * (ev.deltaY < 0 ? 1.12 : 1/1.12);
  zoomAt(ev.clientX, ev.clientY, z);
}

/* ── vícedotyková gesta: dva prsty = přiblížení / oddálení a posun ── */
const pointers = new Map();          // pointerId → {x,y}
let pinch = null;

function ptrDown(ev){
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size === 2){
    drag = null;                     // tažení přerušíme, přebírá gesto
    const [a,b] = [...pointers.values()];
    pinch = {
      d0: Math.hypot(a.x-b.x, a.y-b.y) || 1,
      z0: S.view.zoom,
      cx: (a.x+b.x)/2, cy: (a.y+b.y)/2,
      tx0: S.view.tx, ty0: S.view.ty
    };
    return;
  }
  if(pointers.size === 1){
    svg().setPointerCapture?.(ev.pointerId);
    onDown(ev);
  }
}

function ptrMove(ev){
  if(!pointers.has(ev.pointerId)){ onMove(ev); return; }   // jen najetí myší
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if(pointers.size >= 2 && pinch){ pinchMove(); return; }
  onMove(ev);
}

function pinchMove(){
  const [a,b] = [...pointers.values()];
  const d  = Math.hypot(a.x-b.x, a.y-b.y) || 1;
  const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  const r  = svg().getBoundingClientRect();
  const z  = clamp(pinch.z0 * (d / pinch.d0), 0.01, 8);
  /* světový bod, který byl na začátku gesta pod středem prstů,
     pod ním zůstane i teď – takže se zároveň přibližuje i posouvá */
  const wx = (pinch.cx - r.left - pinch.tx0) / pinch.z0;
  const wy = (pinch.cy - r.top  - pinch.ty0) / pinch.z0;
  S.view.zoom = z;
  S.view.tx = (cx - r.left) - wx*z;
  S.view.ty = (cy - r.top)  - wy*z;
  render();
}

function ptrUp(ev){
  pointers.delete(ev.pointerId);
  if(pointers.size < 2) pinch = null;
  if(pointers.size === 0) onUp(ev);
}

/* ─────────────────────────── 8. ZDI ─────────────────────────── */

/** Zapíše bod, na kterém se zvedl prst. */
function commitWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  const c = S.draft.cursor, pts = S.draft.pts;
  if(pts.length === 0){ pts.push({ x:c.x, y:c.y }); render(); return; }

  const last = pts[pts.length-1];
  /* Stejné místo jako poslední bod → ignorovat. Dřív se to bralo jako
     „dvojklik = hotovo“, jenže přichytávání na mřížku stáhne na stejné místo
     i dva různé kliky a zeď pak končila, kdy nechtěla. */
  if(Math.hypot(last.x-c.x, last.y-c.y) < 1) return;

  /* Klik na první bod zeď uzavře (obvod místnosti). */
  const first = pts[0];
  if(pts.length >= 3 && Math.hypot(first.x-c.x, first.y-c.y) <= Math.max(S.snapMm, 50)){
    finishWall(true);
    return;
  }
  pts.push({ x:c.x, y:c.y });
  render();
}

/** Poslední bod rozkreslené zdi zpátky. */
function undoWallPoint(){
  if(S.draft?.kind !== 'wall') return;
  S.draft.pts.pop();
  if(S.draft.pts.length === 0) S.draft = null;
  render();
}

/**
 * Rozkreslenou kresbu VŽDY dokončí a uloží – nikdy ji nezahodí.
 * Volá se při přepnutí nástroje, takže zeď nemůže zmizet.
 */
function commitDraft(){
  const d = S.draft;
  if(!d) return false;
  if(d.kind === 'wall'){
    if(d.pts.length >= 2){ finishWall(!!d.closed); return true; }
    S.draft = null; render(); return false;
  }
  if(d.kind === 'rect'){
    const r = normRect(d.a, d.b);
    S.draft = null;
    if(r.w >= MIN_SIZE && r.h >= MIN_SIZE){
      const e = addElement({ x:R(r.x), y:R(r.y), w:R(r.w), d:R(r.h) });
      select('el', e.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  if(d.kind === 'guide'){
    const L = Math.hypot(d.b.x-d.a.x, d.b.y-d.a.y);
    S.draft = null;
    if(L >= 50){
      const g = { id:uid('g'), a:{...d.a}, b:{...d.b}, print:true, name:'Odstup' };
      S.project.guides.push(g);
      select('guide', g.id); pushHistory();
      return true;
    }
    render(); return false;
  }
  S.draft = null; render();          // measure – není co ukládat
  return false;
}

function finishWall(closed){
  if(!S.draft || S.draft.kind!=='wall') return;
  const pts = S.draft.pts;
  if(pts.length >= 2){
    const wall = { id:uid('w'), pts, t:S.draft.t||WALL_T_DEFAULT, closed:!!closed, name:closed?'Místnost':'Zeď' };
    S.project.walls.push(wall);
    select('wall', wall.id);
    pushHistory();
    toast(closed ? 'Místnost vytvořena' : 'Zeď vytvořena – uprav délky úseků vpravo');
  }
  S.draft = null;
  render();
}

function createRoom(w, h, t){
  /* První místnost patří do počátku souřadnic – jinak by X/Y byly obrovská
     čísla podle toho, kam zrovna mířil pohled. Další místnosti jdou do pohledu. */
  let x, y;
  if(S.project.walls.length === 0){ x = 0; y = 0; }
  else { const c = viewCenter(); x = R(c.x - w/2); y = R(c.y - h/2); }
  const wall = { id:uid('w'), t:t||WALL_T_DEFAULT, closed:true, name:'Místnost',
    pts:[{x, y}, {x:R(x+w), y}, {x:R(x+w), y:R(y+h)}, {x, y:R(y+h)}] };
  S.project.walls.push(wall);
  select('wall', wall.id);
  pushHistory();
  fitView();
}

/** Přepíše délku i-tého úseku; bod B se posune po směru úsečky. */
function setSegmentLength(wall, i, len){
  const a = wall.pts[i], b = wall.pts[(i+1) % wall.pts.length];
  const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy) || 1;
  const nx = R(a.x + dx/L*len), ny = R(a.y + dy/L*len);
  if(wall.closed && i === wall.pts.length-1) wall.pts[0] = { x:nx, y:ny };
  else wall.pts[(i+1) % wall.pts.length] = { x:nx, y:ny };
  render();
}

/**
 * Srovná zeď do pravých úhlů BEZ ZMĚNY DÉLEK.
 *
 * Každý úsek si nechá svou naměřenou délku, změní se jen jeho směr —
 * a to vždy na nejbližší násobek 90° počítaný od směru PRVNÍHO úseku.
 * Díky společné referenci jsou sousední úseky buď rovnoběžné, nebo kolmé,
 * nikdy ne „téměř". Celý nákres se přitom neotáčí.
 *
 * Vrátí rozdíl v mm, o který se uzavřený obvod po srovnání nezavře
 * (0 = zavřel se přesně). Délky nikdy nepřepisujeme — nesedí-li protilehlé
 * strany, řekneme to uživateli a on si délky upraví sám.
 */
function orthogonalizeWall(wall){
  const n = wall.pts.length;
  if(n < 2) return 0;
  const Q = Math.PI/2;
  const segs = [];
  for(let i=0;i<n-1;i++){
    const a = wall.pts[i], b = wall.pts[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    segs.push({ len:Math.hypot(dx,dy), ang:Math.atan2(dy,dx) });
  }
  /* společná reference = první úsek, ať se zeď neotočí do jiné polohy */
  const base = segs[0].ang;
  for(const sg of segs) sg.dir = base + Math.round((sg.ang - base)/Q)*Q;

  /* délky bereme z původních úseků a přenášíme je do nových směrů */
  const p0 = wall.pts[0];
  let x = p0.x, y = p0.y;
  for(let i=0;i<segs.length;i++){
    x = R(x + Math.cos(segs[i].dir)*segs[i].len);
    y = R(y + Math.sin(segs[i].dir)*segs[i].len);
    wall.pts[i+1] = { x, y };
  }

  /* u uzavřeného obvodu změříme, o kolik se konec rozešel se začátkem */
  let gap = 0;
  if(wall.closed && n > 2){
    const last = wall.pts[n-1];
    gap = Math.round(Math.hypot(p0.x-last.x, p0.y-last.y));
  }
  render();
  return gap;
}

/**
 * Posune celý nákres tak, aby jeho levý horní roh seděl v (0,0).
 * Proto v celém projektu — u zdí, prvků, odstupů i v kótách — vidíš
 * malá čísla od rohu obvodu místo obrovských souřadnic „odněkud z pohledu".
 * Pohled posuneme o stejný rozdíl, takže se obrázek na obrazovce nehne.
 */
function rebaseProject(){
  const OR = projectOrigin();
  const ox = OR.x, oy = OR.y;
  if(!ox && !oy) return false;
  const move = o => { o.x = R(o.x - ox); o.y = R(o.y - oy); };
  for(const w of S.project.walls) for(const p of w.pts) move(p);
  for(const e of S.project.elements){ e.x = R(e.x - ox); e.y = R(e.y - oy); }
  for(const g of S.project.guides){ move(g.a); move(g.b); }
  if(S.draft){ for(const p of S.draft.pts) move(p); if(S.draft.cursor) move(S.draft.cursor); }
  S.view.tx += ox*S.view.zoom;
  S.view.ty += oy*S.view.zoom;
  return true;
}

/* ─────────────────────────── 9. ODSTUPOVÉ ČÁRY ─────────────────────────── */

/** Vytvoří odstupovou čáru rovnoběžně se zdí ve vzdálenosti dist. */
function guideFromWall(wall, dist, side){
  const segs = wallSegments(wall).filter(s => segLength(s) > 1);
  if(!segs.length){ toast('Vyber zeď s alespoň jednou úsečkou'); return null; }
  const made = [];
  for(const s of segs){
    const n = segNormal(s);
    const sgn = side === 'auto' ? pickSide(wall, s, n) : (side==='left' ? 1 : -1);
    /* odstup se měří od vnitřního líce zdi, tedy od středové osy je to t/2 + dist */
    const off = (wall.t || WALL_T_DEFAULT)/2 + dist;
    const a = { x:R(s.a.x + n.nx*off*sgn), y:R(s.a.y + n.ny*off*sgn) };
    const b = { x:R(s.b.x + n.nx*off*sgn), y:R(s.b.y + n.ny*off*sgn) };
    const g = { id:uid('g'), a, b, print:true, name:`Odstup ${fmt(dist)}` };
    S.project.guides.push(g); made.push(g);
  }
  if(made.length){ select('guide', made[0].id); pushHistory(); }
  toast(made.length ? `Vytvořeno ${made.length} odstupových čar` : 'Nic nevytvořeno');
  render();
  return made[0] || null;
}

/** Vybere stranu, na které je vnitřek místnosti (u uzavřené zdi), jinak libovolnou. */
function pickSide(wall, seg, n){
  if(!wall.closed) return 1;
  const mid = { x:(seg.a.x+seg.b.x)/2 + n.nx*10, y:(seg.a.y+seg.b.y)/2 + n.ny*10 };
  return pointInPoly(mid, wall.pts) ? 1 : -1;
}
function pointInPoly(p, pts){
  let inside = false;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    const a = pts[i], b = pts[j];
    if(((a.y>p.y) !== (b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y) + a.x)) inside = !inside;
  }
  return inside;
}

/* ─────────────────────────── 10. PRVKY ─────────────────────────── */

function getEl(id){ return S.project.elements.find(e => e.id === id); }

function addElement(o={}){
  const e = {
    id: uid('e'),
    x: o.x ?? 0, y: o.y ?? 0,
    w: o.w ?? 600, d: o.d ?? 600,
    name: o.name || '',
    note: o.note || '',
    qty: o.qty || 1,
    color: o.color || COLORS[0],
    front: o.front || 'jih'
  };
  S.project.elements.push(e);
  return e;
}

/** Krátké klepnutí nástrojem Obdélník: vloží výchozí 600 × 600 pod prst
   a přichytí ho k nejbližšímu cíli v dosahu magnetu. */
function addElementAtPoint(wx, wy, wmm=600, dmm=600){
  const e = addElement({ x:R(wx - wmm/2), y:R(wy - dmm/2), w:wmm, d:dmm });
  const r = computeSnap(e, e.x, e.y, 0, 0);
  e.x = R(r.x); e.y = R(r.y);
  return e;
}

function deleteSelection(){
  if(!S.sel) return;
  if(S.sel.kind==='el') S.project.elements = S.project.elements.filter(e=>e.id!==S.sel.id);
  if(S.sel.kind==='wall') S.project.walls = S.project.walls.filter(w=>w.id!==S.sel.id);
  if(S.sel.kind==='guide') S.project.guides = S.project.guides.filter(g=>g.id!==S.sel.id);
  S.sel = null;
  pushHistory(); render();
}

function duplicateSelection(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const n = { ...e, id:uid('e'), x:R(e.x + e.w + 10), name:e.name };
  S.project.elements.push(n);
  select('el', n.id); pushHistory(); render();
}

function rotateSelection(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const cx = e.x + e.w/2, cy = e.y + e.d/2;
  const w = e.w, h = e.d;
  e.w = h; e.d = w;
  e.x = R(cx - e.w/2); e.y = R(cy - e.d/2);
  const order = ['jih','západ','sever','východ'];
  e.front = order[(order.indexOf(e.front||'jih')+1) % 4];
  pushHistory(); render();
}

/** Přisune prvek k nejbližší zdi bez ohledu na dosah magnetu. */
function snapToWall(){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const saved = S.snapMm;
  S.snapMm = 100000;
  let best = null;
  for(const c of snapCandidates(e.id)){
    if(c.kind !== 'wall') continue;
    for(const [axis, pos] of [['x', e.x],['x', e.x+e.w],['y', e.y],['y', e.y+e.d]]){
      if(c.axis !== axis) continue;
      const d = Math.abs(c.pos - pos);
      if(!best || d < best.d){
        const test = axis==='x' ? { ...e, x: e.x + (c.pos-pos) } : { ...e, y: e.y + (c.pos-pos) };
        if(!elementHitsWall(test, findWall(c.id))) best = { d, test, axis };
      }
    }
  }
  S.snapMm = saved;
  if(best){ e.x = R(best.test.x); e.y = R(best.test.y); pushHistory(); toast('Přitaženo ke zdi'); }
  else toast('V dosahu není žádná zeď');
  render();
}
function findWall(id){ return S.project.walls.find(w=>w.id===id) || { pts:[], t:0 }; }

/** Dovře mezeru k sousedovi ve stejné řadě. */
function closeGap(dir){
  if(S.sel?.kind!=='el') return;
  const e = getEl(S.sel.id); if(!e) return;
  const others = S.project.elements.filter(o => o.id!==e.id
    && Math.abs((o.y+o.d/2) - (e.y+e.d/2)) < GAP_TOL);
  let best = null;
  for(const o of others){
    const gap = dir==='right' ? e.x - (o.x+o.w) : o.x - (e.x+e.w);
    if(gap <= 0 || gap > 2000) continue;
    if(!best || gap < best.gap) best = { gap, o };
  }
  if(best){
    e.x = R(dir==='right' ? e.x - best.gap : e.x + best.gap);
    pushHistory(); toast('Mezera dovřena');
  } else toast('V této řadě není soused s mezerou');
  render();
}

function select(kind, id){
  S.sel = kind ? { kind, id } : null;
  render();
}

/* ─────────────────────────── 11. HISTORIE ─────────────────────────── */

let history = [], historyIndex = -1;
const hist = { preDrag: null };

function snapshot(){ return JSON.stringify({
  walls:S.project.walls, elements:S.project.elements, guides:S.project.guides, info:S.project.info }); }
function pushHistory(){
  const s = snapshot();
  if(history[historyIndex] === s){ save(); return; }
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save(); render();
}
function commitPreDrag(){
  if(!hist.preDrag) return;
  const before = hist.preDrag; hist.preDrag = null;
  const s = snapshot();
  if(before === s) return;
  history = history.slice(0, historyIndex+1);
  history.push(s);
  if(history.length > HISTORY_MAX) history.shift();
  historyIndex = history.length-1;
  save();
}
function restore(s){
  const o = JSON.parse(s);
  S.project.walls = o.walls || [];
  S.project.elements = o.elements || [];
  S.project.guides = o.guides || [];
  if(o.info) S.project.info = { ...S.project.info, ...o.info };
  if(S.sel){
    const k = S.sel.kind;
    const list = k==='el'?S.project.elements : k==='wall'?S.project.walls : S.project.guides;
    if(!list.find(x=>x.id===S.sel.id)) S.sel = null;
  }
  render();
}
function undo(){ if(historyIndex>0){ historyIndex--; restore(history[historyIndex]); save(); } }
function redo(){ if(historyIndex<history.length-1){ historyIndex++; restore(history[historyIndex]); save(); } }

/* Safari na iPadu blokuje localStorage u file:// a v soukromém okně –
   pak ukládáme do paměti a aplikace běží dál. */
const STORE = (() => {
  try{ localStorage.setItem('__t__','1'); localStorage.removeItem('__t__');
    return { mode:'localStorage', getItem:k=>localStorage.getItem(k),
             setItem:(k,v)=>localStorage.setItem(k,v), removeItem:k=>localStorage.removeItem(k) };
  }catch(e){
    const m = new Map();
    return { mode:'paměť', getItem:k=>m.has(k)?m.get(k):null,
             setItem:(k,v)=>void m.set(k,String(v)), removeItem:k=>void m.delete(k) };
  }
})();

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ STORE.setItem(STORE_KEY, JSON.stringify(S.project)); }
    catch(err){ console.warn('Uložení selhalo', err); }
  }, 250);
}

function exportJson(){
  const blob = new Blob([JSON.stringify(S.project, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.project.info.name || 'narys').replace(/[^\w\dáčďéěíňóřšťúůýž -]/gi,'').trim() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

    </section>`);
